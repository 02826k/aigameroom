<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>좀비 서바이벌 — AI게임장</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: #020617;
      height: 100dvh;
    }
    canvas {
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.7); border-radius: 9999px; }
    @keyframes grenadeFlash {
      0% { opacity: 0.85; transform: scale(0.95); }
      100% { opacity: 0; transform: scale(1.05); }
    }
    .grenade-flash-anim {
      animation: grenadeFlash 0.65s ease-out forwards;
    }
    #fullscreenMain:fullscreen {
      max-width: 100% !important;
      width: 100vw !important;
      height: 100dvh !important;
      background: #020617 !important;
      padding: 8px !important;
      gap: 6px !important;
      overflow: hidden !important;
    }
    #fullscreenMain:fullscreen #arenaWrap {
      flex: 1 1 0% !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col select-none">

  <!-- 표준 상단 헤더 -->
  <header id="topHeader" class="border-b border-slate-800/80 bg-slate-900/95 backdrop-blur px-3 py-2 sticky top-0 z-30 shadow-lg shadow-black/25 shrink-0">
    <div class="max-w-md mx-auto flex flex-col gap-1.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-gradient-to-br from-rose-500/25 to-orange-600/25 text-rose-400 font-extrabold text-xs border border-rose-500/40 shrink-0">☣️</span>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-50 truncate">좀비 서바이벌</h1>
          <span id="vipBadge" class="hidden px-1.5 py-0.5 text-[10px] font-black bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 rounded shrink-0">VIP</span>
        </div>
        <button id="authToggleBtn" type="button" class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0">
          로그인
        </button>
      </div>

      <div class="flex items-center justify-end gap-1.5 pt-1.5 border-t border-slate-800/70">
        <button id="bgmToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap">🎵 배경음 ON</button>
        <button id="soundToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap">🔊 효과음 ON</button>
        <button id="headerExitLobbyBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition active:scale-95 cursor-pointer whitespace-nowrap">나가기</button>
      </div>
    </div>
  </header>

  <!-- 메인 게임 영역 -->
  <main id="fullscreenMain" class="flex-1 min-h-0 w-full max-w-md mx-auto px-2 py-2 flex flex-col gap-1.5">
    <div class="flex items-center justify-between gap-1 shrink-0">
      <button id="grenadeBtn" type="button" class="px-2.5 py-1 rounded-lg bg-rose-950/90 hover:bg-rose-900 border border-rose-500/60 text-rose-200 text-[11px] font-black cursor-pointer active:scale-95 transition whitespace-nowrap flex items-center gap-1 shadow">
        <span>💣</span>
        <span>수류탄 <span id="grenadeCountVal" class="text-amber-300">0</span>개</span>
      </button>

      <div class="flex items-center gap-1 shrink-0">
        <button id="autoDodgeBtn" type="button" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 text-[10px] sm:text-[11px] font-black cursor-pointer active:scale-95 transition whitespace-nowrap">🛡️ VIP생존본능 OFF</button>
        <button id="rankOpenBtn" type="button" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-amber-400/50 text-amber-300 text-[10px] sm:text-[11px] font-black cursor-pointer active:scale-95 transition whitespace-nowrap">🏆 RANK</button>
        <button id="fullscreenBtn" type="button" class="px-2.5 py-1 rounded-lg bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 text-[10px] sm:text-[11px] font-black cursor-pointer active:scale-95 transition shadow whitespace-nowrap">⛶ 전체화면</button>
      </div>
    </div>

    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl px-4 py-2 flex items-center justify-between shadow-xl shrink-0">
      <div>
        <div class="text-[11px] font-bold text-slate-400">Lv.<span id="levelVal" class="text-amber-400 text-sm font-black">1</span></div>
        <div class="w-24 h-2 bg-slate-800 rounded-full overflow-hidden mt-1">
          <div id="expBar" class="h-full bg-amber-400 transition-all duration-200" style="width: 0%"></div>
        </div>
      </div>
      <div class="text-center">
        <div class="text-[10px] font-bold text-rose-400">STAGE <span id="stageVal" class="text-sm font-black text-white">1</span></div>
        <div id="stageGoalVal" class="text-[11px] font-bold text-emerald-400">처치: 0 / 15</div>
      </div>
      <div class="text-right">
        <div class="text-[11px] font-bold text-slate-400">점수</div>
        <div id="scoreVal" class="text-sm font-black text-purple-400">0</div>
      </div>
    </div>

    <!-- 게임 캔버스 아레나 -->
    <div id="arenaWrap" class="relative w-full flex-1 min-h-0 bg-slate-950 border-2 border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center">
      <canvas id="gameCanvas" class="w-full h-full block"></canvas>

      <!-- 수류탄 폭발 플래시 이펙트 -->
      <div id="grenadeExplosionOverlay" class="hidden pointer-events-none absolute inset-0 bg-gradient-to-b from-amber-300/70 via-orange-500/55 to-rose-600/70 flex items-center justify-center z-25 grenade-flash-anim">
        <div class="text-2xl font-black text-white drop-shadow-[0_2px_10px_rgba(0,0,0,0.9)]">💥 수류탄 폭발! 전멸!</div>
      </div>

      <!-- 보스 경고 배너 -->
      <div id="bossAlert" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-rose-600/95 border border-rose-300 px-4 py-1.5 rounded-full text-xs font-black text-white shadow-lg animate-bounce z-20">
        ⚠️ STAGE BOSS 출현!
      </div>

      <!-- 스테이지 클리어 배너 -->
      <div id="stageClearAlert" class="hidden absolute inset-0 bg-emerald-950/75 backdrop-blur-sm flex flex-col items-center justify-center z-20">
        <div class="text-2xl font-black text-emerald-300">STAGE CLEAR!</div>
        <div id="nextStageText" class="text-xs text-slate-200 mt-1">다음 스테이지로 이동합니다...</div>
      </div>

      <!-- 시작 / 게임오버 오버레이 -->
      <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center gap-4 p-6 text-center z-30">
        <div class="text-4xl">🔫🧟‍♀️</div>
        <h2 id="overlayTitle" class="text-2xl font-black text-rose-500">좀비 서바이벌</h2>
        <p id="overlayDesc" class="text-xs text-slate-300 leading-relaxed">
          몰려오는 좀비 웨이브를 뚫고<br/>스테이지 보스를 처치하여 다음 구역으로 돌파하세요!
        </p>
        <button id="startBtn" type="button" class="px-8 py-3 rounded-xl bg-gradient-to-r from-rose-600 to-orange-500 text-white font-black text-sm shadow-lg shadow-rose-500/30 transition active:scale-95 cursor-pointer">
          전투 시작
        </button>
      </div>

      <!-- 레벨업 업그레이드 선택 팝업 -->
      <div id="upgradeModal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center gap-2.5 p-4 text-center z-40 hidden">
        <h2 class="text-base sm:text-lg font-black text-amber-300">🎉 레벨 업! 무기 및 능력 강화</h2>
        <div id="upgradeOptions" class="flex flex-col gap-2 w-full max-w-sm mt-1"></div>
      </div>
    </div>
  </main>

  <!-- RANK 모달 -->
  <div id="rankModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-md w-full p-4 shadow-2xl flex flex-col gap-3">
      <div class="flex items-center justify-between gap-2">
        <div>
          <h2 class="text-sm sm:text-base font-black text-amber-300">🏆 좀비 서바이벌 TOP 10</h2>
          <div class="text-[10px] text-slate-400">최고 점수 &amp; 도달 스테이지 · 전화번호 중간자리 보호</div>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="refreshRankingBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 cursor-pointer">🔄 새로고침</button>
          <button id="rankCloseBtn" type="button" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 cursor-pointer">✕</button>
        </div>
      </div>
      <div class="rounded-lg border border-rose-500/25 px-3 py-1.5 flex justify-between items-center text-[11px] bg-slate-950/80">
        <span class="text-slate-400">내 순위</span>
        <span id="myRankDetailText" class="font-bold text-rose-300">로그인 후 플레이 시 등록</span>
      </div>
      <div id="rankingListContainer" class="flex flex-col gap-1.5 max-h-[300px] overflow-y-auto text-xs text-slate-400">기록을 불러오는 중...</div>
    </div>
  </div>

  <!-- VIP 전용 기능 안내 모달 -->
  <div id="vipNoticeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="w-full max-w-xs bg-slate-900 border-2 border-amber-500/50 rounded-2xl p-5 shadow-2xl text-center">
      <div class="text-3xl mb-2">👑</div>
      <p class="text-sm font-black text-slate-100 mb-4">VIP가입후 사용가능합니다</p>
      <button id="vipNoticeConfirmBtn" type="button" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 hover:brightness-110 text-xs font-black text-slate-950 shadow-lg transition active:scale-95 cursor-pointer">
        확인
      </button>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toastBox" class="pointer-events-none fixed bottom-5 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 translate-y-2">
    <div id="toastMsg" class="px-4 py-2 rounded-xl bg-slate-900/95 border border-amber-500/50 text-xs sm:text-sm font-bold text-amber-200 shadow-2xl">알림</div>
  </div>

  <script>
    const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_CANDIDATES = isLocalHost
      ? ['']
      : [
          'https://02826k.duckdns.org',
          'https://partial-catering-vatican-accounting.trycloudflare.com'
        ];
    let API_BASE_URL = API_CANDIDATES[0];

    async function apiFetch(endpoint, options = {}) {
      let lastErr = null;
      const ordered = [API_BASE_URL, ...API_CANDIDATES.filter(u => u !== API_BASE_URL)];
      for (const base of ordered) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(`${base}${endpoint}`, { ...options, signal: controller.signal });
          clearTimeout(timer);
          API_BASE_URL = base;
          return res;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('서버 연결 실패');
    }

    const GAME_ID = 'zombie_survival';
    const LOBBY_URL = 'https://02826k.github.io/aigameroom/';
    function goLobbyAuth(mode = 'login') {
      const returnTo = encodeURIComponent(window.location.href);
      window.location.href = `${LOBBY_URL}?auth=${encodeURIComponent(mode)}&returnTo=${returnTo}`;
    }
    const ADMIN_VIP_PHONES = [];
    const TOKEN_KEY = 'hero_clicker_jwt_token';
    const USER_KEY = 'hero_clicker_username';
    const AUDIO_PREF_KEY = 'zombie_survival_audio_v1';
    const ALL_TOKEN_KEYS = [TOKEN_KEY, 'sky2026_jwt_token', 'abuse_jwt_token', 'aigameroom_jwt_token'];
    const ALL_USER_KEYS = [USER_KEY, 'sky2026_username', 'abuse_username', 'aigameroom_username'];

    function maskPhoneMiddle(name) {
      const str = String(name || '');
      const m = str.match(/^(01[016789])[-.\s]?(\d{3,4}|\*{3,4})[-.\s]?(\d{4}|\*{4})$/);
      if (m) return `${m[1]}-****-${m[3]}`;
      return str.replace(/(01[016789])[-.\s]?(\d{3,4})[-.\s]?(\d{4})/g, '$1-****-$3');
    }

    function readSharedAuth() {
      const t = localStorage.getItem(TOKEN_KEY) || localStorage.getItem('aigameroom_jwt_token') || localStorage.getItem('sky2026_jwt_token') || null;
      const u = localStorage.getItem(USER_KEY) || localStorage.getItem('aigameroom_username') || localStorage.getItem('sky2026_username') || null;
      return { t, u };
    }

    function syncSharedAuth(t, u, vipFlag) {
      try {
        if (t && u) {
          ALL_TOKEN_KEYS.forEach((k) => localStorage.setItem(k, t));
          ALL_USER_KEYS.forEach((k) => localStorage.setItem(k, u));
          if (typeof vipFlag === 'boolean') localStorage.setItem('hero_clicker_is_vip', String(vipFlag));
        } else {
          ALL_TOKEN_KEYS.forEach((k) => localStorage.removeItem(k));
          ALL_USER_KEYS.forEach((k) => localStorage.removeItem(k));
          localStorage.removeItem('hero_clicker_is_vip');
        }
      } catch (e) {}
    }

    const initialAuth = readSharedAuth();
    let userState = {
      loggedIn: Boolean(initialAuth.t && initialAuth.u),
      phone: initialAuth.u ? initialAuth.u.replace(/\D/g, '') : '',
      pin: '',
      token: initialAuth.t,
      username: initialAuth.u,
      isVip: localStorage.getItem('hero_clicker_is_vip') === 'true',
      autoDodge: false,
      bestScore: 0,
      bestStage: 1,
      serverSaveData: null
    };

    function isAdminAccount(username) {
      return Boolean(username && ADMIN_VIP_PHONES.includes(username.trim()));
    }

    // ==========================================
    // 0. 오디오 (배경음 / 효과음) & 토스트 & 전체화면
    // ==========================================
    let audioPrefs = { bgmEnabled: true, soundEnabled: true };
    try {
      const savedAudio = JSON.parse(localStorage.getItem(AUDIO_PREF_KEY) || 'null');
      if (savedAudio) audioPrefs = { ...audioPrefs, ...savedAudio };
    } catch (e) {}

    let audioCtx = null;
    let bgmTimer = null;
    let bgmStep = 0;

    function saveAudioPrefs() {
      try { localStorage.setItem(AUDIO_PREF_KEY, JSON.stringify(audioPrefs)); } catch (e) {}
    }

    function getAudioContext() {
      if (!audioPrefs.soundEnabled && !audioPrefs.bgmEnabled) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function playSfx(type) {
      if (!audioPrefs.soundEnabled) return;
      const c = getAudioContext();
      if (!c) return;
      try {
        const now = c.currentTime;
        const o = c.createOscillator();
        const g = c.createGain();
        if (type === 'shoot') {
          o.type = 'triangle';
          o.frequency.setValueAtTime(520, now);
          o.frequency.exponentialRampToValueAtTime(160, now + 0.05);
          g.gain.setValueAtTime(0.04, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          o.connect(g); g.connect(c.destination);
          o.start(now); o.stop(now + 0.065);
        } else if (type === 'kill') {
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(190, now);
          o.frequency.exponentialRampToValueAtTime(55, now + 0.14);
          g.gain.setValueAtTime(0.09, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          o.connect(g); g.connect(c.destination);
          o.start(now); o.stop(now + 0.16);
        } else if (type === 'levelup') {
          o.type = 'sine';
          o.frequency.setValueAtTime(523.25, now);
          o.frequency.setValueAtTime(783.99, now + 0.08);
          g.gain.setValueAtTime(0.11, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          o.connect(g); g.connect(c.destination);
          o.start(now); o.stop(now + 0.25);
        } else if (type === 'boom') {
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(140, now);
          o.frequency.exponentialRampToValueAtTime(30, now + 0.55);
          g.gain.setValueAtTime(0.18, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.56);
          o.connect(g); g.connect(c.destination);
          o.start(now); o.stop(now + 0.58);
        } else if (type === 'gameover') {
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(220, now);
          o.frequency.exponentialRampToValueAtTime(45, now + 0.45);
          g.gain.setValueAtTime(0.14, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
          o.connect(g); g.connect(c.destination);
          o.start(now); o.stop(now + 0.48);
        }
      } catch (e) {}
    }

    function startBGM() {
      stopBGM();
      if (!audioPrefs.bgmEnabled) return;
      const c = getAudioContext();
      if (!c) return;
      const notes = [196, 220, 246.94, 293.66, 246.94, 220, 196, 164.81];
      bgmTimer = setInterval(() => {
        if (!audioPrefs.bgmEnabled || !audioCtx || gameState !== 'PLAY') return;
        try {
          const now = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(notes[bgmStep % notes.length], now);
          g.gain.setValueAtTime(0.025, now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(now); o.stop(now + 0.25);
          bgmStep++;
        } catch (e) {}
      }, 260);
    }

    function stopBGM() {
      if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    }

    function updateAudioButtons() {
      const bgmBtn = document.getElementById('bgmToggleBtn');
      const sfxBtn = document.getElementById('soundToggleBtn');
      if (bgmBtn) {
        bgmBtn.textContent = audioPrefs.bgmEnabled ? '🎵 배경음 ON' : '🔇 배경음 OFF';
        bgmBtn.className = audioPrefs.bgmEnabled
          ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap'
          : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';
      }
      if (sfxBtn) {
        sfxBtn.textContent = audioPrefs.soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
        sfxBtn.className = audioPrefs.soundEnabled
          ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap'
          : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';
      }
    }
    updateAudioButtons();

    document.getElementById('bgmToggleBtn').addEventListener('click', () => {
      audioPrefs.bgmEnabled = !audioPrefs.bgmEnabled;
      saveAudioPrefs();
      updateAudioButtons();
      if (audioPrefs.bgmEnabled && gameState === 'PLAY') startBGM();
      else stopBGM();
    });

    document.getElementById('soundToggleBtn').addEventListener('click', () => {

    function createPixelSprite(grid, palette, flashWhite = false) {
      const h = grid.length;
      const w = grid[0].length;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const cctx = c.getContext('2d');
      for (let y = 0; y < h; y++) {
        const row = grid[y];
        for (let x = 0; x < w; x++) {
          const ch = row[x];
          if (ch === '.' || !palette[ch]) continue;
          cctx.fillStyle = flashWhite ? '#ffffff' : palette[ch];
          cctx.fillRect(x, y, 1, 1);
        }
      }
      return c;
    }

    // 옥상 헬리패드 오프스크린 배경 캐시
    let bgCanvas = document.createElement('canvas');
    function buildRooftopBackground(w, h) {
      bgCanvas.width = w;
      bgCanvas.height = h;
      const bctx = bgCanvas.getContext('2d');
      bctx.imageSmoothingEnabled = false;

      // 콘크리트 옥상 바닥
      bctx.fillStyle = '#8b929e';
      bctx.fillRect(0, 0, w, h);

      // 픽셀 타일 격자
      const tile = 32;
      bctx.strokeStyle = '#737a86';
      bctx.lineWidth = 2;
      for (let gx = 0; gx <= w; gx += tile) {
        bctx.beginPath(); bctx.moveTo(gx, 0); bctx.lineTo(gx, h); bctx.stroke();
      }
      for (let gy = 0; gy <= h; gy += tile) {
        bctx.beginPath(); bctx.moveTo(0, gy); bctx.lineTo(w, gy); bctx.stroke();
      }

      // 콘크리트 질감 도트 노이즈 (고정 시드 패턴)
      for (let i = 0; i < Math.floor((w * h) / 1400); i++) {
        const nx = (i * 97 + 13) % w;
        const ny = (i * 193 + 29) % h;
        bctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(15,23,42,0.12)';
        bctx.fillRect(Math.floor(nx / 3) * 3, Math.floor(ny / 3) * 3, 3, 3);
      }

      // 옥상 난간 테두리
      bctx.strokeStyle = '#334155';
      bctx.lineWidth = 10;
      bctx.strokeRect(5, 5, w - 10, h - 10);
      bctx.strokeStyle = '#18181b';
      bctx.lineWidth = 2;
      bctx.strokeRect(10, 10, w - 20, h - 20);

      // 중앙 원형 헬리패드 (H 마크)
      const cx = Math.floor(w / 2);
      const cy = Math.floor(h / 2);
      const padR = Math.min(w, h) * 0.29;

      // 검은 외곽선
      bctx.fillStyle = '#18181b';
      bctx.beginPath(); bctx.arc(cx, cy, padR + 4, 0, Math.PI * 2); bctx.fill();

      // 흰 링
      bctx.fillStyle = '#e2e8f0';
      bctx.beginPath(); bctx.arc(cx, cy, padR + 1, 0, Math.PI * 2); bctx.fill();

      // 진회색 헬리패드 아스팔트
      bctx.fillStyle = '#474e5b';
      bctx.beginPath(); bctx.arc(cx, cy, padR - 6, 0, Math.PI * 2); bctx.fill();

      // 점선 원
      bctx.save();
      bctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
      bctx.lineWidth = 3;
      bctx.setLineDash([8, 8]);
      bctx.beginPath(); bctx.arc(cx, cy, padR - 14, 0, Math.PI * 2); bctx.stroke();
      bctx.restore();

      // 중앙 'H' 픽셀 마크
      const hW = Math.floor(padR * 0.62);
      const hH = Math.floor(padR * 0.78);
      const bar = Math.max(8, Math.floor(padR * 0.16));
      bctx.fillStyle = '#e2e8f0';
      bctx.fillRect(cx - hW / 2, cy - hH / 2, bar, hH);
      bctx.fillRect(cx + hW / 2 - bar, cy - hH / 2, bar, hH);
      bctx.fillRect(cx - hW / 2, cy - bar / 2, hW, bar);

      // 장식용 모래주머니 바리케이드 (우측 상단 & 우측 하단)
      function drawSandbags(bx, by) {
        const bags = [
          [0, 0], [18, 0], [36, 0],
          [8, 9], [26, 9]
        ];
        bags.forEach(([ox, oy]) => {
          bctx.fillStyle = '#18181b';
          bctx.fillRect(bx + ox - 2, by + oy - 2, 20, 12);
          bctx.fillStyle = '#c2a375';
          bctx.fillRect(bx + ox, by + oy, 16, 8);
          bctx.fillStyle = '#dfc498';
          bctx.fillRect(bx + ox + 2, by + oy + 1, 10, 3);
        });
      }
      drawSandbags(w - 78, 28);
      drawSandbags(24, h - 42);

      // 장식용 옥상 환풍기(AC 유닛, 좌측 상단)
      const acX = 22, acY = 24;
      bctx.fillStyle = '#18181b';
      bctx.fillRect(acX - 2, acY - 2, 38, 30);
      bctx.fillStyle = '#94a3b8';
      bctx.fillRect(acX, acY, 34, 26);
      bctx.fillStyle = '#cbd5e1';
      bctx.fillRect(acX + 2, acY + 2, 30, 5);
      bctx.fillStyle = '#334155';
      bctx.beginPath(); bctx.arc(acX + 17, acY + 16, 8, 0, Math.PI * 2); bctx.fill();
      bctx.fillStyle = '#1e293b';
      bctx.fillRect(acX + 11, acY + 15, 12, 2);
      bctx.fillRect(acX + 16, acY + 10, 2, 12);
    }

        const z = zombies[i];
        for (let p = 0; p < 10; p++) {
          particles.push({
            x: z.x, y: z.y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 22,
            size: 4 + Math.floor(Math.random() * 4),
            color: p % 2 === 0 ? '#facc15' : '#f97316'
          });
        }
        const pts = z.isBoss ? 500 : 15;
        score += pts;
        floatingTexts.push({ x: z.x, y: z.y - 10, text: `+${pts}`, life: 32, color: '#fde047' });
        gems.push({ x: z.x, y: z.y, val: z.expVal, radius: z.isBoss ? 10 : 6 });
        if (z.isBoss) bossKilled = true;
        else killedCount++;

      zombies = [];

      if (bossKilled) {

      if (!userState.loggedIn || !userState.token) return;
      try {
        const baseSave = (userState.serverSaveData && typeof userState.serverSaveData === 'object')
          ? { ...userState.serverSaveData }
          : {};
        baseSave.isVip = Boolean(baseSave.isVip || userState.isVip);
        const bestZombieScore = Math.max(score, userState.bestScore, Number(baseSave.zombieSurvival?.score || 0));
        const bestZombieStage = Math.max(stage, userState.bestStage, Number(baseSave.zombieSurvival?.stage || 1));
        userState.bestScore = bestZombieScore;
        userState.bestStage = bestZombieStage;
        baseSave.stage = bestZombieStage;
        baseSave.zombieSurvival = {
          score: bestZombieScore,
          stage: bestZombieStage,
          updatedAt: new Date().toISOString()
        };
        userState.serverSaveData = baseSave;

        const res = await apiFetch('/api/save', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${userState.token}`
          },
          body: JSON.stringify({ gameId: GAME_ID, score: bestZombieScore, stage: bestZombieStage, saveData: baseSave })
        });
        if (res.ok) fetchAndRenderRanking();
        if (res.status === 401 || res.status === 403) {
          handleLogout();
        }
      } catch (e) {
        console.warn('서버 저장 통신 지연:', e);
      }
    }

    async function restoreSessionFromToken() {
      if (!userState.token || !userState.username) return;
      try {
        const res = await apiFetch('/api/load', {
          headers: { 'Authorization': `Bearer ${userState.token}` }
        });
        if (!res.ok) {
          if (res.status === 401 || res.status === 403) {
            handleLogout();
          }
          return;
        }
        const data = await res.json();
        userState.loggedIn = true;
        userState.phone = userState.username.replace(/\D/g, '');
        userState.serverSaveData = data.saveData || {};
        userState.isVip = Boolean(data.isVip || userState.serverSaveData.isVip || isAdminAccount(userState.username));
        userState.bestScore = Math.max(userState.bestScore, Number(userState.serverSaveData?.zombieSurvival?.score || 0));
        userState.bestStage = Math.max(userState.bestStage, Number(userState.serverSaveData?.zombieSurvival?.stage || userState.serverSaveData?.stage || 1));
        syncSharedAuth(userState.token, userState.username, userState.isVip);
        applyVipUI();
      } catch (e) {
        console.warn('세션 복원 대기:', e);
      }
    }

    document.getElementById('authToggleBtn').onclick = () => {

    // ==========================================
    // 2. VIP생존본능 (자동 회피) 토글
    // ==========================================
    const autoDodgeBtn = document.getElementById('autoDodgeBtn');

        autoDodgeBtn.textContent = '🛡️ VIP생존본능 ON';

      } else {

        autoDodgeBtn.className = 'px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 text-[10px] sm:text-[11px] font-black transition active:scale-95 cursor-pointer whitespace-nowrap';

    }
    const vipNoticeModal = document.getElementById('vipNoticeModal');

      }
    });

    autoDodgeBtn.onclick = () => {

        vipNoticeModal.classList.remove('hidden');
        vipNoticeModal.classList.add('flex');
        return;
      }
      userState.autoDodge = !userState.autoDodge;
      updateAutoDodgeUI();
      showToast(userState.autoDodge ? '🛡️ VIP생존본능 (자동 회피) ON' : '🛡️ VIP생존본능 OFF');
    };
    updateAutoDodgeUI();

    // ==========================================
    // 3. 조작 및 게임 루프
    // ==========================================
    let touchControl = { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0 };
    canvas.addEventListener('pointerdown', (e) => {
      if (gameState !== 'PLAY') return;
      getAudioContext();
      touchControl.active = true;
      touchControl.startX = e.clientX;
      touchControl.startY = e.clientY;
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!touchControl.active || gameState !== 'PLAY') return;
      const dx = e.clientX - touchControl.startX;
      const dy = e.clientY - touchControl.startY;
      const dist = Math.hypot(dx, dy);
      if (dist > 0) {
        touchControl.moveX = (dx / Math.max(dist, 40)) * player.speed;
        touchControl.moveY = (dy / Math.max(dist, 40)) * player.speed;
      }
    });
    const resetTouch = () => { touchControl.active = false; touchControl.moveX = 0; touchControl.moveY = 0; };
    canvas.addEventListener('pointerup', resetTouch);
    canvas.addEventListener('pointercancel', resetTouch);

    let keys = {};
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (k === 'g' && !e.repeat && gameState === 'PLAY') {
        useGrenade();
      }
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function updateStageUI() {
      document.getElementById('stageVal').textContent = stage;
      document.getElementById('stageGoalVal').textContent = bossSpawned
        ? '🔥 보스 처치!'
        : `처치: ${stageKills} / ${stageTargetKills}`;
      document.getElementById('expBar').style.width = `${Math.min(100, (player.exp / player.maxExp) * 100)}%`;
    }

    function startGame() {
      getAudioContext();
      resizeCanvas();
      gameState = 'PLAY';
      score = 0;
      stage = 1;
      stageKills = 0;
      stageTargetKills = 15;
      bossSpawned = false;

      zombies = [];
      bullets = [];
      gems = [];
      particles = [];
      floatingTexts = [];

      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.level = 1;
      player.exp = 0;
      player.maxExp = 30;
      player.maxHp = userState.isVip ? 150 : 100;
      player.hp = player.maxHp;
      player.damage = userState.isVip ? 24 : 18;
      player.multiShotLevel = 0;
      player.multiShot = 1;
      player.rapidLevel = 0;
      player.attackSpeed = RAPID_FIRE_COOLDOWNS[0];
      player.grenades = 0;
      player.muzzleFlash = 0;

      document.getElementById('scoreVal').textContent = '0';
      document.getElementById('levelVal').textContent = '1';
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('bossAlert').classList.add('hidden');
      document.getElementById('upgradeModal').classList.add('hidden');
      updateGrenadeUI();
      updateStageUI();

      if (audioPrefs.bgmEnabled) startBGM();
      startSpawner();
    }

    function startSpawner() {
      if (spawnTimer) clearInterval(spawnTimer);
      spawnTimer = setInterval(() => {
        if (gameState === 'PLAY' && !bossSpawned) {
          spawnZombie(false);
        }
      }, Math.max(350, 1050 - stage * 110));
    }

    function spawnZombie(isBoss) {
      const edge = Math.floor(Math.random() * 4);
      let x, y;
      if (edge === 0) { x = Math.random() * canvas.width; y = -28; }
      else if (edge === 1) { x = Math.random() * canvas.width; y = canvas.height + 28; }
      else if (edge === 2) { x = -28; y = Math.random() * canvas.height; }
      else { x = canvas.width + 28; y = Math.random() * canvas.height; }

      if (isBoss) {
        bossSpawned = true;
        const alertEl = document.getElementById('bossAlert');
        alertEl.classList.remove('hidden');
        setTimeout(() => alertEl.classList.add('hidden'), 3000);
        updateStageUI();

        zombies.push({
          x, y,
          radius: 30,
          speed: 1.1 + stage * 0.1,
          hp: 280 + stage * 180,
          maxHp: 280 + stage * 180,
          isBoss: true,
          expVal: 50,
          hitFlash: 0,
          animOffset: Math.floor(Math.random() * 60)
        });
      } else {
        const isRunner = Math.random() < 0.25;
        zombies.push({
          x, y,
          radius: isRunner ? 12 : 15,
          speed: isRunner ? 2.3 + stage * 0.1 : 1.5 + stage * 0.08,
          hp: 20 + stage * 12,
          maxHp: 20 + stage * 12,
          isBoss: false,
          isRunner,
          expVal: 6,
          hitFlash: 0,
          animOffset: Math.floor(Math.random() * 60)
        });
      }
    }

    function nextStage() {
      gameState = 'STAGE_CLEAR';
      playSfx('levelup');
      if (stage + 1 > userState.bestStage) userState.bestStage = stage + 1;
      syncUserToServer();
      const clearBanner = document.getElementById('stageClearAlert');
      document.getElementById('nextStageText').textContent = `STAGE ${stage + 1} 구역으로 진입합니다!`;
      clearBanner.classList.remove('hidden');

      setTimeout(() => {
        clearBanner.classList.add('hidden');
        stage++;
        if (stage > userState.bestStage) userState.bestStage = stage;
        stageKills = 0;
        stageTargetKills = 15 + stage * 5;
        bossSpawned = false;
        zombies = [];
        player.hp = Math.min(player.maxHp, player.hp + 30);
        updateStageUI();
        gameState = 'PLAY';
        startSpawner();
      }, 1800);
    }

    function getAutoDodgeVelocity() {
      let evadeX = 0;
      let evadeY = 0;
      const dangerRadius = 115;

      zombies.forEach(z => {
        const dx = player.x - z.x;
        const dy = player.y - z.y;
        const dist = Math.hypot(dx, dy);
        const safeDist = dangerRadius + z.radius;
        if (dist > 0 && dist < safeDist) {
          const weight = Math.pow((safeDist - dist) / safeDist, 1.6) * (z.isBoss ? 2.5 : 1.2);
          evadeX += (dx / dist) * weight;
          evadeY += (dy / dist) * weight;
        }
      });

      const margin = 55;
      if (player.x < margin) evadeX += (margin - player.x) / margin;
      if (player.x > canvas.width - margin) evadeX -= (player.x - (canvas.width - margin)) / margin;
      if (player.y < margin) evadeY += (margin - player.y) / margin;
      if (player.y > canvas.height - margin) evadeY -= (player.y - (canvas.height - margin)) / margin;

      const mag = Math.hypot(evadeX, evadeY);
      if (mag > 0.05) {
        return {
          vx: (evadeX / mag) * player.speed * 0.95,
          vy: (evadeY / mag) * player.speed * 0.95
        };
      }
      return { vx: 0, vy: 0 };
    }

    function update() {
      animTick++;
      if (gameState !== 'PLAY') return;

      let vx = touchControl.moveX;
      let vy = touchControl.moveY;
      if (keys['arrowleft'] || keys['a']) vx = -player.speed;
      if (keys['arrowright'] || keys['d']) vx = player.speed;
      if (keys['arrowup'] || keys['w']) vy = -player.speed;
      if (keys['arrowdown'] || keys['s']) vy = player.speed;

      if (vx === 0 && vy === 0 && userState.isVip && userState.autoDodge) {
        const dodge = getAutoDodgeVelocity();
        vx = dodge.vx;
        vy = dodge.vy;
      }

      player.isMoving = Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1;
      player.x = Math.max(player.radius + 8, Math.min(canvas.width - player.radius - 8, player.x + vx));
      player.y = Math.max(player.radius + 8, Math.min(canvas.height - player.radius - 8, player.y + vy));

      if (player.muzzleFlash > 0) player.muzzleFlash--;
      player.attackCooldown--;

      let nearest = null;
      let minDist = player.range;
      zombies.forEach(z => {
        let dist = Math.hypot(z.x - player.x, z.y - player.y);
        if (dist < minDist) { minDist = dist; nearest = z; }
      });

      if (nearest) {
        player.facingAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
        if (player.attackCooldown <= 0) {
          for (let i = 0; i < player.multiShot; i++) {
            let spread = (i - (player.multiShot - 1) / 2) * 0.13;
            let angle = player.facingAngle + spread;
            bullets.push({
              x: player.x + Math.cos(angle) * 20,
              y: player.y + 4 + Math.sin(angle) * 20,
              vx: Math.cos(angle) * 9.5,
              vy: Math.sin(angle) * 9.5,
              angle,
              damage: player.damage,
              radius: 4.5
            });
          }
          player.muzzleFlash = 4;
          playSfx('shoot');
          player.attackCooldown = player.attackSpeed;
        }
      } else if (vx !== 0 || vy !== 0) {
        player.facingAngle = Math.atan2(vy, vx);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -10 || b.x > canvas.width + 10 || b.y < -10 || b.y > canvas.height + 10) {
          bullets.splice(i, 1);
        }
      }

      for (let zIdx = zombies.length - 1; zIdx >= 0; zIdx--) {
        let z = zombies[zIdx];
        if (z.hitFlash > 0) z.hitFlash--;
        let angle = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(angle) * z.speed;
        z.y += Math.sin(angle) * z.speed;

        if (Math.hypot(player.x - z.x, player.y - z.y) < player.radius + z.radius) {
          player.hp -= z.isBoss ? 1.2 : 0.55;
          if (player.hp <= 0) {
            gameOver();
            return;
          }
        }

        for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
          let b = bullets[bIdx];
          if (Math.hypot(b.x - z.x, b.y - z.y) < b.radius + z.radius) {
            z.hp -= b.damage;
            z.hitFlash = 4;
            bullets.splice(bIdx, 1);

            // 피격 도트 스파크 & 슬라임 파편
            for (let p = 0; p < 5; p++) {
              particles.push({
                x: b.x, y: b.y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 14,
                size: p === 0 ? 5 : 3,
                color: p < 2 ? '#facc15' : (z.isBoss ? '#a855f7' : '#84cc16')
              });
            }

            if (z.hp <= 0) {
              const pts = z.isBoss ? 500 : 15;
              score += pts;
              document.getElementById('scoreVal').textContent = score.toLocaleString();
              if (score > userState.bestScore) {
                userState.bestScore = score;
              }
              playSfx('kill');

              // 처치 시 만화 폭발 픽셀 파편 + 팝업 텍스트
              for (let p = 0; p < (z.isBoss ? 18 : 8); p++) {
                particles.push({
                  x: z.x, y: z.y,
                  vx: (Math.random() - 0.5) * (z.isBoss ? 8 : 5),
                  vy: (Math.random() - 0.5) * (z.isBoss ? 8 : 5),
                  life: 18,
                  size: 4 + Math.floor(Math.random() * 3),
                  color: p % 3 === 0 ? '#f97316' : (p % 3 === 1 ? '#facc15' : '#65a30d')
                });
              }
              floatingTexts.push({
                x: z.x,
                y: z.y - z.radius,
                text: `+${pts}`,
                life: 28,
                color: z.isBoss ? '#fde047' : '#ffffff'
              });

              gems.push({ x: z.x, y: z.y, val: z.expVal, radius: z.isBoss ? 10 : 6 });
              zombies.splice(zIdx, 1);

              if (z.isBoss) {
                nextStage();
                return;
              } else {
                stageKills++;
                if (stageKills >= stageTargetKills && !bossSpawned) {
                  spawnZombie(true);
                }
                updateStageUI();
              }
              break;
            }
          }
        }
      }

      for (let gIdx = gems.length - 1; gIdx >= 0; gIdx--) {
        let g = gems[gIdx];
        let dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < 85) {
          let angle = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(angle) * 5.5;
          g.y += Math.sin(angle) * 5.5;
        }
        if (dist < player.radius + g.radius) {
          player.exp += g.val;
          gems.splice(gIdx, 1);
          updateStageUI();
          if (player.exp >= player.maxExp) levelUp();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].vx *= 0.92;
        particles[i].vy *= 0.92;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].y -= 0.8;
        floatingTexts[i].life--;
        if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function buildStepBoxesHtml(currentStep, maxStep, isMax) {
      let boxes = '<div class="flex items-center gap-1">';
      for (let i = 1; i <= maxStep; i++) {
        const filled = i <= currentStep;
        boxes += `<span class="w-3.5 h-3.5 rounded-[3px] border ${
          filled
            ? 'bg-amber-400 border-amber-200 shadow-[0_0_6px_rgba(251,191,36,0.75)]'
            : 'bg-slate-950 border-slate-600'
        }"></span>`;
      }
      boxes += '</div>';
      if (isMax) {
        boxes += '<span class="text-[10px] font-black text-emerald-300 bg-emerald-950/90 border border-emerald-500/50 px-1.5 py-0.5 rounded mt-1">업그레이드 완료</span>';
      }
      return boxes;
    }

    function levelUp() {
      playSfx('levelup');
      player.level++;
      player.exp = 0;
      player.maxExp = Math.floor(player.maxExp * 1.35);
      document.getElementById('levelVal').textContent = player.level;
      updateStageUI();

      gameState = 'UPGRADE';
      const modal = document.getElementById('upgradeModal');
      const container = document.getElementById('upgradeOptions');
      container.innerHTML = '';

      const isMultiMax = player.multiShotLevel >= MAX_UPGRADE_STEP;
      const isRapidMax = player.rapidLevel >= MAX_UPGRADE_STEP;

      const options = [
        {
          id: 'multi',
          title: `🔫 멀티 샷 (+${player.multiShotLevel}/${MAX_UPGRADE_STEP})`,
          desc: isMultiMax
            ? `현재 총 ${player.multiShot}발 발사 (최대 단계 달성)`
            : `동시 발사 탄환이 1발 추가됩니다. (현재 ${player.multiShot}발 → ${player.multiShot + 1}발)`,
          isMax: isMultiMax,
          hasGauge: true,
          currentStep: player.multiShotLevel,
          maxStep: MAX_UPGRADE_STEP,
          action: () => {
            if (player.multiShotLevel >= MAX_UPGRADE_STEP) return;
            player.multiShotLevel++;
            player.multiShot = 1 + player.multiShotLevel;
          }
        },
        {
          id: 'rapid',
          title: `⚡ 속사 개조 (${player.rapidLevel}/${MAX_UPGRADE_STEP}단계)`,
          desc: isRapidMax
            ? '최고 연사 속도에 도달했습니다.'
            : '연사 속도가 한 단계 빨라집니다.',
          isMax: isRapidMax,
          hasGauge: true,
          currentStep: player.rapidLevel,
          maxStep: MAX_UPGRADE_STEP,
          action: () => {
            if (player.rapidLevel >= MAX_UPGRADE_STEP) return;
            player.rapidLevel++;
            player.attackSpeed = RAPID_FIRE_COOLDOWNS[player.rapidLevel];
          }
        },
        {
          id: 'damage',
          title: '🔥 탄환 화력 강화 (+10)',
          desc: `총알의 기본 데미지가 상승합니다. (현재 ${player.damage})`,
          isMax: false,
          hasGauge: false,
          action: () => { player.damage += 10; }
        },
        {
          id: 'heal',
          title: '💖 응급 치료 키트',
          desc: '체력을 100% 회복하고 최대 체력이 +30 증가합니다.',
          isMax: false,
          hasGauge: false,
          action: () => { player.maxHp += 30; player.hp = player.maxHp; }
        },
        {
          id: 'grenade',
          title: '💣 수류탄 (+1개)',
          desc: `사용 시 화면의 모든 적을 즉시 제거합니다. (보유: ${player.grenades}개)`,
          isMax: false,
          hasGauge: false,
          action: () => {
            player.grenades++;
            updateGrenadeUI();
            showToast(`💣 수류탄 획득! (보유 ${player.grenades}개)`);
          }
        }
      ];

      const picked = options.sort(() => 0.5 - Math.random()).slice(0, 4);

      picked.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.disabled = Boolean(opt.isMax);
        btn.className = opt.isMax
          ? 'w-full p-2.5 bg-slate-900/60 border border-slate-700/70 rounded-xl text-left opacity-70 cursor-not-allowed flex items-center justify-between gap-2'
          : 'w-full p-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-amber-400/70 rounded-xl text-left transition active:scale-98 cursor-pointer flex items-center justify-between gap-2';

        const rightSideHtml = opt.hasGauge
          ? `<div class="flex flex-col items-end shrink-0">${buildStepBoxesHtml(opt.currentStep, opt.maxStep, opt.isMax)}</div>`
          : '';

        btn.innerHTML = `
          <div class="min-w-0">
            <div class="text-xs font-black ${opt.isMax ? 'text-slate-400' : 'text-amber-300'} truncate">${opt.title}</div>
            <div class="text-[10px] text-slate-400 mt-0.5 leading-snug">${opt.desc}</div>
          </div>
          ${rightSideHtml}
        `;

        btn.onclick = () => {
          if (opt.isMax) return;
          opt.action();
          modal.classList.add('hidden');
          gameState = 'PLAY';
        };
        container.appendChild(btn);
      });
      modal.classList.remove('hidden');
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      stopBGM();
      playSfx('gameover');
      clearInterval(spawnTimer);
      if (stage > userState.bestStage) userState.bestStage = stage;
      syncUserToServer();
      document.getElementById('overlayTitle').textContent = "생존 실패!";
      document.getElementById('overlayDesc').textContent = `도달 스테이지: STAGE ${stage} | 최종 점수: ${score}점`;
      document.getElementById('startBtn').textContent = "다시 도전하기";
      document.getElementById('overlay').classList.remove('hidden');
    }

    // ==========================================
    // 4. 픽셀 아트 렌더링 (SD 캐릭터 / 좀비 / 총구 화염)
    // ==========================================
    function drawPixelHPBar(x, y, w, h, ratio, fillColor) {
      const rx = Math.round(x - w / 2);
      const ry = Math.round(y);
      ctx.fillStyle = '#18181b';
      ctx.fillRect(rx - 1, ry - 1, w + 2, h + 2);
      ctx.fillStyle = '#334155';
      ctx.fillRect(rx, ry, w, h);
      ctx.fillStyle = fillColor;
      ctx.fillRect(rx, ry, Math.max(0, Math.round(w * ratio)), h);
    }

    function drawFemaleCharacter(x, y, angle) {
      ctx.save();
      ctx.translate(Math.round(x), Math.round(y));

      // VIP 오라 링
      if (userState.isVip) {
        ctx.strokeStyle = userState.autoDodge ? 'rgba(52, 211, 153, 0.7)' : 'rgba(250, 204, 21, 0.7)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 14, 20, 9, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 바닥 그림자
      ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
      ctx.beginPath();
      ctx.ellipse(0, 16, 13, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 걷기 애니메이션 프레임 & 통통 튀는 바운스
      const frame = player.isMoving ? Math.floor(animTick / 8) % 2 : 0;
      const bob = player.isMoving ? (frame === 1 ? -2 : 0) : Math.round(Math.sin(animTick * 0.1) * 1);
      const facingLeft = Math.cos(angle) < 0;

      // SD 핑크 트윈테일 캐릭터 그리기 (좌우 반전)
      ctx.save();
      if (facingLeft) ctx.scale(-1, 1);
      const spr = SPRITES.player[frame];
      const size = 40;
      ctx.drawImage(spr, -size / 2, -size / 2 - 2 + bob, size, size);
      ctx.restore();

      // 도트 소총 (타겟 방향으로 회전)
      ctx.save();
      ctx.translate(0, 4 + bob);
      ctx.rotate(angle);
      if (facingLeft) ctx.scale(1, -1);

      // 총기 검은 외곽선
      ctx.fillStyle = '#18181b';
      ctx.fillRect(2, -5, 22, 9);
      // 총 몸체
      ctx.fillStyle = '#334155';
      ctx.fillRect(4, -3, 14, 5);
      // 총열
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(16, -2, 6, 3);
      // 탄창
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(9, 2, 4, 4);

      // 총구 화염 (Muzzle Flash)
      if (player.muzzleFlash > 0) {
        const fSize = 7 + player.muzzleFlash * 2;
        ctx.fillStyle = '#f97316';
        ctx.fillRect(22, -fSize / 2, fSize + 4, fSize);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(23, -fSize / 4, fSize, fSize / 2);
      }
      ctx.restore();

      ctx.restore();
    }

    function drawZombie(z) {
      ctx.save();
      ctx.translate(Math.round(z.x), Math.round(z.y));

      const frame = Math.floor((animTick + z.animOffset) / (z.isRunner ? 6 : 10)) % 2;
      const bob = frame === 1 ? -2 : 0;
      const facingLeft = player.x < z.x;

      // 바닥 그림자
      ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
      ctx.beginPath();
      ctx.ellipse(0, z.isBoss ? 28 : 13, z.isBoss ? 26 : 12, z.isBoss ? 10 : 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 스프라이트 선택 (피격 시 흰색 플래시)
      let spr;
      let drawSize;
      if (z.isBoss) {
        spr = z.hitFlash > 0 ? SPRITES.bossFlash[frame] : SPRITES.boss[frame];
        drawSize = 74;
      } else if (z.isRunner) {
        spr = z.hitFlash > 0 ? SPRITES.runnerFlash[frame] : SPRITES.runner[frame];
        drawSize = 30;
      } else {
        spr = z.hitFlash > 0 ? SPRITES.zombieFlash[frame] : SPRITES.zombie[frame];
        drawSize = 36;
      }

      ctx.save();
      if (facingLeft) ctx.scale(-1, 1);
      ctx.drawImage(spr, -drawSize / 2, -drawSize / 2 - 2 + bob, drawSize, drawSize);
      ctx.restore();

      ctx.restore();

      // 도트 체력바
      const barW = z.isBoss ? 58 : 26;
      const barY = z.y - (z.isBoss ? 44 : 24);
      drawPixelHPBar(z.x, barY, barW, z.isBoss ? 6 : 4, z.hp / z.maxHp, z.isBoss ? '#f43f5e' : '#22c55e');
    }

    function draw() {
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 캐싱된 옥상 헬리패드 배경
      ctx.drawImage(bgCanvas, 0, 0);

      // 2. 경험치 보석 (도트 다이아몬드 + 둥실둥실 애니메이션)
      gems.forEach(g => {
        const floatY = Math.sin(animTick * 0.12 + g.x) * 2;
        const size = g.radius > 7 ? 20 : 14;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
        ctx.beginPath();
        ctx.ellipse(g.x, g.y + size * 0.45, size * 0.35, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.drawImage(SPRITES.gem, Math.round(g.x - size / 2), Math.round(g.y - size / 2 + floatY), size, size);
      });

      // 3. Y좌표 기준 정렬(Depth Sorting)로 입체감 있게 캐릭터 & 좀비 그리기
      const renderList = [
        ...zombies.map(z => ({ type: 'zombie', y: z.y, data: z })),
        { type: 'player', y: player.y, data: player }
      ];
      renderList.sort((a, b) => a.y - b.y);

      renderList.forEach(item => {
        if (item.type === 'zombie') {
          drawZombie(item.data);
        } else {
          drawFemaleCharacter(player.x, player.y, player.facingAngle);
          drawPixelHPBar(player.x, player.y - 29, 38, 5, player.hp / player.maxHp, '#ef4444');
        }
      });

      // 4. 예광탄 스타일 총알 (주황 글로우 + 노란 코어)
      bullets.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);
        ctx.fillStyle = '#f97316';
        ctx.fillRect(-10, -3, 14, 6);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(-6, -1.5, 11, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(1, -1, 4, 2);
        ctx.restore();
      });

      // 5. 픽셀 파편 파티클
      particles.forEach(p => {
        const s = p.size || 4;
        ctx.fillStyle = '#18181b';
        ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, s + 2, s + 2);
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), s, s);
      });

      // 6. 만화풍 도트 점수 팝업 (+15, +500)
      ctx.font = '900 11px "Inter", sans-serif';
      ctx.textAlign = 'center';
      floatingTexts.forEach(ft => {
        ctx.globalAlpha = Math.min(1, ft.life / 12);
        ctx.fillStyle = '#18181b';
        ctx.fillText(ft.text, Math.round(ft.x) + 1, Math.round(ft.y) + 1);
        ctx.fillText(ft.text, Math.round(ft.x) - 1, Math.round(ft.y) - 1);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
        ctx.globalAlpha = 1;
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    async function fetchAndRenderRanking() {
      const box = document.getElementById('rankingListContainer');
      const myEl = document.getElementById('myRankDetailText');
      if (!box || !myEl) return;
      try {
        const headers = userState.token ? { 'Authorization': `Bearer ${userState.token}` } : {};
        const res = await apiFetch(`/api/ranking?gameId=${GAME_ID}`, { headers });
        const data = await res.json();
        if (!res.ok) throw new Error();
        const rankings = (data.rankings || []).slice(0, 10);
        if (data.myRank) {
          const myStage = data.myRank.stage ?? data.myRank.saveData?.zombieSurvival?.stage ?? data.myRank.saveData?.stage ?? userState.bestStage ?? 1;
          myEl.textContent = `${data.totalPlayers || rankings.length}명 중 ${data.myRank.rank}위 · STAGE ${myStage} · ${(data.myRank.score || 0).toLocaleString()}점`;
        } else if (userState.loggedIn) {
          myEl.textContent = `최고 STAGE ${userState.bestStage} · 플레이 완료 시 순위 등록`;
        } else {
          myEl.textContent = '로그인 후 플레이 시 등록';
        }
        box.innerHTML = '';
        if (rankings.length === 0) {
          box.innerHTML = '<div class="text-center text-[11px] text-slate-500 py-3">아직 등록된 랭킹이 없습니다.</div>';
          return;
        }
        rankings.forEach(it => {
          const stg = it.stage ?? it.saveData?.zombieSurvival?.stage ?? it.saveData?.stage ?? (it.isMe ? userState.bestStage : 1);
          const row = document.createElement('div');
          row.className = 'rounded-lg px-3 py-2 border bg-slate-950 border-slate-800 flex items-center justify-between gap-2 text-[11px]' + (it.isMe ? ' ring-1 ring-rose-400' : '');
          row.innerHTML =
            '<div class="min-w-0 flex items-center gap-1.5">' +
              '<span class="font-bold text-slate-100 truncate">' +
                it.rank + '. ' + maskPhoneMiddle(it.maskedName) +
                (it.isMe ? ' <span class="text-rose-300 text-[10px]">(나)</span>' : '') +
              '</span>' +
              '<span class="px-1.5 py-0.5 rounded bg-rose-950/90 border border-rose-500/40 text-rose-300 text-[10px] font-extrabold shrink-0">STAGE ' + stg + '</span>' +
            '</div>' +
            '<span class="font-black text-amber-300 shrink-0">' + (it.score || 0).toLocaleString() + ' 점</span>';
          box.appendChild(row);
        });
      } catch (e) {
        box.innerHTML = '<div class="text-center text-[11px] text-slate-500 py-3">랭킹 서버 연결 대기 중</div>';
      }
    }

    function syncAuthFromStorage() {
      const { t, u } = readSharedAuth();
      const vipStored = localStorage.getItem('hero_clicker_is_vip') === 'true';
      if (t !== userState.token || u !== userState.username || (t && vipStored !== userState.isVip)) {
        userState.token = t;
        userState.username = u;
        userState.loggedIn = Boolean(t && u);
        userState.isVip = Boolean(t && vipStored);
        applyVipUI();
        if (userState.token) restoreSessionFromToken();
      }
    }
    window.addEventListener('pageshow', syncAuthFromStorage);
    window.addEventListener('storage', syncAuthFromStorage);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncAuthFromStorage();
    });

    document.getElementById('refreshRankingBtn').addEventListener('click', fetchAndRenderRanking);
    document.getElementById('startBtn').addEventListener('click', startGame);

    applyVipUI();
    restoreSessionFromToken().then(fetchAndRenderRanking);
    loop();
  </script>
</body>
</html>
