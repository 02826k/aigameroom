      // ---- 탄환 ----
      function renderBullets() {
        const t = performance.now() / 1000;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        bullets.forEach(b => {
          const sp = Math.hypot(b.vx, b.vy) || 1;
          const nx = b.vx / sp, ny = b.vy / sp;
          if (b.type === 'laser') {
            const len = 34;
            ctx.strokeStyle = 'rgba(250,204,21,0.45)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(b.x - nx * len, b.y - ny * len); ctx.lineTo(b.x, b.y); ctx.stroke();
            ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(b.x - nx * len * 0.7, b.y - ny * len * 0.7); ctx.lineTo(b.x, b.y); ctx.stroke();
          } else if (b.type === 'grenade') {
            ctx.fillStyle = radFill(b.x - nx * 14, b.y - ny * 14, 0, 22, [[0, 'rgba(251,146,60,0.9)'], [1, 'rgba(251,146,60,0)']]);
            ctx.beginPath(); ctx.arc(b.x - nx * 14, b.y - ny * 14, 22, 0, Math.PI * 2); ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
            rrect(-12, -5, 22, 10, 5, gradFill(0, -5, 0, 5, [[0, '#e5e7eb'], [1, '#6b7280']]), 2);
            ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.moveTo(10, -5); ctx.lineTo(17, 0); ctx.lineTo(10, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#374151'; ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-17, -9); ctx.lineTo(-10, -2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-12, 5); ctx.lineTo(-17, 9); ctx.lineTo(-10, 2); ctx.fill();
            ctx.restore();
            ctx.globalCompositeOperation = 'lighter';
          } else if (b.type === 'plasma') {
            const r = b.radius * (1.6 + 0.2 * Math.sin(t * 30));
            ctx.fillStyle = radFill(b.x, b.y, 0, r * 2.4, [[0, 'rgba(224,242,254,1)'], [0.3, 'rgba(56,189,248,0.85)'], [1, 'rgba(56,189,248,0)']]);
            ctx.beginPath(); ctx.arc(b.x, b.y, r * 2.4, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(56,189,248,0.5)'; ctx.lineWidth = r;
            ctx.beginPath(); ctx.moveTo(b.x - nx * 40, b.y - ny * 40); ctx.lineTo(b.x, b.y); ctx.stroke();
          } else {
            const k = 1 - Math.max(0, b.life) / 0.42;
            const r = b.radius * (0.8 + k * 1.6);
            ctx.fillStyle = radFill(b.x, b.y, 0, r, [[0, `rgba(254,240,138,${0.95 - k * 0.6})`], [0.45, `rgba(249,115,22,${0.8 - k * 0.5})`], [1, 'rgba(220,38,38,0)']]);
            ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
          }
        });

        enemyBullets.forEach(eb => {
          if (eb.style === 'chalk') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.save(); ctx.translate(eb.x, eb.y); ctx.rotate(t * 12);
            rrect(-12, -4, 24, 8, 3, '#f8fafc', 2);
            ctx.restore();
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath(); ctx.arc(eb.x - eb.vx * 0.03, eb.y - eb.vy * 0.03, 9, 0, Math.PI * 2); ctx.fill();
          } else {
            ctx.fillStyle = radFill(eb.x, eb.y, 0, eb.radius * 2.6, [[0, 'rgba(255,255,255,1)'], [0.3, 'rgba(232,121,249,0.9)'], [1, 'rgba(192,38,211,0)']]);
            ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.radius * 2.6, 0, Math.PI * 2); ctx.fill();
          }
        });
        ctx.restore();
      }

      // ---- 파티클 ----
      function renderParticles() {
        particles.forEach(pt => {
          const ratio = Math.max(0, pt.life / (pt.maxLife || 0.4));
          ctx.save();
          if (pt.kind === 'heart') {
            ctx.globalAlpha = ratio;
            ctx.font = '22px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('❤️', pt.x, pt.y);
          } else if (pt.kind === 'smoke') {
            ctx.globalAlpha = ratio * 0.8;
            const r = pt.size * (1.6 - ratio * 0.7);
            ctx.fillStyle = radFill(pt.x, pt.y, 0, r, [[0, pt.color], [1, 'rgba(100,116,139,0)']]);
            ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.fill();
          } else if (pt.kind === 'flash') {
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = ratio;
            ctx.fillStyle = radFill(pt.x, pt.y, 0, pt.size * 1.8, [[0, '#ffffff'], [0.35, pt.color], [1, 'rgba(250,204,21,0)']]);
            ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * 1.8, 0, Math.PI * 2); ctx.fill();
          } else if (pt.kind === 'ring') {
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = ratio;
            ctx.strokeStyle = pt.color; ctx.lineWidth = 6 * ratio + 1;
            ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * (1.8 - ratio), 0, Math.PI * 2); ctx.stroke();
          } else if (pt.kind === 'ember') {
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = ratio;
            ctx.fillStyle = pt.color;
            ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * ratio + 0.5, 0, Math.PI * 2); ctx.fill();
          } else {
            // spark: 속도 방향 줄무늬
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = ratio;
            ctx.strokeStyle = pt.color; ctx.lineWidth = Math.max(1.5, pt.size * 0.45 * ratio); ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt.x - pt.vx * 0.05, pt.y - pt.vy * 0.05); ctx.stroke();
          }
          ctx.restore();
        });
      }

      function renderPickups() {
        const t = performance.now() / 1000;
        pickups.forEach(pk => {
          const bob = Math.sin(t * 4 + pk.x) * 3;
          drawShadow(pk.x, pk.y + 16, 26);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = radFill(pk.x, pk.y + bob, 0, 34, [[0, 'rgba(74,222,128,0.55)'], [1, 'rgba(74,222,128,0)']]);
          ctx.beginPath(); ctx.arc(pk.x, pk.y + bob, 34, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          rrect(pk.x - 16, pk.y - 14 + bob, 32, 28, 7, gradFill(0, pk.y - 14, 0, pk.y + 14, [[0, '#f8fafc'], [1, '#cbd5e1']]), 3);
          rrect(pk.x - 6, pk.y - 20 + bob, 12, 7, 3, '#94a3b8', 2);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(pk.x - 3, pk.y - 9 + bob, 6, 18); ctx.fillRect(pk.x - 9, pk.y - 3 + bob, 18, 6);
        });
      }

      function renderPostFx() {
        const t = performance.now() / 1000;
        // 비네팅
        const v = ctx.createRadialGradient(CAM_W / 2, CAM_H / 2, CAM_H * 0.35, CAM_W / 2, CAM_H / 2, CAM_W * 0.68);
        v.addColorStop(0, 'rgba(0,0,0,0)');
        v.addColorStop(1, sector >= 3 ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.32)');
        ctx.fillStyle = v; ctx.fillRect(0, 0, CAM_W, CAM_H);
        // 스테이지별 조명
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        if (sector === 3) {
          ctx.fillStyle = `rgba(249,115,22,${0.06 + 0.03 * Math.sin(t * 7)})`;
          ctx.fillRect(0, 0, CAM_W, CAM_H);
        } else if (sector === 4) {
          ctx.fillStyle = radFill(CAM_W * 0.8, -40, 10, 420, [[0, 'rgba(168,85,247,0.22)'], [1, 'rgba(168,85,247,0)']]);
          ctx.fillRect(0, 0, CAM_W, CAM_H);
        } else if (sector === 1) {
          ctx.fillStyle = radFill(CAM_W * 0.2, -60, 10, 460, [[0, 'rgba(255,237,180,0.18)'], [1, 'rgba(255,237,180,0)']]);
          ctx.fillRect(0, 0, CAM_W, CAM_H);
        }
        ctx.restore();
        // 피격 시 붉은 테두리
        if (player.invuln > 0.5 && running && !rescueSequence && player.hp < player.maxHp) {
          ctx.fillStyle = `rgba(239,68,68,${(player.invuln - 0.5) * 0.5})`;
          ctx.fillRect(0, 0, CAM_W, 6); ctx.fillRect(0, CAM_H - 6, CAM_W, 6);
          ctx.fillRect(0, 0, 6, CAM_H); ctx.fillRect(CAM_W - 6, 0, 6, CAM_H);
        }
        if (screenFlash > 0) {
          ctx.fillStyle = `rgba(255,255,255,${screenFlash})`;
          ctx.fillRect(0, 0, CAM_W, CAM_H);
        }
      }

      function renderWorld() {
        ctx.save();
        if (screenShake > 0) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        renderSectorBackground();

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        PLATFORMS.forEach(p => {
          if (p.x + p.w < camera.x - 50 || p.x > camera.x + CAM_W + 50) return;
          if (p.style === 'ground') drawGround(p); else drawPlatform(p);
        });

        if (sector < 4) renderPortal();
        if (sector === 4) renderMom();

        renderPickups();

        enemies.forEach(en => {
          if (en.x + 80 < camera.x || en.x - 80 > camera.x + CAM_W) return;
          renderEnemy(en);
        });

        if (boss && !boss.defeated && boss.hp > 0) renderBossCharacter(boss);

        renderPlayer();
        renderBullets();
        renderParticles();

        // 조준 크로스헤어
        if (!missileBtnHeld && !rescueSequence && running) {
          const aimX = pointerScreen.x + camera.x;
          const aimY = pointerScreen.y + camera.y;
          const t = performance.now() / 1000;
          ctx.save();
          ctx.translate(aimX, aimY); ctx.rotate(t * 1.5);
          ctx.strokeStyle = 'rgba(250,204,21,0.95)'; ctx.lineWidth = 2.5;
          ctx.shadowColor = '#facc15'; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.stroke();
          for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(22, 0); ctx.stroke();
          }
          ctx.restore();
        }

        floatingTexts.forEach(ft => {
          ctx.save();
          ctx.globalAlpha = Math.min(1, ft.life * 1.5);
          const pop = 1 + Math.max(0, ft.life - 0.6) * 1.2;
          ctx.translate(ft.x, ft.y); ctx.scale(pop, pop);
          ctx.font = '900 18px "Noto Sans KR"';
          ctx.textAlign = 'center';
          ctx.strokeStyle = '#020617'; ctx.lineWidth = 5;
          ctx.strokeText(ft.text, 0, 0);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, 0, 0);
          ctx.restore();
        });

        ctx.restore();

        renderPostFx();
        renderTopLeftHud();
        renderTopRightHud();
        renderCenterStageBanner();

        ctx.restore();
      }

      let lastTs = 0;
      function mainLoop(ts) {
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
        lastTs = ts;

        if (running) updateGame(dt);

        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, viewW, viewH);

        const wideFullscreen = Boolean(document.fullscreenElement) && viewW / viewH > CAM_W / CAM_H;
        const scale = Math.min(viewW / CAM_W, viewH / CAM_H);
        const scaleX = wideFullscreen ? viewW / CAM_W : scale;
        const scaleY = wideFullscreen ? viewH / CAM_H : scale;
        const ox = wideFullscreen ? 0 : (viewW - CAM_W * scale) / 2;
        const oy = wideFullscreen ? 0 : viewH - CAM_H * scale;
        ctx.save();
        ctx.translate(ox, oy);
        ctx.scale(scaleX, scaleY);
        renderWorld();
        ctx.restore();

        requestAnimationFrame(mainLoop);
      }

      // ==========================================
      // 5. HUD & 입력 이벤트 바인딩 (기존 게임패드)
      // ==========================================
      function updateHud() {
        const hsEl = document.getElementById('highScoreDisplay');
        if (hsEl) hsEl.textContent = Math.floor(score).toLocaleString();
        document.getElementById('waveDisplay').textContent = SECTOR_INFO[sector].title;

        document.querySelectorAll('.weapon-slot-btn').forEach(btn => {
          const idx = Number(btn.dataset.weapon);
          if (idx === player.weaponIdx) {
            btn.className = 'weapon-slot-btn rounded-xl py-2 border-2 border-amber-400 bg-slate-950 text-center transition cursor-pointer shadow';
          } else {
            btn.className = 'weapon-slot-btn rounded-xl py-2 border border-slate-800 bg-slate-950/70 text-center transition cursor-pointer opacity-80';
          }
        });
      }

      function screenToCamera(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const wideFullscreen = Boolean(document.fullscreenElement) && viewW / viewH > CAM_W / CAM_H;
        const scale = Math.min(viewW / CAM_W, viewH / CAM_H);
        const scaleX = wideFullscreen ? viewW / CAM_W : scale;
        const scaleY = wideFullscreen ? viewH / CAM_H : scale;
        const ox = wideFullscreen ? 0 : (viewW - CAM_W * scale) / 2;
        const oy = wideFullscreen ? 0 : viewH - CAM_H * scale;
        return {
          x: (clientX - rect.left - ox) / scaleX,
          y: (clientY - rect.top - oy) / scaleY
        };
      }

      const fullscreenStage = document.getElementById('fullscreenStage');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      function lockOrientationMode(mode) {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock(mode).catch(() => {
            if (mode === 'portrait' && screen.orientation.unlock) {
              try { screen.orientation.unlock(); } catch (err) {}
            }
          });
        }
      }

      fullscreenBtn.addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await fullscreenStage.requestFullscreen();
            fullscreenBtn.textContent = '✕ 축소';
            lockOrientationMode('landscape');
          } else {
            await document.exitFullscreen();
            fullscreenBtn.textContent = '⛶ 전체화면';
            lockOrientationMode('portrait');
          }
        } catch (e) {
          showToast('이 브라우저에서는 전체화면을 지원하지 않습니다.');
        }
        setTimeout(resizeCanvas, 120);
      });
      document.addEventListener('fullscreenchange', () => {
        const isFs = Boolean(document.fullscreenElement);
        fullscreenBtn.textContent = isFs ? '✕ 축소' : '⛶ 전체화면';
        if (!isFs) {
          lockOrientationMode('portrait');
        }
        requestAnimationFrame(() => setTimeout(resizeCanvas, 120));
      });

      window.addEventListener('orientationchange', () => {
        setTimeout(resizeCanvas, 120);
        setTimeout(resizeCanvas, 400);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          if (document.fullscreenElement) resizeCanvas();
        });
      }

      canvas.addEventListener('pointermove', (e) => {
        pointerScreen = screenToCamera(e.clientX, e.clientY);
      });
      canvas.addEventListener('pointerdown', (e) => {
        if (!running) return;
        getAC();
        pointerScreen = screenToCamera(e.clientX, e.clientY);
        isFiring = true;
      });
      window.addEventListener('pointerup', () => { isFiring = false; });

      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (!running) return;
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') triggerDash();
        if (e.code === 'Digit1') selectWeapon(0);
        else if (e.code === 'Digit2') selectWeapon(1);
        else if (e.code === 'Digit3') selectWeapon(2);
        else if (e.code === 'Digit4') selectWeapon(3);
        else if (e.code === 'KeyQ') selectWeapon((player.weaponIdx + 1) % 4);
      });
      window.addEventListener('keyup', (e) => { keys[e.code] = false; });

      document.querySelectorAll('.weapon-slot-btn').forEach(btn => {
        btn.addEventListener('click', () => selectWeapon(Number(btn.dataset.weapon)));
      });

      function bindDashButton(btnEl) {
        if (!btnEl) return;
        btnEl.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          getAC();
          triggerDash();
        });
      }
      bindDashButton(document.getElementById('mobDashBtn'));

      function bindFireButton(btnEl) {
        if (!btnEl) return;
        btnEl.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          getAC();
          missileBtnHeld = true;
        });
        const release = () => { missileBtnHeld = false; };
        btnEl.addEventListener('pointerup', release);
        btnEl.addEventListener('pointercancel', release);
        btnEl.addEventListener('pointerleave', release);
      }
      bindFireButton(document.getElementById('missileFireBtn'));

      function bindVirtualStick(zoneEl, knobEl) {
        if (!zoneEl || !knobEl) return;
        let activePointerId = null;

        function updateStick(cx, cy) {
          const rect = zoneEl.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const dx = cx - centerX;
          const dy = cy - centerY;
          const maxR = rect.width / 2 - 18;
          const dist = Math.hypot(dx, dy);
          const clamped = Math.min(dist, maxR);
          const ang = Math.atan2(dy, dx);
          knobEl.style.transform = `translate(${Math.cos(ang) * clamped}px, ${Math.sin(ang) * clamped}px)`;
          const nx = maxR > 0 ? (Math.cos(ang) * clamped) / maxR : 0;
          const ny = maxR > 0 ? (Math.sin(ang) * clamped) / maxR : 0;
          moveStickVec = { x: nx, y: ny, active: true };
        }

        zoneEl.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          getAC();
          activePointerId = e.pointerId;
          if (zoneEl.setPointerCapture) try { zoneEl.setPointerCapture(e.pointerId); } catch {}
          updateStick(e.clientX, e.clientY);
        });
        window.addEventListener('pointermove', (e) => {
          if (activePointerId !== null && e.pointerId === activePointerId) {
            updateStick(e.clientX, e.clientY);
          }
        });
        const resetStick = (e) => {
          if (activePointerId !== null && e.pointerId === activePointerId) {
            activePointerId = null;
            knobEl.style.transform = 'translate(0px, 0px)';
            moveStickVec = { x: 0, y: 0, active: false };
          }
        };
        window.addEventListener('pointerup', resetStick);
        window.addEventListener('pointercancel', resetStick);
      }
      bindVirtualStick(document.getElementById('moveStickZone'), document.getElementById('moveStickKnob'));

      // ==========================================
      // 6. 랭킹 / 로그인 / VIP / 바로가기 / 토스트
      // ==========================================
      let toastTimer = null;
      function showToast(msg) {
        const b = document.getElementById('toastBox');
        document.getElementById('toastMsg').textContent = msg;
        b.classList.remove('opacity-0', 'translate-y-2');
        b.classList.add('opacity-100', 'translate-y-0');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          b.classList.remove('opacity-100', 'translate-y-0');
          b.classList.add('opacity-0', 'translate-y-2');
        }, 2200);
      }

      async function fetchRanking() {
        const listEl = document.getElementById('rankingListContainer');
        const myRankEl = document.getElementById('myRankDetailText');
        try {
          const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
          const res = await fetch(`${API_BASE_URL}/api/ranking?gameId=${GAME_ID}&_t=${Date.now()}`, { headers });
          const data = await res.json();
          if (!res.ok) throw new Error();

          const rankings = data.rankings || [];
          if (data.myRank) {
            myRankEl.textContent = `전체 ${data.totalPlayers || rankings.length}명 중 ${data.myRank.rank}위 · 최고 ${Number(data.myRank.score || state.highScore).toLocaleString()}점`;
          } else if (authToken) {
            myRankEl.textContent = '작전 완료 시 최신 점수가 순위에 반영됩니다';
          } else {
            myRankEl.textContent = '로그인 시 실시간 순위에 등록됩니다';
          }

          if (rankings.length === 0) {
            listEl.innerHTML = '<div class="text-center py-4 text-xs text-slate-500">아직 등록된 기록이 없습니다. 첫 1위에 도전하세요!</div>';
            return;
          }

          listEl.innerHTML = rankings.slice(0, 10).map((item, idx) => {
            const rank = item.rank ?? (idx + 1);
            return `
              <div class="rounded-xl px-3 py-2 border ${item.isMe ? 'bg-amber-950/30 border-amber-400/60' : 'bg-slate-950/80 border-slate-800'} flex items-center justify-between text-xs">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="font-black text-amber-300 w-6">${rank}위</span>
                  <span class="font-bold text-slate-100 truncate">${maskPhoneMiddle(item.maskedName)}</span>
                  ${item.isMe ? '<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px] font-bold">나</span>' : ''}
                </div>
                <div class="text-right shrink-0 flex items-center gap-2">
                  ${(item.clearTime || item.saveData?.bestTime) ? `<span class="text-[10px] font-bold text-sky-300">⏱ ${formatTimeSec(item.clearTime || item.saveData?.bestTime)}</span>` : ''}
                  <span class="font-black text-emerald-400">${Number(item.score || 0).toLocaleString()}점</span>
                </div>
              </div>
            `;
          }).join('');
        } catch (e) {
          listEl.innerHTML = '<div class="text-center py-4 text-xs text-slate-500">랭킹 서버 연결 대기 중...</div>';
        }
      }

      function updateHeaderUI() {
        const btn = document.getElementById('authHeaderBtn');
        if (!btn) return;
        const isVip = state.isVip || localStorage.getItem('hero_clicker_is_vip') === 'true';
        if (authToken && currentUsername) {
          if (isVip) {
            btn.textContent = '👑 VIP 로그아웃';
            btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-r from-purple-600 to-indigo-600 hover:brightness-110 text-amber-200 border border-amber-300/70 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap';
          } else {
            btn.textContent = '로그아웃';
            btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-600 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap';
          }
        } else {
          btn.textContent = '로그인';
          btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap';
        }
      }

      function handleLogout(expired = false) {
        authToken = null;
        currentUsername = null;
        state.isVip = false;
        syncSharedAuth(null, null);
        updateHeaderUI();
        fetchRanking();
        showToast(expired ? '로그인이 만료되었습니다.' : '로그아웃되었습니다.');
      }

      function syncAuthFromStorage() {
        const { t, u } = readSharedAuth();
        if (t !== authToken || u !== currentUsername) {
          authToken = t;
          currentUsername = u;
          if (!authToken) state.isVip = false;
          updateHeaderUI();
          if (authToken) loadFromServer();
          fetchRanking();
        }
      }
      window.addEventListener('pageshow', syncAuthFromStorage);
      window.addEventListener('storage', syncAuthFromStorage);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') syncAuthFromStorage();
      });

      document.getElementById('overlayStartBtn').addEventListener('click', startGame);
      document.getElementById('overlayLobbyBtn').addEventListener('click', returnToMomLobby);
      document.getElementById('refreshRankingBtn').addEventListener('click', () => { fetchRanking(); showToast('🏆 랭킹을 갱신했습니다.'); });

      function updateAudioButtons() {
        const bgmBtn = document.getElementById('bgmToggleBtn');
        const sfxBtn = document.getElementById('soundToggleBtn');
        if (bgmBtn) {
          bgmBtn.textContent = state.bgmEnabled ? '🎵 배경음 ON' : '🔇 배경음 OFF';
          bgmBtn.className = state.bgmEnabled
            ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer'
            : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer';
        }
        if (sfxBtn) {
          sfxBtn.textContent = state.soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
          sfxBtn.className = state.soundEnabled
            ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer'
            : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer';
        }
      }
      updateAudioButtons();

      document.getElementById('bgmToggleBtn').addEventListener('click', () => {
        state.bgmEnabled = !state.bgmEnabled;
        saveState(false);
        updateAudioButtons();
        if (state.bgmEnabled && running) startBGM(); else stopBGM();
      });
      document.getElementById('soundToggleBtn').addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        saveState(false);
        updateAudioButtons();
      });
      document.getElementById('headerExitLobbyBtn').addEventListener('click', () => {
        window.location.href = 'https://02826k.github.io/aigameroom/';
      });

      document.getElementById('authHeaderBtn').addEventListener('click', () => {
        if (authToken && currentUsername) {
          if (confirm('로그아웃 하시겠습니까?')) handleLogout(false);
        } else {
          goLobbyAuth('login');
        }
      });
      document.getElementById('vipOpenBtn')?.addEventListener('click', () => {
        goLobbyAuth('vip');
      });

      const rankOverlay = document.getElementById('rankOverlay');
      document.getElementById('rankOpenBtn').addEventListener('click', () => {
        fetchRanking();
        rankOverlay.classList.remove('hidden');
      });
      document.getElementById('rankCloseBtn').addEventListener('click', () => {
        rankOverlay.classList.add('hidden');
      });
      rankOverlay.addEventListener('click', (e) => {
        if (e.target === rankOverlay) rankOverlay.classList.add('hidden');
      });

      resizeCanvas();
      PLATFORMS = buildStagePlatforms(1);
      updateHeaderUI();
      updateHud();
      if (authToken) loadFromServer();
      fetchRanking();
      requestAnimationFrame(mainLoop);
    })();
  </script>
</body>
</html>
