<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>초등 영어 파닉스 & A-Z 영단어 백과사전</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f0f9ff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .eng-font { font-family: 'Fredoka', sans-serif; }
    .card-bounce { transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .card-bounce:active { transform: scale(0.93); }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-4 text-slate-800 gap-4">

  <!-- 1. 상단 헤더 -->
  <header class="w-full max-w-lg bg-white rounded-3xl shadow-md p-3 flex flex-wrap items-center justify-between gap-2 border-2 border-sky-100">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🔤</span>
      <h1 class="font-black text-base sm:text-lg text-sky-600 tracking-tight">초등 파닉스</h1>
    </div>

    <button id="btnTeacherModal" class="flex items-center gap-1.5 px-3 py-1.5 rounded-2xl bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-700 text-xs font-black card-bounce">
      <span id="currentTeacherEmoji">👩‍🏫</span>
      <span id="currentTeacherName">제니 선생님</span>
      <span class="text-[10px] opacity-70">▼</span>
    </button>

    <div class="flex gap-1 bg-slate-100 p-1 rounded-2xl">
      <button id="btnModeLearn" class="px-2.5 py-1.5 rounded-xl text-xs font-black bg-sky-500 text-white shadow-sm transition">
        📖 단어학습
      </button>
      <button id="btnModeQuiz" class="px-2.5 py-1.5 rounded-xl text-xs font-black text-slate-500 hover:text-slate-700 transition">
        🎯 퀴즈
      </button>
    </div>
  </header>

  <!-- 2. 메인 학습 영역 -->
  <main id="learnSection" class="w-full max-w-lg flex flex-col items-center gap-3">
    <div id="stageTabs" class="w-full grid grid-cols-4 gap-1.5"></div>
    <div id="categoryTabs" class="w-full flex gap-1.5 overflow-x-auto no-scrollbar py-1 px-0.5"></div>

    <div class="w-full bg-white rounded-[2rem] shadow-xl p-5 sm:p-6 border-4 border-amber-200 flex flex-col items-center gap-4 relative">
      <div class="flex items-center justify-between w-full">
        <span class="text-[11px] font-bold text-amber-600 bg-amber-50 px-3 py-1 rounded-full">
          글자를 누르면 음가 소리 · 아래 버튼을 누르면 단어 읽기!
        </span>
        <span id="progressText" class="font-black text-xs text-sky-600 bg-sky-50 px-2.5 py-1 rounded-full">1 / 5</span>
      </div>

      <div class="flex flex-col items-center my-1">
        <div id="wordEmoji" class="text-7xl mb-1 animate-pop">🐱</div>
        <div id="wordMeaning" class="text-2xl font-black text-slate-800">고양이</div>
      </div>

      <div id="letterContainer" class="flex items-center justify-center flex-wrap gap-1.5 sm:gap-2 my-1"></div>

      <button id="btnReadWord" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-white font-black text-lg shadow-lg shadow-orange-200 card-bounce flex items-center justify-center gap-2">
        <span>🔊</span> <span id="readWordText" class="eng-font text-2xl sm:text-3xl tracking-wider">CAT</span> <span>단어 읽기!</span>
      </button>
    </div>

    <div class="w-full flex items-center justify-between gap-3">
      <button id="btnPrev" class="flex-1 py-3.5 rounded-2xl bg-white border-2 border-slate-200 font-black text-slate-600 shadow-sm card-bounce">
        ◀ 이전 단어
      </button>
      <button id="btnNext" class="flex-1 py-3.5 rounded-2xl bg-sky-500 text-white font-black shadow-md shadow-sky-200 card-bounce">
        다음 단어 ▶
      </button>
    </div>
  </main>

  <!-- 3. 메인 퀴즈 영역 -->
  <section id="quizSection" class="hidden w-full max-w-lg flex flex-col items-center gap-4">
    <div class="w-full bg-white rounded-[2rem] shadow-xl p-6 border-4 border-emerald-200 flex flex-col items-center gap-5">
      <div class="flex items-center justify-between w-full">
        <span class="text-xs font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">현재 단계 단어 퀴즈</span>
        <span id="quizScore" class="text-sm font-black text-amber-500">⭐ 0점</span>
      </div>

      <div class="text-center my-1">
        <button id="btnQuizSpeak" class="w-24 h-24 rounded-full bg-gradient-to-b from-emerald-400 to-teal-600 text-white text-4xl shadow-lg shadow-emerald-200 card-bounce flex items-center justify-center mx-auto mb-2">
          🔊
        </button>
        <p class="text-xs font-bold text-slate-500">스피커를 눌러 소리를 듣고 알맞은 단어를 고르세요</p>
      </div>

      <div id="quizOptions" class="w-full grid grid-cols-1 gap-2.5"></div>
    </div>
  </section>

  <!-- 4. 하단 A~Z 영단어 백과사전 (외부 JS 분할 로딩 + 실시간 무료 사전 API 보조) -->
  <section class="w-full max-w-lg bg-white rounded-[2rem] shadow-lg p-4 sm:p-5 border-2 border-indigo-100 flex flex-col gap-3 mt-2 mb-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">📚</span>
        <h2 class="font-black text-base text-indigo-900">A ~ Z 영단어 백과사전</h2>
      </div>
      <span id="dictTotalCount" class="text-xs font-black text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">로딩중...</span>
    </div>

    <div class="relative flex gap-1.5">
      <div class="relative flex-1">
        <input type="text" id="dictSearchInput" placeholder="영어 단어 또는 한글 뜻 검색 (예: apple, 사과)..."
          class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-slate-100 text-sm font-bold text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
      </div>
      <button id="btnOnlineSearch" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-xs font-black shrink-0 card-bounce" title="사전에 없는 단어도 실시간 검색">
        🌐 확장검색
      </button>
    </div>

    <div id="alphabetFilter" class="flex flex-wrap gap-1 justify-center"></div>

    <div id="dictList" class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-80 overflow-y-auto pr-1 pt-1"></div>
  </section>

  <!-- 선생님 선택 모달 -->
  <div id="teacherModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border-2 border-purple-200 flex flex-col gap-4 animate-pop">
      <div class="flex items-center justify-between">
        <h3 class="font-black text-base text-purple-900">🎙️ 선생님 목소리 선택</h3>
        <button id="btnCloseTeacherModal" class="w-8 h-8 rounded-full bg-slate-100 font-bold text-slate-500">✕</button>
      </div>
      <p class="text-xs text-slate-500 font-bold leading-relaxed">
        원하는 선생님을 선택하세요. (audio/ 폴더에 Higgsfield 음성 파일을 넣으면 자동 재생됩니다)
      </p>
      <div id="teacherList" class="flex flex-col gap-2"></div>
    </div>
  </div>

  <!-- 기본 초등 필수 단어 데이터 로드 -->
  <script src="data/dict_elem.js"></script>
  <script>
    const TEACHERS = [
      { id: 'jenny', name: '제니 선생님', emoji: '👩‍🏫', desc: '상냥하고 또렷한 미국 여성 발음 (기본)', audioFolder: 'audio/jenny', ttsPitch: 1.15, ttsRate: 0.85, preferFemale: true },
      { id: 'leo', name: '레오 선생님', emoji: '👨‍🏫', desc: '씩씩하고 힘찬 미국 남성 발음', audioFolder: 'audio/leo', ttsPitch: 0.85, ttsRate: 0.85, preferFemale: false },
      { id: 'robo', name: '알파 로봇쌤', emoji: '🤖', desc: '재미있는 AI 로봇 친구 목소리', audioFolder: 'audio/robo', ttsPitch: 1.35, ttsRate: 0.90, preferFemale: true },
      { id: 'custom1', name: '힉스필드 커스텀 1', emoji: '🌟', desc: 'Higgsfield 스페셜 성우 (audio/custom1)', audioFolder: 'audio/custom1', ttsPitch: 1.05, ttsRate: 0.82, preferFemale: true }
    ];
    let currentTeacher = TEACHERS[0];

    const PHONICS_SOUNDS = {
      'a': 'æ', 'b': 'buh', 'c': 'kuh', 'd': 'duh', 'e': 'eh',
      'f': 'fff', 'g': 'guh', 'h': 'huh', 'i': 'ih', 'j': 'juh',
      'k': 'kuh', 'l': 'lll', 'm': 'mmm', 'n': 'nnn', 'o': 'aw',
      'p': 'puh', 'q': 'kwuh', 'r': 'ruh', 's': 'sss', 't': 'tuh',
      'u': 'uh', 'v': 'vvv', 'w': 'wuh', 'x': 'ks', 'y': 'yuh', 'z': 'zzz'
    };

    // 음성 엔진
    let availableVoices = [];
    if ('speechSynthesis' in window) {
      const loadVoices = () => { availableVoices = window.speechSynthesis.getVoices(); };
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakTTS(text, isSinglePhoneme = false) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = isSinglePhoneme ? 0.95 : currentTeacher.ttsRate;
      utter.pitch = currentTeacher.ttsPitch;
      const enVoices = availableVoices.filter(v => v.lang.includes('en-US') || v.lang.includes('en_US'));
      if (enVoices.length > 0) {
        const preferred = enVoices.find(v =>
          currentTeacher.preferFemale
            ? (v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Google US English') || v.name.includes('Zira'))
            : (v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('David'))
        );
        utter.voice = preferred || enVoices[0];
      }
      window.speechSynthesis.speak(utter);
    }

    function playWordAudio(word, customAudioUrl = null) {
      const cleanFile = word.toLowerCase().replace(/\s+/g, '_');
      const audioPath = `${currentTeacher.audioFolder}/${cleanFile}.mp3`;
      const audio = new Audio(audioPath);
      audio.play().catch(() => {
        if (customAudioUrl) {
          new Audio(customAudioUrl).play().catch(() => speakTTS(word, false));
        } else {
          speakTTS(word, false);
        }
      });
    }

    function playPhonemeAudio(char) {
      const lower = char.toLowerCase();
      if (!/[a-z]/.test(lower)) return;
      const audioPath = `${currentTeacher.audioFolder}/phonics_${lower}.mp3`;
      const audio = new Audio(audioPath);
      audio.play().catch(() => speakTTS(PHONICS_SOUNDS[lower] || lower, true));
    }

    // 효과음
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function playSuccessSound() {
      playTone(523.25, 'triangle', 0.12);
      setTimeout(() => playTone(659.25, 'triangle', 0.12), 100);
      setTimeout(() => playTone(783.99, 'triangle', 0.25), 200);
    }
    function playWrongSound() {
      playTone(220, 'sawtooth', 0.2);
      setTimeout(() => playTone(180, 'sawtooth', 0.25), 150);
    }

    // 학습 화면 렌더링
    let curStageIdx = 0, curCatIdx = 0, curWordIdx = 0;
    const CURRICULUM = window.ELEM_CURRICULUM || [];

    function getCurrentWordObj() {
      return CURRICULUM[curStageIdx].categories[curCatIdx].words[curWordIdx];
    }

    function renderStageTabs() {
      document.getElementById('stageTabs').innerHTML = CURRICULUM.map((st, idx) => `
        <button onclick="selectStage(${idx})"
          class="py-2 px-1 rounded-xl text-[11px] sm:text-xs font-black transition text-center truncate ${
            idx === curStageIdx ? 'bg-sky-600 text-white shadow-sm' : 'bg-white text-slate-500 border border-slate-200 hover:bg-sky-50'
          }">${st.shortName}</button>
      `).join('');
    }
    window.selectStage = (idx) => { curStageIdx = idx; curCatIdx = 0; curWordIdx = 0; renderStageTabs(); renderCategoryTabs(); renderLearnWord(); };

    function renderCategoryTabs() {
      const cats = CURRICULUM[curStageIdx].categories;
      document.getElementById('categoryTabs').innerHTML = cats.map((cat, idx) => `
        <button onclick="selectCategory(${idx})"
          class="px-3 py-1.5 rounded-full text-xs font-black whitespace-nowrap transition shrink-0 ${
            idx === curCatIdx ? 'bg-amber-400 text-slate-900 shadow-sm' : 'bg-white text-slate-500 border border-slate-200 hover:bg-amber-50'
          }">${cat.name}</button>
      `).join('');
    }
    window.selectCategory = (idx) => { curCatIdx = idx; curWordIdx = 0; renderCategoryTabs(); renderLearnWord(); };

    function renderLearnWord() {
      const words = CURRICULUM[curStageIdx].categories[curCatIdx].words;
      const item = words[curWordIdx];
      document.getElementById('wordEmoji').textContent = item.emoji;
      document.getElementById('wordMeaning').textContent = item.meaning;
      document.getElementById('readWordText').textContent = item.word.toUpperCase();
      document.getElementById('progressText').textContent = `${curWordIdx + 1} / ${words.length}`;

      const chars = item.word.split('');
      const vowels = ['a', 'e', 'i', 'o', 'u'];
      const sizeClass = chars.length >= 7 ? 'w-10 h-14 text-2xl' : chars.length >= 5 ? 'w-13 h-18 sm:w-14 sm:h-20 text-3xl sm:text-4xl' : 'w-16 h-20 sm:w-20 sm:h-24 text-4xl sm:text-5xl';

      document.getElementById('letterContainer').innerHTML = chars.map((char) => {
        if (char === ' ') return `<div class="w-3"></div>`;
        const isVowel = vowels.includes(char.toLowerCase());
        const bgClass = isVowel ? 'bg-rose-50 border-rose-300 text-rose-600' : 'bg-sky-50 border-sky-300 text-sky-600';
        return `<button onclick="onClickLetter('${char}', this)" class="${sizeClass} rounded-2xl border-3 sm:border-4 ${bgClass} shadow-sm flex flex-col items-center justify-center card-bounce"><span class="eng-font font-bold leading-none">${char}</span></button>`;
      }).join('');
    }

    window.onClickLetter = (char, el) => {
      el.classList.add('ring-4', 'ring-amber-300', 'scale-105');
      setTimeout(() => el.classList.remove('ring-4', 'ring-amber-300', 'scale-105'), 250);
      playPhonemeAudio(char);
    };

    document.getElementById('btnReadWord').addEventListener('click', () => {
      const item = getCurrentWordObj();
      const cards = document.querySelectorAll('#letterContainer button');
      cards.forEach(c => c.classList.add('bg-amber-100', 'scale-105'));
      setTimeout(() => cards.forEach(c => c.classList.remove('bg-amber-100', 'scale-105')), 350);
      playWordAudio(item.word);
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      const words = CURRICULUM[curStageIdx].categories[curCatIdx].words;
      curWordIdx = (curWordIdx - 1 + words.length) % words.length;
      renderLearnWord();
    });
    document.getElementById('btnNext').addEventListener('click', () => {
      const words = CURRICULUM[curStageIdx].categories[curCatIdx].words;
      curWordIdx = (curWordIdx + 1) % words.length;
      renderLearnWord();
    });

    // 퀴즈 모드
    let quizScore = 0, currentQuizAnswer = null;
    function generateQuiz() {
      const stageWords = CURRICULUM[curStageIdx].categories.flatMap(c => c.words);
      const shuffled = [...stageWords].sort(() => Math.random() - 0.5);
      const options = shuffled.slice(0, 3);
      currentQuizAnswer = options[Math.floor(Math.random() * options.length)];
      document.getElementById('quizOptions').innerHTML = options.map(opt => `
        <button onclick="checkQuizAnswer('${opt.word}', this)"
          class="w-full py-3.5 px-5 rounded-2xl bg-slate-50 hover:bg-sky-50 border-2 border-slate-200 flex items-center justify-between card-bounce transition">
          <div class="flex items-center gap-3">
            <span class="eng-font text-2xl sm:text-3xl font-bold text-slate-700">${opt.word}</span>
            <span class="text-xs font-bold text-slate-400">(${opt.meaning})</span>
          </div>
          <span class="text-2xl">${opt.emoji}</span>
        </button>
      `).join('');
      setTimeout(() => playWordAudio(currentQuizAnswer.word), 250);
    }

    window.checkQuizAnswer = (selectedWord, btnEl) => {
      if (!currentQuizAnswer) return;
      if (selectedWord === currentQuizAnswer.word) {
        playSuccessSound();
        quizScore += 10;
        document.getElementById('quizScore').textContent = `⭐ ${quizScore}점`;
        btnEl.classList.remove('bg-slate-50', 'border-slate-200');
        btnEl.classList.add('bg-emerald-100', 'border-emerald-500');
        playWordAudio(currentQuizAnswer.word);
        currentQuizAnswer = null;
        setTimeout(generateQuiz, 1100);
      } else {
        playWrongSound();
        btnEl.classList.add('bg-rose-100', 'border-rose-400');
        setTimeout(() => btnEl.classList.remove('bg-rose-100', 'border-rose-400'), 450);
      }
    };
    document.getElementById('btnQuizSpeak').addEventListener('click', () => { if (currentQuizAnswer) playWordAudio(currentQuizAnswer.word); });

    // =========================================================================
    // A~Z 백과사전 (분할 .js 동적 로딩 + 무료 사전 API 보조)
    // =========================================================================
    window.DICT_CHUNK = window.DICT_CHUNK || {};
    const BASE_WORDS = (() => {
      const map = new Map();
      CURRICULUM.forEach(st => st.categories.forEach(cat => cat.words.forEach(w => {
        const key = w.word.toLowerCase();
        if (!map.has(key)) map.set(key, { ...w, stage: st.shortName });
      })));
      return Array.from(map.values()).sort((a, b) => a.word.localeCompare(b.word));
    })();

    let selectedAlpha = 'ALL';

    function loadDictionaryChunk(alphabet, callback) {
      const key = alphabet.toUpperCase();
      if (key === 'ALL') return callback(BASE_WORDS);
      if (window.DICT_CHUNK[key]) return callback(window.DICT_CHUNK[key]);

      const script = document.createElement('script');
      script.src = `data/dict_${key.toLowerCase()}.js`;
      script.onload = () => {
        const extra = window.DICT_CHUNK[key] || [];
        const baseFiltered = BASE_WORDS.filter(w => w.word.toUpperCase().startsWith(key));
        const mergedMap = new Map();
        [...baseFiltered, ...extra].forEach(item => mergedMap.set(item.word.toLowerCase(), item));
        window.DICT_CHUNK[key] = Array.from(mergedMap.values()).sort((a, b) => a.word.localeCompare(b.word));
        callback(window.DICT_CHUNK[key]);
      };
      script.onerror = () => {
        // 해당 알파벳 추가 파일(dict_x.js 등)이 아직 없으면 기본 초등 단어에서 필터링
        window.DICT_CHUNK[key] = BASE_WORDS.filter(w => w.word.toUpperCase().startsWith(key));
        callback(window.DICT_CHUNK[key]);
      };
      document.head.appendChild(script);
    }

    function renderAlphabetFilter() {
      const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
      document.getElementById('alphabetFilter').innerHTML = letters.map(ch => `
        <button onclick="filterDictByAlpha('${ch}')"
          class="px-2 py-1 rounded-lg text-[11px] font-black transition ${
            selectedAlpha === ch ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-indigo-50'
          }">${ch === 'ALL' ? '초등전체' : ch}</button>
      `).join('');
    }

    window.filterDictByAlpha = (ch) => {
      selectedAlpha = ch;
      renderAlphabetFilter();
      renderDictionaryList();
    };

    function renderDictionaryList() {
      const query = document.getElementById('dictSearchInput').value.trim().toLowerCase();
      const listEl = document.getElementById('dictList');
      listEl.innerHTML = `<div class="col-span-full text-center py-6 text-xs font-bold text-indigo-400">단어장을 불러오는 중...</div>`;

      loadDictionaryChunk(selectedAlpha, (sourceList) => {
        const filtered = sourceList.filter(item =>
          !query || item.word.toLowerCase().includes(query) || (item.meaning && item.meaning.includes(query))
        );

        document.getElementById('dictTotalCount').textContent = `${filtered.length.toLocaleString()}단어`;

        if (filtered.length === 0) {
          listEl.innerHTML = `<div class="col-span-full text-center py-6 text-xs font-bold text-slate-400">
            내장 사전에 없는 단어입니다. 우측 상단 <b>[🌐 확장검색]</b>을 눌러보세요!
          </div>`;
          return;
        }

        // 대용량 데이터 렌더링 시 성능 보호를 위해 최대 120개씩 표시
        const displaySlice = filtered.slice(0, 120);
        listEl.innerHTML = displaySlice.map(item => `
          <button onclick="playWordAudio('${item.word.replace(/'/g, "\'")}', ${item.audioUrl ? `'${item.audioUrl}'` : 'null'})"
            class="p-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 flex flex-col items-start text-left card-bounce transition">
            <div class="flex items-center justify-between w-full">
              <span class="text-xl">${item.emoji || '📘'}</span>
              <span class="text-[9px] font-bold text-indigo-500 bg-indigo-50 px-1.5 py-0.5 rounded">${item.stage || '확장사전'}</span>
            </div>
            <div class="eng-font text-base font-bold text-slate-800 mt-1 leading-tight break-all">${item.word}</div>
            <div class="text-[11px] font-bold text-slate-500 truncate w-full">${item.meaning || ''}</div>
          </button>
        `).join('');
      });
    }

    // 실시간 무료 영어사전 API 확장 검색 (17만 단어 커버용)
    document.getElementById('btnOnlineSearch').addEventListener('click', async () => {
      const q = document.getElementById('dictSearchInput').value.trim().toLowerCase();
      if (!q || !/^[a-z\s-]+$/.test(q)) {
        alert('확장 검색은 영어 단어를 입력한 뒤 눌러주세요! (예: dinosaur, universe)');
        return;
      }
      const listEl = document.getElementById('dictList');
      listEl.innerHTML = `<div class="col-span-full text-center py-6 text-xs font-bold text-indigo-600">🌐 '${q}' 원어민 사전 검색 중...</div>`;

      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        const entry = data[0];
        const phonetic = entry.phonetic || (entry.phonetics.find(p => p.text)?.text) || '';
        const audioUrl = entry.phonetics.find(p => p.audio)?.audio || null;
        const def = entry.meanings[0]?.definitions[0]?.definition || '영영사전 뜻풀이';

        listEl.innerHTML = `
          <div class="col-span-full p-4 rounded-2xl bg-indigo-50 border-2 border-indigo-200 flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <div>
                <span class="eng-font text-2xl font-bold text-indigo-950">${entry.word}</span>
                <span class="text-xs font-bold text-indigo-600 ml-2">${phonetic}</span>
              </div>
              <button onclick="playWordAudio('${entry.word}', ${audioUrl ? `'${audioUrl}'` : 'null'})"
                class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-black card-bounce">🔊 발음 듣기</button>
            </div>
            <p class="text-xs font-bold text-slate-700 leading-relaxed">📖 ${def}</p>
          </div>
        `;
        playWordAudio(entry.word, audioUrl);
      } catch (e) {
        listEl.innerHTML = `<div class="col-span-full text-center py-6 text-xs font-bold text-rose-500">해당 영어 단어를 찾을 수 없습니다. 철자를 확인해주세요!</div>`;
      }
    });

    document.getElementById('dictSearchInput').addEventListener('input', renderDictionaryList);

    // 선생님 선택 모달
    const teacherModal = document.getElementById('teacherModal');
    document.getElementById('btnTeacherModal').addEventListener('click', () => {
      document.getElementById('teacherList').innerHTML = TEACHERS.map(t => `
        <button onclick="selectTeacher('${t.id}')"
          class="p-3 rounded-2xl border-2 text-left flex items-center gap-3 transition card-bounce ${
            t.id === currentTeacher.id ? 'bg-purple-50 border-purple-500' : 'bg-slate-50 border-slate-200 hover:bg-purple-50/50'
          }">
          <span class="text-3xl">${t.emoji}</span>
          <div class="min-w-0 flex-1">
            <div class="font-black text-sm text-slate-800 flex items-center gap-1.5">
              ${t.name}
              ${t.id === currentTeacher.id ? '<span class="text-[10px] bg-purple-600 text-white px-2 py-0.5 rounded-full">선택됨</span>' : ''}
            </div>
            <div class="text-[11px] font-bold text-slate-500 truncate">${t.desc}</div>
          </div>
        </button>
      `).join('');
      teacherModal.classList.remove('hidden');
      teacherModal.classList.add('flex');
    });

    window.selectTeacher = (id) => {
      const found = TEACHERS.find(t => t.id === id);
      if (!found) return;
      currentTeacher = found;
      document.getElementById('currentTeacherEmoji').textContent = found.emoji;
      document.getElementById('currentTeacherName').textContent = found.name;
      teacherModal.classList.add('hidden');
      teacherModal.classList.remove('flex');
      playWordAudio('Hello');
    };

    document.getElementById('btnCloseTeacherModal').addEventListener('click', () => {
      teacherModal.classList.add('hidden');
      teacherModal.classList.remove('flex');
    });

    // 모드 전환
    const btnModeLearn = document.getElementById('btnModeLearn');
    const btnModeQuiz = document.getElementById('btnModeQuiz');
    const learnSection = document.getElementById('learnSection');
    const quizSection = document.getElementById('quizSection');

    btnModeLearn.addEventListener('click', () => {
      learnSection.classList.remove('hidden');
      quizSection.classList.add('hidden');
      btnModeLearn.className = 'px-2.5 py-1.5 rounded-xl text-xs font-black bg-sky-500 text-white shadow-sm transition';
      btnModeQuiz.className = 'px-2.5 py-1.5 rounded-xl text-xs font-black text-slate-500 hover:text-slate-700 transition';
    });

    btnModeQuiz.addEventListener('click', () => {
      learnSection.classList.add('hidden');
      quizSection.classList.remove('hidden');
      btnModeQuiz.className = 'px-2.5 py-1.5 rounded-xl text-xs font-black bg-emerald-500 text-white shadow-sm transition';
      btnModeLearn.className = 'px-2.5 py-1.5 rounded-xl text-xs font-black text-slate-500 hover:text-slate-700 transition';
      generateQuiz();
    });

    // 초기 실행
    renderStageTabs();
    renderCategoryTabs();
    renderLearnWord();
    renderAlphabetFilter();
    renderDictionaryList();
  </script>
</body>
</html>
