          },
          ice: {
            sky: ['#050e1a', '#091a2e', '#0e2945', '#133a5e', '#194d78', '#226294'],
            fog: 'rgba(14, 58, 94, 0.42)',
            groundTop: '#385673', groundMid: '#243a50', groundBot: '#132130',
            edgeHi: '#7dd3fc', rim: 'rgba(125, 211, 252, 0.18)'
          },
          secret_dungeon: {
            sky: ['#120a03', '#1f1104', '#301a06', '#452508', '#5c320a', '#733f0d'],
            fog: 'rgba(115, 63, 13, 0.42)',
            groundTop: '#5c3a14', groundMid: '#3b240b', groundBot: '#1f1205',
            edgeHi: '#f59e0b', rim: 'rgba(251, 191, 36, 0.20)'
          }
        };
        const th = themes[region.id] || themes.village;

        // 1. 디더링 다크판타지 하늘
        const bandH = Math.ceil(gy / 6);
        for (let i = 0; i < 6; i++) {
          pxDitherBand(p, 0, i * bandH, pw, bandH + 1, th.sky[i], th.sky[Math.min(5, i + 1)]);
        }

        // 2. 은은한 밤하늘 별 & 구름 띠
        for (let i = 0; i < 28; i++) {
          const sx = Math.floor(((Math.sin(i * 127.1 + 31.7) * 0.5 + 0.5)) * pw);
          const sy = Math.floor(((Math.sin(i * 269.5 + 183.3) * 0.5 + 0.5)) * gy * 0.58);
          const tw = Math.sin(anim.time * 2.2 + i) > 0.35;
          pxRect(p, sx, sy, 1, 1, tw ? '#e2e8f0' : '#64748b');
        }
        // 천천히 흐르는 안개 구름
        for (let c = 0; c < 4; c++) {
          const cx = ((c * 110 + anim.time * (3 + c)) % (pw + 80)) - 40;
          const cy = 18 + (c % 3) * 16;
          pxRect(p, cx, cy, 46, 5, 'rgba(255,255,255,0.045)');
          pxRect(p, cx + 8, cy - 2, 30, 3, 'rgba(255,255,255,0.035)');
        }

        // 3. 다층 원경 실루엣 (성채·산맥·숲·폐허·화산·빙하·신전)
        // 원경 산맥 1 (가장 어둡고 부드러운 실루엣)
        for (let x = 0; x < pw; x += 2) {
          const h1 = Math.floor(26 + Math.sin(x * 0.018 + 1.2) * 16 + Math.sin(x * 0.047) * 7);
          pxRect(p, x, gy - h1, 2, h1, 'rgba(9, 13, 24, 0.55)');
        }

        if (region.id === 'village') {
          // 보름달 + 은빛 달무리
          pxCircle(p, pw * 0.78, gy * 0.28, 22, 'rgba(226, 232, 240, 0.07)');
          pxCircle(p, pw * 0.78, gy * 0.28, 15, 'rgba(226, 232, 240, 0.12)');
          pxCircle(p, pw * 0.78, gy * 0.28, 10, '#e2e8f0', '#94a3b8');
          pxCircle(p, pw * 0.78 - 3, gy * 0.28 - 2, 3, '#cbd5e1');

          // 원경 중세 성채 & 성벽 실루엣
          const castleX = Math.floor(pw * 0.44);
          pxRect(p, castleX - 28, gy - 44, 14, 44, '#131b2c');
          pxRect(p, castleX - 30, gy - 48, 18, 4, '#1e293b');
          pxRect(p, castleX - 12, gy - 58, 22, 58, '#0f172a');
          pxRect(p, castleX - 15, gy - 62, 28, 4, '#1e293b');
          pxRect(p, castleX + 12, gy - 38, 16, 38, '#131b2c');
          // 성채 창문 따뜻한 등불
          pxRect(p, castleX - 4, gy - 48, 3, 5, '#f59e0b');
          pxRect(p, castleX - 3, gy - 47, 1, 3, '#fef08a');
          pxRect(p, castleX - 22, gy - 34, 2, 4, '#f59e0b');

          // 근경 석조 성벽과 횃불 기둥 (훈련장 분위기)
          pxRect(p, 0, gy - 14, pw, 14, '#182132');
          pxRect(p, 0, gy - 15, pw, 2, '#334155');
          for (let bx = 0; bx < pw; bx += 18) {
            pxRect(p, bx, gy - 14, 1, 14, '#0c111d');
            pxRect(p, bx + 8, gy - 7, 1, 7, '#0c111d');
          }
          // 횃불 2개 (은은한 흔들림)
          [Math.floor(pw * 0.16), Math.floor(pw * 0.84)].forEach((tx, idx) => {
            pxBox(p, tx - 2, gy - 26, 4, 26, '#334155', '#090d16');
            pxBox(p, tx - 4, gy - 29, 8, 3, '#475569', '#090d16');
            const fl = Math.round(Math.sin(anim.time * 10 + idx * 2) * 1.5);
            pxCircle(p, tx, gy - 32, 10, 'rgba(249, 115, 22, 0.16)');
            pxRect(p, tx - 2, gy - 34 + fl, 4, 5, '#f97316');
            pxRect(p, tx - 1, gy - 33 + fl, 2, 3, '#fef08a');
          });
        } else if (region.id === 'forest') {
          // 빛줄기(God-rays)
          for (let r = 0; r < 3; r++) {
            const rx = Math.floor(pw * (0.2 + r * 0.28));
            for (let k = 0; k < gy; k += 2) {
              pxRect(p, rx + Math.floor(k * 0.28), k, 14, 2, 'rgba(110, 231, 183, 0.035)');
            }
          }
          // 어두운 고목 숲 실루엣
          for (let layer = 0; layer < 2; layer++) {
            const n = layer === 0 ? 12 : 8;
            const cBody = layer === 0 ? '#091f16' : '#0f2d20';
            const cHi = layer === 0 ? '#133828' : '#1b4733';
            for (let i = 0; i < n; i++) {
              const tx = Math.floor((pw / n) * i + layer * 16 + 6);
              pxRect(p, tx - 3, gy - 24, 6, 24, '#1a1410');
              for (let tier = 0; tier < 3; tier++) {
                const ty = gy - 20 - tier * 15;
                for (let row = 0; row < 16; row++) {
                  const rw = Math.max(2, Math.floor((22 - tier * 4) * (1 - row / 16)));
                  pxRect(p, tx - rw, ty - row, rw * 2, 1, cBody);
                  if (row > 8) pxRect(p, tx - rw, ty - row, Math.max(1, Math.floor(rw * 0.45)), 1, cHi);
                }
              }
            }
          }
        } else if (region.id === 'desert') {
          pxCircle(p, pw * 0.72, gy * 0.30, 20, 'rgba(251, 146, 60, 0.16)');
          pxCircle(p, pw * 0.72, gy * 0.30, 12, '#fdba74', '#ea580c');
          // 모래언덕 & 고대 피라미드 폐허
          const pyrs = [{ x: Math.floor(pw * 0.26), h: 48 }, { x: Math.floor(pw * 0.58), h: 34 }];
          pyrs.forEach(pr => {
            for (let r = 0; r < pr.h; r++) {
              const half = Math.floor((pr.h - r) * 1.15);
              pxRect(p, pr.x - half, gy - r, half, 1, '#5c2d16');
              pxRect(p, pr.x, gy - r, half, 1, '#3b1b0c');
            }
          });
          for (let x = 0; x < pw; x += 2) {
            const dh = Math.floor(10 + Math.sin(x * 0.022) * 7);
            pxRect(p, x, gy - dh, 2, dh, '#6b3716');
            pxRect(p, x, gy - dh, 2, 1, '#b45309');
          }
        } else if (region.id === 'volcano') {
          const vx = Math.floor(pw * 0.65);
          for (let r = 0; r < 68; r++) {
            const half = Math.floor(14 + (68 - r) * 1.25);
            pxRect(p, vx - half, gy - r, half * 2, 1, r % 6 === 0 ? '#1c1212' : '#140c0c');
            if (r > 14 && r < 64) {
              const lo = Math.floor(Math.sin(r * 0.22 + anim.time * 3.5) * 3);
              pxRect(p, vx + lo - 2, gy - r, 4, 1, '#ea580c');
              pxRect(p, vx + lo - 1, gy - r, 2, 1, '#fde047');
            }
          }
          pxCircle(p, vx, gy - 69, 14, 'rgba(239, 68, 68, 0.22)');
          pxCircle(p, vx, gy - 69, 6, '#f97316');
        } else if (region.id === 'ice') {
          for (let x = 0; x < pw; x += 3) {
            const ay = Math.floor(16 + Math.sin(x * 0.035 + anim.time * 1.2) * 9);
            pxRect(p, x, ay, 3, 10, 'rgba(56, 189, 248, 0.22)');
            pxRect(p, x, ay + 4, 3, 7, 'rgba(52, 211, 153, 0.18)');
          }
          [0.16, 0.42, 0.68, 0.90].forEach((rx, idx) => {
            const ix = Math.floor(pw * rx), ih = 38 + (idx % 2) * 18;
            for (let r = 0; r < ih; r++) {
              const half = Math.floor((ih - r) * 0.62);
              pxRect(p, ix - half, gy - r, half, 1, '#385673');
              pxRect(p, ix, gy - r, half, 1, '#1e3347');
            }
          });
        } else if (region.id === 'secret_dungeon') {
          [0.12, 0.36, 0.64, 0.88].forEach(rx => {
            const px0 = Math.floor(pw * rx) - 7;
            pxBox(p, px0, 6, 14, gy - 6, '#3b240b', '#120a03');
            pxRect(p, px0 + 2, 6, 3, gy - 6, '#92400e');
            pxRect(p, px0 + 5, 6, 2, gy - 6, '#f59e0b');
            pxBox(p, px0 - 3, gy - 7, 20, 7, '#78350f', '#120a03');
          });
          for (let i = 0; i < 28; i++) {
            const bx = Math.floor(((Math.sin(i * 45.3) * 0.5 + 0.5) * 0.84 + 0.08) * pw);
            const by = gy - 3 - (i % 4) * 3;
            pxBox(p, bx, by, 5, 3, i % 2 === 0 ? '#f59e0b' : '#d97706', '#451a03');
          }
        }

        // 지평선 대기 안개 (배경과 바닥 자연스러운 연결)
        pxRect(p, 0, gy - 14, pw, 14, th.fog);

        // 4. 중세 석판 / 대지 바닥 (원근 타일 + 질감 + 그림자)
        const gh = ph - gy;
        pxRect(p, 0, gy, pw, gh, th.groundBot);
        pxRect(p, 0, gy, pw, Math.ceil(gh * 0.55), th.groundMid);
        pxRect(p, 0, gy, pw, 5, th.groundTop);
        pxRect(p, 0, gy, pw, 1, th.edgeHi);

        // 석판/바닥 질감 디테일
        for (let row = 0; row < 3; row++) {
          const ry = gy + 5 + row * Math.max(6, Math.floor((gh - 6) / 3));
          pxRect(p, 0, ry, pw, 1, 'rgba(0,0,0,0.32)');
          const step = 18 + row * 8;
          for (let tx = (row * 9) % step; tx < pw; tx += step) {
            pxRect(p, tx, ry, 1, Math.floor(gh / 3), 'rgba(0,0,0,0.28)');
            pxRect(p, tx + 2, ry + 2, Math.floor(step * 0.45), 1, 'rgba(255,255,255,0.06)');
          }
        }
        if (region.id === 'volcano') {
          for (let tx = 14; tx < pw; tx += 36) {
            pxRect(p, tx, gy + 10, 10, 2, '#ea580c');
            pxRect(p, tx + 2, gy + 10, 4, 1, '#fef08a');
          }
        }

        // 5. 환경 부유 입자 (달빛 먼지 / 반딧불 / 불티 / 눈송이 / 금가루)
        anim.ambientParticles.forEach((ap, i) => {
          if (i % 2 !== 0) return;
          const ax = Math.floor(((ap.x + Math.sin(anim.time + ap.phase) * 0.025 + 1) % 1) * pw);
          const ay = Math.floor(ap.y * ph);
          pxRect(p, ax, ay, 1, 1, region.id === 'ice' ? '#bae6fd' : th.edgeHi);
        });
      }

      function drawHiBitHonorAura(p, x, gy, honorLevel) {
        if (honorLevel <= 0) return;
        const lv = Math.min(honorLevel, 12);
        const pulse = Math.sin(anim.time * 6) * 2;
        const r = 24 + lv * 2 + pulse;
        pxRect(p, x - r, gy - 1, r * 2, 3, 'rgba(251, 191, 36, 0.35)');
        pxRect(p, x - r * 0.7, gy - 2, r * 1.4, 2, 'rgba(254, 240, 138, 0.65)');
        const pillars = Math.min(14, 4 + lv);
        for (let i = 0; i < pillars; i++) {
          const phase = (anim.time * 2.4 + i * 0.71) % 1;
          const px = x + Math.sin(i * 2.1 + anim.time * 2) * (14 + lv * 1.4);
          const py = gy - 4 - phase * (46 + lv * 2.5);
          const sz = phase < 0.4 ? 2 : 1;
          pxRect(p, px, py, sz, sz + 2, phase < 0.3 ? '#fef08a' : (phase < 0.7 ? '#fbbf24' : '#d97706'));
        }
        if (honorLevel >= 3) {
          pxRing(p, x, gy - 28, Math.min(36, 24 + lv), 'rgba(254, 240, 138, 0.32)');
        }
      }

      function drawHiBitMonster(p, baseX, gy, region) {
        const hitRecoil = anim.monsterHit * 9;
        const hitShake = anim.monsterHit > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
        const bob = Math.round(Math.sin(anim.time * 3.5) * 1.5);
        const mx = Math.round(baseX + hitRecoil + hitShake);
        const my = Math.round(gy);
        const flash = anim.hitFlash > 0.35;
        const fCol = (c) => flash ? '#ffffff' : c;

        // 접지 그림자 (다크판타지 톤)
        pxRect(p, mx - 22, gy - 1, 44, 4, 'rgba(4, 7, 14, 0.62)');
        pxRect(p, mx - 16, gy, 32, 2, 'rgba(4, 7, 14, 0.75)');

        if (region.monsterType === 'scarecrow') {
          // 다크판타지 허수아비 (어두운 참나무 기둥 + 해진 마대 + 붉은 눈빛)
          pxBox(p, mx - 3, my - 50, 6, 50, fCol('#452310'), '#090d16');
          pxRect(p, mx - 2, my - 49, 2, 48, fCol('#6b3819'));
          pxBox(p, mx - 25, my - 38, 50, 5, fCol('#572d14'), '#090d16');
          // 해진 마대 튜닉
          pxBox(p, mx - 13, my - 42, 26, 27, fCol('#6e4823'), '#090d16');
          pxRect(p, mx - 11, my - 40, 14, 23, fCol('#8c5e2e'));
          pxRect(p, mx - 11, my - 40, 5, 20, fCol('#a6743d'));
          pxBox(p, mx + 2, my - 33, 7, 7, fCol('#472414'), '#1a0c06');
          pxRect(p, mx - 14, my - 16, 28, 3, fCol('#a18038'));
          // 마대 머리 + 어두운 후드 그림자 + 은은한 눈빛
          pxBox(p, mx - 10, my - 59 + bob, 20, 17, fCol('#9e7c4c'), '#090d16');
          pxRect(p, mx - 8, my - 57 + bob, 11, 13, fCol('#bfa06d'));
          pxRect(p, mx - 6, my - 53 + bob, 3, 2, '#f97316');
          pxRect(p, mx + 3, my - 53 + bob, 3, 2, '#f97316');
          pxRect(p, mx - 5, my - 46 + bob, 10, 2, '#1c120a');
          // 낡은 마녀/밀짚 모자
          pxBox(p, mx - 18, my - 62 + bob, 36, 4, fCol('#4a3518'), '#090d16');
          pxBox(p, mx - 10, my - 72 + bob, 20, 10, fCol('#694b21'), '#090d16');
          pxRect(p, mx - 10, my - 64 + bob, 20, 2, '#7f1d1d');
        } else if (region.monsterType === 'boar') {
          const y = my + bob;
          pxBox(p, mx - 23, y - 35, 48, 27, fCol('#382012'), '#090d16');
          pxRect(p, mx - 20, y - 33, 36, 17, fCol('#54311b'));
          pxRect(p, mx - 17, y - 32, 24, 7, fCol('#6e4226'));
          for (let k = 0; k < 6; k++) pxBox(p, mx - 16 + k * 6, y - 40, 4, 5, fCol('#1f1714'), '#090d16');
          [-16, -6, 8, 16].forEach(lx => pxBox(p, mx + lx, y - 10, 6, 10, fCol('#24140b'), '#090d16'));
          pxBox(p, mx - 31, y - 29, 17, 17, fCol('#4a2915'), '#090d16');
          pxBox(p, mx - 35, y - 20, 7, 7, fCol('#8f4c58'), '#090d16');
          pxBox(p, mx - 34, y - 29, 4, 10, fCol('#e2d9c3'), '#090d16');
          pxRect(p, mx - 25, y - 25, 3, 2, '#ef4444');
        } else if (region.monsterType === 'scorpion') {
          const y = my + bob;
          pxBox(p, mx - 16, y - 23, 34, 16, fCol('#57280a'), '#090d16');
          pxRect(p, mx - 14, y - 21, 26, 7, fCol('#8c4514'));
          pxRect(p, mx - 10, y - 20, 18, 3, fCol('#b45309'));
          [-12, -3, 6, 14].forEach(lx => pxBox(p, mx + lx, y - 8, 4, 8, fCol('#2e1305'), '#090d16'));
          pxBox(p, mx - 32, y - 27, 16, 6, fCol('#78350f'), '#090d16');
          pxBox(p, mx - 38, y - 31, 8, 5, fCol('#92400e'), '#090d16');
          pxBox(p, mx - 38, y - 22, 8, 5, fCol('#92400e'), '#090d16');
          const tailPts = [[16, -24], [22, -34], [20, -44], [12, -50], [2, -48]];
          tailPts.forEach(([tx, ty], idx) => {
            pxBox(p, mx + tx - 4, y + ty, 8, 7, fCol(idx === 4 ? '#9333ea' : '#78350f'), '#090d16');
          });
          pxRect(p, mx - 12, y - 19, 3, 2, '#fbbf24');
        } else if (region.monsterType === 'phoenix') {
          const hover = Math.round(Math.sin(anim.time * 5) * 5);
          const wingY = Math.round(Math.sin(anim.time * 10) * 6);
          const y = my - 46 + hover;
          pxBox(p, mx - 35, y - 10 + wingY, 23, 12, fCol('#991b1b'), '#090d16');
          pxRect(p, mx - 33, y - 8 + wingY, 18, 6, fCol('#ea580c'));
          pxRect(p, mx - 28, y - 6 + wingY, 12, 3, fCol('#facc15'));
          pxBox(p, mx + 12, y - 10 - wingY, 23, 12, fCol('#991b1b'), '#090d16');
          pxRect(p, mx + 14, y - 8 - wingY, 18, 6, fCol('#ea580c'));
          pxRect(p, mx + 16, y - 6 - wingY, 12, 3, fCol('#facc15'));
          pxBox(p, mx - 11, y - 12, 22, 24, fCol('#b91c1c'), '#090d16');
          pxRect(p, mx - 8, y - 9, 16, 16, fCol('#f97316'));
          pxBox(p, mx - 8, y + 12, 16, 14, fCol('#991b1b'), '#090d16');
          pxRect(p, mx - 4, y + 14, 8, 10, fCol('#fbbf24'));
          pxBox(p, mx - 9, y - 24, 16, 13, fCol('#c2410c'), '#090d16');
          pxBox(p, mx - 15, y - 18, 6, 4, fCol('#fde047'), '#090d16');
          pxBox(p, mx - 4, y - 31, 8, 7, fCol('#f59e0b'), '#7f1d1d');
          pxRect(p, mx - 6, y - 20, 3, 2, '#fef08a');
        } else {
          const isGold = region.monsterType === 'gold_dragon';
          const cDark = fCol(isGold ? '#78350f' : '#0c3554');
          const cMid = fCol(isGold ? '#d97706' : '#0369a1');
          const cHi = fCol(isGold ? '#fde047' : '#7dd3fc');
          const cWing = fCol(isGold ? '#92400e' : '#075985');
          const hover = Math.round(Math.sin(anim.time * 4) * 4);
          const wingFlap = Math.round(Math.sin(anim.time * 7) * 5);
          const y = my - 38 + hover;

          if (isGold) {
            pxRing(p, mx, y, 36 + Math.round(Math.sin(anim.time * 5) * 2), 'rgba(251, 191, 36, 0.35)');
          }
          pxBox(p, mx + 6, y - 24 + wingFlap, 28, 20, cWing, '#090d16');
          pxRect(p, mx + 8, y - 22 + wingFlap, 22, 6, cHi);
          pxBox(p, mx + 12, y + 6, 22, 8, cDark, '#090d16');
          pxBox(p, mx + 30, y + 2, 10, 8, cMid, '#090d16');
          pxBox(p, mx - 14, y - 10, 28, 28, cMid, '#090d16');
          pxRect(p, mx - 12, y - 6, 12, 22, cHi);
          for (let sy = -4; sy <= 12; sy += 5) pxRect(p, mx - 12, y + sy, 12, 1, cDark);
          pxBox(p, mx - 24, y - 28, 22, 16, cMid, '#090d16');
          pxBox(p, mx - 30, y - 22, 10, 9, cDark, '#090d16');
          pxBox(p, mx - 10, y - 36, 5, 9, cHi, '#090d16');
          pxBox(p, mx - 3, y - 35, 5, 8, cHi, '#090d16');
          pxRect(p, mx - 20, y - 24, 4, 2, isGold ? '#34d399' : '#fef08a');
          pxBox(p, mx - 12, y + 18, 9, 8, cDark, '#090d16');
          pxBox(p, mx + 4, y + 18, 9, 8, cDark, '#090d16');
        }
      }

      function drawHiBitCheerPet(p, baseX, gy) {
        const pet = getEquippedPet();
        if (!pet) return null;
        const bounce = Math.round(Math.abs(Math.sin(anim.time * 6.5)) * (5 + anim.petCheerBoost * 5));
        const x = Math.round(baseX);
        const y = Math.round(gy - bounce);

        pxRect(p, x - 9, gy - 1, 18, 2, 'rgba(0,0,0,0.45)');
        pxBox(p, x - 8, y - 16, 16, 14, pet.bodyColor, '#090d16');
        pxRect(p, x - 6, y - 14, 6, 4, pet.subColor);
        if (pet.id === 'cheer_dog' || pet.id === 'lucky_cat' || pet.id === 'gold_haetae') {
          pxBox(p, x - 8, y - 21, 4, 5, pet.bodyColor, '#090d16');
          pxBox(p, x + 4, y - 21, 4, 5, pet.bodyColor, '#090d16');
        } else if (pet.id === 'fairy_pixie' || pet.id === 'baby_dragon') {
          const wf = Math.round(Math.sin(anim.time * 16) * 2);
          pxBox(p, x - 14, y - 14 + wf, 6, 6, pet.subColor, '#090d16');
          pxBox(p, x + 8, y - 14 - wf, 6, 6, pet.subColor, '#090d16');
        }
        pxRect(p, x - 4, y - 11, 2, 3, '#090d16');
        pxRect(p, x + 2, y - 11, 2, 3, '#090d16');
        const pomY = y - 12 - Math.round(Math.sin(anim.time * 14) * 3);
        pxCircle(p, x - 11, pomY, 3, pet.pomColor, '#090d16');
        pxCircle(p, x + 11, pomY, 3, pet.pomColor, '#090d16');

        return { x: x * PX_SCALE, y: (y - 24) * PX_SCALE };
      }

      function renderHiBitScene(dt, region, weapon) {
        const pw = Math.max(150, Math.floor(canvasWidth / PX_SCALE));
        const ph = Math.max(130, Math.floor(canvasHeight / PX_SCALE));
        if (pxCanvas.width !== pw || pxCanvas.height !== ph) {
          pxCanvas.width = pw;
          pxCanvas.height = ph;
          pxCtx.imageSmoothingEnabled = false;
        }
        const p = pxCtx;
        const gy = Math.floor(ph * 0.78);

        // 파워 기준 용사 등급 Lv.10 이상 황금기사 / 미만 회색기사
        const heroRankLv = getRankInfo(state.power).current.level;
        const isGoldKnight = heroRankLv >= 10;
        const sp = anim.swingProgress;
        const pat = anim.attackPattern; // 0: 돌진, 1: 상단베기, 2: 광역참격

        // 모션별 이동 오프셋 (돌진: 깊게 전진 / 상단베기: 도약 후 내려찍기 / 광역참격: 회전 베기)
        let extraDash = 0;
        let jumpLift = 0;
        if (sp > 0) {
          if (pat === 0) {
            extraDash = Math.sin(sp * Math.PI) * 34; // 돌진!
          } else if (pat === 1) {
            extraDash = Math.sin(sp * Math.PI) * 18;
            jumpLift = sp < 0.55 ? Math.sin((sp / 0.55) * Math.PI) * 18 : 0; // 상단베기 도약!
          } else {
            extraDash = Math.sin(sp * Math.PI) * 26; // 광역참격!
          }
        }

        drawHiBitEnvironment(p, pw, ph, gy, region);
        drawHiBitMonster(p, pw * 0.72, gy, region);
        const petPos = drawHiBitCheerPet(p, pw * 0.13, gy);

        const heroPxX = Math.round(pw * 0.30 + anim.heroDash * 22 + extraDash * 0.5);
        drawHiBitHonorAura(p, heroPxX, gy, state.honorLevel);

        // 픽셀 충격파 & 파티클
        for (let i = anim.shockwaves.length - 1; i >= 0; i--) {
          const sw = anim.shockwaves[i];
          sw.radius += sw.speed * dt;
          sw.life -= dt * 3.2;
          if (sw.life <= 0) { anim.shockwaves.splice(i, 1); continue; }
          pxRing(p, sw.x / PX_SCALE, sw.y / PX_SCALE, sw.radius / PX_SCALE, sw.color);
        }
        for (let i = anim.particles.length - 1; i >= 0; i--) {
          const pt = anim.particles[i];
          pt.x += pt.vx * dt; pt.y += pt.vy * dt;
          if (pt.shape !== 'honor') pt.vy += 380 * dt;
          pt.rot += pt.vRot * dt; pt.life -= pt.decay * dt;
          if (pt.life <= 0) { anim.particles.splice(i, 1); continue; }
          const ps = Math.max(1, Math.round(pt.size / PX_SCALE));
          pxRect(p, pt.x / PX_SCALE, pt.y / PX_SCALE, ps, ps, pt.color);
        }

        // 메인 캔버스에 도트 배경 블릿
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        ctx.drawImage(pxCanvas, 0, 0, pw, ph, 0, 0, canvasWidth, canvasHeight);

        // 자연스러운 접지 그림자 (기사 발밑)
        const heroSheet = isGoldKnight ? hiBitGoldImg : hiBitGreyImg;
        const heroDrawX = canvasWidth * 0.30 + anim.heroDash * 42 + extraDash;
        const heroGroundY = canvasHeight * 0.78;
        const breatheY = sp > 0 ? 0 : Math.round(Math.sin(anim.time * 4.2) * 2);

        ctx.save();
        ctx.fillStyle = 'rgba(4, 7, 15, 0.58)';
        ctx.beginPath();
        ctx.ellipse(heroDrawX + 4, heroGroundY + 3, Math.max(26, 46 - jumpLift * 0.6), 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 실사 하이비트 기사 스프라이트 + 3종 모션 (돌진 / 상단베기 / 광역참격)
        if (heroSheet.complete && heroSheet.naturalWidth > 0) {
          let frameIdx = 0;
          if (sp > 0) {
            if (isGoldKnight) {
              if (pat === 0) {
                // 황금기사 돌진 모션: 빠른 전진 찌르기/베기 시퀀스
                const seq = [0, 1, 7, 8, 9, 10, 11];
                frameIdx = seq[Math.min(seq.length - 1, Math.floor(sp * seq.length))];
              } else if (pat === 1) {
                // 황금기사 상단베기: 검을 높이 쳐들고 수직 강타 (풀 12프레임)
                frameIdx = Math.min(11, Math.max(1, Math.floor(sp * 11) + 1));
              } else {
                // 황금기사 광역참격: 최대 회심 베기 프레임 강조
                const seq = [2, 4, 5, 6, 6, 7, 8, 10];
                frameIdx = seq[Math.min(seq.length - 1, Math.floor(sp * seq.length))];
              }
            } else {
              if (pat === 0) {
                // 회색기사 돌진: 전방 돌진 자세 강조
                frameIdx = sp < 0.7 ? 1 : 0;
              } else if (pat === 1) {
                // 회색기사 상단베기: 도약 후 상단 내려치기
                frameIdx = sp < 0.25 ? 1 : (sp < 0.78 ? 2 : 0);
              } else {
                // 회색기사 광역참격: 회전 베기 풀 아크
                frameIdx = sp < 0.22 ? 1 : (sp < 0.45 ? 2 : 3);
              }
            }
          }

          const scaleFactor = Math.max(1.25, Math.min(1.62, canvasHeight / 252));
          const drawW = Math.round(HIBIT_CELL_W * scaleFactor);
          const drawH = Math.round(HIBIT_CELL_H * scaleFactor);
          const dx = Math.round(heroDrawX - drawW * 0.44);
          const dy = Math.round(heroGroundY - drawH + Math.round(8 * scaleFactor) + breatheY - jumpLift);

          // 돌진/광역참격 시 잔상(Afterimage) 이펙트로 타격감 극대화
          if (sp > 0.08 && sp < 0.82 && (pat === 0 || pat === 2)) {
            ctx.save();
            ctx.globalAlpha = 0.26;
            ctx.drawImage(heroSheet, frameIdx * HIBIT_CELL_W, 0, HIBIT_CELL_W, HIBIT_CELL_H, dx - 18, dy, drawW, drawH);
            ctx.globalAlpha = 0.13;
            ctx.drawImage(heroSheet, frameIdx * HIBIT_CELL_W, 0, HIBIT_CELL_W, HIBIT_CELL_H, dx - 34, dy, drawW, drawH);
            ctx.restore();
          }

          // 메인 기사 렌더
          ctx.drawImage(heroSheet, frameIdx * HIBIT_CELL_W, 0, HIBIT_CELL_W, HIBIT_CELL_H, dx, dy, drawW, drawH);

          // 모션별 전용 검기(돌진선 / 상단베기 수직섬광 / 광역참격 초승달 아크)
          if (sp > 0.12 && sp < 0.88) {
            const fxAlpha = Math.sin(sp * Math.PI);
            const fxColor = isGoldKnight ? '#fde047' : (weapon.tier >= 2 ? weapon.slashColor : '#e2e8f0');
            ctx.save();
            if (pat === 0) {
              // 돌진 속도선 & 관통 섬광
              ctx.globalAlpha = fxAlpha * 0.78;
              ctx.fillStyle = fxColor;
              ctx.fillRect(heroDrawX + 18, heroGroundY - drawH * 0.44, 78, 4);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(heroDrawX + 28, heroGroundY - drawH * 0.43, 56, 2);
              ctx.globalAlpha = fxAlpha * 0.45;
              ctx.fillStyle = fxColor;
              ctx.fillRect(heroDrawX - 38, heroGroundY - drawH * 0.56, 44, 2);
              ctx.fillRect(heroDrawX - 48, heroGroundY - drawH * 0.32, 52, 2);
            } else if (pat === 1) {
              // 상단베기 수직 내려찍기 궤적
              ctx.globalAlpha = fxAlpha * 0.85;
              ctx.strokeStyle = fxColor;
              ctx.lineWidth = isGoldKnight ? 7 : 5;
              ctx.beginPath();
              ctx.arc(heroDrawX + 26, heroGroundY - drawH * 0.46, 62 + weapon.tier * 4, -1.55, 0.45);
              ctx.stroke();
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.arc(heroDrawX + 26, heroGroundY - drawH * 0.46, 58 + weapon.tier * 4, -1.45, 0.35);
              ctx.stroke();
            } else {
              // 광역참격 대형 초승달 검기
              ctx.globalAlpha = fxAlpha * 0.88;
              ctx.strokeStyle = fxColor;
              ctx.lineWidth = isGoldKnight ? 9 : 6;
              ctx.beginPath();
              ctx.ellipse(heroDrawX + 42, heroGroundY - drawH * 0.38, 84 + weapon.tier * 5, 34, -0.08, -0.95, 1.05);
              ctx.stroke();
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.ellipse(heroDrawX + 42, heroGroundY - drawH * 0.38, 80 + weapon.tier * 5, 30, -0.08, -0.85, 0.95);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        // 전체 화면 은은한 다크판타지 비네팅 (캐릭터·배경 색감 자연스럽게 통합)
        const vig = ctx.createRadialGradient(
          canvasWidth * 0.5, canvasHeight * 0.5, canvasWidth * 0.28,
          canvasWidth * 0.5, canvasHeight * 0.5, canvasWidth * 0.72
        );
        vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vig.addColorStop(1, 'rgba(2, 6, 18, 0.38)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        ctx.restore();

        // 펫 말풍선
        if (petPos && anim.petBubbleTimer > 0 && anim.petBubbleText) {
          ctx.save();
          ctx.font = '800 11px "Noto Sans KR", sans-serif';
          const tw = ctx.measureText(anim.petBubbleText).width;
          const bw = tw + 16, bh = 22;
          const bx = Math.max(8, Math.min(canvasWidth - bw - 8, petPos.x - bw / 2));
          const by = Math.max(36, petPos.y - 24);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
          ctx.strokeStyle = '#f472b6';
          ctx.lineWidth = 2;
          ctx.fillRect(bx, by, bw, bh);
          ctx.strokeRect(bx, by, bw, bh);
          ctx.fillStyle = '#fdf2f8';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(anim.petBubbleText, bx + bw / 2, by + bh / 2);
          ctx.restore();
        }

        // 플로팅 데미지/골드 텍스트
        for (let i = anim.floatingTexts.length - 1; i >= 0; i--) {
          const ft = anim.floatingTexts[i];
          ft.y += ft.vy * dt;
          ft.life -= dt * 1.15;
          if (ft.life <= 0) { anim.floatingTexts.splice(i, 1); continue; }
          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, ft.life * 1.3));
          ctx.font = '900 15px Inter, "Noto Sans KR", sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#090d16';
          ctx.strokeText(ft.text, Math.round(ft.x), Math.round(ft.y));
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
          ctx.restore();
        }
      }

      function updateAndDrawEffects(dt) {
        for (let i = anim.shockwaves.length - 1; i >= 0; i--) {
          const sw = anim.shockwaves[i]; sw.radius += sw.speed * dt; sw.life -= dt * 3.2;
          if (sw.life <= 0) { anim.shockwaves.splice(i, 1); continue; }
          ctx.save(); ctx.globalAlpha = Math.max(0, sw.life * 0.85); ctx.strokeStyle = sw.color; ctx.lineWidth = 3 * sw.life;
          ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
        for (let i = anim.particles.length - 1; i >= 0; i--) {
          const p = anim.particles[i]; p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.shape !== 'honor') p.vy += 380 * dt;
          p.rot += p.vRot * dt; p.life -= p.decay * dt;
          if (p.life <= 0) { anim.particles.splice(i, 1); continue; }
          ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
          if (p.shape === 'honor') { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); }
          else ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        }
        for (let i = anim.floatingTexts.length - 1; i >= 0; i--) {
          const ft = anim.floatingTexts[i]; ft.y += ft.vy * dt; ft.life -= dt * 1.15;
          if (ft.life <= 0) { anim.floatingTexts.splice(i, 1); continue; }
          ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, ft.life * 1.3));
          ctx.font = '900 15px Inter, "Noto Sans KR", sans-serif'; ctx.textAlign = 'center';
          ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(15, 23, 42, 0.9)'; ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
        }
      }

      function performHit(clientX = null, clientY = null) {
        const weapon = getEquippedWeapon(), region = getCurrentRegion(), pet = getEquippedPet();
        const { powerGain, goldGain } = getClickRewards();
        state.power += powerGain; state.gold += goldGain; state.totalClicks += 1;
        anim.attackPattern = (anim.attackPattern + 1) % 3;
        anim.heroDash = 1.0; anim.swingProgress = 0.01; anim.monsterHit = 1.0; anim.hitFlash = 1.0;
        anim.screenShake = Math.min(9, 3 + weapon.tier * 0.9); anim.combo += 1; anim.comboTimer = 1.6;
        if (pet) {
          anim.petCheerBoost = 1.0;
          if (anim.petBubbleTimer <= 0.2 || Math.random() < 0.35) { anim.petBubbleText = pet.cheers[Math.floor(Math.random() * pet.cheers.length)]; anim.petBubbleTimer = 1.3; }
        }
        if (!document.hidden) {
          playSlashSound(weapon.tier);
          const monsterX = canvasWidth * 0.72, monsterY = canvasHeight * 0.78 - 58;
          if (anim.shockwaves.length < 15) anim.shockwaves.push({ x: monsterX, y: monsterY, radius: 12, speed: 240 + weapon.tier * 28, color: weapon.slashColor, life: 1.0 });
          const spawnCount = Math.min(12 + weapon.tier * 2, Math.max(0, 180 - anim.particles.length));
          for (let i = 0; i < spawnCount; i++) {
            const angle = Math.random() * Math.PI * 2, speed = 100 + Math.random() * 230;
            anim.particles.push({ x: monsterX + (Math.random() - 0.5) * 24, y: monsterY + (Math.random() - 0.5) * 32, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 95, size: 4 + Math.random() * 4.5, color: i % 2 === 0 ? weapon.slashColor : region.accent, shape: 'spark', rot: Math.random() * Math.PI, vRot: (Math.random() - 0.5) * 12, life: 0.65 + Math.random() * 0.25, decay: 1.5 });
          }
          if (anim.floatingTexts.length < 30) {
            let spawnX = monsterX + (Math.random() - 0.5) * 40, spawnY = monsterY - 28;
            if (clientX !== null && clientY !== null) {
              const rect = canvas.getBoundingClientRect();
              spawnX = Math.max(60, Math.min(canvasWidth - 60, clientX - rect.left));
              spawnY = Math.max(40, Math.min(canvasHeight - 40, clientY - rect.top));
            }
            anim.floatingTexts.push({ x: spawnX, y: spawnY, vy: -62, text: `+${formatNumber(powerGain)} 파워  +${formatNumber(goldGain)} G`, color: '#fde047', life: 1.0 });
          }
        }
        saveState(false); updateUI();
      }

      let toastTimeout = null;
      function showToast(message) {
        const box = document.getElementById('toastBox');
        document.getElementById('toastMsg').textContent = message;
        box.classList.remove('opacity-0', 'translate-y-2'); box.classList.add('opacity-100', 'translate-y-0');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { box.classList.remove('opacity-100', 'translate-y-0'); box.classList.add('opacity-0', 'translate-y-2'); }, 2300);
      }

      function updateUI() {
        const weapon = getEquippedWeapon(), pet = getEquippedPet(), region = getCurrentRegion();
        const { powerGain, goldGain } = getClickRewards();
        const { current, next } = getRankInfo(state.power);
        const honorCost = getNextHonorCost(), canUpgradeHonor = state.gold >= honorCost;

        document.getElementById('goldDisplay').textContent = formatNumber(state.gold);
        document.getElementById('honorDisplay').textContent = `명예 Lv.${state.honorLevel}`;
        document.getElementById('honorBonusBadge').textContent = state.honorLevel === 0 ? '오오라 전용' : `오오라 Lv.${state.honorLevel}`;
        document.getElementById('honorSubText').textContent = state.honorLevel === 0 ? 'Lv.1 달성 시 황금 오오라 개방' : `황금 오오라 농도 ${Math.min(100, 22 + state.honorLevel * 12)}% (외형 전용)`;
        document.getElementById('honorCostText').textContent = `${formatNumber(honorCost)} G`;

        const autoBtn = document.getElementById('autoClickToggleBtn'), autoDot = document.getElementById('autoClickDot'), autoLabel = document.getElementById('autoClickBtnLabel'), autoSubLabel = document.getElementById('autoClickSubLabel');
        if (state.isVip && state.autoClickEnabled) {
          autoBtn.className = 'flex-[1] min-w-[78px] sm:min-w-[92px] py-2 px-2 rounded-xl text-[11px] sm:text-xs font-extrabold bg-emerald-950 hover:bg-emerald-900 border border-emerald-400/80 text-emerald-200 shadow-lg shadow-emerald-500/25 transition active:scale-95 flex flex-col items-center justify-center leading-tight cursor-pointer shrink-0';
          autoDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping'; autoLabel.textContent = '자동 ON'; autoSubLabel.textContent = '초당 5회 작동';
        } else if (state.isVip) {
          autoBtn.className = 'flex-[1] min-w-[78px] sm:min-w-[92px] py-2 px-2 rounded-xl text-[11px] sm:text-xs font-extrabold bg-slate-950 hover:bg-slate-800 border border-amber-400/60 text-amber-200 shadow-md transition active:scale-95 flex flex-col items-center justify-center leading-tight cursor-pointer shrink-0';
          autoDot.className = 'w-1.5 h-1.5 rounded-full bg-slate-500'; autoLabel.textContent = '자동 OFF'; autoSubLabel.textContent = '초당 5회 대기';
        } else {
          autoBtn.className = 'flex-[1] min-w-[78px] sm:min-w-[92px] py-2 px-2 rounded-xl text-[11px] sm:text-xs font-extrabold bg-slate-950 hover:bg-purple-950/70 border border-purple-500/60 text-purple-200 shadow-md transition active:scale-95 flex flex-col items-center justify-center leading-tight cursor-pointer shrink-0';
          autoDot.className = 'w-1.5 h-1.5 rounded-full bg-purple-400'; autoLabel.textContent = '자동 OFF'; autoSubLabel.textContent = '👑 VIP 5연타';
        }

        const honorBtn = document.getElementById('honorUpgradeBtn');
        honorBtn.disabled = !canUpgradeHonor;
        honorBtn.className = canUpgradeHonor
          ? 'shrink-0 px-3 py-2 rounded-xl text-xs font-extrabold bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 hover:from-amber-300 hover:to-yellow-200 text-slate-950 shadow-lg shadow-amber-500/30 active:scale-95 transition flex flex-col items-center justify-center leading-tight cursor-pointer'
          : 'shrink-0 px-3 py-2 rounded-xl text-xs font-extrabold bg-slate-800/90 text-slate-500 border border-slate-700/80 cursor-not-allowed flex flex-col items-center justify-center leading-tight';

        const gfxBtn = document.getElementById('graphicModeToggleBtn');
        const gfxLabel = document.getElementById('graphicModeLabel');
        const isHiBit = state.graphicMode === 'hibit';
        if (gfxBtn && gfxLabel) {
          gfxLabel.textContent = isHiBit ? '✨ 하이비트 도트' : '기본 그래픽';
          gfxBtn.className = isHiBit
            ? 'bg-gradient-to-br from-fuchsia-950/90 via-indigo-950/90 to-slate-950 border border-fuchsia-400/80 hover:border-fuchsia-300 rounded-xl px-3 py-2.5 flex flex-col justify-center items-start text-left transition active:scale-95 cursor-pointer shadow-lg shadow-fuchsia-500/20'
            : 'bg-slate-950/85 hover:bg-slate-900 border border-sky-500/50 hover:border-sky-400 rounded-xl px-3 py-2.5 flex flex-col justify-center items-start text-left transition active:scale-95 cursor-pointer shadow-inner';
          gfxLabel.className = isHiBit
            ? 'text-xs sm:text-sm font-black text-fuchsia-300 truncate mt-0.5'
            : 'text-xs sm:text-sm font-black text-sky-300 truncate mt-0.5';
        }
        canvas.classList.toggle('pixel-art', isHiBit);
        document.getElementById('gainPerClickDisplay').textContent = `+${formatNumber(powerGain)} 파워 / +${formatNumber(goldGain)} G`;
        document.getElementById('equippedWeaponDisplay').textContent = `${weapon.name} · ${pet ? pet.icon + pet.name : '펫 없음'}`;
        document.getElementById('stageBadge').textContent = `훈련 지역: ${region.name} · 대상: ${region.monsterName}`;
        document.getElementById('arenaRegionPill').textContent = `${region.icon} ${region.name}`;
        document.getElementById('arenaMonsterPill').textContent = `🎯 ${region.monsterName}`;
        const arenaPetPill = document.getElementById('arenaPetPill');
        if (pet) { arenaPetPill.classList.remove('hidden'); arenaPetPill.textContent = `${pet.icon} ${pet.name} 응원중`; }
        else arenaPetPill.classList.add('hidden');
        document.getElementById('trainBtnLabel').textContent = `${region.monsterName} 타격하기 (+${formatNumber(powerGain)} 파워)`;

        if (next) {
          const pct = Math.max(3, Math.min(100, ((state.power - current.minPower) / Math.max(1, next.minPower - current.minPower)) * 100));
          document.getElementById('rankProgressBar').style.width = `${pct}%`;
          const evoHint = current.level < 10 ? ' · Lv.10 황금기사 각성' : ' · 👑 황금기사 각성';
          document.getElementById('nextRankText').textContent = `Lv.${current.level} → Lv.${next.level}까지 ${formatNumber(Math.max(0, next.minPower - state.power))} 파워${evoHint}`;
        } else {
          document.getElementById('rankProgressBar').style.width = '100%';
          document.getElementById('nextRankText').textContent = '최고 용사 등급(Lv.100) 달성!';
        }

        const bgmBtn = document.getElementById('bgmToggleBtn');
        bgmBtn.textContent = state.bgmEnabled ? '🎵 배경음 ON' : '🔇 배경음 OFF';
        bgmBtn.className = state.bgmEnabled ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap' : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';
        const soundBtn = document.getElementById('soundToggleBtn');
        soundBtn.textContent = state.soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
        soundBtn.className = state.soundEnabled ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap' : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';

        renderWeaponsPanel(); renderRegionsPanel(); renderPetsPanel();
      }

      function renderWeaponsPanel() {
        const panel = document.getElementById('weaponsPanel');
        panel.innerHTML = '';
        WEAPONS.forEach(w => {
          const owned = state.ownedWeapons.includes(w.id), equipped = state.equippedWeaponId === w.id, isVipOnly = w.isVipOnly === true, canBuy = !owned && state.gold >= w.cost && !isVipOnly;
          const actionLabel = isVipOnly ? (state.isVip ? '장착하기' : '👑 VIP 전용') : `구매 (${formatNumber(w.cost)} G)`;
          const card = document.createElement('div');
          card.className = `rounded-xl p-3 border transition flex flex-col justify-between gap-2.5 ${equipped ? 'bg-amber-950/25 border-amber-500/60 shadow-md shadow-amber-500/10' : owned ? 'bg-slate-950/85 border-slate-700/80' : 'bg-slate-950/60 border-slate-800/90'}`;
          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs sm:text-sm font-extrabold text-slate-100">${isVipOnly ? '👑 ' : ''}${w.name}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${equipped ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : owned ? 'bg-slate-800 text-slate-300' : 'bg-slate-900 text-slate-400 border border-slate-800'}">${equipped ? '장착 중' : owned ? '보유 중' : isVipOnly ? 'VIP 보물' : `Tier ${w.tier + 1}`}</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-1">${w.desc}</p>
              <div class="mt-2 flex flex-wrap gap-1.5 text-[10px] font-bold"><span class="px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-300 border border-sky-500/25">파워 +${w.powerMult}</span></div>
            </div>
            <button type="button" class="w-full py-2 px-3 rounded-lg text-xs font-extrabold transition ${equipped ? 'bg-slate-800 text-amber-300 cursor-default' : (owned || (isVipOnly && state.isVip)) ? 'bg-sky-600 hover:bg-sky-500 text-white active:scale-95 cursor-pointer' : isVipOnly ? 'bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white shadow active:scale-95 cursor-pointer' : canBuy ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow active:scale-95 cursor-pointer' : 'bg-slate-800/80 text-slate-500 cursor-not-allowed'}">${equipped ? '현재 장착됨' : owned ? '장착하기' : actionLabel}</button>
          `;
          card.querySelector('button').addEventListener('click', () => {
            if (equipped) return;
            if (isVipOnly && !state.isVip) { openVipModal(); return; }
            if (isVipOnly && !state.ownedWeapons.includes(w.id)) state.ownedWeapons.push(w.id);
            if (owned || (isVipOnly && state.isVip)) { state.equippedWeaponId = w.id; saveState(true); playPurchaseSound(); showToast(`⚔️ [${w.name}] 장착 완료!`); updateUI(); return; }
            if (state.gold >= w.cost) { state.gold -= w.cost; state.ownedWeapons.push(w.id); state.equippedWeaponId = w.id; saveState(true); playPurchaseSound(); showToast(`🎉 [${w.name}] 구매 및 장착 완료!`); updateUI(); }
            else showToast(`골드가 부족합니다! (필요: ${formatNumber(w.cost)} G)`);
          });
          panel.appendChild(card);
        });
      }

      function renderPetsPanel() {
        const panel = document.getElementById('petsPanel');
        if (!panel) return;
        panel.innerHTML = '';
        PETS.forEach(pet => {
          const isVipOnly = pet.isVipOnly === true, unlocked = isVipOnly ? state.isVip : (state.honorLevel >= pet.reqHonor), equipped = state.equippedPetId === pet.id;
          const actionLabel = isVipOnly ? (state.isVip ? '함께 응원하기' : '👑 VIP 전용') : (unlocked ? '함께 응원하기' : `잠김 (명예 Lv.${pet.reqHonor.toLocaleString('ko-KR')})`);
          const card = document.createElement('div');
          card.className = `rounded-xl p-3 border transition flex flex-col justify-between gap-2.5 ${equipped ? 'bg-pink-950/25 border-pink-500/60 shadow-md shadow-pink-500/10' : unlocked ? 'bg-slate-950/85 border-slate-700/80' : 'bg-slate-950/60 border-slate-800/90 opacity-85'}`;
          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs sm:text-sm font-extrabold text-slate-100">${pet.icon} ${pet.name}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${equipped ? 'bg-pink-500/20 text-pink-300 border border-pink-500/40' : unlocked ? 'bg-slate-800 text-slate-300' : 'bg-amber-950/60 text-amber-300 border border-amber-700/40'}">${equipped ? '응원 중' : unlocked ? '해금됨' : isVipOnly ? 'VIP 펫' : `명예 Lv.${pet.reqHonor.toLocaleString('ko-KR')}`}</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-1">${pet.desc}</p>
              <div class="mt-2 flex flex-wrap gap-1.5 text-[10px] font-bold"><span class="px-1.5 py-0.5 rounded bg-pink-500/10 text-pink-300 border border-pink-500/25">📣 "${pet.cheers[0]}"</span></div>
            </div>
            <button type="button" class="w-full py-2 px-3 rounded-lg text-xs font-extrabold transition ${equipped ? 'bg-slate-800 hover:bg-slate-700 text-pink-300 cursor-pointer' : unlocked ? 'bg-pink-600 hover:bg-pink-500 text-white active:scale-95 cursor-pointer' : isVipOnly ? 'bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white shadow active:scale-95 cursor-pointer' : 'bg-slate-800/80 text-slate-500 cursor-not-allowed'}">${equipped ? '응원 쉬기 (해제)' : actionLabel}</button>
          `;
          card.querySelector('button').addEventListener('click', () => {
            if (equipped) { state.equippedPetId = null; saveState(true); showToast(`🐾 [${pet.name}]이(가) 잠시 휴식합니다.`); updateUI(); return; }
            if (isVipOnly && !state.isVip) { openVipModal(); return; }
            if (!unlocked) { showToast(`👑 명예 Lv.${pet.reqHonor.toLocaleString('ko-KR')} 달성 시 해금됩니다!`); return; }
            if (!state.ownedPets.includes(pet.id)) state.ownedPets.push(pet.id);
            state.equippedPetId = pet.id; anim.petCheerBoost = 1.0; anim.petBubbleText = pet.cheers[0]; anim.petBubbleTimer = 2.0;
            saveState(true); playPurchaseSound(); showToast(`${pet.icon} [${pet.name}]이(가) 뒤에서 응원을 시작합니다!`); updateUI();
          });
          panel.appendChild(card);
        });
      }

      function renderRegionsPanel() {
        const panel = document.getElementById('regionsPanel');
        panel.innerHTML = '';
        REGIONS.forEach(r => {
          const isVipOnly = r.isVipOnly === true, unlocked = isVipOnly ? state.isVip : (state.power >= r.reqPower), active = state.currentRegionId === r.id;
          const btnLabel = isVipOnly ? (active ? '비밀던젼 내부' : state.isVip ? '던젼 입장하기' : '👑 VIP 전용던젼') : (active ? '현재 훈련 지역' : unlocked ? '지역 이동하기' : `잠김 (${formatNumber(r.reqPower)} 파워 필요)`);
          const card = document.createElement('div');
          card.className = `rounded-xl p-3 border transition flex flex-col justify-between gap-2.5 ${active ? 'bg-emerald-950/25 border-emerald-500/60 shadow-md shadow-emerald-500/10' : unlocked ? 'bg-slate-950/85 border-slate-700/80' : 'bg-slate-950/50 border-slate-800/80 opacity-80'}`;
          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs sm:text-sm font-extrabold text-slate-100">${r.icon} ${r.name}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${active ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : unlocked ? 'bg-slate-800 text-slate-300' : 'bg-rose-950/60 text-rose-300 border border-rose-800/50'}">${active ? '훈련 중' : unlocked ? '입장 가능' : isVipOnly ? 'VIP 전용' : `필요 파워 ${formatNumber(r.reqPower)}`}</span>
              </div>
              <div class="text-[11px] font-bold text-amber-300/90 mt-1">출현 몬스터: ${r.monsterName}</div>
              <p class="text-[11px] text-slate-400 mt-0.5">${r.desc}</p>
              <div class="mt-2 flex flex-wrap gap-1.5 text-[10px] font-bold"><span class="px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/25">골드 배율 x${r.goldMult}</span></div>
            </div>
            <button type="button" class="w-full py-2 px-3 rounded-lg text-xs font-extrabold transition ${active ? 'bg-slate-800 text-emerald-300 cursor-default' : unlocked ? 'bg-emerald-600 hover:bg-emerald-500 text-white active:scale-95 cursor-pointer' : isVipOnly ? 'bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white shadow active:scale-95 cursor-pointer' : 'bg-slate-800/80 text-slate-500 cursor-not-allowed'}">${btnLabel}</button>
          `;
          card.querySelector('button').addEventListener('click', () => {
            if (active) return;
            if (isVipOnly) { if (!state.isVip) { openVipModal(); return; } }
            else if (!unlocked) { showToast(`파워가 부족합니다! (${formatNumber(r.reqPower)} 파워 필요)`); return; }
            state.currentRegionId = r.id; saveState(true); playPurchaseSound();
            if (state.bgmEnabled) startBGM();
            showToast(`${r.icon} [${r.name}] 지역으로 이동했습니다!`); updateUI();
          });
          panel.appendChild(card);
        });
      }

      const tabWeaponsBtn = document.getElementById('tabWeaponsBtn'), tabRegionsBtn = document.getElementById('tabRegionsBtn'), tabPetsBtn = document.getElementById('tabPetsBtn'), tabRankingBtn = document.getElementById('tabRankingBtn');
      const weaponsPanel = document.getElementById('weaponsPanel'), regionsPanel = document.getElementById('regionsPanel'), petsPanel = document.getElementById('petsPanel'), rankingPanel = document.getElementById('rankingPanel');

      function switchMainTab(tabName) {
        activeTab = tabName;
        const inactive = 'flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold text-slate-400 hover:text-slate-200 transition whitespace-nowrap cursor-pointer';
        tabWeaponsBtn.className = tabRegionsBtn.className = tabPetsBtn.className = tabRankingBtn.className = inactive;
        weaponsPanel.classList.add('hidden'); weaponsPanel.classList.remove('grid');
        regionsPanel.classList.add('hidden'); regionsPanel.classList.remove('grid');
        petsPanel.classList.add('hidden'); petsPanel.classList.remove('grid');
        rankingPanel.classList.add('hidden'); rankingPanel.classList.remove('flex');
        if (tabName === 'weapons') { tabWeaponsBtn.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold bg-slate-800 text-amber-300 shadow transition whitespace-nowrap cursor-pointer'; weaponsPanel.classList.remove('hidden'); weaponsPanel.classList.add('grid'); }
        else if (tabName === 'regions') { tabRegionsBtn.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold bg-slate-800 text-emerald-300 shadow transition whitespace-nowrap cursor-pointer'; regionsPanel.classList.remove('hidden'); regionsPanel.classList.add('grid'); }
        else if (tabName === 'pets') { tabPetsBtn.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold bg-slate-800 text-pink-300 shadow transition whitespace-nowrap cursor-pointer'; petsPanel.classList.remove('hidden'); petsPanel.classList.add('grid'); }
        else if (tabName === 'ranking') { tabRankingBtn.className = 'flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold bg-slate-800 text-sky-300 shadow transition whitespace-nowrap cursor-pointer'; rankingPanel.classList.remove('hidden'); rankingPanel.classList.add('flex'); syncAndRefreshRanking(false, true); }
      }

      tabWeaponsBtn.addEventListener('click', () => switchMainTab('weapons'));
      tabRegionsBtn.addEventListener('click', () => switchMainTab('regions'));
      tabPetsBtn.addEventListener('click', () => switchMainTab('pets'));
      tabRankingBtn.addEventListener('click', () => switchMainTab('ranking'));
      document.getElementById('headerExitLobbyBtn')?.addEventListener('click', () => { stopBGM(); window.location.href = 'https://02826k.github.io/aigameroom/'; });

      canvasWrapper.addEventListener('pointerdown', (e) => { e.preventDefault(); getAudioContext(); if (!bgmTimer && state.bgmEnabled) startBGM(); performHit(e.clientX, e.clientY); });
      document.getElementById('trainActionBtn').addEventListener('click', () => { getAudioContext(); if (!bgmTimer && state.bgmEnabled) startBGM(); performHit(); });
      document.getElementById('graphicModeToggleBtn').addEventListener('click', () => {
        state.graphicMode = state.graphicMode === 'hibit' ? 'classic' : 'hibit';
        saveState(true);
        updateUI();
        showToast(state.graphicMode === 'hibit' ? '🎨 하이비트 도트 모드로 전환되었습니다!' : '🖼️ 기본 그래픽 모드로 복귀했습니다!');
      });

      document.getElementById('honorUpgradeBtn').addEventListener('click', () => {
        const cost = getNextHonorCost();
        if (state.gold < cost) { showToast(`골드가 부족합니다! (필요: ${formatNumber(cost)} G)`); return; }
        state.gold -= cost; state.honorLevel += 1; saveState(true); playHonorUpSound();
        const heroX = canvasWidth * 0.30, heroY = canvasHeight * 0.78 - 52;
        for (let i = 0; i < 28; i++) {
          const angle = (Math.PI * 2 * i) / 28, speed = 90 + Math.random() * 140;
          anim.particles.push({ x: heroX, y: heroY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 60, size: 4 + Math.random() * 3.5, color: i % 2 === 0 ? '#fef08a' : '#f59e0b', shape: 'honor', rot: 0, vRot: 0, life: 1.15, decay: 1.4 });
        }
        anim.screenShake = 6; showToast(`👑 명예 Lv.${state.honorLevel} 달성!`); updateUI();
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !e.repeat) {
          if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
          e.preventDefault(); getAudioContext(); if (!bgmTimer && state.bgmEnabled) startBGM(); performHit();
        }
      });

      document.getElementById('bgmToggleBtn').addEventListener('click', () => { state.bgmEnabled = !state.bgmEnabled; saveState(true); updateUI(); if (state.bgmEnabled) startBGM(); else stopBGM(); });
      document.getElementById('soundToggleBtn').addEventListener('click', () => { state.soundEnabled = !state.soundEnabled; saveState(true); updateUI(); });

      document.getElementById('authToggleBtn').addEventListener('click', () => {
        if (authToken) {
          if (confirm('로그아웃 하시겠습니까?')) handleLogout(false);
        } else {
          goLobbyAuth('login');
        }
      });

      function syncAuthFromStorage() {
        const { t, u } = readSharedAuth();
        if (t !== authToken || u !== currentUsername) {
          authToken = t;
          currentUsername = u;
          if (currentUsername) {
            lastKnownUsername = currentUsername;
            safeSetStorage(LAST_USER_KEY, currentUsername);
          } else {
            state.isVip = false;
            state.autoClickEnabled = false;
          }
          updateAuthHeaderUI();
          updateUI();
          if (authToken) loadFromServer();
          fetchAndRenderRanking(false, true);
        }
      }
      window.addEventListener('pageshow', syncAuthFromStorage);
      window.addEventListener('storage', syncAuthFromStorage);

      let lastTimestamp = 0;
      function gameLoop(timestamp) {
        const dt = lastTimestamp ? Math.min(0.05, (timestamp - lastTimestamp) / 1000) : 0.016;
        lastTimestamp = timestamp; anim.time += dt;
        if (anim.heroDash > 0) anim.heroDash = Math.max(0, anim.heroDash - dt * 4.8);
        if (anim.swingProgress > 0) { anim.swingProgress += dt * 5.2; if (anim.swingProgress >= 1) anim.swingProgress = 0; }
        if (anim.monsterHit > 0) anim.monsterHit = Math.max(0, anim.monsterHit - dt * 4.5);
        if (anim.hitFlash > 0) anim.hitFlash = Math.max(0, anim.hitFlash - dt * 7.5);
        if (anim.screenShake > 0) anim.screenShake = Math.max(0, anim.screenShake - dt * 28);
        if (anim.petCheerBoost > 0) anim.petCheerBoost = Math.max(0, anim.petCheerBoost - dt * 2.8);
        if (anim.petBubbleTimer > 0) anim.petBubbleTimer = Math.max(0, anim.petBubbleTimer - dt);

        const comboBadge = document.getElementById('comboBadge');
        if (anim.comboTimer > 0) {
          anim.comboTimer -= dt;
          if (anim.combo >= 2) {
            comboBadge.classList.remove('opacity-0'); comboBadge.classList.add('opacity-100');
            document.getElementById('comboCountText').textContent = `${anim.combo} COMBO`;
            document.getElementById('comboBonusText').textContent = anim.combo >= 30 ? '초고속 광폭 연타!' : anim.combo >= 10 ? '맹렬한 연속 공격!' : '연속 타격 중!';
          }
          if (anim.comboTimer <= 0) { anim.combo = 0; comboBadge.classList.remove('opacity-100'); comboBadge.classList.add('opacity-0'); }
        }

        ctx.save();
        if (anim.screenShake > 0) ctx.translate((Math.random() - 0.5) * anim.screenShake, (Math.random() - 0.5) * anim.screenShake);
        const region = getCurrentRegion(), weapon = getEquippedWeapon(), groundY = canvasHeight * 0.78;
        if (state.graphicMode === 'hibit') {
          renderHiBitScene(dt, region, weapon);
        } else {
          ctx.imageSmoothingEnabled = true;
          drawEnvironment(region);
          drawMonster(canvasWidth * 0.72, groundY, region);
          drawCheerPet(canvasWidth * 0.14, groundY);
          drawHero(canvasWidth * 0.30, groundY, weapon);
          updateAndDrawEffects(dt);
        }
        ctx.restore();
        requestAnimationFrame(gameLoop);
      }

      async function initGame() {
        resizeCanvas();
        updateAuthHeaderUI(); updateUI();
        requestAnimationFrame(gameLoop);
        if (authToken) await loadFromServer();
        await fetchAndRenderRanking(false, true);
        setTimeout(() => { if (state.bgmEnabled) startBGM(); }, 800);
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initGame);
      else initGame();
    })();
  </script>
</body>
</html>
