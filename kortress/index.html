                    ctx.fillStyle = aura;
                    ctx.beginPath();
                    ctx.arc(0, -12, 34, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.ellipse(0, 1, 22, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(0, -13);
                ctx.rotate(-this.slopeAngle);
                const rad = (-this.angle * Math.PI) / 180;
                ctx.rotate(rad);
                const barrelGrad = ctx.createLinearGradient(0, -4, 0, 4);
                barrelGrad.addColorStop(0, '#f8fafc');
                barrelGrad.addColorStop(0.5, '#94a3b8');
                barrelGrad.addColorStop(1, '#334155');
                ctx.fillStyle = barrelGrad;
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.roundRect(0, -3.5, 28, 7, 2.5);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#475569';
                ctx.beginPath();
                ctx.roundRect(24, -5, 6, 10, 1.5);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-TANK_WIDTH / 2, -9, TANK_WIDTH, 9, 4.5);
                ctx.fill();
                ctx.stroke();

                for (let wx = -13; wx <= 13; wx += 6.5) {
                    ctx.fillStyle = '#64748b';
                    ctx.beginPath();
                    ctx.arc(wx, -4.5, 2.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#cbd5e1';
                    ctx.beginPath();
                    ctx.arc(wx, -4.5, 1, 0, Math.PI * 2);
                    ctx.fill();
                }

                const bodyGrad = ctx.createLinearGradient(0, -24, 0, -8);
                bodyGrad.addColorStop(0, this.lightColor);
                bodyGrad.addColorStop(0.5, this.color);
                bodyGrad.addColorStop(1, this.darkColor);

                ctx.fillStyle = bodyGrad;
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-16, -17, 32, 9, 4);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, -17, 10, Math.PI, 0);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.ellipse(-3, -21, 4, 2, -0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
                }

                if (gameState.phase !== 'GAMEOVER' && gameState.tanks[gameState.turn] === this && !this.isAI) {
                    const bob = Math.sin(Date.now() / 180) * 4;
                    ctx.fillStyle = '#facc15';
                    ctx.shadowColor = '#facc15';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - 66 + bob);
                    ctx.lineTo(this.x - 8, this.y - 78 + bob);
                    ctx.lineTo(this.x + 8, this.y - 78 + bob);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (gameState.phase === 'AIMING' || gameState.phase === 'CHARGING') {
                        const rad = (-this.angle * Math.PI) / 180;
                        const startX = this.x + Math.cos(rad) * 32;
                        const startY = (this.y - PIVOT_Y) + Math.sin(rad) * 32;
                        ctx.strokeStyle = 'rgba(250, 204, 21, 0.7)';
                        ctx.setLineDash([5, 5]);
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(startX + Math.cos(rad) * 50, startY + Math.sin(rad) * 50);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // VIP자동센서 활성 시: 포탄 궤적 예측 점선 포물선 및 착탄 지점 실시간 표시
                        if (vipSensorEnabled && authState.isVip && this.id === 0) {
                            const opp = gameState.tanks[(gameState.turn + 1) % 2];
                            const sensorSol = currentVipSolution || calculatePowerForAngle(this, opp, this.angle);
                            if (sensorSol) {
                                const spd = (sensorSol.power / 100) * MAX_POWER;
                                let px = this.x + Math.cos(rad) * 30;
                                let py = (this.y - PIVOT_Y) + Math.sin(rad) * 30;
                                let pvx = Math.cos(rad) * spd;
                                let pvy = Math.sin(rad) * spd;

                                const pts = [{ x: px, y: py }];
                                let hitTarget = false;
                                let impactPt = null;

                                for (let frame = 0; frame < 260; frame++) {
                                    pvy += GRAVITY;
                                    let stopped = false;
                                    for (let s = 0; s < 4; s++) {
                                        px += pvx / 4;
                                        py += pvy / 4;
                                        if (px < 0 || px >= WORLD_WIDTH) {
                                            stopped = true;
                                            break;
                                        }
                                        if (opp && opp.hp > 0 && Math.hypot(px - opp.x, py - (opp.y - HIT_Y)) < HIT_R - 2) {
                                            hitTarget = true;
                                            impactPt = { x: px, y: py };
                                            pts.push(impactPt);
                                            stopped = true;
                                            break;
                                        }
                                        const ix = Math.floor(px);
                                        if (ix >= 0 && ix < WORLD_WIDTH && py >= gameState.terrain[ix]) {
                                            impactPt = { x: px, y: gameState.terrain[ix] };
                                            pts.push(impactPt);
                                            stopped = true;
                                            break;
                                        }
                                    }
                                    if (stopped) break;
                                    pts.push({ x: px, y: py });
                                }

                                if (pts.length > 1) {
                                    ctx.save();
                                    // 점선 포물선 궤적
                                    ctx.strokeStyle = hitTarget ? 'rgba(250, 204, 21, 0.92)' : 'rgba(56, 189, 248, 0.85)';
                                    ctx.lineWidth = 2.4;
                                    ctx.setLineDash([6, 6]);
                                    ctx.beginPath();
                                    ctx.moveTo(pts[0].x, pts[0].y);
                                    for (let i = 1; i < pts.length; i++) {
                                        ctx.lineTo(pts[i].x, pts[i].y);
                                    }
                                    ctx.stroke();
                                    ctx.setLineDash([]);

                                    // 일정 간격 점 표시
                                    let accDist = 0;
                                    ctx.fillStyle = hitTarget ? '#fde047' : '#7dd3fc';
                                    for (let i = 1; i < pts.length; i++) {
                                        accDist += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
                                        if (accDist >= 22) {
                                            accDist = 0;
                                            ctx.beginPath();
                                            ctx.arc(pts[i].x, pts[i].y, 2.8, 0, Math.PI * 2);
                                            ctx.fill();
                                        }
                                    }

                                    // 예상 착탄 지점 마커
                                    if (impactPt) {
                                        const pulse = 8 + Math.sin(Date.now() / 160) * 2.5;
                                        ctx.strokeStyle = hitTarget ? '#ef4444' : '#fde047';
                                        ctx.lineWidth = 2;
                                        ctx.beginPath();
                                        ctx.arc(impactPt.x, impactPt.y, pulse, 0, Math.PI * 2);
                                        ctx.stroke();

                                        ctx.fillStyle = hitTarget ? 'rgba(239, 68, 68, 0.35)' : 'rgba(250, 204, 21, 0.25)';
                                        ctx.beginPath();
                                        ctx.arc(impactPt.x, impactPt.y, 4.5, 0, Math.PI * 2);
                                        ctx.fill();
                                    }
                                    ctx.restore();
                                }
                            }
                        }
                    }
                }
            }
        }

        class Projectile {
            constructor(x, y, vx, vy, weapon, ownerId) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.weapon = weapon;
                this.ownerId = ownerId;
                this.trail = [];
                this.active = true;
            }

            update() {
                if (!this.active) return;
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 26) this.trail.shift();

                this.vy += GRAVITY;
                if (Math.random() < 0.5) gameState.particles.push({ type: 'smoke', x: this.x, y: this.y, vx: (Math.random() - 0.5) * 0.3, vy: -0.15, size: this.weapon.id === 2 ? 5 : 3.5, grow: 0.22, alpha: 0.45, decay: 0.018, color: '210,210,220' });

                const steps = 4;
                for (let s = 0; s < steps; s++) {
                    this.x += this.vx / steps;
                    this.y += this.vy / steps;
                    if (this.x < 0 || this.x >= WORLD_WIDTH) {
                        this.active = false;
                        return;
                    }
                    for (let tank of gameState.tanks) {
                        if (tank.hp <= 0) continue;
                        if (Math.hypot(this.x - tank.x, this.y - (tank.y - HIT_Y)) < HIT_R) {
                            this.explode();
                            return;
                        }
                    }
                    const ix = Math.floor(this.x);
                    if (ix >= 0 && ix < WORLD_WIDTH && this.y >= gameState.terrain[ix]) {
                        this.explode();
                        return;
                    }
                }
            }

            explode() {
                this.active = false;
                const r = this.weapon.radius;
                sfx.playExplosion(this.weapon.id === 2);
                gameState.screenShake = this.weapon.id === 2 ? 14 : 7;

                gameState.shockwaves.push({
                    x: this.x, y: this.y,
                    radius: 8, maxRadius: r * 1.45,
                    color: this.weapon.color, alpha: 0.9
                });

                const startX = Math.max(0, Math.floor(this.x - r));
                const endX = Math.min(WORLD_WIDTH - 1, Math.ceil(this.x + r));
                for (let x = startX; x <= endX; x++) {
                    const dx = x - this.x;
                    const dy = Math.sqrt(Math.max(0, r * r - dx * dx));
                    const craterBottom = this.y + dy;
                    if (craterBottom > gameState.terrain[x]) {
                        gameState.terrain[x] = Math.min(WORLD_HEIGHT - 10, craterBottom);
                    }
                }

                for (let tank of gameState.tanks) {
                    if (tank.hp <= 0) continue;
                    const dist = Math.hypot(tank.x - this.x, (tank.y - 10) - this.y);
                    if (dist <= r + 15) {
                        const falloff = Math.max(0.2, 1 - dist / (r + 15));
                        const dmg = Math.round(this.weapon.damage * falloff);
                        tank.hp = Math.max(0, tank.hp - dmg);
                        tank.hitFlash = 1;
                        gameState.floatingTexts.push({
                            x: tank.x, y: tank.y - 38,
                            text: `-${dmg}`, color: '#ef4444', alpha: 1, vy: -1.6
                        });
                    }
                    tank.updatePositionOnTerrain();
                }

                const particleCount = this.weapon.id === 2 ? 65 : 35;
                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * (this.weapon.id === 2 ? 7.5 : 5) + 1;
                    gameState.particles.push({
                        x: this.x, y: this.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1.8,
                        size: Math.random() * 5.5 + 2,
                        color: ['#fef08a', '#f97316', '#ef4444', '#94a3b8'][Math.floor(Math.random() * 4)],
                        alpha: 1,
                        decay: Math.random() * 0.024 + 0.014
                    });
                }

                // 고퀄리티 폭발: 스프라이트 화염 + 흙 파편 + 연기 + 그을음 + 섬광
                const isBig = this.weapon.id === 2;
                gameState.booms.push({ x: this.x, y: this.y, r, t0: Date.now(), big: isBig });
                gameState.craterMarks.push({ x: this.x, y: this.y, r: r * 1.1 });
                if (gameState.craterMarks.length > 40) gameState.craterMarks.shift();
                gameState.flash = Math.max(gameState.flash || 0, isBig ? 1 : 0.6);
                const soil = ['#7c4a24', '#5b3418', '#9a6436', '#3f2a1a', '#4d7c2f'];
                for (let i = 0; i < (isBig ? 34 : 20); i++) {
                    const a = -Math.PI * (0.1 + Math.random() * 0.8);
                    const sp = Math.random() * (isBig ? 9 : 6.5) + 2;
                    gameState.particles.push({ type: 'debris', x: this.x, y: this.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                        size: Math.random() * 4 + 2, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.5,
                        color: soil[(Math.random() * soil.length) | 0], alpha: 1, decay: 0.008 + Math.random() * 0.008 });
                }
                for (let i = 0; i < (isBig ? 16 : 9); i++) {
                    gameState.particles.push({ type: 'smoke', x: this.x + (Math.random() - 0.5) * r * 0.8, y: this.y - Math.random() * r * 0.5,
                        vx: (Math.random() - 0.5) * 0.9, vy: -0.4 - Math.random() * 0.8, size: r * (0.25 + Math.random() * 0.3),
                        grow: 0.35 + Math.random() * 0.3, alpha: 0.75, decay: 0.006 + Math.random() * 0.006, color: isBig ? '64,30,40' : '55,50,60' });
                }
                cam.hold = { x: this.x, y: this.y }; cam.holdUntil = Date.now() + 1000;

                updateHUD();
            }

            draw(ctx) {
                if (!this.active) return;
                const big = this.weapon.id === 2;
                for (let i = 1; i < this.trail.length; i++) {
                    const a = i / this.trail.length;
                    ctx.globalAlpha = a * 0.85;
                    ctx.strokeStyle = this.weapon.trailColor;
                    ctx.lineWidth = (big ? 7 : 4.5) * a;
                    ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(this.trail[i - 1].x, this.trail[i - 1].y); ctx.lineTo(this.trail[i].x, this.trail[i].y); ctx.stroke();
                }
                ctx.globalAlpha = 1;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const gr = big ? 22 : 16;
                const g = ctx.createRadialGradient(this.x, this.y, 1, this.x, this.y, gr);
                g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.3, this.weapon.color); g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, gr, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                ctx.save();
                ctx.translate(this.x, this.y); ctx.rotate(Math.atan2(this.vy, this.vx));
                ctx.fillStyle = big ? '#7f1d1d' : '#334155'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.ellipse(0, 0, big ? 8 : 6, big ? 4.6 : 3.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = this.weapon.color; ctx.beginPath(); ctx.arc(big ? 5 : 3.5, 0, big ? 3 : 2.2, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        function generateTerrain() {
            const freq1 = (Math.random() * 1.5 + 1.5) * Math.PI / WORLD_WIDTH;
            const freq2 = (Math.random() * 3.0 + 3.0) * Math.PI / WORLD_WIDTH;
            const phase1 = Math.random() * Math.PI * 2;
            const phase2 = Math.random() * Math.PI * 2;
            const baseHeight = WORLD_HEIGHT * 0.62;

            for (let x = 0; x < WORLD_WIDTH; x++) {
                const h1 = Math.sin(x * freq1 + phase1) * 85;
                const h2 = Math.sin(x * freq2 + phase2) * 35;
                const h3 = Math.cos(x * 0.02) * 12;
                gameState.terrain[x] = Math.max(220, Math.min(WORLD_HEIGHT - 60, baseHeight + h1 + h2 + h3));
            }

            gameState.stars = [];
            for (let i = 0; i < 110; i++) {
                gameState.stars.push({
                    x: Math.random() * WORLD_WIDTH,
                    y: Math.random() * (WORLD_HEIGHT * 0.68),
                    r: Math.random() * 1.7 + 0.4,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function startGame(mode) {
            sfx.init();
            if (sfx.bgmEnabled) sfx.startBGM();
            gameState.mode = mode;
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('p2-name').textContent = mode === 'ai' ? 'CPU (AI)' : 'PLAYER 2';
            initMatch();
        }

        function restartGame() {
            document.getElementById('gameover-modal').classList.add('hidden');
            initMatch();
        }

        function showMainMenu() {
            gameState.phase = 'MENU';
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('start-modal').classList.remove('hidden');
        }

        function initMatch() {
            generateTerrain();
            const p1X = 140 + Math.random() * 120;
            const p2X = WORLD_WIDTH - (140 + Math.random() * 120);

            const t1 = new Tank(0, 'PLAYER 1', p1X, '#3b82f6', '#1d4ed8', '#93c5fd', false);
            const t2 = new Tank(1, gameState.mode === 'ai' ? 'CPU (AI)' : 'PLAYER 2', p2X, '#f43f5e', '#be123c', '#fda4af', gameState.mode === 'ai');

            t1.updatePositionOnTerrain();
            t2.updatePositionOnTerrain();

            gameState.tanks = [t1, t2];
            gameState.projectiles = [];
            gameState.particles = [];
            gameState.shockwaves = [];
            gameState.booms = [];
            gameState.craterMarks = [];
            gameState.muzzleFlashes = [];
            gameState.floatingTexts = [];
            gameState.turn = 0;
            gameState.power = 0;

            startTurn(0);
        }

        function startTurn(turnIdx) {
            const p1 = gameState.tanks[0];
            const p2 = gameState.tanks[1];
            if (p1.hp <= 0 || p2.hp <= 0) {
                endGame(p1.hp > 0 ? p1 : p2);
                return;
            }
            gameState.turn = turnIdx;
            const activeTank = gameState.tanks[turnIdx];
            activeTank.fuel = MAX_FUEL;
            gameState.power = 0;

            if (activeTank.isAI) {
                gameState.phase = 'AI_THINKING';
                setControlsEnabled(false);

                updateHUD();
                setTimeout(executeAITurn, 900);
            } else {
                gameState.phase = 'AIMING';
                setControlsEnabled(true);

                updateHUD();
            }
        }

        function endGame(winner) {
            gameState.phase = 'GAMEOVER';
            setControlsEnabled(false);
            const titleEl = document.getElementById('winner-title');
            const descEl = document.getElementById('winner-desc');

            titleEl.textContent = `${winner.name} 승리!`;
            titleEl.className = `title-font text-3xl mb-2 ${winner.id === 0 ? 'text-sky-400' : 'text-rose-400'}`;
            descEl.textContent = winner.id === 0
                ? '정확한 계산과 포격으로 승리를 거머쥐었습니다!'
                : (winner.isAI ? 'AI의 정밀 타격에 패배했습니다. 다시 도전해보세요!' : 'PLAYER 2의 완벽한 승리입니다!');

            if (winner.id === 0) {
                authState.wins += 1;
                localStorage.setItem(LOCAL_WIN_KEY, String(authState.wins));
                updateAuthUI();
                syncWinToServer();
            }

            document.getElementById('gameover-modal').classList.remove('hidden');
        }

        function fireProjectile() {
            const tank = gameState.tanks[gameState.turn];
            if (!tank || gameState.power < 5) return;

            gameState.phase = 'FIRING';
            setControlsEnabled(false);
            tank.lastPower = gameState.power;
            tank.recoil = 1;

            const weapon = WEAPONS[tank.selectedWeapon];
            if (tank.ammo[tank.selectedWeapon] !== Infinity) {
                tank.ammo[tank.selectedWeapon] = Math.max(0, tank.ammo[tank.selectedWeapon] - 1);
            }

            const speed = (gameState.power / 100) * MAX_POWER;
            const baseRad = (-tank.angle * Math.PI) / 180;
            const muzzleX = tank.x + Math.cos(baseRad) * 30;
            const muzzleY = (tank.y - PIVOT_Y) + Math.sin(baseRad) * 30;

            sfx.playShoot(weapon.id);
            gameState.muzzleFlashes.push({ x: muzzleX, y: muzzleY, radius: 22, alpha: 1 });
            for (let i = 0; i < 6; i++) gameState.particles.push({ type: 'smoke', x: muzzleX, y: muzzleY, vx: Math.cos(baseRad) * (1 + Math.random() * 1.5) + (Math.random() - 0.5), vy: Math.sin(baseRad) * (1 + Math.random()) - 0.3, size: 6 + Math.random() * 6, grow: 0.35, alpha: 0.6, decay: 0.012, color: '200,200,210' });
            gameState.screenShake = Math.max(gameState.screenShake, 3);

            if (weapon.id === 1) {
                for (let sp of [-0.07, 0, 0.07]) {
                    const r = baseRad + sp;
                    gameState.projectiles.push(
                        new Projectile(muzzleX, muzzleY, Math.cos(r) * speed, Math.sin(r) * speed, weapon, tank.id)
                    );
                }
            } else {
                gameState.projectiles.push(
                    new Projectile(muzzleX, muzzleY, Math.cos(baseRad) * speed, Math.sin(baseRad) * speed, weapon, tank.id)
                );
            }

            if (tank.ammo[tank.selectedWeapon] === 0) tank.selectedWeapon = 0;
            updateHUD();
        }

        function executeAITurn() {
            if (gameState.phase !== 'AI_THINKING') return;
            const ai = gameState.tanks[1];
            const target = gameState.tanks[0];
            const moveSteps = Math.floor(Math.random() * 15);
            const moveDir = Math.random() < 0.5 ? -1 : 1;
            let stepCount = 0;

            const moveInterval = setInterval(() => {
                if (stepCount < moveSteps && ai.fuel > 10) {
                    ai.move(moveDir);
                    stepCount++;
                } else {
                    clearInterval(moveInterval);
                    aimAndShootAI(ai, target);
                }
            }, 30);
        }

        function aimAndShootAI(ai, target) {
            if (ai.ammo[2] > 0 && Math.random() < 0.45) ai.selectedWeapon = 2;
            else if (ai.ammo[1] > 0 && Math.random() < 0.5) ai.selectedWeapon = 1;
            else ai.selectedWeapon = 0;

            let bestAngle = 135;
            let bestPower = 60;
            let minDist = Infinity;

            for (let testAngle = 115; testAngle <= 155; testAngle += 5) {
                const rad = (-testAngle * Math.PI) / 180;
                for (let testPower = 25; testPower <= 95; testPower += 3) {
                    const speed = (testPower / 100) * MAX_POWER;
                    let simX = ai.x + Math.cos(rad) * 30;
                    let simY = (ai.y - PIVOT_Y) + Math.sin(rad) * 30;
                    let vx = Math.cos(rad) * speed;
                    let vy = Math.sin(rad) * speed;

                    for (let t = 0; t < 180; t++) {
                        vy += GRAVITY;
                        simX += vx;
                        simY += vy;
                        if (simX < 0 || simX >= WORLD_WIDTH) break;
                        const ix = Math.floor(simX);
                        if (simY >= gameState.terrain[ix]) {
                            const d = Math.hypot(simX - target.x, simY - target.y);
                            if (d < minDist) { minDist = d; bestAngle = testAngle; bestPower = testPower; }
                            break;
                        }
                    }
                }
            }

            const errorPower = (Math.random() - 0.5) * 9;
            const errorAngle = (Math.random() - 0.5) * 4;
            ai.angle = Math.max(95, Math.min(175, Math.round(bestAngle + errorAngle)));
            const targetPower = Math.max(15, Math.min(100, bestPower + errorPower));
            updateHUD();

            gameState.power = 0;
            const chargeInterval = setInterval(() => {
                gameState.power += 2.5;
                updatePowerBar();
                if (gameState.power >= targetPower) {
                    clearInterval(chargeInterval);
                    gameState.power = targetPower;
                    fireProjectile();
                }
            }, 25);
        }


        // ===================== 렌더링 =====================
        function updateCamera(W, H) {
            const sFit = Math.max(H / 560, W / WORLD_WIDTH);
            const sCap = Math.max(W / 520, W / WORLD_WIDTH);
            cam.s = Math.min(sFit, sCap);
            cam.vw = W / cam.s; cam.vh = H / cam.s;
            const now = Date.now();
            const act = gameState.tanks[gameState.turn];
            const opp = gameState.tanks[(gameState.turn + 1) % 2];
            const proj = gameState.projectiles.find((p) => p.active);
            let fx = WORLD_WIDTH / 2, fy = 420;
            if (proj) { fx = proj.x + proj.vx * 10; fy = proj.y; }
            else if (cam.hold && now < cam.holdUntil) { fx = cam.hold.x; fy = cam.hold.y; }
            else if (act) {
                const dir = opp ? (Math.sign(opp.x - act.x) || 1) : 1;
                fx = act.x + dir * cam.vw * 0.2; fy = act.y - 70;
            }
            let tx = cam.vw >= WORLD_WIDTH ? (WORLD_WIDTH - cam.vw) / 2 : clamp(fx - cam.vw / 2, 0, WORLD_WIDTH - cam.vw);
            const maxY = WORLD_HEIGHT - cam.vh;
            const ty = cam.vh >= WORLD_HEIGHT ? maxY : clamp(fy - cam.vh * 0.55, Math.min(-240, maxY), maxY);
            if (!cam.inited || gameState.phase === 'MENU') { cam.x = tx; cam.y = ty; cam.inited = true; }
            if (now < cam.manualUntil && !proj) tx = cam.x;
            const k = proj ? 0.14 : 0.07;
            cam.x += (tx - cam.x) * k;
            cam.y += (ty - cam.y) * k;
        }

        function drawBackground(W, H) {
            const sky = ART.sky;
            if (sky) {
                const ar = sky.width / sky.height;
                let dh = Math.max(H * 1.12, (W * 1.12) / ar), dw = dh * ar;
                const span = Math.max(1, WORLD_WIDTH - cam.vw);
                const ox = -(dw - W) * clamp(cam.x / span, 0, 1);
                const oy = -(dh - H) * clamp(0.75 + cam.y / 2400, 0, 1);
                ctx.drawImage(sky, ox, oy, dw, dh);
            } else {
                const g = ctx.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, '#0b1026'); g.addColorStop(0.55, '#2a1f5c'); g.addColorStop(1, '#f97316');
                ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            }
        }

        function drawHills() {
            const hills = ART.hills;
            if (!hills) return;
            const tw = 1300, th = tw * hills.height / hills.width;
            const par = 0.45, base = cam.x * par;
            const y = 620 - th;
            const k0 = Math.floor((cam.x - base) / tw) - 1, k1 = Math.ceil((cam.x + cam.vw - base) / tw);
            for (let k = k0; k <= k1; k++) {
                const x = base + k * tw;
                ctx.save();
                if (k & 1) { ctx.translate(x + tw, y); ctx.scale(-1, 1); ctx.drawImage(hills, 0, 0, tw + 1, th); }
                else ctx.drawImage(hills, x, y, tw + 1, th);
                ctx.restore();
            }
            const haze = ctx.createLinearGradient(0, y + th * 0.2, 0, WORLD_HEIGHT);
            haze.addColorStop(0, 'rgba(10, 14, 40, 0)'); haze.addColorStop(1, 'rgba(10, 14, 40, 0.55)');
            ctx.fillStyle = haze; ctx.fillRect(cam.x - 10, y, cam.vw + 20, WORLD_HEIGHT - y + 300);
        }

        function terrainPath(x0, x1, bottom) {
            ctx.beginPath();
            ctx.moveTo(x0, bottom);
            for (let x = x0; x <= x1; x += 2) ctx.lineTo(x, gameState.terrain[x]);
            ctx.lineTo(x1, gameState.terrain[x1]);
            ctx.lineTo(x1, bottom);
            ctx.closePath();
        }

        function drawTerrain() {
            const x0 = Math.max(0, Math.floor(cam.x) - 4), x1 = Math.min(WORLD_WIDTH - 1, Math.ceil(cam.x + cam.vw) + 4);
            const bottom = WORLD_HEIGHT + 400;
            terrainPath(x0, x1, bottom);
            if (ART.soilPat) {
                ART.soilPat.setTransform(new DOMMatrix([0.42, 0, 0, 0.42, 0, 0]));
                ctx.fillStyle = ART.soilPat;
            } else {
                const gg = ctx.createLinearGradient(0, 220, 0, WORLD_HEIGHT);
                gg.addColorStop(0, '#573b26'); gg.addColorStop(1, '#1c1917');
                ctx.fillStyle = gg;
            }
            ctx.fill();
            ctx.save();
            ctx.clip();
            // 깊이감: 아래로 갈수록 어둡게
            const dg = ctx.createLinearGradient(0, 300, 0, WORLD_HEIGHT);
            dg.addColorStop(0, 'rgba(0,0,0,0)'); dg.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = dg; ctx.fillRect(x0, 200, x1 - x0, bottom);
            // 포격 그을음
            for (const c of gameState.craterMarks) {
                if (c.x + c.r < x0 || c.x - c.r > x1) continue;
                const sg = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, c.r);
                sg.addColorStop(0, 'rgba(20,10,5,0.55)'); sg.addColorStop(0.7, 'rgba(30,15,8,0.3)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
            }
            // 지표 아래 그림자 띠
            ctx.strokeStyle = 'rgba(25, 12, 4, 0.45)'; ctx.lineWidth = 18; ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let x = x0; x <= x1; x += 2) { if (x === x0) ctx.moveTo(x, gameState.terrain[x] + 6); else ctx.lineTo(x, gameState.terrain[x] + 6); }
            ctx.stroke();
            ctx.restore();
            // 잔디 가장자리
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.beginPath();
            for (let x = x0; x <= x1; x += 2) { if (x === x0) ctx.moveTo(x, gameState.terrain[x]); else ctx.lineTo(x, gameState.terrain[x]); }
            ctx.strokeStyle = '#166534'; ctx.lineWidth = 9; ctx.stroke();
            ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 5; ctx.stroke();
            ctx.save(); ctx.translate(0, -2);
            ctx.strokeStyle = 'rgba(187, 247, 208, 0.55)'; ctx.lineWidth = 1.6; ctx.stroke();
            ctx.restore();
        }

        function drawEffects() {
            const now = Date.now();
            for (let i = gameState.muzzleFlashes.length - 1; i >= 0; i--) {
                const mf = gameState.muzzleFlashes[i];
                mf.alpha -= 0.12;
                if (mf.alpha <= 0) { gameState.muzzleFlashes.splice(i, 1); continue; }
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = mf.alpha;
                const g = ctx.createRadialGradient(mf.x, mf.y, 2, mf.x, mf.y, mf.radius * 1.4);
                g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#fde047'); g.addColorStop(1, 'rgba(249, 115, 22, 0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mf.x, mf.y, mf.radius * 1.4, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            // 연기 (화염 뒤)
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const p = gameState.particles[i];
                if (p.type !== 'smoke') continue;
                p.x += p.vx; p.y += p.vy; p.vy *= 0.985; p.size += p.grow; p.alpha -= p.decay;
                if (p.alpha <= 0) { gameState.particles.splice(i, 1); continue; }
                const sg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                sg.addColorStop(0, `rgba(${p.color},${(p.alpha * 0.55).toFixed(3)})`); sg.addColorStop(1, `rgba(${p.color},0)`);
                ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }

            // 화염 스프라이트
            for (let i = gameState.booms.length - 1; i >= 0; i--) {
                const b = gameState.booms[i];
                const strip = b.big ? (ART.boomBig || ART.boom) : ART.boom;
                const dur = b.big ? 1150 : 850;
                const k = (now - b.t0) / dur;
                if (k >= 1) { gameState.booms.splice(i, 1); continue; }
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                if (strip) {
                    const fw = strip.width / STRIP_N, f = Math.min(STRIP_N - 1, Math.floor(k * STRIP_N));
                    const size = b.r * (b.big ? 4.4 : 3.6);
                    ctx.drawImage(strip, f * fw, 0, fw, strip.height, b.x - size / 2, b.y - size * 0.58, size, size);
                } else {
                    const rr = b.r * (0.6 + k);
                    const g = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, rr);
                    g.addColorStop(0, `rgba(255,255,220,${1 - k})`); g.addColorStop(0.4, `rgba(251,146,60,${0.9 * (1 - k)})`); g.addColorStop(1, 'rgba(239,68,68,0)');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }

            for (let i = gameState.shockwaves.length - 1; i >= 0; i--) {
                const sw = gameState.shockwaves[i];
                sw.radius += (sw.maxRadius - sw.radius) * 0.2;
                sw.alpha -= 0.05;
                if (sw.alpha <= 0) { gameState.shockwaves.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = sw.alpha;
                ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 5 * sw.alpha + 1;
                ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); ctx.stroke();
                ctx.strokeStyle = sw.color; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius * 0.92, 0, Math.PI * 2); ctx.stroke();
                ctx.restore();
            }

            // 불꽃 · 흙 파편
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const p = gameState.particles[i];
                if (p.type === 'smoke') continue;
                if (p.type === 'debris') {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.24; p.vx *= 0.99; p.rot += p.vr; p.alpha -= p.decay;
                    const ix = Math.floor(p.x);
                    if (ix >= 0 && ix < WORLD_WIDTH && p.y > gameState.terrain[ix]) { p.y = gameState.terrain[ix]; p.vy *= -0.35; p.vx *= 0.6; p.vr *= 0.5; }
                    if (p.alpha <= 0) { gameState.particles.splice(i, 1); continue; }
                    ctx.save(); ctx.globalAlpha = Math.min(1, p.alpha * 1.5);
                    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.8);
                    ctx.restore();
                    continue;
                }
                p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha -= p.decay;
                if (p.alpha <= 0) { gameState.particles.splice(i, 1); continue; }
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + p.alpha * 0.5), 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
            ctx.globalAlpha = 1;

            for (let i = gameState.floatingTexts.length - 1; i >= 0; i--) {
                const ft = gameState.floatingTexts[i];
                ft.y += ft.vy; ft.vy *= 0.97;
                ft.alpha -= 0.014;
                if (ft.alpha <= 0) { gameState.floatingTexts.splice(i, 1); continue; }
                ctx.globalAlpha = Math.min(1, ft.alpha * 1.6);
                ctx.font = '900 26px "Black Han Sans", "Noto Sans KR", sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1;
        }

        // 화면 고정 요소: 섬광 · 화면 밖 탱크 표시 · 미니맵
        function drawScreenOverlay(W, H) {
            if (gameState.flash > 0.01) {
                ctx.save(); ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = `rgba(255, 200, 140, ${(gameState.flash * 0.32).toFixed(3)})`; ctx.fillRect(0, 0, W, H);
                ctx.restore();
                gameState.flash *= 0.88;
            }
            if (gameState.phase === 'MENU' || !gameState.tanks.length) return;
            const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.8);
            vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.35)');
            ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

            const topPad = document.getElementById('hud').offsetHeight + 4;
            for (const t of gameState.tanks) {
                if (t.hp <= 0) continue;
                const sx = (t.x - cam.x) * cam.s;
                if (sx > -10 && sx < W + 10) continue;
                const left = sx < 0;
                const sy = clamp((t.y - PIVOT_Y - cam.y) * cam.s, topPad + 30, H - 30);
                const ex = left ? 22 : W - 22;
                ctx.save();
                ctx.translate(ex, sy);
                const col = t.id === 0 ? '#38bdf8' : '#fb7185';
                ctx.fillStyle = 'rgba(2,6,23,0.8)'; ctx.strokeStyle = col; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = col;
                ctx.beginPath();
                if (left) { ctx.moveTo(-23, 0); ctx.lineTo(-15, -7); ctx.lineTo(-15, 7); } else { ctx.moveTo(23, 0); ctx.lineTo(15, -7); ctx.lineTo(15, 7); }
                ctx.fill();
                ctx.font = '900 10px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(t.id === 0 ? 'P1' : 'P2', 0, -4);
                ctx.fillStyle = '#e2e8f0'; ctx.font = '800 8.5px Inter, sans-serif';
                const dist = Math.round(Math.abs(t.x - (cam.x + cam.vw / 2)) / 10);
                ctx.fillText(`${dist}m`, 0, 7);
                ctx.restore();
            }

            // 미니맵
            const mw = Math.min(200, Math.max(96, Math.min(W * 0.3, H * 0.55))), mh = mw * 0.2;
            const mx = (W - mw) / 2, my = topPad;
            ctx.save();
            ctx.fillStyle = 'rgba(8,12,32,0.72)'; ctx.strokeStyle = 'rgba(148,163,184,0.35)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.roundRect(mx - 4, my - 3, mw + 8, mh + 6, 8); ctx.fill(); ctx.stroke();
            const sxm = mw / WORLD_WIDTH, sym = mh / WORLD_HEIGHT;
            ctx.beginPath(); ctx.moveTo(mx, my + mh);
            for (let x = 0; x < WORLD_WIDTH; x += 12) ctx.lineTo(mx + x * sxm, my + gameState.terrain[x] * sym);
            ctx.lineTo(mx + mw, my + mh); ctx.closePath();
            ctx.fillStyle = 'rgba(74, 222, 128, 0.45)'; ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
            ctx.strokeRect(mx + Math.max(0, cam.x) * sxm, my + Math.max(0, cam.y) * sym, Math.min(WORLD_WIDTH, cam.vw) * sxm, Math.min(mh / sym, cam.vh) * sym);
            for (const t of gameState.tanks) {
                if (t.hp <= 0) continue;
                ctx.fillStyle = t.id === 0 ? '#38bdf8' : '#fb7185';
                ctx.beginPath(); ctx.arc(mx + t.x * sxm, my + (t.y - 8) * sym, 3, 0, Math.PI * 2); ctx.fill();
            }
            for (const p of gameState.projectiles) {
                if (!p.active) continue;
                ctx.fillStyle = '#fde047';
                ctx.beginPath(); ctx.arc(mx + clamp(p.x, 0, WORLD_WIDTH) * sxm, my + clamp(p.y, 0, WORLD_HEIGHT) * sym, 2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }


        const FIXED_STEP_MS = 1000 / 60;
        const POWER_CHARGE_SPEED = 38; // 초당 38% (5%→100% 약 2.5초, 모든 모니터 주사율 동일)
        let lastFrameTime = 0;
        let stepAccumulator = 0;

        function updateCharging(dtSec) {
            if (gameState.phase !== 'CHARGING') return;
            gameState.power += gameState.powerDir * POWER_CHARGE_SPEED * dtSec;
            if (gameState.power >= 100) { gameState.power = 100; gameState.powerDir = -1; }
            else if (gameState.power <= 5) { gameState.power = 5; gameState.powerDir = 1; }
            updatePowerBar();
            const now = Date.now();
            if (now - gameState.lastTickTime > 90) {
                sfx.playChargeTick(gameState.power / 100);
                gameState.lastTickTime = now;
            }
        }

        function update() {
            if (gameState.screenShake > 0) gameState.screenShake = Math.max(0, gameState.screenShake - 0.6);
            if (gameState.phase === 'MENU' || gameState.phase === 'GAMEOVER') return;

            const activeTank = gameState.tanks[gameState.turn];
            if (gameState.phase === 'AIMING' && activeTank && !activeTank.isAI) {
                if (gameState.keys['ArrowLeft'] || gameState.buttonHold === 'left') { activeTank.move(-1); updateHUD(); }
                if (gameState.keys['ArrowRight'] || gameState.buttonHold === 'right') { activeTank.move(1); updateHUD(); }
                if (gameState.keys['ArrowUp'] || gameState.buttonHold === 'up') { activeTank.adjustAngle(1); updateHUD(); }
                if (gameState.keys['ArrowDown'] || gameState.buttonHold === 'down') { activeTank.adjustAngle(-1); updateHUD(); }
            }

            if (gameState.phase === 'FIRING') {
                let anyActive = false;
                for (let proj of gameState.projectiles) {
                    if (proj.active) { proj.update(); anyActive = true; }
                }
                if (!anyActive && gameState.particles.length < 8) {
                    gameState.projectiles = [];
                    startTurn((gameState.turn + 1) % 2);
                }
            }
        }

        function render() {
            const rect = canvas.getBoundingClientRect();
            const W = rect.width, H = rect.height;
            if (W <= 0 || H <= 0) return;
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            const cw = Math.round(W * dpr), ch = Math.round(H * dpr);
            if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }

            updateCamera(W, H);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawBackground(W, H);

            let shx = 0, shy = 0;
            if (gameState.screenShake > 0) { shx = (Math.random() - 0.5) * gameState.screenShake; shy = (Math.random() - 0.5) * gameState.screenShake; }
            const s = cam.s;
            ctx.setTransform(dpr * s, 0, 0, dpr * s, (-cam.x * s + shx) * dpr, (-cam.y * s + shy) * dpr);
            drawHills();
            drawTerrain();
            for (let tank of gameState.tanks) { if (tank.hp > 0) tank.draw(ctx); }
            for (let proj of gameState.projectiles) proj.draw(ctx);
            drawEffects();

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawScreenOverlay(W, H);
        }

        // 전장 드래그로 둘러보기
        (() => {
            let dragging = false, lastX = 0;
            canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
            canvas.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - lastX; lastX = e.clientX;
                if (Math.abs(dx) < 0.5) return;
                cam.x = cam.vw >= WORLD_WIDTH ? cam.x : clamp(cam.x - dx / cam.s, 0, WORLD_WIDTH - cam.vw);
                cam.manualUntil = Date.now() + 2500;
            });
            const end = () => { dragging = false; canvas.style.cursor = 'grab'; };
            canvas.addEventListener('pointerup', end);
            canvas.addEventListener('pointercancel', end);
        })();

        function gameLoop(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const rawDeltaMs = Math.min(100, Math.max(0, timestamp - lastFrameTime));
            lastFrameTime = timestamp;

            updateCharging(rawDeltaMs / 1000);

            stepAccumulator += rawDeltaMs;
            while (stepAccumulator >= FIXED_STEP_MS) {
                update();
                stepAccumulator -= FIXED_STEP_MS;
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            if (gameState.tanks.length < 2) return;
            const p1 = gameState.tanks[0];
            const p2 = gameState.tanks[1];
            const active = gameState.tanks[gameState.turn];

            document.getElementById('p1-hp-text').textContent = p1.hp;
            document.getElementById('p1-hp-bar').style.width = `${p1.hp}%`;
            document.getElementById('p2-hp-text').textContent = p2.hp;
            document.getElementById('p2-hp-bar').style.width = `${p2.hp}%`;

            const turnEl = document.getElementById('turn-indicator');
            const shortTxt = window.innerWidth < 520;
            turnEl.textContent = gameState.turn === 0 ? (shortTxt ? 'P1 TURN' : 'PLAYER 1 TURN') : (p2.isAI ? (shortTxt ? 'CPU TURN' : 'CPU (AI) TURN') : (shortTxt ? 'P2 TURN' : 'PLAYER 2 TURN'));
            turnEl.className = gameState.turn === 0 ? 'p1' : 'p2';
            document.getElementById('p1card').classList.toggle('on', gameState.turn === 0);
            document.getElementById('p2card').classList.toggle('on', gameState.turn === 1);

            document.getElementById('angle-display').textContent = `${active.angle}°`;
            document.getElementById('fuel-bar').style.width = `${active.fuel}%`;
            document.getElementById('fuel-text').textContent = `${Math.round(active.fuel)}%`;

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`wp-${i}`);
                if (active.selectedWeapon === i) btn.classList.add('active');
                else btn.classList.remove('active');
                if (i > 0) {
                    const countEl = document.getElementById(`wp-${i}-count`);
                    countEl.textContent = `${active.ammo[i]}발`;
                    btn.disabled = active.ammo[i] <= 0;
                    btn.style.opacity = active.ammo[i] <= 0 ? '0.4' : '1';
                }
            }

            const marker = document.getElementById('last-power-marker');
            if (active.lastPower > 0) {
                marker.classList.remove('hidden');
                marker.style.left = `${active.lastPower}%`;
            } else {
                marker.classList.add('hidden');
            }
            updateVipAssistUI();
            updatePowerBar();
        }

        let currentVipSolution = null;
        let vipSensorEnabled = false;

        function calculatePowerForAngle(shooter, target, angleDeg) {
            if (!shooter || !target || target.hp <= 0) return null;
            const rad = (-angleDeg * Math.PI) / 180;
            let bestPower = 50;
            let minDist = Infinity;

            for (let p = 5; p <= 100; p += 0.5) {
                const speed = (p / 100) * MAX_POWER;
                let sx = shooter.x + Math.cos(rad) * 30;
                let sy = (shooter.y - PIVOT_Y) + Math.sin(rad) * 30;
                let vx = Math.cos(rad) * speed;
                let vy = Math.sin(rad) * speed;

                for (let frame = 0; frame < 240; frame++) {
                    vy += GRAVITY;
                    for (let s = 0; s < 4; s++) {
                        sx += vx / 4;
                        sy += vy / 4;
                        if (sx < 0 || sx >= WORLD_WIDTH) break;
                        const dTank = Math.hypot(sx - target.x, sy - (target.y - HIT_Y));
                        if (dTank < HIT_R - 2) {
                            return { angle: angleDeg, power: Math.round(p), dist: 0 };
                        }
                        const ix = Math.floor(sx);
                        if (ix >= 0 && ix < WORLD_WIDTH && sy >= gameState.terrain[ix]) {
                            const d = Math.hypot(sx - target.x, sy - (target.y - HIT_Y));
                            if (d < minDist) {
                                minDist = d;
                                bestPower = Math.round(p);
                            }
                            frame = 240;
                            break;
                        }
                    }
                }
            }
            return { angle: angleDeg, power: bestPower, dist: minDist };
        }

        function updateVipSensorButtonStyle() {
            const btn = document.getElementById('vip-sensor-btn');
            if (!btn) return;
            btn.classList.remove('on', 'lock');
            if (!authState.isVip) {
                btn.innerHTML = '🔒 VIP<br>자동센서';
                btn.classList.add('lock');
                return;
            }
            btn.innerHTML = vipSensorEnabled ? '👑 센서<br>ON' : '👑 센서<br>OFF';
            if (vipSensorEnabled) btn.classList.add('on');
        }

        function calculateVipSolution(shooter, target) {
            if (!shooter || !target || target.hp <= 0) return null;
            const toRight = target.x >= shooter.x;
            const angleMin = toRight ? 15 : 100;
            const angleMax = toRight ? 80 : 165;

            let best = null;
            let minDist = Infinity;

            const simulate = (angleDeg, powerPct) => {
                const rad = (-angleDeg * Math.PI) / 180;
                const speed = (powerPct / 100) * MAX_POWER;
                let sx = shooter.x + Math.cos(rad) * 30;
                let sy = (shooter.y - PIVOT_Y) + Math.sin(rad) * 30;
                let vx = Math.cos(rad) * speed;
                let vy = Math.sin(rad) * speed;

                for (let frame = 0; frame < 220; frame++) {
                    vy += GRAVITY;
                    for (let s = 0; s < 4; s++) {
                        sx += vx / 4;
                        sy += vy / 4;
                        if (sx < 0 || sx >= WORLD_WIDTH) return Infinity;
                        const dTank = Math.hypot(sx - target.x, sy - (target.y - HIT_Y));
                        if (dTank < HIT_R - 2) return 0;
                        const ix = Math.floor(sx);
                        if (ix >= 0 && ix < WORLD_WIDTH && sy >= gameState.terrain[ix]) {
                            return Math.hypot(sx - target.x, sy - (target.y - HIT_Y));
                        }
                    }
                }
                return Infinity;
            };

            for (let a = angleMin; a <= angleMax; a += 3) {
                for (let p = 15; p <= 100; p += 2) {
                    const d = simulate(a, p);
                    if (d < minDist) {
                        minDist = d;
                        best = { angle: a, power: p };
                        if (d === 0) break;
                    }
                }
                if (minDist === 0) break;
            }

            if (best) {
                const baseA = best.angle;
                const baseP = best.power;
                for (let a = Math.max(0, baseA - 3); a <= Math.min(180, baseA + 3); a += 1) {
                    for (let p = Math.max(5, baseP - 2); p <= Math.min(100, baseP + 2); p += 1) {
                        const d = simulate(a, p);
                        if (d < minDist) {
                            minDist = d;
                            best = { angle: a, power: p };
                        }
                    }
                }
            }
            return best;
        }

        function updateVipAssistUI() {
            updateVipSensorButtonStyle();
            const badge = document.getElementById('vip-assist-badge');
            const vipMarker = document.getElementById('vip-power-marker');
            const targetLabel = document.getElementById('vip-target-power-label');
            if (!badge || !vipMarker) return;

            const active = gameState.tanks[gameState.turn];
            const opponent = gameState.tanks[(gameState.turn + 1) % 2];
            const showAssist = authState.isVip && vipSensorEnabled && active && !active.isAI && opponent && opponent.hp > 0 && (gameState.phase === 'AIMING' || gameState.phase === 'CHARGING');

            if (!showAssist) {
                badge.classList.add('hidden');
                vipMarker.classList.add('hidden');
                if (targetLabel) targetLabel.classList.add('hidden');
                currentVipSolution = null;
                return;
            }

            currentVipSolution = calculatePowerForAngle(active, opponent, active.angle);

            if (currentVipSolution) {
                badge.textContent = `👑 VIP 센서 · ${currentVipSolution.angle}° → 파워 ${currentVipSolution.power}%`;
                badge.classList.remove('hidden');
                vipMarker.style.left = `${Math.max(2, Math.min(98, currentVipSolution.power))}%`;
                vipMarker.classList.remove('hidden');
                if (targetLabel) {
                    targetLabel.textContent = `목표 ${currentVipSolution.power}%`;
                    targetLabel.classList.remove('hidden');
                }
            } else {
                badge.classList.add('hidden');
                vipMarker.classList.add('hidden');
                if (targetLabel) targetLabel.classList.add('hidden');
            }
        }

        document.getElementById('vip-sensor-btn')?.addEventListener('click', () => {
            if (!authState.isVip) {
                vipSensorEnabled = false;
                updateVipAssistUI();
                showToast('🔒 VIP 유저만 사용 가능합니다. (VIP 가입 후 이용 가능)');
                return;
            }
            vipSensorEnabled = !vipSensorEnabled;
            updateVipAssistUI();
            showToast(vipSensorEnabled ? '👑 VIP자동센서 ON: 포물선 예측 및 파워 게이지 표시!' : '👑 VIP자동센서 OFF');
        });

        document.getElementById('vip-assist-badge').addEventListener('click', () => {
            if (!authState.isVip || !currentVipSolution || gameState.phase !== 'AIMING') return;
            const active = gameState.tanks[gameState.turn];
            if (!active || active.isAI) return;
            active.angle = currentVipSolution.angle;
            active.facing = active.angle < 90 ? 1 : -1;
            updateHUD();
            showToast(`👑 각도 ${currentVipSolution.angle}° 맞춤 완료! 파워 ${currentVipSolution.power}% 눈금에서 발사하세요!`);
        });

        function updatePowerBar() {
            const p = Math.round(gameState.power);
            document.getElementById('power-bar').style.width = `${p}%`;
            document.getElementById('power-text').textContent = `${p}%`;
            const container = document.getElementById('power-container');
            if (container) {
                const isNearTarget = gameState.phase === 'CHARGING' && authState.isVip && vipSensorEnabled && currentVipSolution && Math.abs(p - currentVipSolution.power) <= 2;
                container.style.borderColor = isNearTarget ? '#fde047' : '';
            }
        }

        function setControlsEnabled(enabled) {
            ['btn-left', 'btn-right', 'btn-up', 'btn-down', 'btn-fire', 'wp-0', 'wp-1', 'wp-2'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = !enabled;
            });
        }

        function selectWeapon(idx) {
            if (gameState.phase !== 'AIMING') return;
            const active = gameState.tanks[gameState.turn];
            if (active.ammo[idx] <= 0) return;
            active.selectedWeapon = idx;
            updateHUD();
        }

        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('toast-msg');
            el.textContent = msg;
            el.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2300);
        }

        window.addEventListener('keydown', (e) => {
            gameState.keys[e.code] = true;
            if (e.code === 'Space' && gameState.phase === 'AIMING') { e.preventDefault(); startCharging(); }
            if (e.code === 'Digit1') selectWeapon(0);
            if (e.code === 'Digit2') selectWeapon(1);
            if (e.code === 'Digit3') selectWeapon(2);
        });

        window.addEventListener('keyup', (e) => {
            gameState.keys[e.code] = false;
            if (e.code === 'Space' && gameState.phase === 'CHARGING') { e.preventDefault(); releaseFire(); }
        });

        function bindHoldButton(id, actionName) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); if (!btn.disabled) gameState.buttonHold = actionName; };
            const end = () => { if (gameState.buttonHold === actionName) gameState.buttonHold = null; };
            btn.addEventListener('mousedown', start);
            btn.addEventListener('touchstart', start, { passive: false });
            window.addEventListener('mouseup', end);
            window.addEventListener('touchend', end);
        }

        bindHoldButton('btn-left', 'left');
        bindHoldButton('btn-right', 'right');
        bindHoldButton('btn-up', 'up');
        bindHoldButton('btn-down', 'down');

        function startCharging() {
            if (gameState.phase !== 'AIMING') return;
            gameState.phase = 'CHARGING';
            gameState.power = 5;
            gameState.powerDir = 1;
            document.getElementById('power-container').classList.add('charging-glow');
        }

        function releaseFire() {
            if (gameState.phase !== 'CHARGING') return;
            document.getElementById('power-container').classList.remove('charging-glow');
            fireProjectile();
        }

        const fireBtn = document.getElementById('btn-fire');
        fireBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startCharging(); });
        fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startCharging(); }, { passive: false });
        window.addEventListener('mouseup', () => { if (gameState.phase === 'CHARGING') releaseFire(); });
        window.addEventListener('touchend', () => { if (gameState.phase === 'CHARGING') releaseFire(); });

        function refreshSoundButtons() {
            const bgmBtn = document.getElementById('bgmToggleBtn');
            const sfxBtn = document.getElementById('soundToggleBtn');
            if (bgmBtn) { bgmBtn.querySelector('.st').textContent = sfx.bgmEnabled ? '켜짐' : '꺼짐'; bgmBtn.classList.toggle('off', !sfx.bgmEnabled); }
            if (sfxBtn) { sfxBtn.querySelector('.st').textContent = !sfx.muted ? '켜짐' : '꺼짐'; sfxBtn.classList.toggle('off', sfx.muted); }
        }
        (() => {
            const panel = document.getElementById('menuPanel');
            document.getElementById('menuToggle').addEventListener('click', (e) => { e.stopPropagation(); panel.classList.toggle('hidden'); });
            document.addEventListener('click', (e) => { if (!panel.contains(e.target) && e.target.id !== 'menuToggle') panel.classList.add('hidden'); });
            ['menu-btn', 'headerExitLobbyBtn'].forEach((id) => document.getElementById(id).addEventListener('click', () => panel.classList.add('hidden')));
        })();
        refreshSoundButtons();

        document.getElementById('bgmToggleBtn').addEventListener('click', () => {
            sfx.toggleBGM();
            refreshSoundButtons();
            showToast(sfx.bgmEnabled ? '🎵 배경음이 켜졌습니다.' : '🔇 배경음이 꺼졌습니다.');
        });
        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            sfx.toggleMute();
            refreshSoundButtons();
            showToast(!sfx.muted ? '🔊 효과음이 켜졌습니다.' : '🔇 효과음이 꺼졌습니다.');
        });
        document.getElementById('menu-btn').addEventListener('click', () => showMainMenu());
        document.getElementById('headerExitLobbyBtn').addEventListener('click', () => {
            sfx.stopBGM();
            window.location.href = 'https://02826k.github.io/aigameroom/';
        });

        window.onload = function() {
            generateTerrain();
            restoreAuthSession();
            refreshSoundButtons();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
