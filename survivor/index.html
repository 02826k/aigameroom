<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>좀비 서바이벌 — AI게임장</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; max-width: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: #020617;
      color: #f1f5f9;
      height: 100dvh;
    }
    canvas { touch-action: none; }
    .hidden { display: none !important; }
    #fullscreenMain:fullscreen {
      max-width: 100% !important;
      width: 100vw !important;
      height: 100dvh !important;
      background: #020617 !important;
      padding: 8px !important;
      gap: 6px !important;
      overflow: hidden !important;
    }
    #fullscreenMain:fullscreen #arenaWrap {
      flex: 1 1 0% !important;
      min-height: 0 !important;
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] select-none">

  <!-- 상단 통합 헤더 -->
  <header class="border-b border-slate-800/80 bg-slate-900/95 backdrop-blur px-3 sm:px-4 py-1.5 shrink-0 z-30">
    <div class="max-w-md mx-auto flex flex-col gap-1">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="w-7 h-7 rounded-xl bg-gradient-to-br from-rose-500/30 to-orange-600/30 border border-rose-400/40 flex items-center justify-center text-sm shrink-0">☣️</span>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-50 truncate">좀비 서바이벌</h1>
          <button id="autoDodgeBtn" type="button" class="hidden px-2 py-0.5 rounded-lg bg-emerald-600 border border-emerald-400 text-white text-[10px] font-black shadow transition active:scale-95 cursor-pointer shrink-0">
            🛡️ 자동회피: ON
          </button>
        </div>
        <button id="authHeaderBtn" type="button" class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0">
          로그인
        </button>
      </div>
      <div class="flex items-center justify-end gap-1.5 text-[11px] border-t border-slate-800/60 pt-1">
        <button id="bgmToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap">
          🎵 배경음 ON
        </button>
        <button id="soundToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap">
          🔊 효과음 ON
        </button>
        <button id="headerExitLobbyBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition active:scale-95 cursor-pointer whitespace-nowrap">
          나가기
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 게임 플레이 영역 -->
  <main id="fullscreenMain" class="flex-1 min-h-0 max-w-md w-full mx-auto px-2.5 py-1.5 flex flex-col gap-1.5">
    <!-- 게임 상태바 + RANK / 전체화면 버튼 -->
    <section class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl px-3 py-1.5 flex items-center justify-between gap-2 shadow-xl shrink-0 z-20">
      <div class="shrink-0">
        <div class="text-[10px] font-bold text-slate-400">Lv.<span id="levelVal" class="text-amber-400 text-xs sm:text-sm font-black">1</span></div>
        <div class="w-16 sm:w-20 h-1.5 bg-slate-800 rounded-full overflow-hidden mt-1">
          <div id="expBar" class="h-full bg-amber-400 transition-all duration-200" style="width: 0%"></div>
        </div>
      </div>

      <div class="text-center min-w-0">
        <div class="text-[10px] font-bold text-rose-400">STAGE <span id="stageVal" class="text-xs sm:text-sm font-black text-white">1</span></div>
        <div id="stageGoalVal" class="text-[10px] sm:text-[11px] font-bold text-emerald-400 truncate">처치: 0 / 15</div>
      </div>

      <div class="text-right shrink-0">
        <div class="text-[10px] font-bold text-slate-400">점수</div>
        <div id="scoreVal" class="text-xs sm:text-sm font-black text-purple-400 tabular-nums">0</div>
      </div>

      <div class="flex items-center gap-1 shrink-0">
        <button id="rankOpenBtn" type="button" class="px-2 py-1.5 rounded-lg text-[10px] sm:text-[11px] font-black bg-slate-800 hover:bg-slate-700 border border-rose-400/50 text-rose-300 cursor-pointer active:scale-95 transition">
          🏆 RANK
        </button>
        <button id="fullscreenBtn" type="button" class="px-2 py-1.5 rounded-lg text-[10px] sm:text-[11px] font-black bg-gradient-to-r from-rose-500 to-orange-500 text-white cursor-pointer active:scale-95 transition">
          ⛶ 전체화면
        </button>
      </div>
    </section>

    <!-- 게임 캔버스 아레나 -->
    <div id="arenaWrap" class="relative w-full flex-1 min-h-0 bg-slate-950 border-2 border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center">
      <canvas id="gameCanvas" class="w-full h-full block"></canvas>

      <!-- 보스 경고 배너 -->
      <div id="bossAlert" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-rose-600/95 border border-rose-300 px-4 py-1.5 rounded-full text-xs font-black text-white shadow-lg animate-bounce z-20">
        ⚠️ STAGE BOSS 출현!
      </div>

      <!-- 스테이지 클리어 배너 -->
      <div id="stageClearAlert" class="hidden absolute inset-0 bg-emerald-950/75 backdrop-blur-sm flex flex-col items-center justify-center z-20">
        <div class="text-2xl font-black text-emerald-300">STAGE CLEAR!</div>
        <div id="nextStageText" class="text-xs text-slate-200 mt-1">다음 스테이지로 이동합니다...</div>
      </div>

      <!-- 시작 / 게임오버 오버레이 -->
      <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center gap-4 p-6 text-center z-30">
        <div class="text-4xl">🔫🧟‍♀️</div>
        <h2 id="overlayTitle" class="text-2xl font-black text-rose-500">좀비 서바이벌</h2>
        <p id="overlayDesc" class="text-xs text-slate-300 leading-relaxed">
          몰려오는 좀비 웨이브를 뚫고<br/>스테이지 보스를 처치하여 다음 구역으로 돌파하세요!
        </p>
        <button id="startBtn" type="button" class="px-8 py-3 rounded-xl bg-gradient-to-r from-rose-600 to-orange-500 text-white font-black text-sm shadow-lg shadow-rose-500/30 transition active:scale-95 cursor-pointer">
          전투 시작
        </button>
      </div>

      <!-- 레벨업 업그레이드 선택 팝업 -->
      <div id="upgradeModal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center gap-3 p-5 text-center z-40 hidden">
        <h2 class="text-lg font-black text-amber-300">🎉 레벨 업! 무기 및 능력 강화</h2>
        <div id="upgradeOptions" class="flex flex-col gap-2.5 w-full max-w-xs mt-2"></div>
      </div>
    </div>
  </main>

  <!-- 상단 토스트 알림 -->
  <div id="toastBox" class="pointer-events-none fixed top-3 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 -translate-y-2">
    <div id="toastMsg" class="px-4 py-2 rounded-xl bg-slate-900/95 border border-rose-500/50 text-xs font-bold text-rose-200 shadow-xl">알림</div>
  </div>

  <!-- TOP 10 랭킹 모달 -->
  <div id="rankModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-rose-500/40 rounded-2xl max-w-md w-full p-4 shadow-2xl flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-sm sm:text-base font-black text-rose-400">🏆 좀비 서바이벌 TOP 10</h2>
          <p class="text-[10px] text-slate-400">최고 점수 기준 · 전화번호 중간자리 보호</p>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="refreshRankingBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 cursor-pointer">🔄 새로고침</button>
          <button id="rankCloseBtn" type="button" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 cursor-pointer">✕</button>
        </div>
      </div>
      <div class="rounded-xl bg-slate-950/90 border border-rose-500/30 px-3 py-2 flex items-center justify-between text-xs">
        <span class="text-slate-300 font-semibold">내 순위</span>
        <span id="myRankDetailText" class="font-black text-rose-300">로그인 후 플레이 시 등록</span>
      </div>
      <div id="rankingListContainer" class="flex flex-col gap-1.5 max-h-[280px] overflow-y-auto text-xs text-slate-400">기록을 불러오는 중...</div>
    </div>
  </div>

  <!-- 통합 DB 연동 로그인 / 회원가입 모달 -->
  <div id="loginModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="w-full max-w-xs bg-slate-900 border-2 border-amber-500/40 rounded-3xl p-5 shadow-2xl text-center">
      <div class="w-12 h-12 mx-auto mb-2 rounded-2xl bg-amber-500/15 border border-amber-400/40 flex items-center justify-center text-2xl">🔐</div>
      <h3 class="text-lg font-black text-amber-300 mb-3">AI게임장 통합 계정</h3>

      <div class="flex rounded-xl bg-slate-950 p-1 border border-slate-800 mb-3">
        <button type="button" id="modeLoginBtn" class="flex-1 py-1.5 rounded-lg text-xs font-extrabold bg-amber-500 text-slate-950 transition cursor-pointer">
          기존 계정 로그인
        </button>
        <button type="button" id="modeRegisterBtn" class="flex-1 py-1.5 rounded-lg text-xs font-extrabold text-slate-400 hover:text-slate-200 transition cursor-pointer">
          간편 회원가입
        </button>
      </div>

      <div class="space-y-2.5 text-left">
        <div>
          <label class="text-[10px] font-bold text-slate-400 ml-1">휴대폰 번호 (010 제외 8자리)</label>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="px-3 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-black text-amber-400">010-</span>
            <input id="phoneInput" type="tel" inputmode="numeric" maxlength="9" placeholder="1234-5678" class="flex-1 px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm font-bold text-white tracking-wider focus:outline-none focus:border-amber-400" />
          </div>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 ml-1">비밀번호 (숫자 4자리)</label>
          <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" class="w-full mt-1 px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm font-bold text-white tracking-widest text-center focus:outline-none focus:border-amber-400" />
        </div>
      </div>

      <div id="loginMsg" class="text-[11px] font-bold text-rose-400 mt-3 hidden"></div>

      <div class="flex gap-2 mt-4">
        <button type="button" id="closeLoginBtn" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition cursor-pointer">닫기</button>
        <button type="button" id="confirmLoginBtn" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-xs font-black text-slate-950 shadow-lg shadow-amber-500/20 transition active:scale-95 cursor-pointer">로그인</button>
      </div>
    </div>
  </div>

  <!-- 로그아웃 확인 모달 -->
  <div id="logoutConfirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-xs w-full p-5 shadow-2xl text-center">
      <h3 class="text-sm font-black text-slate-100 mb-1.5">로그아웃</h3>
      <p class="text-xs text-slate-400 mb-4">로그아웃 하시겠습니까?</p>
      <div class="flex gap-2">
        <button id="logoutCancelBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer">취소</button>
        <button id="logoutConfirmBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-black bg-rose-600 hover:bg-rose-500 text-white cursor-pointer">로그아웃</button>
      </div>
    </div>
  </div>

  <script>
    const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_CANDIDATES = isLocalHost
      ? ['']
      : [
          'https://02826k.duckdns.org',
          'https://partial-catering-vatican-accounting.trycloudflare.com'
        ];
    let API_BASE_URL = API_CANDIDATES[0];

    async function apiFetch(endpoint, options = {}) {
      let lastErr = null;
      const ordered = [API_BASE_URL, ...API_CANDIDATES.filter(u => u !== API_BASE_URL)];
      for (const base of ordered) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(`${base}${endpoint}`, { ...options, signal: controller.signal });
          clearTimeout(timer);
          API_BASE_URL = base;
          return res;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('서버 연결 실패');
    }

    const GAME_ID = 'zombie_survival';
    const TOKEN_KEYS = ['hero_clicker_jwt_token', 'abuse_jwt_token', 'sky2026_jwt_token', 'gongdaegong_jwt_token', 'aigameroom_jwt_token', 'moto_racing_3d_jwt'];
    const USER_KEYS = ['hero_clicker_username', 'gongdaegong_username', 'aigameroom_username', 'moto_racing_3d_user'];
    const VIP_KEY = 'hero_clicker_is_vip';
    const AUDIO_PREF_KEY = 'zombie_survival_audio_v1';
    const LOBBY_URL = 'https://02826k.github.io/aigameroom/';

    function maskPhoneMiddle(name) {
      const str = String(name || '');
      const m = str.match(/^(01[016789])[-.\s]?(\d{3,4}|\*{3,4})[-.\s]?(\d{4}|\*{4})$/);
      if (m) return `${m[1]}-****-${m[3]}`;
      return str.replace(/(01[016789])[-.\s]?(\d{3,4})[-.\s]?(\d{4})/g, '$1-****-$3');
    }

    let audioPrefs = (() => {
      try {
        const raw = JSON.parse(localStorage.getItem(AUDIO_PREF_KEY) || '{}');
        return { bgm: raw.bgm !== false, sfx: raw.sfx !== false };
      } catch {
        return { bgm: true, sfx: true };
      }
    })();

    let userState = {
      loggedIn: false,
      phone: '',
      pin: '',
      token: null,
      username: null,
      isVip: localStorage.getItem(VIP_KEY) === 'true',
      autoDodge: true,
      serverSaveData: null
    };
    let isRegisterMode = false;

    function loadSharedAuth() {
      let tok = null;
      let usr = null;
      try {
        for (const k of TOKEN_KEYS) {
          const v = localStorage.getItem(k);
          if (v) { tok = v; break; }
        }
        for (const k of USER_KEYS) {
          const v = localStorage.getItem(k);
          if (v) { usr = v; break; }
        }
      } catch {}
      userState.token = tok;
      userState.username = usr;
      userState.loggedIn = Boolean(tok || usr);
      if (usr) userState.phone = usr.replace(/\D/g, '');
      userState.isVip = localStorage.getItem(VIP_KEY) === 'true';
    }

    function saveSharedAuth(token, username, isVip) {
      try {
        if (token) {
          TOKEN_KEYS.forEach(k => localStorage.setItem(k, token));
          if (username) USER_KEYS.forEach(k => localStorage.setItem(k, username));
          if (isVip) localStorage.setItem(VIP_KEY, 'true');
        } else {
          TOKEN_KEYS.forEach(k => localStorage.removeItem(k));
          USER_KEYS.forEach(k => localStorage.removeItem(k));
          localStorage.removeItem(VIP_KEY);
        }
      } catch {}
    }

    loadSharedAuth();

    // ==========================================
    // Web Audio 효과음 & 배경음
    // ==========================================
    let audioCtx = null;
    let bgmTimer = null;
    let bgmStep = 0;
    const bgmNotes = [146.83, 174.61, 220.00, 196.00, 164.81, 146.83, 130.81, 146.83];

    function getAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function startBGM() {
      stopBGM();
      if (!audioPrefs.bgm) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      bgmStep = 0;
      bgmTimer = setInterval(() => {
        if (!audioPrefs.bgm || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(bgmNotes[bgmStep++ % bgmNotes.length], now);
          g.gain.setValueAtTime(0.03, now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(now);
          o.stop(now + 0.26);
        } catch {}
      }, 300);
    }

    function stopBGM() {
      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }
    }

    function playSound(type) {
      if (!audioPrefs.sfx) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      if (type === 'shoot') {
        o.type = 'square';
        o.frequency.setValueAtTime(620, now);
        o.frequency.exponentialRampToValueAtTime(180, now + 0.045);
        g.gain.setValueAtTime(0.045, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        o.start(now);
        o.stop(now + 0.055);
      } else if (type === 'kill') {
        o.type = 'triangle';
        o.frequency.setValueAtTime(280, now);
        o.frequency.exponentialRampToValueAtTime(95, now + 0.09);
        g.gain.setValueAtTime(0.09, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        o.start(now);
        o.stop(now + 0.11);
      } else if (type === 'levelup') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0.08, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.16);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.17);
        });
      }
    }

    function updateAudioButtonsUI() {
      const bgmBtn = document.getElementById('bgmToggleBtn');
      const sfxBtn = document.getElementById('soundToggleBtn');
      bgmBtn.textContent = audioPrefs.bgm ? '🎵 배경음 ON' : '🔇 배경음 OFF';
      bgmBtn.className = audioPrefs.bgm
        ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap'
        : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';

      sfxBtn.textContent = audioPrefs.sfx ? '🔊 효과음 ON' : '🔇 효과음 OFF';
      sfxBtn.className = audioPrefs.sfx
        ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap'
        : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';
    }

    document.getElementById('bgmToggleBtn').onclick = () => {
      audioPrefs.bgm = !audioPrefs.bgm;

    function resizeCanvas() {
      const parent = canvas.parentElement;

      if (w > 0 && h > 0) {
        const prevW = canvas.width || w;
        const prevH = canvas.height || h;
        canvas.width = w;
        canvas.height = h;
        if (typeof player !== 'undefined' && prevW > 0 && prevH > 0) {
          player.x = Math.max(player.radius, Math.min(w - player.radius, (player.x / prevW) * w));
          player.y = Math.max(player.radius, Math.min(h - player.radius, (player.y / prevH) * h));
        }
      }
    }

    window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 120); setTimeout(resizeCanvas, 320); });

        touchControl.moveX = (dx / Math.max(dist, 40)) * player.speed;
        touchControl.moveY = (dy / Math.max(dist, 40)) * player.speed;

    function spawnZombie(isBoss) {
      const edge = Math.floor(Math.random() * 4);
      let x, y;
      if (edge === 0) { x = Math.random() * canvas.width; y = -25; }
      else if (edge === 1) { x = Math.random() * canvas.width; y = canvas.height + 25; }
      else if (edge === 2) { x = -25; y = Math.random() * canvas.height; }
      else { x = canvas.width + 25; y = Math.random() * canvas.height; }

      if (isBoss) {
        bossSpawned = true;

        alertEl.classList.remove('hidden');
        setTimeout(() => alertEl.classList.add('hidden'), 3000);

          maxHp: 280 + stage * 180,
          isBoss: true,
          expVal: 50
        });
      } else {
        const isRunner = Math.random() < 0.25;
        zombies.push({
          x, y,
          radius: isRunner ? 11 : 14,
          speed: isRunner ? 2.3 + stage * 0.1 : 1.5 + stage * 0.08,
          hp: 20 + stage * 12,
          maxHp: 20 + stage * 12,

    function getAutoDodgeVelocity() {
      let evadeX = 0;
      let evadeY = 0;
      const dangerRadius = 115;

      zombies.forEach(z => {
        const dx = player.x - z.x;
        const dy = player.y - z.y;
        const dist = Math.hypot(dx, dy);
        const safeDist = dangerRadius + z.radius;
        if (dist > 0 && dist < safeDist) {
          const weight = Math.pow((safeDist - dist) / safeDist, 1.6) * (z.isBoss ? 2.5 : 1.2);
          evadeX += (dx / dist) * weight;
          evadeY += (dy / dist) * weight;
        }
      });

      const margin = 55;
      if (player.x < margin) evadeX += (margin - player.x) / margin;
      if (player.x > canvas.width - margin) evadeX -= (player.x - (canvas.width - margin)) / margin;
      if (player.y < margin) evadeY += (margin - player.y) / margin;
      if (player.y > canvas.height - margin) evadeY -= (player.y - (canvas.height - margin)) / margin;

      const mag = Math.hypot(evadeX, evadeY);
      if (mag > 0.05) {
        return {
          vx: (evadeX / mag) * player.speed * 0.95,
          vy: (evadeY / mag) * player.speed * 0.95
        };
      }
      return { vx: 0, vy: 0 };
    }

    function update() {
      if (gameState !== 'PLAY') return;

      let vx = touchControl.moveX;
      let vy = touchControl.moveY;
      if (keys['arrowleft'] || keys['a']) vx = -player.speed;
      if (keys['arrowright'] || keys['d']) vx = player.speed;
      if (keys['arrowup'] || keys['w']) vy = -player.speed;
      if (keys['arrowdown'] || keys['s']) vy = player.speed;

      if (vx === 0 && vy === 0 && userState.isVip && userState.autoDodge) {
        const dodge = getAutoDodgeVelocity();
        vx = dodge.vx;
        vy = dodge.vy;
      }

      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + vx));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + vy));

      player.attackCooldown--;
      let nearest = null;
      let minDist = player.range;
      zombies.forEach(z => {
        const dist = Math.hypot(z.x - player.x, z.y - player.y);
        if (dist < minDist) { minDist = dist; nearest = z; }
      });

      if (nearest) {
        player.facingAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
        if (player.attackCooldown <= 0) {
          for (let i = 0; i < player.multiShot; i++) {
            const spread = (i - (player.multiShot - 1) / 2) * 0.14;
            const angle = player.facingAngle + spread;
            bullets.push({
              x: player.x + Math.cos(angle) * 18,
              y: player.y + Math.sin(angle) * 18,
              vx: Math.cos(angle) * 8.5,
              vy: Math.sin(angle) * 8.5,
              damage: player.damage,
              radius: 4
            });
          }
          playSound('shoot');
          player.attackCooldown = player.attackSpeed;
        }
      } else if (vx !== 0 || vy !== 0) {
        player.facingAngle = Math.atan2(vy, vx);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }

      for (let zIdx = zombies.length - 1; zIdx >= 0; zIdx--) {
        const z = zombies[zIdx];
        const angle = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(angle) * z.speed;
        z.y += Math.sin(angle) * z.speed;

        if (Math.hypot(player.x - z.x, player.y - z.y) < player.radius + z.radius) {
          player.hp -= z.isBoss ? 1.2 : 0.55;
          if (player.hp <= 0) {
            gameOver();
            return;
          }
        }

        for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
          const b = bullets[bIdx];
          if (Math.hypot(b.x - z.x, b.y - z.y) < b.radius + z.radius) {
            z.hp -= b.damage;
            bullets.splice(bIdx, 1);

            for (let p = 0; p < 3; p++) {
              particles.push({
                x: z.x, y: z.y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 12,
                color: '#84cc16'
              });
            }

            if (z.hp <= 0) {
              playSound('kill');
              score += z.isBoss ? 500 : 15;
              document.getElementById('scoreVal').textContent = score.toLocaleString();
              gems.push({ x: z.x, y: z.y, val: z.expVal, radius: z.isBoss ? 10 : 6 });
              zombies.splice(zIdx, 1);

              if (z.isBoss) {
                nextStage();
                return;
              } else {
                stageKills++;
                if (stageKills >= stageTargetKills && !bossSpawned) {
                  spawnZombie(true);
                }
                updateStageUI();
              }
              break;
            }
          }
        }
      }

      for (let gIdx = gems.length - 1; gIdx >= 0; gIdx--) {
        const g = gems[gIdx];
        const dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < 85) {
          const angle = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(angle) * 5.5;
          g.y += Math.sin(angle) * 5.5;
        }
        if (dist < player.radius + g.radius) {
          player.exp += g.val;
          gems.splice(gIdx, 1);
          updateStageUI();
          if (player.exp >= player.maxExp) levelUp();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
    }

    function levelUp() {
      playSound('levelup');
      player.level++;
      player.exp = 0;
      player.maxExp = Math.floor(player.maxExp * 1.35);
      document.getElementById('levelVal').textContent = player.level;
      updateStageUI();

      gameState = 'UPGRADE';
      const modal = document.getElementById('upgradeModal');
      const container = document.getElementById('upgradeOptions');
      container.innerHTML = '';

      const options = [
        { title: '🔥 탄환 화력 강화 (+10)', desc: '총알의 기본 데미지가 상승합니다.', action: () => { player.damage += 10; } },
        { title: '🔫 멀티 샷 (+1발)', desc: '동시에 발사되는 총알 수가 늘어납니다.', action: () => { player.multiShot = Math.min(5, player.multiShot + 1); } },
        { title: '⚡ 속사 개조', desc: '연사 속도가 대폭 빨라집니다.', action: () => { player.attackSpeed = Math.max(5, player.attackSpeed - 3); } },
        { title: '💖 응급 치료 키트', desc: '체력을 100% 회복하고 최대 체력이 증가합니다.', action: () => { player.maxHp += 30; player.hp = player.maxHp; } }
      ];

      options.sort(() => 0.5 - Math.random()).slice(0, 3).forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'w-full p-3 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl text-left transition cursor-pointer';
        btn.innerHTML = `<div class="text-xs font-black text-amber-300">${opt.title}</div><div class="text-[10px] text-slate-400 mt-0.5">${opt.desc}</div>`;
        btn.onclick = () => {
          opt.action();
          modal.classList.add('hidden');
          gameState = 'PLAY';
        };
        container.appendChild(btn);
      });
      modal.classList.remove('hidden');
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      clearInterval(spawnTimer);
      stopBGM();
      syncUserToServer();
      document.getElementById('overlayTitle').textContent = '생존 실패!';
      document.getElementById('overlayDesc').textContent = `도달 스테이지: STAGE ${stage} | 최종 점수: ${score.toLocaleString()}점`;
      document.getElementById('startBtn').textContent = '다시 도전하기';
      document.getElementById('overlay').classList.remove('hidden');
    }

    function drawFemaleCharacter(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);

      if (userState.isVip) {
        ctx.strokeStyle = userState.autoDodge ? 'rgba(52, 211, 153, 0.55)' : 'rgba(250, 204, 21, 0.45)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 23, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.rotate(angle);

      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.ellipse(-13, 0, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(6, 3, 18, 4);
      ctx.fillStyle = '#334155';
      ctx.fillRect(4, 2, 8, 6);

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.arc(2, 0, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#e11d48';
      ctx.beginPath();
      ctx.arc(0, 0, 8.5, Math.PI * 0.65, Math.PI * 1.35);
      ctx.fill();

      ctx.restore();
    }

    function drawZombie(z) {
      ctx.save();
      ctx.translate(z.x, z.y);
      const angle = Math.atan2(player.y - z.y, player.x - z.x);
      ctx.rotate(angle);

      ctx.fillStyle = z.isBoss ? '#7f1d1d' : '#4d7c0f';
      ctx.fillRect(2, -z.radius * 0.85, z.radius * 1.1, 4);
      ctx.fillRect(2, z.radius * 0.85 - 4, z.radius * 1.1, 4);

      ctx.fillStyle = z.isBoss ? '#991b1b' : (z.isRunner ? '#65a30d' : '#3f6212');
      ctx.beginPath();
      ctx.arc(0, 0, z.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(z.radius * 0.45, -z.radius * 0.3, z.isBoss ? 3.5 : 2, 0, Math.PI * 2);
      ctx.arc(z.radius * 0.45, z.radius * 0.3, z.isBoss ? 3.5 : 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      const barW = z.isBoss ? 54 : 24;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(z.x - barW / 2, z.y - z.radius - 9, barW, 4);
      ctx.fillStyle = z.isBoss ? '#f43f5e' : '#22c55e';
      ctx.fillRect(z.x - barW / 2, z.y - z.radius - 9, barW * Math.max(0, z.hp / z.maxHp), 4);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
      ctx.lineWidth = 1;
      for (let gx = 0; gx < canvas.width; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
      }
      for (let gy = 0; gy < canvas.height; gy += 40) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
      }

      gems.forEach(g => {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#facc15';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      zombies.forEach(z => drawZombie(z));

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });

      drawFemaleCharacter(player.x, player.y, player.facingAngle);

      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(player.x - 18, player.y - 24, 36, 5);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(player.x - 18, player.y - 24, 36 * Math.max(0, player.hp / player.maxHp), 5);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // ==========================================
    // 3. TOP 10 랭킹 모달
    // ==========================================
    const rankModal = document.getElementById('rankModal');
    document.getElementById('rankOpenBtn').onclick = () => {
      rankModal.classList.remove('hidden');
      rankModal.classList.add('flex');
      fetchAndRenderRanking();
    };
    document.getElementById('rankCloseBtn').onclick = () => {
      rankModal.classList.add('hidden');
      rankModal.classList.remove('flex');
    };
    rankModal.onclick = (e) => {
      if (e.target === rankModal) {
        rankModal.classList.add('hidden');
        rankModal.classList.remove('flex');
      }
    };

    async function fetchAndRenderRanking() {
      const box = document.getElementById('rankingListContainer');
      const myEl = document.getElementById('myRankDetailText');
      if (!box || !myEl) return;
      try {
        const headers = userState.token ? { 'Authorization': `Bearer ${userState.token}` } : {};
        const res = await apiFetch(`/api/ranking?gameId=${GAME_ID}`, { headers });
        const data = await res.json();
        if (!res.ok) throw new Error();
        const rankings = (data.rankings || []).slice(0, 10);
        if (data.myRank) {
          myEl.textContent = `${data.totalPlayers || rankings.length}명 중 ${data.myRank.rank}위 · ${(data.myRank.score || 0).toLocaleString()}점`;
        } else if (userState.loggedIn) {
          myEl.textContent = '플레이 완료 시 순위 자동 등록';
        } else {
          myEl.textContent = '로그인 후 플레이 시 등록';
        }
        box.innerHTML = '';
        if (rankings.length === 0) {
          box.innerHTML = '<div class="text-center text-[11px] text-slate-500 py-4">아직 등록된 랭킹이 없습니다.</div>';
          return;
        }
        rankings.forEach(it => {
          const row = document.createElement('div');
          row.className = 'rounded-xl px-3 py-2 border bg-slate-950 border-slate-800 flex items-center justify-between gap-2 text-[11px]' + (it.isMe ? ' ring-1 ring-rose-400' : '');
          row.innerHTML =
            '<div class="min-w-0 font-bold text-slate-100 truncate">' +
              it.rank + '. ' + maskPhoneMiddle(it.maskedName) +
              (it.isMe ? ' <span class="text-rose-300 text-[10px]">(나)</span>' : '') +
            '</div>' +
            '<span class="font-black text-rose-400 shrink-0">' + (it.score || 0).toLocaleString() + ' 점</span>';
          box.appendChild(row);
        });
      } catch {
        box.innerHTML = '<div class="text-center text-[11px] text-slate-500 py-4">랭킹 서버 연결 대기 중</div>';
      }
    }
    document.getElementById('refreshRankingBtn').addEventListener('click', fetchAndRenderRanking);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    updateAudioButtonsUI();
    updateAuthHeaderUI();
    restoreSessionFromToken().then(fetchAndRenderRanking);
    loop();
  </script>
</body>
