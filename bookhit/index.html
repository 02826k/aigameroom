<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <title>판치기 — 교실의 전설</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body.fs-lock {
      overflow: hidden !important;
      height: 100dvh !important;
    }
    canvas { touch-action: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.7); border-radius: 9999px; }

    #fullscreenStage { display: contents; }

    /* 전체화면 (Native Fullscreen API + iOS/모바일 CSS 폴백 공용) */
    #fullscreenStage:fullscreen,
    #fullscreenStage.is-fullscreen {
      display: flex !important;
      flex-direction: column !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      padding-top: env(safe-area-inset-top, 0px) !important;
      padding-bottom: env(safe-area-inset-bottom, 0px) !important;
      padding-left: env(safe-area-inset-left, 0px) !important;
      padding-right: env(safe-area-inset-right, 0px) !important;
      background: #020617 !important;
      overflow: hidden !important;
      z-index: 60 !important;
    }
    /* 전체화면 시 중복 상단바 숨김 (게임 HUD 내 축소/랭킹 버튼으로 통합) */
    #fullscreenStage:fullscreen #topControlBar,
    #fullscreenStage.is-fullscreen #topControlBar {
      display: none !important;
    }
    #fullscreenStage:fullscreen #fsQuickActions,
    #fullscreenStage.is-fullscreen #fsQuickActions {
      display: flex !important;
    }
    #fullscreenStage:fullscreen #gameAreaSection,
    #fullscreenStage.is-fullscreen #gameAreaSection {
      flex: 1 1 0% !important;
      min-height: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      border-radius: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      background: #020617 !important;
    }
    /* 전체화면 상단 HUD: 모바일 가로모드에서도 1줄 콤팩트 배치 */
    #fullscreenStage:fullscreen #gameTopHud,
    #fullscreenStage.is-fullscreen #gameTopHud {
      flex-direction: row !important;
      align-items: center !important;
      justify-content: space-between !important;
      flex-wrap: nowrap !important;
      padding: 4px 10px !important;
      gap: 6px !important;
    }
    #fullscreenStage:fullscreen #gameTopHud > div:first-child,
    #fullscreenStage.is-fullscreen #gameTopHud > div:first-child {
      display: contents !important;
    }
    #fullscreenStage:fullscreen #hudScoreText,
    #fullscreenStage.is-fullscreen #hudScoreText {
      order: 1 !important;
    }
    #fullscreenStage:fullscreen #midGameMenu,
    #fullscreenStage.is-fullscreen #midGameMenu {
      order: 2 !important;
      flex-wrap: nowrap !important;
      padding: 2px 6px !important;
      gap: 4px !important;
    }
    #fullscreenStage:fullscreen #gameTopHud > div:first-child > div:last-child,
    #fullscreenStage.is-fullscreen #gameTopHud > div:first-child > div:last-child {
      order: 3 !important;
    }
    #fullscreenStage:fullscreen #canvasWrap,
    #fullscreenStage.is-fullscreen #canvasWrap {
      flex: 1 1 0% !important;
      min-height: 0 !important;
      width: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: #020617 !important;
      overflow: hidden !important;
    }
    /* 전체화면 시 PC/모바일 모두 캔버스 꽉 차게 */
    #fullscreenStage:fullscreen #cv,
    #fullscreenStage.is-fullscreen #cv {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: fill !important;
    }

    /* 모바일(폰)에서는 하단 상태 설명바 숨김 */
    @media (max-width: 1023px) {
      #gameBottomMsg {
        display: none !important;
      }
    }

    /* PC(컴퓨터) 전용: 일반 화면 좌우 꽉 차게 */
    @media (min-width: 1024px) {
      #headerInner,
      #mainWrap {
        max-width: 100% !important;
        padding-left: 16px !important;
        padding-right: 16px !important;
      }
      #gameAreaSection {
        width: 100% !important;
      }
      #cv {
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur px-3 sm:px-4 py-2 sticky top-0 z-30 shadow-lg shadow-black/30">
    <div id="headerInner" class="max-w-5xl mx-auto flex flex-col gap-1.5">
      <!-- 1단 -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-gradient-to-br from-rose-400/25 to-amber-600/25 text-amber-300 font-extrabold text-sm border border-amber-500/40 shadow-inner shrink-0">🪙</span>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-50 truncate">판치기 <span class="text-amber-400">: 교실의 전설</span></h1>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="authHeaderBtn" type="button"
            class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap">
            로그인
          </button>
        </div>
      </div>

      <!-- 2단 -->
      <div class="flex items-center justify-between gap-2 pt-1.5 border-t border-slate-800/70">
        <div class="flex items-center gap-1.5 shrink-0 ml-auto">
          <button id="bgmToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer">
            🎵 배경음 ON
          </button>
          <button id="soundToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer">
            🔊 효과음 ON
          </button>
          <button id="headerExitLobbyBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition active:scale-95 cursor-pointer">
            나가기
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="mainWrap" class="flex-1 max-w-5xl w-full mx-auto px-2 sm:px-4 py-2.5 sm:py-3.5 flex flex-col gap-2.5">
    <div id="fullscreenStage">
      <!-- 상단 바: 좌측(스테이지) · 우측(RANK / 전체화면) -->
      <section id="topControlBar" class="bg-slate-900/90 border border-amber-500/35 rounded-xl px-3 py-2 flex items-center justify-between gap-2 shadow-lg">
        <div class="min-w-0">
          <div class="text-[10px] text-amber-300/90 font-bold leading-tight truncate">🪙 책 위 동전 뒤집기</div>
          <div id="stageInfoDisplay" class="text-xs font-extrabold text-emerald-300 mt-0.5 leading-tight truncate">1교시 쉬는시간 · 학교 교실</div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button id="rankOpenBtn" type="button" title="TOP 10 랭킹 보기"
            class="px-2.5 sm:px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-black bg-slate-800 hover:bg-slate-700 border border-amber-400/50 text-amber-300 cursor-pointer active:scale-95 transition shadow whitespace-nowrap">
            🏆 RANK
          </button>
          <button id="fullscreenBtn" type="button" title="전체화면 전환"
            class="px-3 sm:px-3.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-black bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 cursor-pointer active:scale-95 transition shadow whitespace-nowrap">
            ⛶ 전체화면
          </button>
        </div>
      </section>

      <!-- 게임 영역 (통합 상단 HUD + 캔버스 + 하단 안내 바) -->
      <section id="gameAreaSection" class="relative rounded-2xl overflow-hidden border-2 border-slate-800 shadow-2xl shadow-black/60 bg-slate-900 flex flex-col">
        <!-- 게임 상단 HUD: 좌측(승수) · 중앙(중간 메뉴) · 우측(스테이지 & 전체화면 축소) -->
        <div id="gameTopHud" class="bg-[#202630] border-b-2 border-[#465063] px-2.5 sm:px-4 py-1.5 flex flex-col md:flex-row md:items-center md:justify-between gap-1.5 shrink-0">
          <!-- 모바일 1행 / PC 좌측+우측 분리 배치 -->
          <div class="flex items-center justify-between gap-2 md:contents">
            <div id="hudScoreText" class="text-xs sm:text-sm font-extrabold text-[#ffe478] tracking-tight whitespace-nowrap md:order-1">
              나(P1): 0승 &nbsp;|&nbsp; AI: 0승
            </div>

            <div class="flex items-center gap-1.5 shrink-0 md:order-3">
              <div id="hudStageText" class="text-[11px] sm:text-xs font-bold text-[#9fb4d0] whitespace-nowrap">
                📘 국어 &nbsp; 1교시 쉬는시간
              </div>
              <div id="fsQuickActions" class="hidden items-center gap-1 ml-1">
                <button id="fsRankBtn" type="button" title="TOP 10 랭킹 보기"
                  class="px-2 py-1 rounded-md text-[11px] font-black bg-slate-800 hover:bg-slate-700 border border-amber-400/50 text-amber-300 cursor-pointer active:scale-95">
                  🏆
                </button>
                <button id="fsExitBtn" type="button" title="전체화면 종료"
                  class="px-2.5 py-1 rounded-md text-[11px] font-black bg-amber-400 hover:bg-amber-300 text-slate-950 cursor-pointer active:scale-95 whitespace-nowrap">
                  ✕ 축소
                </button>
              </div>
            </div>
          </div>

          <!-- 중앙 게임 메뉴 (책 교체 · 대전 모드 · 자동 배치 · 배치 아이콘 · 리셋) -->
          <div id="midGameMenu" class="flex flex-wrap items-center justify-center gap-1 sm:gap-1.5 bg-[#121722]/90 border border-slate-700/70 rounded-lg px-2 py-1 md:order-2">
            <button id="bookBtn" type="button" class="px-2 sm:px-2.5 py-1 rounded-md text-[11px] sm:text-xs font-black bg-slate-800 hover:bg-slate-700 border border-sky-500/50 text-sky-300 active:scale-95 cursor-pointer whitespace-nowrap">📘 책 교체</button>
            <button id="modeBtn" type="button" class="px-2 sm:px-2.5 py-1 rounded-md text-[11px] sm:text-xs font-black bg-slate-800 hover:bg-slate-700 border border-sky-500/50 text-sky-300 active:scale-95 cursor-pointer whitespace-nowrap">AI 대전</button>
            <div class="flex items-center gap-1">
              <button id="autoBtn" type="button" class="px-2 sm:px-2.5 py-1 rounded-md text-[11px] sm:text-xs font-black bg-emerald-600 border border-amber-300 text-white active:scale-95 cursor-pointer whitespace-nowrap">자동 배치</button>
              <div id="autoIcons" class="flex items-center gap-1">
                <button id="icV" type="button" title="세로배치" class="w-6 h-6 sm:w-7 sm:h-7 rounded-md border flex items-center justify-center active:scale-95 cursor-pointer">
                  <svg width="14" height="16" viewBox="0 0 16 18"><circle cx="8" cy="3.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="9" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="14.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
                </button>
                <button id="icC" type="button" title="뭉치배치" class="w-6 h-6 sm:w-7 sm:h-7 rounded-md border flex items-center justify-center active:scale-95 cursor-pointer">
                  <svg width="14" height="14" viewBox="0 0 16 16"><circle cx="4.5" cy="4.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11.5" cy="4.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4.5" cy="11.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11.5" cy="11.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
                </button>
              </div>
            </div>
            <button id="resetBtn" type="button" class="px-2 sm:px-2.5 py-1 rounded-md text-[11px] sm:text-xs font-black bg-rose-900/70 hover:bg-rose-800/80 border border-rose-500/50 text-rose-200 active:scale-95 cursor-pointer whitespace-nowrap">이번판 리셋</button>
          </div>
        </div>

        <!-- 캔버스 래퍼 -->
        <div id="canvasWrap" class="relative w-full flex items-center justify-center bg-[#020617]">
          <canvas id="cv" width="1120" height="646" class="block w-full h-auto cursor-crosshair"></canvas>
        </div>

        <!-- 하단 상태 메시지 바 (PC에서만 표시) -->
        <div id="gameBottomMsg" class="bg-[#202630] border-t border-[#3b4456] px-3 py-2 text-center text-xs sm:text-sm font-bold text-[#f5f8fc] leading-snug shrink-0">
          자동배치 완료 (세로배치, 뒷면 통일)! 나(P1) 차례 - 드래그해 치세요!
        </div>

        <!-- 게임 화면 내 RANK TOP 10 오버레이 -->
        <div id="rankOverlay" class="hidden absolute inset-0 z-30 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-3">
          <div class="w-full max-w-sm bg-slate-900 border border-amber-500/40 rounded-2xl p-3.5 shadow-2xl flex flex-col gap-2 max-h-full">
            <div class="flex items-center justify-between">
              <div class="text-xs sm:text-sm font-black text-amber-300">🏆 판치기 TOP 10 (최고 보유 금액)</div>
              <button id="rankCloseBtn" type="button" class="px-2 py-1 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer">✕</button>
            </div>
            <div class="rounded-xl border border-amber-500/25 px-2.5 py-1.5 flex justify-between text-[11px] bg-slate-950/85">
              <span class="text-slate-400 font-semibold">내 순위</span>
              <span id="myRankDetailText" class="font-extrabold text-amber-300">불러오는 중...</span>
            </div>
            <div id="rankingListContainer" class="flex flex-col gap-1 overflow-y-auto pr-1 max-h-[240px]"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Toast -->
  <div id="toastBox" class="pointer-events-none fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] opacity-0 transition-all duration-200 translate-y-2">
    <div id="toastMsg" class="px-4 py-2 rounded-xl bg-slate-900/95 border border-amber-500/50 text-xs sm:text-sm font-bold text-amber-200 shadow-2xl whitespace-nowrap">알림</div>
  </div>

  <!-- 로그아웃 확인 모달 -->
  <div id="logoutModal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-xs w-full p-5 shadow-2xl">
      <h2 class="text-sm font-extrabold text-slate-100 mb-2">로그아웃 확인</h2>
      <p class="text-xs text-slate-400 mb-4">현재 계정에서 로그아웃 하시겠습니까?</p>
      <div class="flex gap-2">
        <button id="logoutCancelBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 cursor-pointer">취소</button>
        <button id="logoutConfirmBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-black bg-rose-600 hover:bg-rose-500 text-white cursor-pointer">로그아웃</button>
      </div>
    </div>
  </div>

  <!-- 로그인 모달 -->
  <div id="authModal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-base font-extrabold text-amber-300">🟨 서버 저장 계정</h2>
        <button id="authCloseBtn" type="button" class="text-slate-400 hover:text-slate-200 text-sm font-bold px-2 py-1 cursor-pointer">✕</button>
      </div>
      <p class="text-xs text-slate-400 mb-4">휴대폰 번호 뒷 8자리와 숫자 비밀번호 4자리로 최고 보유 금액을 서버에 영구 저장하세요.</p>
      <div class="flex rounded-xl bg-slate-950 p-1 border border-slate-800 mb-4">
        <button id="modeLoginBtn" type="button" class="flex-1 py-1.5 rounded-lg text-xs font-extrabold bg-amber-500 text-slate-950 cursor-pointer">기존 계정 로그인</button>
        <button id="modeRegisterBtn" type="button" class="flex-1 py-1.5 rounded-lg text-xs font-extrabold text-slate-400 cursor-pointer">간편 회원가입</button>
      </div>
      <form id="authForm" class="flex flex-col gap-3.5">
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">아이디 (휴대폰 번호 뒷 8자리)</label>
