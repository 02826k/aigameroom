<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>벽돌깨기 — 네온 아케이드 아레나</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      touch-action: none;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.7);
      border-radius: 9999px;
    }
    @keyframes goldShine {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.45)); }
      50% { filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.85)); }
    }
    .gold-bar-glow {
      animation: goldShine 2.4s infinite ease-in-out;
    }
    @keyframes vipPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(168, 85, 247, 0.45); }
      50% { box-shadow: 0 0 15px rgba(232, 121, 249, 0.8); }
    }
    .vip-btn-glow {
      animation: vipPulse 2.2s infinite ease-in-out;
    }
    #fullscreenMain:fullscreen {
      max-width: 100% !important;
      width: 100vw !important;
      height: 100dvh !important;
      background: #020617 !important;
      padding: 6px !important;
      gap: 6px !important;
      overflow: hidden !important;
    }
    #fullscreenMain:fullscreen #gameStageSection {
      flex: 1 1 0% !important;
      min-height: 0 !important;
    }
    #fullscreenMain:fullscreen #canvasWrapper {
      flex: 1 1 0% !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-dvh overflow-hidden flex flex-col">
  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur px-3 py-1.5 sticky top-0 z-20 shadow-lg shadow-black/20 shrink-0">
    <div class="max-w-4xl mx-auto flex flex-col gap-1">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-xl bg-gradient-to-br from-cyan-500/25 to-blue-600/25 text-cyan-400 font-extrabold text-sm border border-cyan-500/40 shadow-inner shrink-0">🧱</span>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-50 truncate">벽돌깨기</h1>
        </div>
        <button id="authHeaderBtn" type="button" class="px-3 py-1 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0">
          로그인
        </button>
      </div>

      <div class="flex items-center justify-end gap-1.5 pt-1 border-t border-slate-800/70">
        <button id="bgmToggleBtn" type="button" class="px-2 py-0.5 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap">🎵 배경음 ON</button>
        <button id="soundToggleBtn" type="button" class="px-2 py-0.5 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap">🔊 효과음 ON</button>
        <button id="headerExitLobbyBtn" type="button" class="px-2 py-0.5 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition active:scale-95 cursor-pointer whitespace-nowrap">나가기</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="fullscreenMain" class="flex-1 min-h-0 max-w-4xl w-full mx-auto px-2 sm:px-4 py-1.5 sm:py-2 flex flex-col gap-1.5">
    <!-- Top Status Card (컴팩트) -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-xl p-1.5 sm:p-2 shadow-xl shadow-black/30 shrink-0">
      <div class="flex flex-col sm:flex-row sm:items-center gap-1.5">
        <div class="flex-1 bg-gradient-to-br from-cyan-950/40 via-slate-950/90 to-slate-950/90 border border-cyan-500/35 rounded-lg px-2.5 py-1.5 flex items-center justify-between gap-2 shadow-inner">
          <div class="min-w-0 flex items-center gap-2">
            <span id="scoreBadge" class="text-[10px] px-1.5 py-0.5 rounded bg-cyan-500/15 text-cyan-300 font-bold border border-cyan-500/30 shrink-0">
              STAGE 1/10
            </span>
            <div class="text-sm sm:text-base font-black text-cyan-400 tracking-tight truncate" id="scoreDisplay">점수: 0 점</div>
          </div>
          <button id="startGameBtn" type="button" class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-black bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 shadow transition active:scale-95 cursor-pointer">
            게임 시작
          </button>
        </div>

        <div class="flex items-center justify-between gap-1.5 bg-slate-950/80 border border-slate-800/90 rounded-lg px-2.5 py-1.5">
          <div class="flex items-center gap-2.5">
            <div class="text-xs font-bold text-rose-400" id="livesDisplay">❤️❤️❤️</div>
            <div class="text-xs font-extrabold text-emerald-300 tabular-nums" id="timeDisplay">00:00</div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button id="rankOpenBtn" type="button" class="px-2 py-1 rounded-lg text-[11px] font-black bg-slate-800 hover:bg-slate-700 border border-cyan-400/50 text-cyan-300 shadow active:scale-95 transition cursor-pointer whitespace-nowrap">
              🏆 RANK
            </button>
            <button id="fullscreenBtn" type="button" class="px-2 py-1 rounded-lg text-[11px] font-black bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 shadow active:scale-95 transition cursor-pointer whitespace-nowrap">
              ⛶ 전체화면
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 중간 게임 화면 (바닥에서 위로 꽉 차게 확장) -->
    <section id="gameStageSection" class="flex-1 min-h-0 flex flex-col relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl shadow-black/40">
      <div id="canvasWrapper" class="relative flex-1 min-h-0 w-full cursor-pointer bg-slate-950 flex items-center justify-center">
        <canvas id="gameCanvas" class="block w-full h-full"></canvas>

        <!-- 게임 오버 / 스테이지 클리어 오버레이 -->
        <div id="gameOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 transition-opacity duration-200">
          <div id="overlayTitle" class="text-xl sm:text-2xl font-black text-cyan-400 tracking-tight">벽돌깨기 아레나</div>
          <p id="overlaySub" class="text-xs sm:text-sm text-slate-300 text-center px-4">상단 [게임 시작] 버튼을 누르거나 화면을 터치해 시작하세요!</p>
          <button id="overlayActionBtn" type="button" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 text-slate-950 font-black text-xs sm:text-sm shadow-lg transition active:scale-95 cursor-pointer">
            게임 시작하기
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- TOP 10 랭킹 모달 -->
  <div id="brickRankModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-cyan-500/40 rounded-2xl max-w-md w-full p-4 shadow-2xl flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm sm:text-base font-black text-cyan-300">🏆 벽돌깨기 TOP 10</h2>
        <button id="brickRankCloseBtn" type="button" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 cursor-pointer">✕</button>
      </div>
      <div class="rounded-xl bg-slate-950/90 border border-cyan-500/30 px-3 py-2 flex items-center justify-between text-xs">
        <span class="text-slate-300 font-semibold">내 최고 점수</span>
        <span id="myRankDetailText" class="font-black text-cyan-300">0 점</span>
      </div>
      <div id="rankingListContainer" class="flex flex-col gap-1.5 max-h-[280px] overflow-y-auto text-xs text-slate-400">기록을 불러오는 중...</div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastBox" class="pointer-events-none fixed top-3 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 -translate-y-2">
    <div id="toastMsg" class="px-4 py-2 rounded-xl bg-slate-900/95 border border-cyan-500/50 text-xs sm:text-sm font-bold text-cyan-200 shadow-2xl">
      알림 메시지
    </div>
  </div>

  <!-- 로그아웃 확인 모달 -->
  <div id="logoutConfirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-xs w-full p-5 shadow-2xl text-center">
      <h3 class="text-sm font-black text-slate-100 mb-1.5">로그아웃</h3>
      <p class="text-xs text-slate-400 mb-4">로그아웃 하시겠습니까?</p>
      <div class="flex gap-2">
        <button id="logoutCancelBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer">취소</button>
        <button id="logoutConfirmBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-black bg-rose-600 hover:bg-rose-500 text-white cursor-pointer">로그아웃</button>
      </div>
    </div>
  </div>

  <script>
    (() => {


      // 클라우드 서버 설정 & 게임 상태
      const GAME_ID = 'brick_breaker_v4';
      const CLOUD_API_URL = 'https://02826k.duckdns.org';
      const API_BASE_URL = CLOUD_API_URL;
      const ADMIN_VIP_PHONES = [];

      const STORAGE_KEY = 'brick_breaker_save_v4';
      const TOKEN_KEYS = ['hero_clicker_jwt_token', 'abuse_jwt_token', 'sky2026_jwt_token', 'gongdaegong_jwt_token', 'aigameroom_jwt_token', 'brick_breaker_jwt_token'];
      const USER_KEYS = ['hero_clicker_username', 'gongdaegong_username', 'aigameroom_username', 'brick_breaker_username'];
      const VIP_KEY = 'hero_clicker_is_vip';
      const ALL_NICK_KEYS = ['aigameroom_nickname', 'hero_clicker_nickname'];
      const LOBBY_URL = 'https://02826k.github.io/aigameroom/';
      function goLobbyAuth(mode = 'login') {
        try { saveState(false); } catch (e) {}
        window.location.href = `${LOBBY_URL}?auth=${encodeURIComponent(mode)}&returnTo=${encodeURIComponent(window.location.href)}`;
      }

      let authToken = null;
      let currentUsername = null;
      function loadSharedAuth() {
        authToken = null;
        currentUsername = null;
        try {
          for (const k of TOKEN_KEYS) {
            const v = localStorage.getItem(k);
            if (v) { authToken = v; break; }
          }
          for (const k of USER_KEYS) {
            const v = localStorage.getItem(k);
            if (v) { currentUsername = v; break; }
          }
        } catch (e) {}
      }
      function saveSharedAuth(token, username, isVip) {
        try {
          if (token) {
            TOKEN_KEYS.forEach(k => localStorage.setItem(k, token));
            if (username) USER_KEYS.forEach(k => localStorage.setItem(k, username));
            if (isVip) localStorage.setItem(VIP_KEY, 'true');
          } else {
            TOKEN_KEYS.forEach(k => localStorage.removeItem(k));
            USER_KEYS.forEach(k => localStorage.removeItem(k));
            ALL_NICK_KEYS.forEach(k => localStorage.removeItem(k));
            localStorage.removeItem(VIP_KEY);
          }
        } catch (e) {}
      }
      loadSharedAuth();
      let hasUnsavedChanges = false;

      function isAdminAccount(username) {
        return username && ADMIN_VIP_PHONES.includes(username.trim());
      }

      function maskPhoneMiddle(name) {
        const str = String(name || '');
        const m = str.match(/^(01[016789])[-.\s]?(\d{3,4}|\*{3,4})[-.\s]?(\d{4}|\*{4})$/);
        if (m) return `${m[1]}-****-${m[3]}`;
        return str.replace(/(01[016789])[-.\s]?(\d{3,4})[-.\s]?(\d{4})/g, '$1-****-$3');
      }

      const defaultState = () => ({
        highScore: 0,
        gold: 200,
        soundEnabled: true,
        bgmEnabled: true,
        isVip: isAdminAccount(currentUsername)
      });

      function sanitizeState(parsed) {
        const base = defaultState();
        if (!parsed || typeof parsed !== 'object') return base;
        const isVip = (typeof parsed.isVip === 'boolean' ? parsed.isVip : false) || isAdminAccount(currentUsername);

        return {
          highScore: typeof parsed.highScore === 'number' && parsed.highScore >= 0 ? Math.floor(parsed.highScore) : base.highScore,
          gold: typeof parsed.gold === 'number' && parsed.gold >= 0 ? Math.floor(parsed.gold) : base.gold,
          soundEnabled: typeof parsed.soundEnabled === 'boolean' ? parsed.soundEnabled : true,
          bgmEnabled: typeof parsed.bgmEnabled === 'boolean' ? parsed.bgmEnabled : true,
          isVip: isVip
        };
      }

      function loadLocalState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const s = raw ? sanitizeState(JSON.parse(raw)) : defaultState();
          if (localStorage.getItem(VIP_KEY) === 'true') s.isVip = true;
          return s;
        } catch (e) {
          return defaultState();
        }
      }

      let state = loadLocalState();

      // Web Audio 효과음 및 배경음 신시사이저 (BGM 루프 포함)
      let audioCtx = null;
      let bgmTimer = null;
      let bgmStep = 0;
      const bgmNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 392.00, 329.63];

      function getAudioContext() {
        if (!audioCtx) {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) audioCtx = new AudioCtxClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
      }

      function startBGM() {
        stopBGM();
        if (!state.bgmEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        bgmStep = 0;
        bgmTimer = setInterval(() => {
          if (!state.bgmEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const freq = bgmNotes[bgmStep % bgmNotes.length];
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
            bgmStep++;
          } catch (e) {}
        }, 280);
      }

      function stopBGM() {
        if (bgmTimer) {
          clearInterval(bgmTimer);
          bgmTimer = null;
        }
      }

      function playSound(type) {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'hit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'brick') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'score') {
          [523.25, 659.25, 783.99].forEach((f, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.setValueAtTime(f, now + idx * 0.05);
            g.gain.setValueAtTime(0.1, now + idx * 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.15);
            o.start(now + idx * 0.05); o.stop(now + idx * 0.05 + 0.16);
          });
        }
      }

      function saveState(syncImmediately = false) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
        hasUnsavedChanges = true;
        if (syncImmediately && authToken) {
          syncSaveToServer(false);
        }
      }

      async function syncSaveToServer(showNotification = false) {
        if (!authToken) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/save`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({
              gameId: GAME_ID,
              saveData: state,
              score: state.highScore
            })
          });
          if (res.status === 401 || res.status === 403) {
            handleLogout(true);
            return;
          }
          const data = await res.json();
          if (res.ok) {
            hasUnsavedChanges = false;
            if (showNotification) showToast(`🟨 [${currentUsername}] 클라우드 서버에 전적이 안전하게 저장되었습니다!`);
            fetchAndRenderRanking();
          }
        } catch (err) {}
      }

      async function loadFromServer() {
        if (!authToken) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/load?gameId=${GAME_ID}`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          if (res.status === 401 || res.status === 403) {
            handleLogout(true);
            return;
          }
          const data = await res.json();
          if (res.ok) {
            const serverVip = Boolean(data.isVip);
            try {
              localStorage.setItem(VIP_KEY, String(serverVip));
              if (data.nickname) ALL_NICK_KEYS.forEach(k => localStorage.setItem(k, data.nickname));
            } catch (e) {}
            state = sanitizeState({ ...(data.saveData || state), isVip: serverVip });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateUI();
          }
        } catch (err) {}
      }

      // ==========================================
      // 벽돌깨기 게임 엔진
      // ==========================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const canvasWrapper = document.getElementById('canvasWrapper');
      const canvasWidth = 440;
      const canvasHeight = 580;

      function resizeCanvas() {
        const rect = canvasWrapper.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx.setTransform(
          dpr * (rect.width / canvasWidth),
          0,
          0,
          dpr * (rect.height / canvasHeight),
          0,
          0
        );
      }
      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', () => {
        setTimeout(resizeCanvas, 120);
        setTimeout(resizeCanvas, 350);
      });
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => resizeCanvas()).observe(canvasWrapper);
      }

      const fullscreenMain = document.getElementById('fullscreenMain');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      function lockPortrait() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('portrait').catch(() => {});
        }
      }
      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            await fullscreenMain.requestFullscreen();
            lockPortrait();
          } else {
            lockPortrait();
            await document.exitFullscreen();
          }
        } catch (e) {
          showToast('이 브라우저에서는 전체화면을 지원하지 않습니다.');
        }
        setTimeout(resizeCanvas, 100);
        setTimeout(resizeCanvas, 300);
      }
      fullscreenBtn.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', () => {
        const isFs = Boolean(document.fullscreenElement);
        fullscreenBtn.textContent = isFs ? '✕ 축소' : '⛶ 전체화면';
        lockPortrait();
        setTimeout(resizeCanvas, 100);
        setTimeout(resizeCanvas, 300);
      });

      let gameRunning = false;
      let allCleared = false;
      let score = 0;
      let stage = 1;
      let lives = 3;
      let gameTime = 0; // seconds
      let gameStartTs = 0;
      const BASE_PADDLE_WIDTH = 100;
      let paddle = { x: 350, y: 400, width: BASE_PADDLE_WIDTH, height: 14, dx: 0, baseWidth: BASE_PADDLE_WIDTH };
      let balls = [];
      let items = []; // falling power-ups
      let missiles = []; // paddle side missiles
      let bricks = [];
      let particles = [];
      let bgStars = [];
      let keys = { left: false, right: false, space: false };
      let paddleWidenTimer = 0; // remaining seconds of widen effect
      const PADDLE_WIDEN_DURATION = 10;
      const PADDLE_WIDEN_AMOUNT = 70;
      const MAX_STAGE = 10;
      const MISSILE_COOLDOWN = 0.35; // seconds between volleys
      let missileCooldown = 0;

      for (let i = 0; i < 35; i++) {
        bgStars.push({
          x: Math.random(), y: Math.random(),
          size: 1 + Math.random() * 2,
          speed: 0.02 + Math.random() * 0.05,
          alpha: 0.2 + Math.random() * 0.6
        });
      }

      function createBall(x, y, vx, vy, active) {
        return { x, y, radius: 9, vx: vx || 0, vy: vy || 0, active: !!active };
      }

      function initBricks() {
        bricks = [];
        // 스테이지 1: 8열×4행 → 스테이지마다 가로·세로 각 +2칸, 벽돌 높이는 짧게
        const cols = Math.min(16, 6 + stage * 2);  // 1→8, 2→10, 3→12, ...
        const rows = Math.min(14, 2 + stage * 2);  // 1→4, 2→6, 3→8, ...
        const padding = 4;
        const topOffset = 32;
        const brickWidth = (canvasWidth - (cols + 1) * padding) / cols;
        // 행이 늘어도 화면을 너무 차지하지 않도록 높이 제한
        const availableH = canvasHeight * 0.48;
        const brickHeight = Math.min(16, Math.max(10, availableH / rows - padding));
        const colors = ['#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#f43f5e', '#eab308', '#10b981', '#f97316', '#14b8a6', '#a78bfa'];

        const baseHp = stage <= 2 ? 1 : (stage <= 5 ? 2 : 3);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            let hp = baseHp;
            if (stage >= 4 && r < Math.max(1, Math.floor(rows / 3))) hp = baseHp + 1;
            if (stage >= 7 && (c === 0 || c === cols - 1)) hp += 1;

            const bx = c * (brickWidth + padding) + padding;
            const by = r * (brickHeight + padding) + topOffset;
            const canDrop = Math.random() < (0.10 + stage * 0.012);
            bricks.push({
              x: bx, y: by, w: brickWidth, h: brickHeight,
              hp, maxHp: hp,
              color: colors[(r + c + stage) % colors.length],
              canDrop
            });
          }
        }
      }

      function startNewGame() {
        resizeCanvas();
        score = 0;
        stage = 1;
        lives = state.isVip ? 3 : 1;
        allCleared = false;
        gameTime = 0;
        gameStartTs = performance.now();
        paddleWidenTimer = 0;
        missileCooldown = 0;
        items = [];
        missiles = [];
        particles = [];
        initBricks();
        resetBallAndPaddle();
        gameRunning = true;
        if (state.bgmEnabled) startBGM();

        document.getElementById('gameOverlay').classList.add('opacity-0', 'pointer-events-none');
        updateUI();
      }

      function continueOrStart() {
        // 스테이지 클리어 대기 중이면 다음 스테이지로, 아니면 새 게임
        if (!gameRunning && !allCleared && bricks.length === 0 && stage >= 1 && lives > 0) {
          missiles = [];
          items = [];
          particles = [];
          initBricks();
          resetBallAndPaddle();
          gameRunning = true;
          if (state.bgmEnabled) startBGM();
          document.getElementById('gameOverlay').classList.add('opacity-0', 'pointer-events-none');
          updateUI();
          return;
        }
        if (!gameRunning) {
          startNewGame();
        }
      }

      function getBasePaddleWidth() {
        return state.isVip ? 160 : BASE_PADDLE_WIDTH;
      }

      function applyPaddleWidth() {
        const base = getBasePaddleWidth();
        if (paddleWidenTimer > 0) {
          // 남은 시간에 따라 서서히 줄어듦 (마지막 2초는 빠르게 복귀)
          const t = paddleWidenTimer;
          const factor = t > 2 ? 1 : (t / 2);
          paddle.width = base + PADDLE_WIDEN_AMOUNT * factor;
        } else {
          paddle.width = base;
        }
        paddle.baseWidth = base;
        // 화면 밖으로 나가지 않도록 보정
        paddle.x = Math.max(0, Math.min(canvasWidth - paddle.width, paddle.x));
      }

      function resetBallAndPaddle() {
        paddleWidenTimer = 0;
        applyPaddleWidth();
        paddle.x = (canvasWidth - paddle.width) / 2;
        paddle.y = canvasHeight - 30;
        balls = [createBall(paddle.x + paddle.width / 2, paddle.y - 11, 0, 0, false)];
        items = [];
      }

      function launchBall() {
        if (!gameRunning) return;
        const inactive = balls.filter(b => !b.active);
        if (inactive.length === 0 && balls.length > 0) return;
        const targets = inactive.length > 0 ? inactive : balls;
        getAudioContext();
        // 스테이지 올라갈수록 공 속도 증가 (1:2.2 → 10:약 4.6)
        const baseSpeed = 2.0 + stage * 0.26;
        targets.forEach((ball, idx) => {
          if (ball.active) return;
          ball.active = true;
          const angle = (Math.random() * 0.4 - 0.2) * Math.PI + (idx * 0.15);
          ball.vx = Math.sin(angle) * baseSpeed;
          ball.vy = -Math.cos(angle) * baseSpeed;
        });
      }

      function spawnItem(x, y) {
        const type = Math.random() < 0.5 ? 'multi' : 'widen';
        items.push({
          x, y,
          w: 22, h: 14,
          vy: 90 + Math.random() * 40,
          type,
          life: 8
        });
      }

      function applyItem(type) {
        if (type === 'multi') {
          const activeBalls = balls.filter(b => b.active);
          if (activeBalls.length === 0) return;
          const MAX_BALLS = 24;
          if (balls.length >= MAX_BALLS) {
            showToast(`⚡ 모든 공 복제! (최대 ${MAX_BALLS}개)`);
            return;
          }
          const angleOff = 0.32;
          for (const srcBall of activeBalls) {
            if (balls.length >= MAX_BALLS) break;
            const sign = Math.random() < 0.5 ? 1 : -1;
            const a = angleOff * sign;
            const nvx = srcBall.vx * Math.cos(a) - srcBall.vy * Math.sin(a);
            const nvy = srcBall.vx * Math.sin(a) + srcBall.vy * Math.cos(a);
            balls.push(createBall(srcBall.x, srcBall.y, nvx, nvy, true));
          }
          playSound('score');
          showToast(`⚡ 모든 공 복제! (${balls.length}개)`);
        } else if (type === 'widen') {
          paddleWidenTimer = PADDLE_WIDEN_DURATION;
          applyPaddleWidth();
          playSound('score');
          showToast('🛡️ 패들이 10초간 확장됩니다!');
        }
      }

      function fireMissiles() {
        if (!gameRunning || missileCooldown > 0) return;
        // 공이 아직 안 나갔으면 먼저 발사
        const hasActive = balls.some(b => b.active);
        if (!hasActive) {
          launchBall();
          return;
        }
        missileCooldown = MISSILE_COOLDOWN;
        const speed = -320;
        const my = paddle.y - 6;
        missiles.push({ x: paddle.x + 6, y: my, w: 4, h: 12, vy: speed });
        missiles.push({ x: paddle.x + paddle.width - 10, y: my, w: 4, h: 12, vy: speed });
        playSound('hit');
      }

      // 키보드: ↑ 미사일(또는 첫 공 발사), Space 패들 부스터
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (!gameRunning) {
            continueOrStart();
          } else {
            fireMissiles();
          }
        }
        if (e.code === 'Space') {
          e.preventDefault();
          if (!gameRunning) {
            continueOrStart();
          } else {
            keys.space = true;
          }
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.code === 'Space') {
          keys.space = false;
        }
      });

      canvasWrapper.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) * (canvasWidth / (rect.width || canvasWidth));
        paddle.x = Math.max(0, Math.min(canvasWidth - paddle.width, mouseX - paddle.width / 2));
        if (gameRunning) {
          balls.forEach(b => {
            if (!b.active) b.x = paddle.x + paddle.width / 2;
          });
        }
      });

      canvasWrapper.addEventListener('pointerdown', (e) => {
        // 마우스 클릭·터치 모두 미사일 (첫 공 미발사 시에는 공 발사)
        if (!gameRunning) {
          continueOrStart();
          return;
        }
        e.preventDefault();
        fireMissiles();
      });

      // 메인 게임 루프
      let lastTime = 0;
      function gameLoop(timestamp) {
        try {
          const dt = lastTime ? Math.min(0.05, (timestamp - lastTime) / 1000) : 0.016;
          lastTime = timestamp;

          if (gameRunning) {
            // 게임 시간 업데이트
            gameTime = (timestamp - gameStartTs) / 1000;
            const timeEl = document.getElementById('timeDisplay');
            if (timeEl) {
              const s = Math.max(0, Math.floor(gameTime));
              const m = Math.floor(s / 60);
              const r = s % 60;
              timeEl.textContent = String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
            }

            // 패들 확장 타이머 감소
            if (paddleWidenTimer > 0) {
              paddleWidenTimer = Math.max(0, paddleWidenTimer - dt);
              applyPaddleWidth();
            }

            // 스페이스바 부스터
            const speedMultiplier = keys.space ? 2.0 : 1.0;
            const pSpeed = 520 * speedMultiplier * dt;

            if (keys.left) paddle.x = Math.max(0, paddle.x - pSpeed);
            if (keys.right) paddle.x = Math.min(canvasWidth - paddle.width, paddle.x + pSpeed);

            // 비활성 공은 패들에 붙임
            balls.forEach(b => {
              if (!b.active) {
                b.x = paddle.x + paddle.width / 2;
                b.y = paddle.y - b.radius - 2;
              }
            });

            // 공 물리
            for (let bi = balls.length - 1; bi >= 0; bi--) {
              const ball = balls[bi];
              if (!ball.active) continue;

              ball.x += ball.vx;
              ball.y += ball.vy;

              if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1; playSound('hit'); }
              if (ball.x + ball.radius > canvasWidth) { ball.x = canvasWidth - ball.radius; ball.vx *= -1; playSound('hit'); }
              if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -1; playSound('hit'); }

              // 바닥 낙하
              if (ball.y - ball.radius > canvasHeight) {
                balls.splice(bi, 1);
                playSound('hit');
                if (balls.length === 0) {
                  lives--;
                  if (lives <= 0) {
                    gameRunning = false;
                    stopBGM();
                    if (score > state.highScore) {
                      state.highScore = score;
                      saveState(true);
                    }
                    showGameOverOverlay();
                  } else {
                    resetBallAndPaddle();
                  }
                  updateUI();
                }
                continue;
              }

              // 패들 충돌
              if (
                ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width &&
                ball.vy > 0
              ) {
                ball.y = paddle.y - ball.radius;
                playSound('hit');
                const hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) || 3;
                const bounceAngle = hitPos * (Math.PI / 2.8);
                ball.vx = Math.sin(bounceAngle) * speed;
                ball.vy = -Math.cos(bounceAngle) * speed;
              }

              // 벽돌 충돌
              for (let i = bricks.length - 1; i >= 0; i--) {
                const b = bricks[i];
                if (
                  ball.x + ball.radius > b.x &&
                  ball.x - ball.radius < b.x + b.w &&
                  ball.y + ball.radius > b.y &&
                  ball.y - ball.radius < b.y + b.h
                ) {
                  // 어느 면에서 부딪혔는지 대략 판단
                  const overlapL = (ball.x + ball.radius) - b.x;
                  const overlapR = (b.x + b.w) - (ball.x - ball.radius);
                  const overlapT = (ball.y + ball.radius) - b.y;
                  const overlapB = (b.y + b.h) - (ball.y - ball.radius);
                  const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);
                  if (minOverlap === overlapL || minOverlap === overlapR) ball.vx *= -1;
                  else ball.vy *= -1;

                  const dmg = state.isVip ? 2 : 1;
                  b.hp -= dmg;
                  playSound('brick');

                  for (let p = 0; p < 7; p++) {
                    particles.push({
                      x: b.x + b.w / 2, y: b.y + b.h / 2,
                      vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180,
                      radius: 2 + Math.random() * 3, color: b.color, life: 0.45
                    });
                  }

                  if (b.hp <= 0) {
                    if (b.canDrop) spawnItem(b.x + b.w / 2, b.y + b.h / 2);
                    bricks.splice(i, 1);
                    const gainScore = 100 * stage;
                    score += state.isVip ? gainScore * 3 : gainScore;
                    state.gold += state.isVip ? 50 : 10;
                    playSound('score');
                    saveState(false);
                  }

                  if (bricks.length === 0) {
                    if (stage >= MAX_STAGE) {
                      allCleared = true;
                      gameRunning = false;
                      stopBGM();
                      if (score > state.highScore) {
                        state.highScore = score;
                        saveState(true);
                      }
                      showAllClearOverlay();
                    } else {
                      stage++;
                      showStageClearOverlay();
                      gameRunning = false;
                      stopBGM();
                    }
                  }
                  updateUI();
                  break;
                }
              }
            }

            // 미사일 업데이트
            if (missileCooldown > 0) missileCooldown = Math.max(0, missileCooldown - dt);
            for (let mi = missiles.length - 1; mi >= 0; mi--) {
              const m = missiles[mi];
              m.y += m.vy * dt;
              if (m.y + m.h < 0) {
                missiles.splice(mi, 1);
                continue;
              }
              let hit = false;
              for (let i = bricks.length - 1; i >= 0; i--) {
                const b = bricks[i];
                if (
                  m.x + m.w > b.x && m.x < b.x + b.w &&
                  m.y + m.h > b.y && m.y < b.y + b.h
                ) {
                  b.hp -= state.isVip ? 2 : 1;
                  playSound('brick');
                  for (let p = 0; p < 5; p++) {
                    particles.push({
                      x: b.x + b.w / 2, y: b.y + b.h / 2,
                      vx: (Math.random() - 0.5) * 140, vy: (Math.random() - 0.5) * 140,
                      radius: 2 + Math.random() * 2, color: b.color, life: 0.35
                    });
                  }
                  if (b.hp <= 0) {
                    if (b.canDrop) spawnItem(b.x + b.w / 2, b.y + b.h / 2);
                    bricks.splice(i, 1);
                    const gainScore = 100 * stage;
                    score += state.isVip ? gainScore * 3 : gainScore;
                    state.gold += state.isVip ? 50 : 10;
                    playSound('score');
                    saveState(false);
                  }
                  if (bricks.length === 0) {
                    if (stage >= MAX_STAGE) {
                      allCleared = true;
                      gameRunning = false;
                      stopBGM();
                      if (score > state.highScore) {
                        state.highScore = score;
                        saveState(true);
                      }
                      showAllClearOverlay();
                    } else {
                      stage++;
                      showStageClearOverlay();
                      gameRunning = false;
                      stopBGM();
                    }
                  }
                  updateUI();
                  hit = true;
                  break;
                }
              }
              if (hit) missiles.splice(mi, 1);
            }

            // 아이템 낙하 & 패들 수집
            for (let i = items.length - 1; i >= 0; i--) {
              const it = items[i];
              it.y += it.vy * dt;
              it.life -= dt;
              if (it.y > canvasHeight + 20 || it.life <= 0) {
                items.splice(i, 1);
                continue;
              }
              if (
                it.y + it.h >= paddle.y &&
                it.y <= paddle.y + paddle.height &&
                it.x + it.w / 2 >= paddle.x &&
                it.x - it.w / 2 <= paddle.x + paddle.width
              ) {
                applyItem(it.type);
                items.splice(i, 1);
              }
            }
          }

          // 파티클 업데이트
          for (let i = particles.length - 1; i >= 0; i--) {
            const pt = particles[i];
            pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
            if (pt.life <= 0) { particles.splice(i, 1); continue; }
          }

          // 렌더링
          ctx.clearRect(0, 0, canvasWidth, canvasHeight);

          const bgGrad = ctx.createRadialGradient(canvasWidth / 2, canvasHeight / 2, 20, canvasWidth / 2, canvasHeight / 2, canvasWidth * 0.75);
          bgGrad.addColorStop(0, '#090d16');
          bgGrad.addColorStop(1, '#020617');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);

          bgStars.forEach(s => {
            s.y -= s.speed * dt;
            if (s.y < 0) s.y = 1;
            ctx.fillStyle = `rgba(148, 163, 184, ${s.alpha})`;
            ctx.beginPath(); ctx.arc(s.x * canvasWidth, s.y * canvasHeight, s.size, 0, Math.PI * 2); ctx.fill();
          });

          ctx.strokeStyle = 'rgba(14, 165, 233, 0.08)';
          ctx.lineWidth = 1;
          for (let x = 0; x < canvasWidth; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke();
          }

          // 벽돌
          bricks.forEach(b => {
            ctx.save();
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 12;
            ctx.fillStyle = b.color;
            ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.stroke();
            // 아이템 드롭 가능 벽돌 표시
            if (b.canDrop) {
              ctx.fillStyle = 'rgba(255,255,255,0.35)';
              ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 3, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
          });

          // 아이템
          items.forEach(it => {
            ctx.save();
            if (it.type === 'multi') {
              ctx.shadowColor = '#fbbf24';
              ctx.shadowBlur = 14;
              ctx.fillStyle = '#f59e0b';
            } else {
              ctx.shadowColor = '#22d3ee';
              ctx.shadowBlur = 14;
              ctx.fillStyle = '#06b6d4';
            }
            ctx.beginPath(); ctx.roundRect(it.x - it.w / 2, it.y, it.w, it.h, 4); ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(it.type === 'multi' ? '⚡' : '🛡️', it.x, it.y + it.h / 2);
            ctx.restore();
          });

          // 파티클
          particles.forEach(pt => {
            ctx.save();
            ctx.globalAlpha = Math.max(0, pt.life * 2.2);
            ctx.fillStyle = pt.color;
            ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          });

          // 패들
          ctx.save();
          ctx.shadowColor = paddleWidenTimer > 0 ? '#a855f7' : '#06b6d4';
          ctx.shadowBlur = paddleWidenTimer > 0 ? 24 : 18;
          const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
          if (paddleWidenTimer > 0) {
            paddleGrad.addColorStop(0, '#e879f9');
            paddleGrad.addColorStop(1, '#7c3aed');
          } else {
            paddleGrad.addColorStop(0, '#22d3ee');
            paddleGrad.addColorStop(1, '#0284c7');
          }
          ctx.fillStyle = paddleGrad;
          ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8); ctx.fill();
          ctx.strokeStyle = paddleWidenTimer > 0 ? '#f5d0fe' : '#a5f3fc';
          ctx.lineWidth = 1.8; ctx.stroke();
          ctx.restore();

          // 공들
          balls.forEach(ball => {
            ctx.save();
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#fb7185';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff1f2'; ctx.lineWidth = 2.5; ctx.stroke();
            ctx.restore();
          });

          // 미사일
          missiles.forEach(m => {
            ctx.save();
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 12;
            const mg = ctx.createLinearGradient(m.x, m.y + m.h, m.x, m.y);
            mg.addColorStop(0, '#f59e0b');
            mg.addColorStop(1, '#fef08a');
            ctx.fillStyle = mg;
            ctx.beginPath(); ctx.roundRect(m.x, m.y, m.w, m.h, 2); ctx.fill();
            ctx.restore();
          });

        } catch (err) {}

        requestAnimationFrame(gameLoop);
      }

      function showGameOverOverlay() {
        const overlay = document.getElementById('gameOverlay');
        document.getElementById('overlayTitle').textContent = 'GAME OVER';
        document.getElementById('overlaySub').textContent = `최종 점수: ${score.toLocaleString()}점 · 생존 시간 ${formatTime(gameTime)}`;
        document.getElementById('overlayActionBtn').textContent = '다시 도전하기';
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      }

      function showStageClearOverlay() {
        const overlay = document.getElementById('gameOverlay');
        document.getElementById('overlayTitle').textContent = `STAGE ${stage - 1} 클리어!`;
        document.getElementById('overlaySub').textContent = `현재 점수: ${score.toLocaleString()}점. STAGE ${stage}/10 으로 진격하세요!`;
        document.getElementById('overlayActionBtn').textContent = `STAGE ${stage} 시작하기`;
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      }

      function showAllClearOverlay() {
        const overlay = document.getElementById('gameOverlay');
        document.getElementById('overlayTitle').textContent = '🏆 ALL CLEAR!';
        document.getElementById('overlaySub').textContent = `전 스테이지(1~10) 클리어! 최종 점수 ${score.toLocaleString()}점 · ${formatTime(gameTime)}`;
        document.getElementById('overlayActionBtn').textContent = '처음부터 다시하기';
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      }

      document.getElementById('overlayActionBtn').addEventListener('click', () => {
        if (allCleared || lives <= 0) {
          startNewGame();
          return;
        }
        continueOrStart();
      });

      document.getElementById('startGameBtn').addEventListener('click', () => {
        if (!gameRunning) continueOrStart();
        else launchBall();
      });

      // 소리 및 배경음 ON/OFF 버튼 연동
      const soundToggleBtn = document.getElementById('soundToggleBtn');
      soundToggleBtn.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        saveState(true);
        updateUI();
        showToast(state.soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF');
      });

      const bgmToggleBtn = document.getElementById('bgmToggleBtn');
      bgmToggleBtn.addEventListener('click', () => {
        state.bgmEnabled = !state.bgmEnabled;
        saveState(true);
        updateUI();
        if (state.bgmEnabled) {
          startBGM();
          showToast('🎵 배경음 ON');
        } else {
          stopBGM();
          showToast('🔇 배경음 OFF');
        }
      });

      const brickRankModal = document.getElementById('brickRankModal');
      document.getElementById('rankOpenBtn').addEventListener('click', () => {
        fetchAndRenderRanking();
        brickRankModal.classList.remove('hidden');
        brickRankModal.classList.add('flex');
      });
      document.getElementById('brickRankCloseBtn').addEventListener('click', () => {
        brickRankModal.classList.add('hidden');
        brickRankModal.classList.remove('flex');
      });
      brickRankModal.addEventListener('click', (e) => {
        if (e.target === brickRankModal) {
          brickRankModal.classList.add('hidden');
          brickRankModal.classList.remove('flex');
        }
      });

      async function fetchAndRenderRanking() {
        const listContainer = document.getElementById('rankingListContainer');
        const myRankDetail = document.getElementById('myRankDetailText');
        if (myRankDetail) myRankDetail.textContent = `${(state.highScore || 0).toLocaleString()} 점`;
        if (!listContainer) return;
        try {
          const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
          const res = await fetch(`${API_BASE_URL}/api/ranking?gameId=${GAME_ID}&_t=${Date.now()}`, { headers });
          const data = await res.json();
          if (!res.ok) throw new Error();

          const rankings = (data.rankings || []).slice(0, 10);
          const myRank = data.myRank;
          if (myRank && myRankDetail) {
            myRankDetail.textContent = `${myRank.score.toLocaleString()} 점 (${myRank.rank}위)`;
          }

          if (rankings.length === 0) {
            listContainer.innerHTML = '<div class="text-center py-4 text-slate-500">아직 등록된 순위가 없습니다.</div>';
            return;
          }
          listContainer.innerHTML = rankings.map((item, idx) => `
            <div class="rounded-xl px-3 py-2 border ${item.isMe ? 'border-cyan-400/60' : 'border-slate-800'} bg-slate-950/80 flex items-center justify-between">
              <span class="text-xs font-bold text-slate-100">${item.rank || idx + 1}위 ${maskPhoneMiddle(item.maskedName || '익명')}</span>
              <span class="text-xs font-black text-cyan-400">${(item.score || 0).toLocaleString()} 점</span>
            </div>
          `).join('');
        } catch (err) {
          listContainer.innerHTML = '<div class="text-center py-4 text-xs text-slate-400">랭킹 서버 연결 대기 중</div>';
        }
      }

      // 통합 인증 & 로그아웃 모달
      const logoutConfirmModal = document.getElementById('logoutConfirmModal');
      document.getElementById('authHeaderBtn').addEventListener('click', () => {
        if (authToken) {
          logoutConfirmModal.classList.remove('hidden');
          logoutConfirmModal.classList.add('flex');
        } else {
          goLobbyAuth('login');
        }
      });
      document.getElementById('logoutCancelBtn').addEventListener('click', () => {
        logoutConfirmModal.classList.add('hidden');
        logoutConfirmModal.classList.remove('flex');
      });
      document.getElementById('logoutConfirmBtn').addEventListener('click', () => {
        logoutConfirmModal.classList.add('hidden');
        logoutConfirmModal.classList.remove('flex');
        handleLogout(false);
      });

      function handleLogout(expired = false) {
        authToken = null;
        currentUsername = null;
        saveSharedAuth(null, null, false);
        state.isVip = false;
        updateAuthHeaderUI();
        updateUI();
        fetchAndRenderRanking();
        showToast(expired ? '로그인 정보가 만료되었습니다.' : '로그아웃되었습니다.');
      }

      function updateAuthHeaderUI() {
        const authBtn = document.getElementById('authHeaderBtn');
        if (!authBtn) return;
        if (authToken) {
          authBtn.textContent = state.isVip ? '👑 VIP 로그아웃' : '로그아웃';
          authBtn.className = state.isVip
            ? 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-r from-fuchsia-600 via-purple-600 to-indigo-600 text-white border border-amber-300/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0'
            : 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 shadow transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0';
        } else {
          authBtn.textContent = '로그인';
          authBtn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0';
        }
      }

      document.getElementById('headerExitLobbyBtn').addEventListener('click', () => {
        window.location.href = LOBBY_URL;
      });

      ['pageshow', 'focus', 'storage'].forEach(evt => {
        window.addEventListener(evt, () => {
          loadSharedAuth();
          if (localStorage.getItem(VIP_KEY) === 'true') state.isVip = true;
          updateUI();
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          loadSharedAuth();
          if (localStorage.getItem(VIP_KEY) === 'true') state.isVip = true;
          updateUI();
        }
      });

      function formatTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function updateUI() {
        document.getElementById('scoreDisplay').textContent = `점수: ${score.toLocaleString()} 점`;
        document.getElementById('scoreBadge').textContent = `STAGE ${stage}/10`;
        document.getElementById('livesDisplay').textContent = (state.isVip ? '👑' : '') + ('❤️'.repeat(Math.max(0, lives)) || '💀');
        const timeEl = document.getElementById('timeDisplay');
        if (timeEl) timeEl.textContent = formatTime(gameTime);

        const soundBtn = document.getElementById('soundToggleBtn');
        soundBtn.textContent = state.soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
        soundBtn.className = state.soundEnabled
          ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap'
          : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';

        const bgmBtn = document.getElementById('bgmToggleBtn');
        bgmBtn.textContent = state.bgmEnabled ? '🎵 배경음 ON' : '🔇 배경음 OFF';
        bgmBtn.className = state.bgmEnabled
          ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap'
          : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';

        updateAuthHeaderUI();
      }

      let toastTimer = null;
      function showToast(message) {
        const box = document.getElementById('toastBox');
        const msg = document.getElementById('toastMsg');
        msg.textContent = message;
        box.classList.remove('opacity-0', '-translate-y-2');
        box.classList.add('opacity-100', 'translate-y-0');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          box.classList.remove('opacity-100', 'translate-y-0');
          box.classList.add('opacity-0', '-translate-y-2');
        }, 1800);
      }

      window.onload = async () => {
        resizeCanvas();
        updateUI();
        if (authToken) await loadFromServer();
        initBricks();
        resetBallAndPaddle();
        fetchAndRenderRanking();
        requestAnimationFrame(gameLoop);
      };
    })();
  </script>
</body>
</html>
