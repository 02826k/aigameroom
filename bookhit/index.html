<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <title>판치기 — 교실의 전설</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    canvas { touch-action: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.7); border-radius: 9999px; }

    #fullscreenStage { display: contents; }

    /* 전체화면 기본 (모바일 포함) */
    #fullscreenStage:fullscreen {
      display: flex !important;
      flex-direction: column !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      background: #020617 !important;
      overflow: hidden !important;
      z-index: 40 !important;
    }
    #fullscreenStage:fullscreen #topControlBar {
      width: 100% !important;
      flex-shrink: 0 !important;
      border-radius: 0 !important;
      border-left: none !important;
      border-right: none !important;
      border-top: none !important;
      padding: 6px 14px !important;
      background: rgba(15, 23, 42, 0.95) !important;
    }
    #fullscreenStage:fullscreen #gameAreaSection {
      flex: 1 1 0% !important;
      min-height: 0 !important;
      width: 100% !important;
      border: none !important;
      border-radius: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: #020617 !important;
    }
    #fullscreenStage:fullscreen #cv {
      max-width: 100% !important;
      max-height: 100% !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
    }

    /* PC(컴퓨터) 전용: 일반 화면 및 전체화면 좌우 꽉 차게 */
    @media (min-width: 1024px) {
      #headerInner,
      #mainWrap {
        max-width: 100% !important;
        padding-left: 16px !important;
        padding-right: 16px !important;
      }
      #gameAreaSection {
        width: 100% !important;
      }
      #cv {
        width: 100% !important;
        height: auto !important;
      }
      #fullscreenStage:fullscreen #cv {
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        object-fit: fill !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur px-4 py-2.5 sticky top-0 z-30 shadow-lg shadow-black/30">
    <div id="headerInner" class="max-w-5xl mx-auto flex flex-col gap-2">
      <!-- 1단 -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-gradient-to-br from-rose-400/25 to-amber-600/25 text-amber-300 font-extrabold text-sm border border-amber-500/40 shadow-inner shrink-0">🪙</span>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-50 truncate">판치기 <span class="text-amber-400">: 교실의 전설</span></h1>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="authHeaderBtn" type="button"
            class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap">
            로그인
          </button>
        </div>
      </div>

      <!-- 2단 -->
      <div class="flex items-center justify-between gap-2 pt-1.5 border-t border-slate-800/70">
        <div class="flex items-center gap-1.5 shrink-0 ml-auto">
          <button id="bgmToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer">
            🎵 배경음 ON
          </button>
          <button id="soundToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer">
            🔊 효과음 ON
          </button>
          <button id="headerExitLobbyBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition active:scale-95 cursor-pointer">
            나가기
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="mainWrap" class="flex-1 max-w-5xl w-full mx-auto px-2.5 sm:px-4 py-3 sm:py-4 flex flex-col gap-3">
    <div id="fullscreenStage">
      <!-- 통합 상단 바: 좌측(스테이지) · 중앙(게임 메뉴) · 우측(RANK / 전체화면) -->
      <section id="topControlBar" class="bg-slate-900/90 border border-amber-500/35 rounded-xl px-3 py-2 flex flex-wrap items-center justify-between gap-2 shadow-lg">
        <div class="shrink-0">
          <div class="text-[10px] text-amber-300/90 font-bold leading-tight">🪙 책 위 동전 뒤집기</div>
          <div id="stageInfoDisplay" class="text-xs font-extrabold text-emerald-300 mt-0.5 leading-tight">1교시 쉬는시간 · 학교 교실</div>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-1.5">
          <button id="bookBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-black bg-slate-800 hover:bg-slate-700 border border-sky-500/50 text-sky-300 active:scale-95 cursor-pointer">📘 책 교체</button>
          <button id="modeBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-black bg-slate-800 hover:bg-slate-700 border border-sky-500/50 text-sky-300 active:scale-95 cursor-pointer">AI 대전</button>
          <div class="flex items-center gap-1">
            <button id="autoBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-black bg-slate-800 border border-slate-600 text-slate-300 active:scale-95 cursor-pointer">자동 배치</button>
            <div id="autoIcons" class="hidden items-center gap-1">
              <button id="icV" type="button" title="세로배치" class="w-7 h-7 rounded-md border flex items-center justify-center active:scale-95 cursor-pointer">
                <svg width="15" height="17" viewBox="0 0 16 18"><circle cx="8" cy="3.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="9" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="14.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              </button>
              <button id="icC" type="button" title="뭉치배치" class="w-7 h-7 rounded-md border flex items-center justify-center active:scale-95 cursor-pointer">
                <svg width="15" height="15" viewBox="0 0 16 16"><circle cx="4.5" cy="4.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11.5" cy="4.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4.5" cy="11.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11.5" cy="11.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              </button>
            </div>
          </div>
          <button id="resetBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-black bg-rose-900/70 hover:bg-rose-800/80 border border-rose-500/50 text-rose-200 active:scale-95 cursor-pointer">판 초기화</button>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button id="rankOpenBtn" type="button" title="TOP 10 랭킹 보기"
            class="px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-black bg-slate-800 hover:bg-slate-700 border border-amber-400/50 text-amber-300 cursor-pointer active:scale-95 transition shadow">
            🏆 RANK
          </button>
          <button id="fullscreenBtn" type="button" title="전체화면 전환"
            class="px-3.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-black bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 cursor-pointer active:scale-95 transition shadow">
            ⛶ 전체화면
          </button>
        </div>
      </section>

      <!-- 게임 캔버스 영역 -->
      <section id="gameAreaSection" class="relative rounded-2xl overflow-hidden border-2 border-slate-800 shadow-2xl shadow-black/60 bg-slate-900">
        <canvas id="cv" width="1120" height="740" class="block w-full h-auto cursor-crosshair"></canvas>

        <!-- 게임 화면 내 RANK TOP 10 오버레이 (새로고침 버튼 삭제) -->
        <div id="rankOverlay" class="hidden absolute inset-0 z-30 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-3">
          <div class="w-full max-w-sm bg-slate-900 border border-amber-500/40 rounded-2xl p-3.5 shadow-2xl flex flex-col gap-2 max-h-full">
            <div class="flex items-center justify-between">
              <div class="text-xs sm:text-sm font-black text-amber-300">🏆 판치기 TOP 10 (최고 보유 금액)</div>
              <button id="rankCloseBtn" type="button" class="px-2 py-1 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer">✕</button>
            </div>
            <div class="rounded-xl border border-amber-500/25 px-2.5 py-1.5 flex justify-between text-[11px] bg-slate-950/85">
              <span class="text-slate-400 font-semibold">내 순위</span>
              <span id="myRankDetailText" class="font-extrabold text-amber-300">불러오는 중...</span>
            </div>
            <div id="rankingListContainer" class="flex flex-col gap-1 overflow-y-auto pr-1 max-h-[240px]"></div>
          </div>
        </div>
      </section>
    </div>

    <p class="text-[11px] text-slate-400 text-center leading-relaxed">
      마우스(손가락)를 누른 채 <b class="text-sky-300">왼쪽</b>으로 당기면 안쪽 치기, 제자리 클릭은 <b class="text-emerald-300">수직</b> 내리치기, <b class="text-rose-300">오른쪽</b>으로 당기면 바깥쪽 치기! (숫자 1~5 파워 조절)
    </p>
  </main>

  <!-- Toast -->
  <div id="toastBox" class="pointer-events-none fixed bottom-5 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 translate-y-2">
    <div id="toastMsg" class="px-4 py-2 rounded-xl bg-slate-900/95 border border-amber-500/50 text-xs sm:text-sm font-bold text-amber-200 shadow-2xl">알림</div>
  </div>

  <!-- 로그인 모달 -->
  <div id="authModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-base font-extrabold text-amber-300">🟨 서버 저장 계정</h2>
        <button id="authCloseBtn" type="button" class="text-slate-400 hover:text-slate-200 text-sm font-bold px-2 py-1 cursor-pointer">✕</button>
      </div>
      <p class="text-xs text-slate-400 mb-4">휴대폰 번호 뒷 8자리와 숫자 비밀번호 4자리로 최고 보유 금액을 서버에 영구 저장하세요.</p>
      <div class="flex rounded-xl bg-slate-950 p-1 border border-slate-800 mb-4">
        <button id="modeLoginBtn" type="button" class="flex-1 py-1.5 rounded-lg text-xs font-extrabold bg-amber-500 text-slate-950 cursor-pointer">기존 계정 로그인</button>
        <button id="modeRegisterBtn" type="button" class="flex-1 py-1.5 rounded-lg text-xs font-extrabold text-slate-400 cursor-pointer">간편 회원가입</button>
      </div>
      <form id="authForm" class="flex flex-col gap-3.5">
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">아이디 (휴대폰 번호 뒷 8자리)</label>
          <div class="flex items-center rounded-xl bg-slate-950 border border-slate-700 overflow-hidden">
            <span class="px-3 py-2 bg-slate-900 text-amber-300 font-extrabold text-sm border-r border-slate-800">010 -</span>
            <input id="authPhoneDigits" type="tel" inputmode="numeric" maxlength="9" required placeholder="1234-5678" class="w-full px-3 py-2 bg-transparent text-sm font-bold text-slate-100 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">비밀번호 (숫자 4자리)</label>
          <input id="authPinCode" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" required placeholder="1234" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm font-bold tracking-[0.35em] text-slate-100 focus:outline-none" />
        </div>
        <div id="authErrorMsg" class="hidden text-xs text-rose-400 font-semibold bg-rose-950/40 border border-rose-800/50 rounded-lg px-3 py-2"></div>
        <button id="authSubmitBtn" type="submit" class="w-full py-2.5 rounded-xl text-xs sm:text-sm font-black bg-amber-500 hover:bg-amber-400 text-slate-950 shadow cursor-pointer">로그인 및 서버저장 연동</button>
      </form>
    </div>
  </div>

  <script>
    (() => {
      // ==========================================
      // 1. 서버 연동 & 공용 인증 (최고 보유 금액 랭킹)
      // ==========================================
      const GAME_ID = 'panchigi_v1';
      const CLOUD_API_URL = 'https://02826k.duckdns.org';
      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const API_BASE_URL = isLocalHost ? '' : CLOUD_API_URL;
      const STORAGE_KEY = 'panchigi_save_v1';
      const TOKEN_KEY = 'aigameroom_jwt_token';
      const USER_KEY = 'aigameroom_username';

      const ALL_TOKEN_KEYS = [TOKEN_KEY, 'abuse_jwt_token', 'hero_clicker_jwt_token', 'sky2026_jwt_token'];
      const ALL_USER_KEYS = [USER_KEY, 'abuse_username', 'hero_clicker_username', 'sky2026_username'];

      function readSharedAuth() {
        let t = null, u = null;
        for (const k of ALL_TOKEN_KEYS) { if (!t) t = localStorage.getItem(k); }
        for (const k of ALL_USER_KEYS) { if (!u) u = localStorage.getItem(k); }
        return { t, u };
      }
      function syncSharedAuth(t, u) {
        try {
          if (t && u) {
            ALL_TOKEN_KEYS.forEach((k) => localStorage.setItem(k, t));
            ALL_USER_KEYS.forEach((k) => localStorage.setItem(k, u));
          } else {
            ALL_TOKEN_KEYS.forEach((k) => localStorage.removeItem(k));
            ALL_USER_KEYS.forEach((k) => localStorage.removeItem(k));
            localStorage.removeItem('hero_clicker_is_vip');
          }
        } catch (e) {}
      }

      let { t: authToken, u: currentUsername } = readSharedAuth();
      let isRegisterMode = false;

      let saveStateObj = {
        bestMoney: 0,
        soundEnabled: true,
        bgmEnabled: true,
        isVip: false
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) saveStateObj = { ...saveStateObj, ...JSON.parse(raw) };
      } catch (e) {}

      function persistState(syncCloud = false) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saveStateObj)); } catch (e) {}
        if (syncCloud && authToken) syncSaveToServer(false);
      }

      function maskPhoneMiddle(name) {
        const str = String(name || '');
        const m = str.match(/^(01[016789])[-.\s]?(\d{3,4}|\*{3,4})[-.\s]?(\d{4}|\*{4})$/);
        if (m) return `${m[1]}-****-${m[3]}`;
        return str.replace(/(01[016789])[-.\s]?(\d{3,4})[-.\s]?(\d{4})/g, '$1-****-$3');
      }

      let toastTimer = null;
      function showToast(msg) {
        const b = document.getElementById('toastBox');
        document.getElementById('toastMsg').textContent = msg;
        b.classList.remove('opacity-0', 'translate-y-2');
        b.classList.add('opacity-100', 'translate-y-0');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          b.classList.remove('opacity-100', 'translate-y-0');
          b.classList.add('opacity-0', 'translate-y-2');
        }, 2200);
      }

      async function syncSaveToServer(notify = false) {
        if (!authToken) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
            body: JSON.stringify({
              gameId: GAME_ID,
              saveData: saveStateObj,
              score: saveStateObj.bestMoney
            })
          });
          if (res.status === 401 || res.status === 403) { handleLogout(true); return; }
          if (res.ok) {
            if (notify) showToast('🟨 클라우드 서버에 기록이 저장되었습니다!');
            fetchRanking();
          }
        } catch (e) {}
      }

      async function loadFromServer() {
        if (!authToken) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/load?gameId=${GAME_ID}`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          if (res.status === 401 || res.status === 403) { handleLogout(true); return; }
          const data = await res.json();
          if (res.ok && data.saveData) {
            const sd = typeof data.saveData === 'string' ? JSON.parse(data.saveData) : data.saveData;
            saveStateObj.bestMoney = Math.max(saveStateObj.bestMoney, Number(sd.bestMoney || 0));
            saveStateObj.isVip = Boolean(data.isVip || sd.isVip || saveStateObj.isVip);
            persistState(false);
            updateHeaderUI();
          }
        } catch (e) {}
      }

      async function fetchRanking() {
        const listEl = document.getElementById('rankingListContainer');
        const myRankEl = document.getElementById('myRankDetailText');
        try {
          const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
          const res = await fetch(`${API_BASE_URL}/api/ranking?gameId=${GAME_ID}&_t=${Date.now()}`, { headers });
          const data = await res.json();
          if (!res.ok) throw new Error();
          const rankings = data.rankings || [];
          if (data.myRank) {
            myRankEl.textContent = `전체 ${data.totalPlayers || rankings.length}명 중 ${data.myRank.rank}위 · 최고 ${Number(data.myRank.score || saveStateObj.bestMoney).toLocaleString()}원`;
          } else if (authToken) {
            myRankEl.textContent = '게임 종료 시 최고 보유 금액이 반영됩니다';
          } else {
            myRankEl.textContent = '로그인 시 실시간 순위에 등록됩니다';
          }
          if (!rankings.length) {
            listEl.innerHTML = '<div class="text-center py-4 text-xs text-slate-500">아직 등록된 기록이 없습니다. 첫 1위에 도전하세요!</div>';
            return;
          }
          listEl.innerHTML = rankings.slice(0, 10).map((item, idx) => {
            const rank = item.rank ?? (idx + 1);
            return `
              <div class="rounded-xl px-3 py-2 border ${item.isMe ? 'bg-amber-950/30 border-amber-400/60' : 'bg-slate-950/80 border-slate-800'} flex items-center justify-between text-xs">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="font-black text-amber-300 w-6">${rank}위</span>
                  <span class="font-bold text-slate-100 truncate">${maskPhoneMiddle(item.maskedName)}</span>
                  ${item.isMe ? '<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px] font-bold">나</span>' : ''}
                </div>
                <span class="font-black text-emerald-400 shrink-0">${Number(item.score || 0).toLocaleString()}원</span>
              </div>
            `;
          }).join('');
        } catch (e) {
          listEl.innerHTML = '<div class="text-center py-4 text-xs text-slate-500">랭킹 서버 연결 대기 중...</div>';
        }
      }

      // ==========================================
      // 2. Web Audio (BGM & 효과음)
      // ==========================================
      let audioCtx = null, bgmTimer = null, bgmStep = 0;
      function getAC() {
        if (!saveStateObj.soundEnabled && !saveStateObj.bgmEnabled) return null;
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
      }
      function beep(f, d, t = 'triangle', vol = 0.12) {
        if (!saveStateObj.soundEnabled) return;
        const ac = getAC(); if (!ac) return;
        try {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = t; o.frequency.value = f; g.gain.value = vol;

      const relay = (l) => { G.layout = l; syncUI(); if (G.auto && (G.state === 'SETUP' || (G.state === 'READY' && G.slapCount === 0))) autoPlace(); };
      $('icV').onclick = () => relay('vertical');
      $('icC').onclick = () => relay('cluster');

      // 배경음 & 효과음 토글
      function updateAudioButtons() {
        const b = $('bgmToggleBtn'), s = $('soundToggleBtn');
        b.textContent = saveStateObj.bgmEnabled ? '🎵 배경음 ON' : '🔇 배경음 OFF';
        b.className = saveStateObj.bgmEnabled
          ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer'
          : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer';
        s.textContent = saveStateObj.soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
        s.className = saveStateObj.soundEnabled
          ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer'
          : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer';
      }
      updateAudioButtons();
      $('bgmToggleBtn').onclick = () => {
        saveStateObj.bgmEnabled = !saveStateObj.bgmEnabled; persistState(false); updateAudioButtons();
        if (saveStateObj.bgmEnabled) { getAC(); startBGM(); } else stopBGM();
      };
      $('soundToggleBtn').onclick = () => {
        saveStateObj.soundEnabled = !saveStateObj.soundEnabled; persistState(false); updateAudioButtons();
      };
      $('headerExitLobbyBtn').onclick = () => { recordMaxMoney(false); window.location.href = 'https://02826k.github.io/aigameroom/'; };

      // 전체화면 전환 & 모바일 화면 회전 잠금
      const fullscreenStage = $('fullscreenStage'), fullscreenBtn = $('fullscreenBtn');
      function lockOrientationMode(mode) {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock(mode).catch(() => {
            if (mode === 'portrait' && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch {} }
          });
        }
      }
      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            await fullscreenStage.requestFullscreen();
            fullscreenBtn.textContent = '✕ 축소';
            lockOrientationMode('landscape');
          } else {
            await document.exitFullscreen();
            fullscreenBtn.textContent = '⛶ 전체화면';
            lockOrientationMode('portrait');
          }
        } catch (e) {
          showToast('이 브라우저에서는 전체화면을 지원하지 않습니다.');
        }
      }
      fullscreenBtn.onclick = toggleFullscreen;
      document.addEventListener('fullscreenchange', () => {
        const isFs = Boolean(document.fullscreenElement);
        fullscreenBtn.textContent = isFs ? '✕ 축소' : '⛶ 전체화면';
        if (!isFs) lockOrientationMode('portrait');
      });

      // 로그인 / 로그아웃 / VIP 헤더
      function updateHeaderUI() {
        const btn = $('authHeaderBtn');
        const isVip = saveStateObj.isVip || localStorage.getItem('hero_clicker_is_vip') === 'true';
        if (authToken && currentUsername) {
          if (isVip) {
            btn.textContent = '👑 VIP 로그아웃';
            btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-r from-purple-600 to-indigo-600 hover:brightness-110 text-amber-200 border border-amber-300/70 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap';
          } else {
            btn.textContent = '로그아웃';
            btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-600 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap';
          }
        } else {
          btn.textContent = '로그인';
          btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap';
        }
      }
      function handleLogout(expired = false) {
        authToken = null; currentUsername = null; saveStateObj.isVip = false;
        syncSharedAuth(null, null); updateHeaderUI(); fetchRanking();
        showToast(expired ? '로그인이 만료되었습니다.' : '로그아웃되었습니다.');
      }
      function syncAuthFromStorage() {
        const { t, u } = readSharedAuth();
        if (t !== authToken || u !== currentUsername) {
          authToken = t; currentUsername = u;
          if (!authToken) saveStateObj.isVip = false;
          updateHeaderUI(); if (authToken) loadFromServer(); fetchRanking();
        }
      }
      window.addEventListener('pageshow', syncAuthFromStorage);
      window.addEventListener('storage', syncAuthFromStorage);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncAuthFromStorage(); });

      const authModal = $('authModal'), phoneInput = $('authPhoneDigits'), pinInput = $('authPinCode');
      $('authHeaderBtn').onclick = () => {
        if (authToken && currentUsername) { if (confirm('로그아웃 하시겠습니까?')) handleLogout(false); }
        else { authModal.classList.remove('hidden'); authModal.classList.add('flex'); phoneInput.focus(); }
      };
      $('authCloseBtn').onclick = () => { authModal.classList.add('hidden'); authModal.classList.remove('flex'); };
      $('modeLoginBtn').onclick = () => {
        isRegisterMode = false;
        $('modeLoginBtn').className = 'flex-1 py-1.5 rounded-lg text-xs font-extrabold bg-amber-500 text-slate-950 cursor-pointer';
        $('modeRegisterBtn').className = 'flex-1 py-1.5 rounded-lg text-xs font-extrabold text-slate-400 cursor-pointer';
      };
      $('modeRegisterBtn').onclick = () => {
        isRegisterMode = true;
        $('modeRegisterBtn').className = 'flex-1 py-1.5 rounded-lg text-xs font-extrabold bg-amber-500 text-slate-950 cursor-pointer';
        $('modeLoginBtn').className = 'flex-1 py-1.5 rounded-lg text-xs font-extrabold text-slate-400 cursor-pointer';
      };
      phoneInput.addEventListener('input', (e) => {
        const d = e.target.value.replace(/\D/g, '').slice(0, 8);
        e.target.value = d.length > 4 ? `${d.slice(0, 4)}-${d.slice(4)}` : d;
      });
      pinInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });

      $('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = $('authErrorMsg'); errEl.classList.add('hidden');
        const digits = phoneInput.value.replace(/\D/g, ''), pin = pinInput.value.trim();
        if (digits.length !== 8 || !/^\d{4}$/.test(pin)) {
          errEl.textContent = '휴대폰 번호 8자리와 숫자 비밀번호 4자리를 확인해 주세요.';
          errEl.classList.remove('hidden'); return;
        }
        const fullId = `010-${digits.slice(0, 4)}-${digits.slice(4)}`;
        try {
          const res = await fetch(`${API_BASE_URL}${isRegisterMode ? '/api/register' : '/api/login'}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: fullId, password: pin, gameId: GAME_ID, initialSaveData: saveStateObj })
          });
          const data = await res.json();
          if (!res.ok) { errEl.textContent = data.error || '처리 중 오류가 발생했습니다.'; errEl.classList.remove('hidden'); return; }
          authToken = data.token; currentUsername = data.username;
          syncSharedAuth(authToken, currentUsername);
          if (data.isVip) saveStateObj.isVip = true;
          await loadFromServer(); await syncSaveToServer(false);
          updateHeaderUI(); authModal.classList.add('hidden'); authModal.classList.remove('flex'); pinInput.value = '';
          showToast(`🟨 [${maskPhoneMiddle(currentUsername)}] 연동 완료!`);
        } catch (err) {
          errEl.textContent = '클라우드 서버와 연결할 수 없습니다.'; errEl.classList.remove('hidden');
        }
      });

      // 랭킹 오버레이 (열 때마다 자동 갱신)
      const rankOverlay = $('rankOverlay');
      $('rankOpenBtn').onclick = () => { fetchRanking(); rankOverlay.classList.remove('hidden'); };
      $('rankCloseBtn').onclick = () => { rankOverlay.classList.add('hidden'); };
      rankOverlay.addEventListener('click', (e) => { if (e.target === rankOverlay) rankOverlay.classList.add('hidden'); });

      // 시작 & 60fps 고정 타임스텝 메인 루프
      updateHeaderUI();
      if (authToken) loadFromServer();
      fetchRanking();
      startMatch(false);

      const STEP = 1 / 60;
      let lastTs = 0, acc = 0;
      function loop(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        acc += dt;
        while (acc >= STEP) {
          update();
          acc -= STEP;
        }
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
