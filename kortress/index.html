<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1026" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>코트리스 — KORTRESS 2D</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(10, 16, 40, 0.72); --line: rgba(148, 163, 184, 0.22); }
        html, body { margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; height: 100%; }
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif; background: #050816; color: #f8fafc;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
            display: flex; flex-direction: column; height: 100vh; height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }
        .title-font { font-family: 'Black Han Sans', sans-serif; }
        .hidden { display: none !important; }

        /* ---------- 헤더 ---------- */
        #topHeader { position: relative; z-index: 40; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px;
            background: linear-gradient(180deg, rgba(15,23,55,.96), rgba(8,12,32,.96)); border-bottom: 1px solid var(--line); }
        #topHeader .logo { width: 30px; height: 30px; border-radius: 9px; box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 4px 12px rgba(0,0,0,.5); object-fit: cover; }
        #topHeader h1 { font-size: 21px; line-height: 1; letter-spacing: .5px; margin: 0;
            background: linear-gradient(180deg, #fde68a, #fb923c 55%, #ef4444); -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,.45)); white-space: nowrap; }
        .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap; }
        .hbtn { height: 32px; padding: 0 12px; border-radius: 11px; font-size: 12px; font-weight: 900; white-space: nowrap; cursor: pointer; transition: transform .08s; }
        .hbtn:active { transform: scale(.94); }
        #menuPanel { position: absolute; right: 10px; top: calc(100% + 6px); min-width: 190px; padding: 6px; border-radius: 16px;
            background: rgba(12,18,44,.98); border: 1px solid #334155; box-shadow: 0 18px 40px rgba(0,0,0,.6); }
        #menuPanel button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 800; color: #e2e8f0; text-align: left; white-space: nowrap; background: transparent; cursor: pointer; }
        #menuPanel button:hover { background: rgba(148,163,184,.12); }
        #menuPanel .st { margin-left: auto; font-size: 11px; color: #94a3b8; }
        #menuPanel button.off { opacity: .55; }

        /* ---------- 전장 ---------- */
        #stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #0b1026; }
        #gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
        #hud { position: absolute; left: 0; right: 0; top: 0; z-index: 10; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 10px; pointer-events: none; }
        .pcard { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 0; max-width: 260px; padding: 6px 10px 7px; border-radius: 14px;
            background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 8px 22px rgba(0,0,0,.35); transition: box-shadow .25s, border-color .25s; }
        .pcard.on.p1 { border-color: rgba(56,189,248,.85); box-shadow: 0 0 0 1px rgba(56,189,248,.5), 0 0 22px rgba(56,189,248,.35); }
        .pcard.on.p2 { border-color: rgba(251,113,133,.85); box-shadow: 0 0 0 1px rgba(251,113,133,.5), 0 0 22px rgba(251,113,133,.35); }
        .pcard img { width: 40px; height: 28px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
        .pcard .nm span { overflow: hidden; text-overflow: ellipsis; }
        .pcard .nm { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; font-weight: 900; margin-bottom: 3px; white-space: nowrap; }
        .hpbar { position: relative; height: 9px; border-radius: 99px; background: rgba(2,6,23,.85); border: 1px solid rgba(148,163,184,.35); overflow: hidden; }
        .hpbar > div { height: 100%; border-radius: 99px; transition: width .35s; }
        #p2card { flex-direction: row-reverse; text-align: right; }
        #p2card img { transform: scaleX(-1); }
        #turnWrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
        #turn-indicator { padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 900; letter-spacing: .5px; white-space: nowrap; border: 1px solid; backdrop-filter: blur(6px); }
        #turn-indicator.p1 { background: rgba(14,116,144,.55); border-color: #38bdf8; color: #e0f2fe; }
        #turn-indicator.p2 { background: rgba(159,18,57,.55); border-color: #fb7185; color: #ffe4e6; }
        #toast-msg { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; max-width: 92%; padding: 8px 16px; border-radius: 14px;
            background: rgba(8,12,32,.94); border: 1px solid rgba(56,189,248,.5); color: #bae6fd; font-size: 13px; font-weight: 800; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5);
            opacity: 0; transition: opacity .2s; pointer-events: none; }
        .modal { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(3,6,20,.72); backdrop-filter: blur(4px); }
        .mcard { width: 100%; max-width: 420px; border-radius: 22px; padding: 22px; text-align: center; background: linear-gradient(180deg, rgba(20,28,66,.97), rgba(10,14,36,.97)); border: 1px solid rgba(251,191,36,.35); box-shadow: 0 30px 70px rgba(0,0,0,.6); }
        .mcard .hero { width: 120px; height: 120px; border-radius: 28px; margin: -70px auto 10px; display: block; box-shadow: 0 0 0 3px rgba(251,191,36,.6), 0 16px 40px rgba(0,0,0,.6); object-fit: cover; }
        .bigbtn { width: 100%; padding: 13px; border-radius: 16px; font-size: 17px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
            background: linear-gradient(180deg, #3b82f6, #1d4ed8); border: 2px solid #93c5fd; box-shadow: 0 5px 0 #1e3a8a, 0 10px 18px rgba(0,0,0,.4); transition: transform .08s; }
        .bigbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1e3a8a; }
        .bigbtn.green { background: linear-gradient(180deg, #10b981, #047857); border-color: #6ee7b7; box-shadow: 0 5px 0 #064e3b, 0 10px 18px rgba(0,0,0,.4); }

        /* ---------- 하단 컨트롤 ---------- */
        #ctrl { flex-shrink: 0; z-index: 20; padding: 8px 10px 10px; background: linear-gradient(180deg, rgba(12,18,44,.98), rgba(6,9,24,.99)); border-top: 1px solid var(--line); }
        #ctrlGrid > * { min-width: 0; }
        #ctrlGrid { max-width: 1180px; margin: 0 auto; display: grid; gap: 8px;
            grid-template-columns: 1fr auto; grid-template-areas: "wp ang" "pw pw" "pad fire"; }
        .box { background: rgba(30,41,80,.55); border: 1px solid rgba(148,163,184,.22); border-radius: 14px; }
        #wpBox { grid-area: wp; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 4px; }
        .weapon-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 4px 4px; border-radius: 11px; border: 1.5px solid transparent; cursor: pointer; background: rgba(2,6,23,.35); transition: all .12s; min-width: 0; }
        .weapon-btn img { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
        .weapon-btn .wt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; min-width: 0; }
        .weapon-btn .wn { font-size: 11px; font-weight: 900; color: #e2e8f0; white-space: nowrap; }
        .weapon-btn .wc { font-size: 10px; font-weight: 800; font-family: ui-monospace, monospace; }
        .weapon-btn.active { border-color: #facc15; background: rgba(250,204,21,.16); box-shadow: 0 0 12px rgba(250,204,21,.45) inset, 0 0 10px rgba(250,204,21,.35); }
        #angBox { grid-area: ang; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 5px 10px; min-width: 104px; }
        #angBox .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; font-weight: 800; color: #94a3b8; }
        #angle-display { font-size: 18px; font-weight: 900; color: #fbbf24; font-family: ui-monospace, monospace; }
        #pwBox { grid-area: pw; display: flex; flex-direction: column; gap: 3px; }
        #pwBox .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 900; padding: 0 2px; min-width: 0; }
        #power-container { position: relative; height: 18px; border-radius: 99px; padding: 2px; background: #020617; border: 1px solid #475569; overflow: hidden; }
        #power-container .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.12) calc(10% - 1px) 10%); pointer-events: none; z-index: 5; }
        #power-bar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #34d399, #fbbf24 55%, #f43f5e); box-shadow: 0 0 12px rgba(251,191,36,.5); }
        @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 8px rgba(250,204,21,.6); } 50% { box-shadow: 0 0 18px rgba(239,68,68,.95); } }
        .charging-glow { animation: pulseGlow .5s infinite; }
        #padBox { grid-area: pad; display: flex; align-items: center; gap: 6px; }
        .pad { display: flex; align-items: center; gap: 4px; padding: 4px; }
        .pbtn { width: 44px; height: 44px; border-radius: 12px; font-size: 16px; font-weight: 900; color: #e2e8f0; cursor: pointer;
            background: linear-gradient(180deg, #334155, #1e293b); border: 1px solid #475569; box-shadow: 0 3px 0 #0f172a; display: flex; align-items: center; justify-content: center; }
        .pbtn.half { height: 21px; font-size: 10px; box-shadow: 0 2px 0 #0f172a; }
        .pbtn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; background: #475569; }
        .pbtn:disabled, .weapon-btn:disabled, #btn-fire:disabled { opacity: .45; cursor: not-allowed; }
        #vip-sensor-btn { height: 44px; padding: 0 10px; border-radius: 12px; font-size: 11px; font-weight: 900; line-height: 1.15; white-space: nowrap; cursor: pointer; border: 1px solid rgba(251,191,36,.5); background: rgba(30,41,59,.9); color: #fcd34d; }
        #vip-sensor-btn.on { background: linear-gradient(180deg, #fde047, #f59e0b); color: #0f172a; border-color: #fef08a; box-shadow: 0 0 14px rgba(251,191,36,.8); }
        #vip-sensor-btn.lock { color: #94a3b8; border-color: #475569; }
        #btn-fire { grid-area: fire; min-width: 120px; height: 52px; border-radius: 16px; font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #fff; cursor: pointer;
            background: radial-gradient(120% 140% at 50% 0%, #fb7185 0%, #ef4444 45%, #991b1b 100%); border: 2px solid #fecaca; box-shadow: 0 5px 0 #7f1d1d, 0 0 22px rgba(239,68,68,.55); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
        #btn-fire:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #7f1d1d, 0 0 26px rgba(239,68,68,.8); }

        /* 가로가 넓은 화면(태블릿 가로 · PC): 한 줄 배치 */
        @media (min-width: 860px) {
            #ctrlGrid { grid-template-columns: auto auto 1fr auto auto; grid-template-areas: "wp ang pw pad fire"; align-items: center; }
            #wpBox { grid-template-columns: repeat(3, 92px); }
            #btn-fire { height: 56px; min-width: 150px; }
            #topHeader h1 { font-size: 24px; }
            .pcard { width: 280px; }
        }
        /* 높이가 낮은 화면(폰 가로): 컨트롤 압축 */
        @media (max-height: 520px) {
            #topHeader { padding: 4px 10px; }
            #topHeader .logo { width: 24px; height: 24px; }
            #ctrl { padding: 5px 8px 6px; }
            #ctrlGrid { gap: 5px; grid-template-columns: auto auto 1fr auto auto; grid-template-areas: "wp ang pw pad fire"; align-items: center; }
            #wpBox { grid-template-columns: repeat(3, auto); }
            .weapon-btn img { width: 24px; height: 24px; }
            .weapon-btn .wt { display: none; }
            .pbtn { width: 38px; height: 38px; } .pbtn.half { height: 18px; }
            #vip-sensor-btn { height: 38px; font-size: 10px; }
            #btn-fire { height: 44px; min-width: 96px; font-size: 17px; }
            #angBox { min-width: 84px; padding: 3px 8px; }
            .pcard img { display: none; }
            #hud { padding: 5px 8px; }
            .pcard { max-width: 190px; padding: 3px 8px 4px; border-radius: 10px; }
            .pcard .nm { font-size: 10px; margin-bottom: 2px; }
            .hpbar { height: 6px; }
            #turn-indicator { font-size: 10.5px; padding: 3px 10px; }
            #topHeader h1 { font-size: 18px; }
            .hbtn { height: 28px; }
        }
        /* 좁은 폰 */
        @media (max-width: 380px) {
            .weapon-btn .wn { font-size: 10px; }
            .weapon-btn img { width: 24px; height: 24px; }
            .pbtn { width: 38px; }
            #btn-fire { min-width: 96px; }
            #topHeader h1 { font-size: 18px; }
            .pcard { padding: 5px 7px; }
            .pcard img { width: 30px; height: 22px; }
            #turn-indicator { font-size: 10.5px; padding: 4px 9px; }
            #winChip { display: none; }
            #angBox { min-width: 78px; padding: 4px 7px; }
            #angle-display { font-size: 15px; }
            #btn-fire { min-width: 84px; font-size: 18px; }
            #vip-sensor-btn { padding: 0 6px; font-size: 10px; }
            .weapon-btn { gap: 3px; }
        }
        @media (min-width: 700px) and (min-height: 700px) { .weapon-btn img { width: 34px; height: 34px; } }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header id="topHeader">
        <img class="logo" src="./icon.png" alt="" onerror="this.style.display='none'">
        <h1 class="title-font">KORTRESS</h1>
        <span id="vipBadge" class="hidden chip" style="background:linear-gradient(90deg,#fbbf24,#eab308);color:#0f172a;padding:2px 7px;font-size:10px;font-weight:900">👑 VIP</span>
        <div style="flex:1"></div>
        <span id="winChip" class="chip" style="background:rgba(14,165,233,.12);border:1px solid rgba(56,189,248,.35);color:#7dd3fc">🏆 승리 <span id="winCountText">0</span></span>
        <button id="loginOpenBtn" type="button" class="hbtn" style="background:linear-gradient(180deg,#fde68a,#f59e0b);color:#0f172a;border:1px solid #fef3c7">로그인</button>
        <button id="logoutBtn" type="button" class="hidden hbtn" style="background:#1e293b;color:#cbd5e1;border:1px solid #334155">로그아웃</button>
        <button id="menuToggle" type="button" class="hbtn" style="background:#1e293b;color:#e2e8f0;border:1px solid #475569;font-size:16px;padding:0 11px" aria-label="메뉴">☰</button>
        <div id="menuPanel" class="hidden">
            <button id="bgmToggleBtn" type="button"><span>🎵</span>배경음 <span class="st">켜짐</span></button>
            <button id="soundToggleBtn" type="button"><span>🔊</span>효과음 <span class="st">켜짐</span></button>
            <button id="menu-btn" type="button"><span>🏠</span>메인 메뉴</button>
            <button id="headerExitLobbyBtn" type="button"><span>🚪</span>로비로 나가기</button>
        </div>
    </header>

    <!-- 전장 -->
    <main id="stage">
        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <div id="p1card" class="pcard p1">
                <img src="img/tank_blue.webp" alt="" onerror="this.style.visibility='hidden'">
                <div style="flex:1;min-width:0">
                    <div class="nm"><span style="color:#7dd3fc">PLAYER 1</span><span id="p1-hp-text">100</span></div>
                    <div class="hpbar"><div id="p1-hp-bar" style="width:100%;background:linear-gradient(90deg,#0ea5e9,#67e8f9)"></div></div>
                </div>
            </div>
            <div id="turnWrap"><div id="turn-indicator" class="p1">P1 TURN</div></div>
            <div id="p2card" class="pcard p2">
                <img src="img/tank_red.webp" alt="" onerror="this.style.visibility='hidden'">
                <div style="flex:1;min-width:0">
                    <div class="nm"><span id="p2-hp-text">100</span><span id="p2-name" style="color:#fda4af">CPU (AI)</span></div>
                    <div class="hpbar" style="display:flex;justify-content:flex-end"><div id="p2-hp-bar" style="width:100%;background:linear-gradient(270deg,#e11d48,#fb923c)"></div></div>
                </div>
            </div>
        </div>

        <div id="toast-msg">알림</div>

        <!-- 시작 -->
        <div id="start-modal" class="modal">
            <div class="mcard" style="margin-top:56px">
                <img class="hero" src="./icon.png" alt="" onerror="this.style.display='none'">
                <div class="chip" style="background:rgba(245,158,11,.15);border:1px solid rgba(251,191,36,.45);color:#fcd34d;margin-bottom:6px">코트리스 · ARCADE ARTILLERY</div>
                <h1 class="title-font" style="font-size:46px;line-height:1.05;margin:4px 0 6px;background:linear-gradient(180deg,#fde68a,#fb923c 55%,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))">KORTRESS</h1>
                <p style="color:#94a3b8;font-size:13px;margin:0 0 16px">각도와 파워를 계산해 상대 탱크를 파괴하세요!</p>
                <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
                    <button type="button" onclick="startGame('ai')" class="bigbtn">🤖 1인용 (AI 대전)</button>
                    <button type="button" onclick="startGame('pvp')" class="bigbtn green">👥 2인용 (로컬 대전)</button>
                </div>
                <div style="background:rgba(30,41,80,.6);border:1px solid #334155;border-radius:14px;padding:10px 12px;text-align:left;font-size:11.5px;color:#cbd5e1;line-height:1.6">
                    <div style="font-weight:900;color:#fbbf24;margin-bottom:2px">🎮 조작 가이드</div>
                    <div>• <b style="color:#fff">이동</b> ← / → 또는 ◀ ▶ 버튼</div>
                    <div>• <b style="color:#fff">각도</b> ↑ / ↓ 또는 ▲ ▼ 버튼</div>
                    <div>• <b style="color:#fff">발사</b> <b style="color:#fb7185">SPACE</b> 또는 <b style="color:#fb7185">FIRE!</b> 길게 눌렀다 떼기</div>
                    <div>• <b style="color:#fff">전장 보기</b> 화면을 좌우로 드래그</div>
                </div>
            </div>
        </div>

        <!-- 게임 오버 -->
        <div id="gameover-modal" class="modal hidden">
            <div class="mcard">
                <div style="font-size:46px;margin-bottom:4px">🏆</div>
                <h2 id="winner-title" class="title-font" style="font-size:32px;color:#fbbf24;margin:0 0 6px">PLAYER 1 WIN!</h2>
                <p id="winner-desc" style="color:#cbd5e1;font-size:13px;margin:0 0 18px">완벽한 포격으로 적 탱크를 격파했습니다!</p>
                <div style="display:flex;flex-direction:column;gap:10px">
                    <button type="button" onclick="restartGame()" class="bigbtn">🔄 다시 하기</button>
                    <button type="button" onclick="showMainMenu()" class="hbtn" style="height:42px;background:#1e293b;color:#cbd5e1;border:1px solid #475569">메인 메뉴로</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 하단 컨트롤 -->
    <footer id="ctrl">
        <div id="ctrlGrid">
            <div id="wpBox" class="box">
                <button id="wp-0" type="button" onclick="selectWeapon(0)" class="weapon-btn active">
                    <img src="img/w0.webp" alt="" onerror="this.outerHTML='<span style=&quot;font-size:20px&quot;>💣</span>'">
                    <span class="wt"><span class="wn">일반탄</span><span class="wc" style="color:#fbbf24">∞</span></span>
                </button>
                <button id="wp-1" type="button" onclick="selectWeapon(1)" class="weapon-btn">
                    <img src="img/w1.webp" alt="" onerror="this.outerHTML='<span style=&quot;font-size:20px&quot;>☄️</span>'">
                    <span class="wt"><span class="wn">3연발</span><span id="wp-1-count" class="wc" style="color:#22d3ee">2발</span></span>
                </button>
                <button id="wp-2" type="button" onclick="selectWeapon(2)" class="weapon-btn">
                    <img src="img/w2.webp" alt="" onerror="this.outerHTML='<span style=&quot;font-size:20px&quot;>☢️</span>'">
                    <span class="wt"><span class="wn">고폭탄</span><span id="wp-2-count" class="wc" style="color:#fb7185">1발</span></span>
                </button>
            </div>

        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.bgmEnabled = true;
                this.bgmTimer = null;
                this.bgmStep = 0;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            }
            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }
            startBGM() {
                this.stopBGM();
                if (!this.bgmEnabled) return;
                this.init();
                const notes = [261.63, 329.63, 392.0, 523.25, 392.0, 329.63, 293.66, 392.0];
                this.bgmTimer = setInterval(() => {
                    if (!this.bgmEnabled || !this.ctx) return;
                    try {
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(notes[this.bgmStep % notes.length], now);
                        gain.gain.setValueAtTime(0.025, now);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.23);
                        this.bgmStep++;
                    } catch (e) {}
                }, 260);
            }
            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
            toggleBGM() {
                this.bgmEnabled = !this.bgmEnabled;
                if (this.bgmEnabled) this.startBGM();
                else this.stopBGM();
                return this.bgmEnabled;
            }
            playShoot(type = 0) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type === 2 ? 'sawtooth' : 'triangle';
                const startFreq = type === 1 ? 320 : (type === 2 ? 180 : 240);
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
            playExplosion(isBig = false) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const duration = isBig ? 0.8 : 0.45;
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isBig ? 600 : 800, now);
                filter.frequency.exponentialRampToValueAtTime(60, now + duration);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(isBig ? 0.7 : 0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
                noise.stop(now + duration);
                // 묵직한 저음 쿵
                const sub = this.ctx.createOscillator(), sg = this.ctx.createGain();
                sub.type = 'sine'; sub.frequency.setValueAtTime(isBig ? 70 : 95, now); sub.frequency.exponentialRampToValueAtTime(28, now + duration);
                sg.gain.setValueAtTime(isBig ? 0.9 : 0.6, now); sg.gain.exponentialRampToValueAtTime(0.001, now + duration);
                sub.connect(sg); sg.connect(this.ctx.destination); sub.start(now); sub.stop(now + duration);
            }
            playChargeTick(powerRatio) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200 + powerRatio * 600, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            }
            playMove() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(90, now);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.03);
            }
        }

        const ART = {};
        function tintCanvas(img, color) {

        class Tank {
            constructor(id, name, x, color, darkColor, lightColor, isAI = false) {
                this.id = id;
                this.name = name;
                this.x = x;
                this.y = 0;
                this.color = color;
                this.darkColor = darkColor;
                this.lightColor = lightColor;
                this.isAI = isAI;
                this.hp = 100;
                this.maxHp = 100;
                this.angle = id === 0 ? 45 : 135;
                this.facing = id === 0 ? 1 : -1;
                this.fuel = MAX_FUEL;
                this.selectedWeapon = 0;
                this.ammo = [Infinity, 2, 1];
                this.lastPower = 0;
                this.slopeAngle = 0;
                this.recoil = 0; this.hitFlash = 0; this.drivePhase = 0; this.driveT = 0;
            }

            updatePositionOnTerrain() {
                const ix = Math.max(10, Math.min(WORLD_WIDTH - 11, Math.round(this.x)));
                this.y = gameState.terrain[ix];
                const leftY = gameState.terrain[Math.max(0, ix - 12)];
                const rightY = gameState.terrain[Math.min(WORLD_WIDTH - 1, ix + 12)];
                this.slopeAngle = Math.atan2(rightY - leftY, 24);
            }

            move(dir) {
                if (this.fuel <= 0) return;
                const nextX = this.x + dir * 2.2;
                if (nextX < 30 || nextX > WORLD_WIDTH - 30) return;
                const currY = gameState.terrain[Math.round(this.x)];
                const nextY = gameState.terrain[Math.round(nextX)];
                if (currY - nextY > 8) return;
                this.x = nextX;
                this.facing = dir;
                this.fuel = Math.max(0, this.fuel - 0.8);
                this.drivePhase = (this.drivePhase || 0) + 0.9; this.driveT = Date.now() + 140;
                this.updatePositionOnTerrain();
                sfx.playMove();
            }

            adjustAngle(delta) {
                this.angle = Math.max(0, Math.min(180, this.angle + delta));
                if (this.angle < 90) this.facing = 1;
                else if (this.angle > 90) this.facing = -1;
            }

            draw(ctx) {
                const now = Date.now();
                if (this.recoil > 0) this.recoil = Math.max(0, this.recoil - 0.07);
                if (this.hitFlash > 0) this.hitFlash = Math.max(0, this.hitFlash - 0.04);

                        ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(px, py + 6, 44, 0, Math.PI * 2); ctx.fill();
                    }
                    // 포신 (몸통 뒤에서 포탑 돔으로 들어가도록 먼저 그림)
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate((-this.angle * Math.PI) / 180);
                    const rc = this.recoil * 7;
                    const bg = ctx.createLinearGradient(0, -4, 0, 4);
                    bg.addColorStop(0, '#f8fafc'); bg.addColorStop(0.45, '#94a3b8'); bg.addColorStop(1, '#1e293b');

                    ctx.beginPath(); ctx.roundRect(4 - rc, -3.8, 26, 7.6, 2.6); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = this.id === 0 ? '#2563eb' : '#dc2626';
                    ctx.beginPath(); ctx.roundRect(23 - rc, -5.2, 8, 10.4, 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(8 - rc, -3, 13, 1.4);
                    ctx.restore();
                    // 몸통 (이동 중엔 궤도가 굴러가는 애니메이션)
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(this.slopeAngle * 0.85);
                    ctx.scale(this.facing, 1);
                    const idleBob = this.driveT > now ? Math.sin(now / 45) * 0.5 : Math.sin(now / 260 + this.id) * 0.35;
                    const top = -H * 0.30 + idleBob;
                    const strip = ART['drive' + this.id];

                        ctx.drawImage(img, -W / 2, top, W, H);

                    if (this.hitFlash > 0 && ART['tankW' + this.id]) {

                        ctx.globalAlpha = 1;
                    }
                    ctx.restore();
                    // 머리 위 체력 바
                    const bw = 46, by = py - H * 0.30 - 22;
                    ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
                    ctx.beginPath(); ctx.roundRect(this.x - bw / 2 - 1.5, by - 1.5, bw + 3, 7, 3.5); ctx.fill();
                    const hr = Math.max(0, this.hp / this.maxHp);
                    ctx.fillStyle = this.id === 0 ? (hr > 0.3 ? '#38bdf8' : '#f43f5e') : (hr > 0.3 ? '#fb7185' : '#f43f5e');
                    ctx.beginPath(); ctx.roundRect(this.x - bw / 2, by, bw * hr, 4, 2); ctx.fill();
                } else {

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.slopeAngle);

                if (this.id === 0 && authState.isVip) {
                    const aura = ctx.createRadialGradient(0, -12, 4, 0, -12, 34);
