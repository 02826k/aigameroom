<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>용사 키우기 — 클릭 훈련 RPG</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { touch-action: manipulation; }
    canvas.pixel-art { image-rendering: pixelated; image-rendering: crisp-edges; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.7); border-radius: 9999px; }
    @keyframes goldShine {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.45)); }
      50% { filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.85)); }
    }
    .gold-bar-glow { animation: goldShine 2.4s infinite ease-in-out; }
    @keyframes vipPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(168, 85, 247, 0.45); }
      50% { box-shadow: 0 0 15px rgba(232, 121, 249, 0.8); }
    }
    .vip-btn-glow { animation: vipPulse 2.2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/95 backdrop-blur px-3 sm:px-4 py-2 sticky top-0 z-20 shadow-lg shadow-black/25">
    <div class="max-w-4xl mx-auto flex flex-col gap-1.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-gradient-to-br from-amber-400/25 to-orange-600/25 text-amber-400 font-extrabold text-xs border border-amber-500/40 shrink-0">⚔️</span>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-50 truncate">용사 키우기</h1>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <div class="px-2.5 py-1 rounded-xl text-xs font-extrabold bg-amber-500/15 border border-amber-500/40 text-amber-300 flex items-center gap-1 shadow-sm">
            <span>🪙</span><span id="goldDisplay">0</span><span>G</span>
          </div>
          <button id="authToggleBtn" type="button" title="로그인 및 로그아웃"
            class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0">
            로그인
          </button>
        </div>
      </div>
      <div class="flex items-center justify-end gap-1.5 pt-1.5 border-t border-slate-800/70">
        <button id="bgmToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap">🎵 배경음 ON</button>
        <button id="soundToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap">🔊 효과음 ON</button>
        <button id="headerExitLobbyBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition active:scale-95 cursor-pointer whitespace-nowrap">나가기</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-4 flex flex-col gap-4">
    <!-- Top Status Card -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl shadow-black/30">
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
        <div class="sm:col-span-5 bg-gradient-to-br from-amber-950/40 via-slate-950/90 to-slate-950/90 border border-amber-500/35 rounded-xl px-3.5 py-2.5 flex items-center justify-between gap-2.5 shadow-inner">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-xs">👑</span>
              <span class="text-[11px] text-amber-300/90 font-bold tracking-tight">명예</span>
              <span id="honorBonusBadge" class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 font-semibold border border-amber-500/30">오오라 전용</span>
            </div>
            <div class="text-lg sm:text-xl font-black text-amber-400 tracking-tight mt-0.5" id="honorDisplay">명예 Lv.0</div>
            <div class="text-[10px] text-slate-400 truncate" id="honorSubText">Lv.1 달성 시 황금 오오라 개방</div>
          </div>
          <button id="honorUpgradeBtn" type="button" class="shrink-0 px-3 py-2 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-500 border border-slate-700 transition flex flex-col items-center justify-center leading-tight">
            <span>명예 상승</span>
            <span id="honorCostText" class="text-[10px] font-bold mt-0.5">100만 G</span>
          </button>
        </div>

        <div class="sm:col-span-7 grid grid-cols-3 gap-2">
          <button id="graphicModeToggleBtn" type="button" title="게임 화면 이미지 전환"
            class="bg-slate-950/85 hover:bg-slate-900 border border-sky-500/50 hover:border-sky-400 rounded-xl px-3 py-2.5 flex items-center justify-center gap-1.5 text-center transition active:scale-95 cursor-pointer shadow-inner">
            <span class="text-sm">🎨</span>
            <span class="text-xs sm:text-sm font-black text-sky-300 whitespace-nowrap">이미지변경</span>
          </button>
          <div class="bg-slate-950/80 border border-slate-800/90 rounded-xl px-3 py-2.5 flex flex-col justify-center">
            <div class="text-[11px] text-slate-400 font-medium">클릭당 획득</div>
            <div class="text-xs sm:text-sm font-extrabold text-emerald-400 mt-0.5 leading-snug" id="gainPerClickDisplay">+1 파워 / +1 G</div>
          </div>
          <div class="bg-slate-950/80 border border-slate-800/90 rounded-xl px-3 py-2.5 flex flex-col justify-center">
            <div class="text-[11px] text-slate-400 font-medium">장착 무기 / 펫</div>
            <div class="text-xs sm:text-sm font-bold text-purple-300 truncate mt-0.5" id="equippedWeaponDisplay">목검</div>
          </div>
        </div>
      </div>

      <div class="mt-3.5">
        <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1.5">
          <span id="stageBadge" class="font-bold text-slate-200">훈련 지역: 기본 마을 · 대상: 허수아비</span>
          <span id="nextRankText" class="font-medium">다음 등급까지 9 파워</span>
        </div>
        <div class="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800 p-0.5">
          <div id="rankProgressBar" class="h-full rounded-full bg-gradient-to-r from-amber-500 via-orange-400 to-yellow-300 transition-all duration-200" style="width: 2%;"></div>
        </div>
      </div>
    </section>

    <!-- Training Canvas Arena -->
    <section class="relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl shadow-black/40">
      <div id="canvasWrapper" class="relative w-full h-[330px] sm:h-[400px] cursor-pointer">
        <canvas id="gameCanvas" class="block w-full h-full"></canvas>
        <div id="threeViewport" class="hidden absolute inset-0 w-full h-full" style="touch-action:none;"></div>
        <div id="threeHudHint" class="hidden absolute bottom-2.5 left-1/2 -translate-x-1/2 z-10 flex items-center gap-1.5">
          <span class="pointer-events-none px-2.5 py-1 rounded-full bg-slate-950/75 border border-cyan-400/40 text-[10px] font-bold text-cyan-200 backdrop-blur-sm">🔄 드래그로 360° 회전 · 탭으로 타격</span>
          <button id="threeResetCamBtn" type="button" class="px-2 py-1 rounded-full bg-slate-900/90 hover:bg-slate-800 border border-slate-600 text-[10px] font-bold text-slate-200 cursor-pointer">↺ 정면</button>
        </div>

        <div class="pointer-events-none absolute top-3 left-3 flex flex-wrap items-center gap-1.5">
          <span id="arenaRegionPill" class="px-2.5 py-1 rounded-lg bg-slate-950/75 border border-slate-700/80 backdrop-blur-sm text-[11px] font-bold text-slate-200 shadow">🏡 기본 마을</span>
          <span id="arenaMonsterPill" class="px-2.5 py-1 rounded-lg bg-rose-950/75 border border-rose-700/70 backdrop-blur-sm text-[11px] font-extrabold text-rose-200 shadow">🎯 허수아비</span>
          <span id="arenaPetPill" class="px-2.5 py-1 rounded-lg bg-pink-950/75 border border-pink-700/70 backdrop-blur-sm text-[11px] font-extrabold text-pink-200 shadow">💧 아기 슬라임 응원중</span>
        </div>

        <div id="comboBadge" class="pointer-events-none absolute top-3 right-3 opacity-0 transition-opacity duration-150 bg-slate-950/85 border border-amber-500/50 backdrop-blur-sm px-3 py-1.5 rounded-xl text-right shadow-lg">
          <div class="text-xs sm:text-sm font-black text-amber-400" id="comboCountText">0 COMBO</div>
          <div class="text-[10px] text-slate-300" id="comboBonusText">연속 타격 중!</div>
        </div>

        <div id="canvasBottomHint" class="pointer-events-none absolute bottom-3 inset-x-0 flex justify-center px-3">
          <div class="px-3.5 py-1.5 rounded-full bg-slate-950/80 border border-slate-700/80 backdrop-blur-sm text-[11px] sm:text-xs text-slate-200 font-medium shadow">
            화면을 클릭하거나 <kbd class="px-1.5 py-0.5 bg-slate-800 rounded text-amber-300 font-mono text-[10px] border border-slate-700">Space</kbd> 를 눌러 몬스터를 타격하세요!
          </div>
        </div>
      </div>
    </section>

    <!-- Action & Shop / Region / Pet / Ranking Tabs -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl shadow-black/30 flex flex-col gap-3.5">
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">
        <div class="flex-1 flex items-stretch gap-2 min-w-0">
          <button id="trainActionBtn" type="button" class="flex-[4] min-w-0 py-3 px-3 sm:px-4 rounded-xl bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500 hover:from-amber-400 hover:to-orange-400 active:scale-[0.99] text-slate-950 font-black text-sm sm:text-base shadow-lg shadow-amber-500/25 transition flex items-center justify-center gap-1.5 sm:gap-2 cursor-pointer">
            <span class="shrink-0">⚔️</span>
            <span id="trainBtnLabel" class="truncate">타격하기 (+1 파워)</span>
          </button>

          <button id="autoClickToggleBtn" type="button" title="VIP 전용 초당 10회 자동클릭기 ON/OFF"
            class="flex-[1] min-w-[78px] sm:min-w-[92px] py-2 px-2 rounded-xl text-[11px] sm:text-xs font-extrabold bg-slate-950 hover:bg-slate-800 border border-purple-500/60 text-purple-200 shadow-md transition active:scale-95 flex flex-col items-center justify-center leading-tight cursor-pointer shrink-0">
            <div class="flex items-center gap-1">
              <span id="autoClickDot" class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
              <span id="autoClickBtnLabel">자동 OFF</span>
            </div>
            <span id="autoClickSubLabel" class="text-[9px] text-slate-400 font-bold mt-0.5">VIP 10연타</span>
          </button>
        </div>

        <div class="flex rounded-xl bg-slate-950 p-1 border border-slate-800 shrink-0 overflow-x-auto">
          <button id="tabRegionsBtn" type="button" class="flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold bg-slate-800 text-emerald-300 shadow transition whitespace-nowrap cursor-pointer">🗺️ 훈련 지역</button>
          <button id="tabWeaponsBtn" type="button" class="flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold text-slate-400 hover:text-slate-200 transition whitespace-nowrap cursor-pointer">🗡️ 무기 상점</button>
          <button id="tabPetsBtn" type="button" class="flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold text-slate-400 hover:text-slate-200 transition whitespace-nowrap cursor-pointer">🐾 애완동물</button>
          <button id="tabRankingBtn" type="button" class="flex-1 sm:flex-initial px-3 py-2 rounded-lg text-xs font-extrabold text-slate-400 hover:text-slate-200 transition whitespace-nowrap cursor-pointer">🏆 랭킹</button>
        </div>
      </div>

      <div id="regionsPanel" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5"></div>
      <div id="weaponsPanel" class="hidden grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5"></div>
      <div id="petsPanel" class="hidden grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5"></div>

      <div id="rankingPanel" class="hidden flex-col gap-3">
        <div id="serverStatusDashboard" class="w-full">
          <div class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 flex items-center gap-2">
            <span class="text-sm sm:text-base font-extrabold text-slate-200">🌍 서버 참전 용사 :</span>
            <span id="srvStatTotalPlayers" class="text-sm sm:text-base font-black text-emerald-400">집계 중...</span>
          </div>
        </div>
        <div class="flex items-center justify-between px-1">
          <span class="text-xs font-extrabold text-amber-300">🏆 TOP 100</span>
        </div>
        <div id="rankingListContainer" class="flex flex-col gap-2"></div>
      </div>
    </section>
  </main>

  <!-- Toast Notification -->
  <div id="toastBox" class="pointer-events-none fixed bottom-5 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 translate-y-2">
    <div id="toastMsg" class="px-4 py-2 rounded-xl bg-slate-900/95 border border-amber-500/50 text-xs sm:text-sm font-bold text-amber-200 shadow-2xl">알림 메시지</div>
  </div>

  <script>
    (() => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      const GAME_ID = 'clicker';
      const CLOUD_API_URL = 'https://02826k.duckdns.org';
      const API_BASE_URL = CLOUD_API_URL;
      const LOBBY_AUTH_BASE = 'https://02826k.github.io/aigameroom/';
      const ADMIN_VIP_PHONES = [];

      if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
          const radius = typeof r === 'number' ? r : (Array.isArray(r) ? (r[0] || 0) : 0);
          const rr = Math.max(0, Math.min(radius, Math.min(w, h) / 2));
          this.moveTo(x + rr, y);
          this.arcTo(x + w, y, x + w, y + h, rr);
          this.arcTo(x + w, y + h, x, y + h, rr);
          this.arcTo(x, y + h, x, y, rr);
          this.arcTo(x, y, x + w, y, rr);
          this.closePath();
          return this;
        };
      }

      const STORAGE_KEY = 'hero_clicker_rpg_save_v1';
      const TOKEN_KEY = 'hero_clicker_jwt_token';
      const USER_KEY = 'hero_clicker_username';
      const LAST_USER_KEY = 'hero_clicker_last_username_v1';
      const RANK_SNAPSHOT_KEY = 'hero_clicker_rank_snapshots_v1';
      const ACCOUNT_SAVES_KEY = 'hero_clicker_account_saves_v1';
      const HOURLY_RANK_CACHE_KEY = 'hero_clicker_hourly_rank_cache_v3';
      const HONOR_BASE_COST = 1000000;

      function safeGetStorage(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
      function safeSetStorage(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
      function safeRemoveStorage(key) { try { localStorage.removeItem(key); } catch (e) {} }

      const ALL_TOKEN_KEYS = [TOKEN_KEY, 'abuse_jwt_token', 'sky2026_jwt_token', 'aigameroom_jwt_token'];
      const ALL_USER_KEYS = [USER_KEY, 'abuse_username', 'sky2026_username', 'aigameroom_username'];
      const ALL_NICK_KEYS = ['aigameroom_nickname', 'hero_clicker_nickname'];

      function readSharedAuth() {
        let t = null, u = null;
        for (const k of ALL_TOKEN_KEYS) { if (!t) t = safeGetStorage(k); }
        for (const k of ALL_USER_KEYS) { if (!u) u = safeGetStorage(k); }
        return { t, u };
      }

      function goLobbyAuth(mode = 'login') {
        try { flushSaveOnExit(); } catch (e) {}
        const target = `${LOBBY_AUTH_BASE}?auth=${encodeURIComponent(mode)}&returnTo=${encodeURIComponent(window.location.href)}`;
        window.location.href = target;
      }

      let { t: authToken, u: currentUsername } = readSharedAuth();
      let lastKnownUsername = currentUsername || safeGetStorage(LAST_USER_KEY) || null;
      if (currentUsername) safeSetStorage(LAST_USER_KEY, currentUsername);
      let hasUnsavedChanges = false;
      let saveRevision = 0;
      let isSyncInFlight = false;
      let lastRankingPayload = null;
      let lastAggregatedHourKey = null;

      function apiFetch(endpointPath, options = {}) { return fetch(API_BASE_URL + endpointPath, options); }
      function isAdminAccount(username) { return username && ADMIN_VIP_PHONES.includes(username.trim()); }

      const RANK_TITLES = ['수련생', '견습 검사', '정식 기사', '숙련 전사', '왕국 수호자', '소드 마스터', '드래곤 슬레이어', '전설의 영웅', '신화적 반신', '초월자'];
      const RANKS = Array.from({ length: 100 }, (_, i) => ({
        level: i + 1,
        title: RANK_TITLES[Math.min(RANK_TITLES.length - 1, Math.floor(i / 10))],
        minPower: Math.pow(10, i)
      }));

      const WEAPONS = [
        { id: 'wooden_sword', name: '목검', tier: 0, cost: 0, powerMult: 1, bladeColor: '#b45309', edgeColor: '#d97706', guardColor: '#78350f', glowColor: 'rgba(217, 119, 6, 0)', slashColor: '#fde68a', desc: '기본 수련용 나무 검' },
        { id: 'iron_axe', name: '도끼', tier: 1, cost: 10000, powerMult: 10, bladeColor: '#94a3b8', edgeColor: '#f1f5f9', guardColor: '#475569', glowColor: 'rgba(148, 163, 184, 0.15)', slashColor: '#e2e8f0', desc: '강력하게 내리치는 훈련용 도끼' },
        { id: 'water_sword', name: '물의 검', tier: 2, cost: 300000, powerMult: 30, bladeColor: '#38bdf8', edgeColor: '#e0f2fe', guardColor: '#0284c7', glowColor: 'rgba(56, 189, 248, 0.35)', slashColor: '#7dd3fc', desc: '흐르는 물의 힘이 깃든 장검' },
        { id: 'ice_sword', name: '얼음 검', tier: 3, cost: 1000000, powerMult: 40, bladeColor: '#06b6d4', edgeColor: '#ecfeff', guardColor: '#155e75', glowColor: 'rgba(34, 211, 238, 0.45)', slashColor: '#67e8f9', desc: '절대 한기의 서리가 내린 검' },
        { id: 'fire_sword', name: '화염 검', tier: 4, cost: 10000000, powerMult: 50, bladeColor: '#ea580c', edgeColor: '#fef08a', guardColor: '#9a3412', glowColor: 'rgba(249, 115, 22, 0.55)', slashColor: '#fb923c', desc: '꺼지지 않는 불꽃이 타오르는 마검' },
        { id: 'light_sword', name: '빛의 검', tier: 5, cost: 0, powerMult: 100, bladeColor: '#fbbf24', edgeColor: '#fef08a', guardColor: '#d97706', glowColor: 'rgba(251, 191, 36, 0.85)', slashColor: '#fef08a', desc: '👑 VIP 전용 성스러운 신성의 대검', isVipOnly: true }
      ];

      const REGIONS = [
        { id: 'village', name: '기본 마을', icon: '🏡', monsterName: '허수아비', monsterType: 'scarecrow', reqPower: 1, goldMult: 1, skyTop: '#0f172a', skyBottom: '#1e293b', groundTop: '#3f6212', groundBottom: '#1a2e05', accent: '#a3e635', desc: '평화로운 마을 앞마당의 짚단 허수아비' },
        { id: 'forest', name: '포레스트', icon: '🌲', monsterName: '거대 멧돼지', monsterType: 'boar', reqPower: 100, goldMult: 2, skyTop: '#052e16', skyBottom: '#14532d', groundTop: '#166534', groundBottom: '#052e16', accent: '#4ade80', desc: '깊은 숲속을 질주하는 사나운 거대 멧돼지' },
        { id: 'desert', name: '사막', icon: '🏜️', monsterName: '사막 전갈', monsterType: 'scorpion', reqPower: 1000, goldMult: 3, skyTop: '#451a03', skyBottom: '#92400e', groundTop: '#d97706', groundBottom: '#78350f', accent: '#fbbf24', desc: '작열하는 모래폭풍 속 맹독 집게 사막 전갈' },

      const PETS = [

        { id: 'cheer_dog', name: '치어리더 시바견', icon: '🐶', reqHonor: 10, bodyColor: '#f59e0b', subColor: '#fef3c7', pomColor: '#ef4444', cheers: ['멍멍! 힘내요!🐾', '최고의 용사님!', '가즈아 멍!!🔥'], desc: '붉은 응원봉을 흔들며 꼬리를 살랑거리는 열정 만점 강아지 (명예 Lv.10)' },
        { id: 'lucky_cat', name: '행운 복고양이', icon: '🐱', reqHonor: 100, bodyColor: '#f8fafc', subColor: '#fca5a5', pomColor: '#fbbf24', cheers: ['골드 쏟아져라냥!🪙', '냥냥 펀치 응원!', '대박 나라냥~💛'], desc: '황금 방울을 달고 복을 불러주는 귀여운 삼색 복고양이 (명예 Lv.100)' },
        { id: 'fairy_pixie', name: '숲의 픽시 요정', icon: '🧚', reqHonor: 1000, bodyColor: '#a7f3d0', subColor: '#34d399', pomColor: '#fef08a', cheers: ['반짝반짝 빛나라!✨', '요정의 축복을~!', '멋진 검술이에요!🌿'], desc: '날개를 파닥이며 용사님 뒤에서 반짝이는 응원 가루를 뿌리는 요정 (명예 Lv.1,000)' },
        { id: 'baby_dragon', name: '불꽃 아기용', icon: '🐲', reqHonor: 10000, bodyColor: '#fb7185', subColor: '#fef08a', pomColor: '#f97316', cheers: ['크아앙! 다 부숴요!🔥', '불꽃 응원 발사!', '용사님 무적!!⚡'], desc: '작은 날개로 날아오르며 폭죽 같은 불꽃 응원을 뿜어내는 아기 드래곤 (명예 Lv.10,000)' },
        { id: 'gold_haetae', name: '황금 해태', icon: '🦁', reqHonor: 0, isVipOnly: true, bodyColor: '#fbbf24', subColor: '#fef08a', pomColor: '#c084fc', cheers: ['👑 천하무적 용사님!', '황금빛 승리!!✨', '전설의 일격!!👑'], desc: '👑 VIP 전용 - 신비한 황금 오오라를 두르고 응원하는 수호신 아기 해태' }
      ];

      const defaultState = () => ({
        power: 1, gold: 0, honorLevel: 0, totalClicks: 0,
        ownedWeapons: ['wooden_sword'], equippedWeaponId: 'wooden_sword',
        ownedPets: [], equippedPetId: null, currentRegionId: 'village',
        soundEnabled: true, bgmEnabled: true,
        graphicMode: 'classic',
        isVip: isAdminAccount(currentUsername), autoClickEnabled: false, basicAutoClickEnabled: false,
        ownerUsername: currentUsername || lastKnownUsername || null,
        updatedAt: Date.now()
      });

      function encodeScoreWithMeta(power, honorLevel, regionId, weaponId) {
        const cleanPower = Math.max(1, Math.floor(Number(power) || 1));
        if (cleanPower < 100000) return cleanPower;
        const wIdx = Math.max(0, WEAPONS.findIndex(w => w.id === weaponId));
        const rIdx = Math.max(0, REGIONS.findIndex(r => r.id === regionId));
        const hClamped = Math.max(0, Math.min(99, Math.floor(Number(honorLevel) || 0)));
        return Math.floor(cleanPower / 10000) * 10000 + 6000 + (hClamped * 36) + (rIdx * 6) + wIdx;
      }

      function decodeScoreMeta(rawScore) {
        const num = Math.max(1, Math.floor(Number(rawScore) || 1));
        if (num >= 100000) {
          const tail = num % 10000;
          if (tail >= 6000 && tail < 9600) {
            const code = tail - 6000;
            return {
              hasEncodedMeta: true, power: num,
              honorLevel: Math.floor(code / 36),
              weaponId: WEAPONS[code % 6]?.id || 'wooden_sword',
              regionId: REGIONS[Math.floor(code / 6) % 6]?.id || 'village'
            };
          }
        }
        return { hasEncodedMeta: false, power: num };
      }

      function inferStatsFromPower(power) {
        const p = Math.max(1, Number(power) || 1);
        let regionId = 'village';
        if (p >= 50000000) regionId = 'secret_dungeon';
        else if (p >= 100000) regionId = 'ice';
        else if (p >= 10000) regionId = 'volcano';
        else if (p >= 1000) regionId = 'desert';
        else if (p >= 100) regionId = 'forest';

        let weaponId = 'wooden_sword';
        if (p >= 50000000) weaponId = 'light_sword';
        else if (p >= 5000000) weaponId = 'fire_sword';
        else if (p >= 500000) weaponId = 'ice_sword';
        else if (p >= 100000) weaponId = 'water_sword';
        else if (p >= 5000) weaponId = 'iron_axe';

        let honorLevel = 0;
        if (p >= 100000000) honorLevel = Math.min(50, Math.max(5, Math.floor(p / 95000000)));
        else if (p >= 10000000) honorLevel = Math.max(2, Math.floor(p / 20000000) + 2);
        else if (p >= 1000000) honorLevel = 1;

        return { honorLevel, weaponId, regionId, petId: 'baby_slime' };
      }

      function sanitizeState(parsed) {
        const base = defaultState();
        if (!parsed || typeof parsed !== 'object') return base;
        const rawWeaponId = parsed.equippedWeaponId ?? parsed.equipped_weapon_id ?? parsed.weaponId;
        const rawRegionId = parsed.currentRegionId ?? parsed.current_region_id ?? parsed.regionId;
        const rawHonor = parsed.honorLevel ?? parsed.honor_level;
        const isVip = (typeof parsed.isVip === 'boolean' ? parsed.isVip : false) || isAdminAccount(currentUsername);
        const ownedWeapons = Array.isArray(parsed.ownedWeapons) && parsed.ownedWeapons.length > 0
          ? Array.from(new Set(parsed.ownedWeapons.filter(id => WEAPONS.some(w => w.id === id))))
          : [...base.ownedWeapons];
        if (!ownedWeapons.includes('wooden_sword')) ownedWeapons.unshift('wooden_sword');
        const honorVal = typeof rawHonor === 'number' && Number.isFinite(rawHonor) && rawHonor >= 0 ? Math.floor(rawHonor) : base.honorLevel;
        const ownedPets = PETS.filter(p => p.isVipOnly ? isVip : honorVal >= p.reqHonor).map(p => p.id);
        if (isVip && !ownedWeapons.includes('light_sword')) ownedWeapons.push('light_sword');
        if (isVip && !ownedPets.includes('gold_haetae')) ownedPets.push('gold_haetae');
        const equippedWeaponId = WEAPONS.some(w => w.id === rawWeaponId) ? rawWeaponId : base.equippedWeaponId;
        if (!ownedWeapons.includes(equippedWeaponId)) ownedWeapons.push(equippedWeaponId);
        const validPetId = (parsed.equippedPetId === null || PETS.some(p => p.id === parsed.equippedPetId)) ? parsed.equippedPetId : base.equippedPetId;
        if (validPetId && !ownedPets.includes(validPetId)) ownedPets.push(validPetId);
        const currentRegionId = REGIONS.some(r => r.id === rawRegionId) ? rawRegionId : base.currentRegionId;
        return {
          power: typeof parsed.power === 'number' && Number.isFinite(parsed.power) && parsed.power >= 1 ? Math.floor(parsed.power) : base.power,
          gold: typeof parsed.gold === 'number' && Number.isFinite(parsed.gold) && parsed.gold >= 0 ? Math.floor(parsed.gold) : base.gold,
          honorLevel: honorVal,
          totalClicks: typeof parsed.totalClicks === 'number' && Number.isFinite(parsed.totalClicks) && parsed.totalClicks >= 0 ? Math.floor(parsed.totalClicks) : 0,
          ownedWeapons, equippedWeaponId, ownedPets, equippedPetId: validPetId, currentRegionId,
          soundEnabled: typeof parsed.soundEnabled === 'boolean' ? parsed.soundEnabled : true,
          bgmEnabled: typeof parsed.bgmEnabled === 'boolean' ? parsed.bgmEnabled : true,
          graphicMode: ['classic', 'hibit', '3d'].includes(parsed.graphicMode) ? parsed.graphicMode : 'classic',
          isVip, autoClickEnabled: isVip && typeof parsed.autoClickEnabled === 'boolean' ? parsed.autoClickEnabled : false,
          basicAutoClickEnabled: typeof parsed.basicAutoClickEnabled === 'boolean' ? parsed.basicAutoClickEnabled : false,
          ownerUsername: parsed.ownerUsername || currentUsername || lastKnownUsername || null,
          updatedAt: typeof parsed.updatedAt === 'number' && parsed.updatedAt > 0 ? parsed.updatedAt : Date.now()
        };
      }

      function getAccountSavedState(username) {
        if (!username) return null;
        try {
          const rawSaves = safeGetStorage(ACCOUNT_SAVES_KEY);
          const savesMap = rawSaves ? JSON.parse(rawSaves) : {};
          return savesMap[username.trim()] || null;
        } catch (e) { return null; }
      }

      function saveAccountBackup(username, st) {
        if (!username || !st) return;
        try {
          const rawSaves = safeGetStorage(ACCOUNT_SAVES_KEY);
          const savesMap = rawSaves ? JSON.parse(rawSaves) : {};
          savesMap[username.trim()] = { ...st, ownerUsername: username.trim(), updatedAt: Date.now() };
          safeSetStorage(ACCOUNT_SAVES_KEY, JSON.stringify(savesMap));
        } catch (e) {}
      }

      function mergePlayerStates(localRaw, serverRaw, targetUsername) {
        const loc = sanitizeState(localRaw);
        const srv = sanitizeState(serverRaw);
        const isSameOwner = !loc.ownerUsername || !targetUsername || loc.ownerUsername === targetUsername;
        if (!isSameOwner) return sanitizeState({ ...srv, ownerUsername: targetUsername });
        const localIsNewer = (loc.updatedAt || 0) >= (srv.updatedAt || 0);
        const honorLevel = Math.max(loc.honorLevel, srv.honorLevel);
        const power = Math.max(loc.power, srv.power);
        const gold = (loc.honorLevel === srv.honorLevel && loc.power === srv.power)
          ? Math.max(loc.gold, srv.gold)
          : (loc.honorLevel > srv.honorLevel || (loc.honorLevel === srv.honorLevel && loc.power > srv.power) ? loc.gold : srv.gold);
        return sanitizeState({
          ...srv, ...loc, honorLevel, power, gold,
          totalClicks: Math.max(loc.totalClicks, srv.totalClicks),
          isVip: Boolean(loc.isVip || srv.isVip || isAdminAccount(targetUsername)),
          ownedWeapons: Array.from(new Set([...loc.ownedWeapons, ...srv.ownedWeapons])),
          ownedPets: Array.from(new Set([...loc.ownedPets, ...srv.ownedPets])),
          equippedWeaponId: localIsNewer ? loc.equippedWeaponId : srv.equippedWeaponId,
          currentRegionId: localIsNewer ? loc.currentRegionId : srv.currentRegionId,
          equippedPetId: localIsNewer ? loc.equippedPetId : srv.equippedPetId,
          ownerUsername: targetUsername || loc.ownerUsername || srv.ownerUsername,
          updatedAt: Math.max(loc.updatedAt || 0, srv.updatedAt || 0, Date.now())
        });
      }

      function loadLocalState() {
        try {
          const raw = safeGetStorage(STORAGE_KEY);
          return raw ? sanitizeState(JSON.parse(raw)) : defaultState();
        } catch (e) { return defaultState(); }
      }

      let state = loadLocalState();
      let activeTab = 'regions';

      setInterval(() => {
        if (state.isVip && state.autoClickEnabled) {
          if (!document.hidden) {
            getAudioContext();
            if (!bgmTimer && state.bgmEnabled) startBGM();
          }
          performHit();
        }
      }, 100);
      setInterval(() => {
        if (state.basicAutoClickEnabled && !(state.isVip && state.autoClickEnabled)) {
          performHit();
        }
      }, 200);

      function saveState(syncImmediately = false) {
        state.updatedAt = Date.now();
        if (currentUsername) state.ownerUsername = currentUsername;
        safeSetStorage(STORAGE_KEY, JSON.stringify(state));
        if (currentUsername || state.ownerUsername) saveAccountBackup(currentUsername || state.ownerUsername, state);
        saveRevision += 1;
        hasUnsavedChanges = true;
        if (syncImmediately && authToken) syncSaveToServer(false);
      }

      function buildSavePayload() {
        const encodedScore = encodeScoreWithMeta(state.power, state.honorLevel, state.currentRegionId, state.equippedWeaponId);
        const snapshotState = { ...state, ownerUsername: currentUsername || state.ownerUsername || lastKnownUsername || null, updatedAt: Date.now() };
        return {
          gameId: GAME_ID, saveData: snapshotState, save_data: snapshotState, score: encodedScore,
          power: state.power, honorLevel: state.honorLevel, honor_level: state.honorLevel,
          equippedWeaponId: state.equippedWeaponId, currentRegionId: state.currentRegionId, equippedPetId: state.equippedPetId
        };
      }

      async function syncSaveToServer(showNotification = false, useKeepalive = false) {
        if (!authToken) return false;
        const revAtSend = saveRevision;
        if (currentUsername) saveAccountBackup(currentUsername, state);
        try {
          isSyncInFlight = true;
          const res = await apiFetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
            body: JSON.stringify(buildSavePayload()),
            keepalive: Boolean(useKeepalive)
          });
          if (res.status === 401 || res.status === 403) { await handleLogout(true); return false; }
          await res.json().catch(() => ({}));
          if (res.ok) {
            if (saveRevision === revAtSend) hasUnsavedChanges = false;
            if (showNotification) showToast('🟨 클라우드 서버에 데이터가 저장되었습니다!');
            if (lastRankingPayload) renderRankingFromData(lastRankingPayload);
            return true;
          }
        } catch (err) {} finally { isSyncInFlight = false; }
        return false;
      }

      function flushSaveOnExit() {
        state.updatedAt = Date.now();
        if (currentUsername) state.ownerUsername = currentUsername;
        safeSetStorage(STORAGE_KEY, JSON.stringify(state));
        if (currentUsername || state.ownerUsername) saveAccountBackup(currentUsername || state.ownerUsername, state);
        if (authToken) syncSaveToServer(false, true);
      }

      window.addEventListener('beforeunload', flushSaveOnExit);
      window.addEventListener('pagehide', flushSaveOnExit);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushSaveOnExit();
        else if (document.visibilityState === 'visible') {
          if (state.bgmEnabled && audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
          checkHourlyRankingRollover();
        }
      });

      async function loadFromServer() {
        if (!authToken) return false;
        try {
          const res = await apiFetch(`/api/load?gameId=${GAME_ID}&_t=${Date.now()}`, {
            headers: { 'Authorization': `Bearer ${authToken}` }, cache: 'no-store'
          });
          if (res.status === 401 || res.status === 403) { await handleLogout(true); return false; }
          const data = await res.json();
          const rawServerSave = data?.saveData ?? data?.save_data ?? data?.data;
          if (res.ok) {
            const parsedSave = rawServerSave ? (typeof rawServerSave === 'string' ? JSON.parse(rawServerSave) : rawServerSave) : {};
            const decoded = decodeScoreMeta(data?.score || parsedSave?.power || 1);
            const serverVip = Boolean(data?.isVip);
            safeSetStorage('hero_clicker_is_vip', String(serverVip));
            if (data?.nickname) {
              ALL_NICK_KEYS.forEach((k) => safeSetStorage(k, data.nickname));
            }
            const serverWithTopFields = {
              ...(parsedSave || {}),
              power: Math.max(Number(parsedSave?.power || 1), decoded.power),
              honorLevel: Math.max(Number(parsedSave?.honorLevel ?? 0), Number(data?.honorLevel ?? 0), decoded.hasEncodedMeta ? decoded.honorLevel : 0),
              equippedWeaponId: parsedSave?.equippedWeaponId || data?.equippedWeaponId || (decoded.hasEncodedMeta ? decoded.weaponId : 'wooden_sword'),
              currentRegionId: parsedSave?.currentRegionId || data?.currentRegionId || (decoded.hasEncodedMeta ? decoded.regionId : 'village'),
              isVip: serverVip
            };
            const accountLocalBackup = getAccountSavedState(currentUsername);
            const baseLocal = accountLocalBackup ? mergePlayerStates(state, accountLocalBackup, currentUsername) : state;
            state = mergePlayerStates(baseLocal, serverWithTopFields, currentUsername);
            state.isVip = serverVip || isAdminAccount(currentUsername);
            safeSetStorage(STORAGE_KEY, JSON.stringify(state));
            saveAccountBackup(currentUsername, state);
            await syncSaveToServer(false);
            updateAuthHeaderUI();
            updateUI();
            if (state.bgmEnabled) startBGM();
            return true;
          }
        } catch (err) {}
        return false;
      }

      function openVipModal() {
        if (state.isVip) {
          showToast('👑 이미 VIP 영구 패키지가 활성화된 계정입니다!');
          return;
        }
        goLobbyAuth('vip');
      }

      document.getElementById('autoClickToggleBtn').addEventListener('click', () => {
        if (!state.isVip) { showToast('👑 VIP 가입후 사용하세요'); openVipModal(); return; }
        state.autoClickEnabled = !state.autoClickEnabled;
        if (state.autoClickEnabled) state.basicAutoClickEnabled = false;
        saveState(true); updateUI();
        if (state.autoClickEnabled) { getAudioContext(); if (!bgmTimer && state.bgmEnabled) startBGM(); showToast('⚡ 자동클릭기 ON! (초당 10회 고속 타격)'); }
        else showToast('⏸️ 자동클릭기 OFF');
      });

      // 랭킹 (서버 별명 우선 표시 + 로컬 전화번호 중복 주입 제거)
      function getCurrentHourBucketKey(d = new Date()) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}`;
      }
      function loadHourlyRankingCache() {
        try {
          const raw = safeGetStorage(HOURLY_RANK_CACHE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (parsed && parsed.hourKey === getCurrentHourBucketKey() && parsed.data) return parsed;
        } catch (e) {}
        return null;
      }
      function saveHourlyRankingCache(data) {
        const hourKey = getCurrentHourBucketKey();
        lastAggregatedHourKey = hourKey;
        safeSetStorage(HOURLY_RANK_CACHE_KEY, JSON.stringify({ hourKey, aggregatedAt: Date.now(), data }));
      }

      function extractRankItemFields(item) {
        let sd = item?.saveData ?? item?.save_data ?? item?.data ?? {};
        if (typeof sd === 'string') { try { sd = JSON.parse(sd); } catch (e) { sd = {}; } }
        const displayName = item?.nickname || maskPhoneMiddle(item?.maskedName || item?.username || '익명 용사');
        const isMe = Boolean(authToken && item?.isMe);
        const rawPowerVal = Number(item?.power ?? sd?.power ?? item?.score ?? 1);
        const decodedMeta = decodeScoreMeta(rawPowerVal);
        const power = Math.max(1, decodedMeta.power, Number(sd?.power || 0), isMe ? state.power : 0);
        const inferred = inferStatsFromPower(power);
        const explicitHonor = Math.max(
          Number(item?.honorLevel ?? -1),
          Number(sd?.honorLevel ?? -1),
          decodedMeta.hasEncodedMeta ? decodedMeta.honorLevel : -1,
          isMe ? state.honorLevel : -1
        );
        const honorLevel = explicitHonor > 0 ? explicitHonor : (inferred.honorLevel > 0 ? inferred.honorLevel : Math.max(0, explicitHonor));
        return { isMe, displayName, honorLevel, power };
      }

      function renderRankingFromData(data) {
        const listContainer = document.getElementById('rankingListContainer');
        const rawRankings = Array.isArray(data?.rankings) ? [...data.rankings] : [];
        const normalizedRankings = rawRankings.map((item, idx) => ({ ...item, ...extractRankItemFields(item), originalRank: item.rank ?? (idx + 1) }));

        normalizedRankings.sort((a, b) => (b.honorLevel !== a.honorLevel ? b.honorLevel - a.honorLevel : b.power - a.power));
        normalizedRankings.forEach((item, idx) => { item.rank = idx + 1; });

        const totalCount = Math.max(Number(data?.totalPlayers || 0), normalizedRankings.length);
        const elTotalPlayers = document.getElementById('srvStatTotalPlayers');
        if (elTotalPlayers) elTotalPlayers.textContent = `${totalCount.toLocaleString('ko-KR')}명 참전 중`;

        listContainer.innerHTML = '';
        if (normalizedRankings.length === 0) {
          listContainer.innerHTML = '<div class="text-center py-8 text-xs text-slate-400 bg-slate-950/60 rounded-xl border border-slate-800">등록된 용사 기록이 없습니다.</div>';
          return;
        }

        normalizedRankings.slice(0, 100).forEach((item) => {
          const rankInfo = getRankInfo(item.power).current;
          let rankBadgeHtml = `<span class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-extrabold text-xs flex items-center justify-center shrink-0">${item.rank}</span>`;

        if (m) return `${m[1]}-****-${m[3]}`;

      function formatNumber(num) {
        const n = Number(num);

        if (n >= 1e24) return n.toExponential(2).replace('+', '');
        if (n >= 1e20) return (n / 1e20).toFixed(2).replace(/\.00$/, '') + '해';
        if (n >= 1e16) return (n / 1e16).toFixed(2).replace(/\.00$/, '') + '경';
        if (n >= 1e12) return (n / 1e12).toFixed(2).replace(/\.00$/, '') + '조';
        if (n >= 1e8) return (n / 1e8).toFixed(2).replace(/\.00$/, '') + '억';
