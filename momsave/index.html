<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <title>엄마 구하기 — 외계인 침공 2D 액션</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    canvas {
      touch-action: none;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.7); border-radius: 9999px; }
    @keyframes goldShine {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.45)); }
      50% { filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.85)); }
    }
    .gold-bar-glow { animation: goldShine 2.4s infinite ease-in-out; }
    @keyframes vipPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(168, 85, 247, 0.45); }
      50% { box-shadow: 0 0 15px rgba(232, 121, 249, 0.8); }
    }
    .vip-btn-glow { animation: vipPulse 2.2s infinite ease-in-out; }

    /* 평소에는 게임 영역과 기존 조작 패드가 원래 위치에 참여한다. */
    #fullscreenStage { display: contents; }

    /* 전체화면에서는 게임 캔버스가 100% 꽉 차고, 조작 패드는 투명하게 하단 모서리에 슬림 배치 */
    #fullscreenStage:fullscreen {
      display: block !important;
      width: 100vw !important;
      height: 100dvh !important;
      position: fixed !important;
      inset: 0 !important;
      border-radius: 0 !important;
      border: none !important;
      background: #020617 !important;
      overflow: hidden !important;
    }

    #fullscreenStage:fullscreen #gameAreaSection {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      border: none !important;
      border-radius: 0 !important;
      overflow: hidden !important;
    }

    #fullscreenStage:fullscreen #canvasWrapper {
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
      aspect-ratio: auto !important;
      max-height: none !important;
    }

    /* 전체화면 패드: 배경박스 제거하고 투명 오버레이 + 컴팩트 사이즈 적용 */
    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] {
      display: flex !important;
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      z-index: 30 !important;
      margin: 0 !important;
      padding: 8px 14px 12px !important;
      border: none !important;
      border-radius: 0 !important;
      background: linear-gradient(to top, rgba(2, 6, 23, 0.42), transparent) !important;
      box-shadow: none !important;
      pointer-events: none !important;
    }

    /* 투명 패드 내부 조작 버튼들만 터치 허용 및 반투명 최적화 */
    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] #moveStickZone,
    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] button {
      pointer-events: auto !important;
    }

    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] #moveStickZone {
      width: 88px !important;
      height: 88px !important;
      background: rgba(15, 23, 42, 0.45) !important;
      backdrop-filter: blur(2px) !important;
    }

    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] #moveStickKnob {
      width: 38px !important;
      height: 38px !important;
    }

    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] .weapon-slot-btn {
      padding-top: 6px !important;
      padding-bottom: 6px !important;
      background: rgba(15, 23, 42, 0.55) !important;
    }

    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] #mobDashBtn {
      padding: 10px 12px !important;
      background: rgba(30, 41, 59, 0.65) !important;
    }

    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] #missileFireBtn {
      width: 64px !important;
      height: 64px !important;
      opacity: 0.88 !important;
    }

    #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] #missileFireBtn span:first-child {
      font-size: 1.35rem !important;
    }

    /* 휴대폰 가로 회전: 고정 폭/높이로 인한 좌우 분할과 가로 스크롤 방지 */
    @media (orientation: landscape) {
      html, body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      #fullscreenStage:fullscreen {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        max-width: none !important;
        max-height: none !important;
        overflow: hidden !important;
      }

      #fullscreenStage:fullscreen #canvasWrapper {
        width: 100% !important;
        height: 100% !important;
        min-width: 0 !important;
        min-height: 0 !important;
        max-width: none !important;
        max-height: none !important;
      }

      #fullscreenStage:fullscreen > [aria-label="게임 조작 패드"] {
        padding: 4px 16px 8px !important;
        gap: 8px !important;
        max-width: 100% !important;
        overflow: hidden !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur px-4 py-2.5 sticky top-0 z-30 shadow-lg shadow-black/30">
    <div class="max-w-5xl mx-auto flex flex-col gap-2">
      <!-- 1단 -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-gradient-to-br from-rose-400/25 to-amber-600/25 text-amber-300 font-extrabold text-sm border border-amber-500/40 shadow-inner shrink-0">🛸</span>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-50 truncate">엄마 구하기 <span class="text-amber-400">: 외계인 침공</span></h1>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button id="authHeaderBtn" type="button"
            class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap">
            로그인
          </button>
        </div>
      </div>

      <!-- 2단 -->
      <div class="flex items-center justify-between gap-2 pt-1.5 border-t border-slate-800/70">
        <div class="flex items-center gap-1.5 shrink-0 ml-auto">
          <button id="bgmToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer">
            🎵 배경음 ON
          </button>
          <button id="soundToggleBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer">
            🔊 효과음 ON
          </button>
          <button id="headerExitLobbyBtn" type="button" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition active:scale-95 cursor-pointer">
            나가기
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-2.5 sm:px-4 py-3 sm:py-4 flex flex-col gap-3">
    <!-- 상단 스테이지 & 전체화면 버튼 바 -->
    <section class="bg-slate-900/90 border border-amber-500/35 rounded-xl px-3.5 py-2.5 flex items-center justify-between">
      <div>
        <div class="text-[10px] text-amber-300/90 font-bold">🛸 외계인 침공 2D 액션</div>
        <div id="waveDisplay" class="text-xs sm:text-sm font-extrabold text-emerald-300 mt-0.5">STAGE 1 · 학교 교실</div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="rankOpenBtn" type="button" title="TOP 10 랭킹 보기"
          class="px-3.5 py-2 rounded-lg text-xs font-black bg-slate-800 hover:bg-slate-700 border border-amber-400/50 text-amber-300 cursor-pointer active:scale-95 transition shadow">
          🏆 RANK
        </button>
        <button id="fullscreenBtn" type="button" title="전체화면 전환"
          class="px-4 py-2 rounded-lg text-xs font-black bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 cursor-pointer active:scale-95 transition shadow">
          ⛶ 전체화면
        </button>
      </div>
    </section>

    <div id="fullscreenStage">
    <!-- 게임 캔버스 영역 -->
    <section id="gameAreaSection" class="relative bg-slate-950 border-2 border-slate-800 rounded-2xl overflow-hidden shadow-2xl shadow-black/60">
      <div id="canvasWrapper" class="relative w-full aspect-[4/3] sm:aspect-[16/9] min-h-[340px] max-h-[620px] bg-slate-900 cursor-crosshair">
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full block"></canvas>

        <!-- 시작 / 게임오버 / 클리어 오버레이 -->
        <div id="gameOverlay" class="absolute inset-0 z-20 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center p-4 text-center">
          <div id="overlayIcon" class="w-16 h-16 rounded-2xl bg-amber-500/15 border border-amber-400/40 flex items-center justify-center text-4xl mb-3 shadow-lg">🛸</div>
          <h2 id="overlayTitle" class="text-2xl sm:text-3xl font-black text-amber-400 tracking-tight">엄마 구하기</h2>
          <p id="overlaySub" class="text-xs sm:text-sm text-slate-300 max-w-md mt-2 leading-relaxed">
            학교를 탈출해 외계인에게 납치된 엄마를 구출하라!
          </p>
          <div class="mt-6 w-full max-w-xs flex items-center justify-center gap-2.5">
            <button id="overlayStartBtn" type="button" class="flex-1 py-3.5 px-3 rounded-xl bg-gradient-to-r from-amber-400 via-orange-400 to-rose-500 hover:from-amber-300 hover:to-rose-400 text-slate-950 font-black text-sm shadow-lg shadow-amber-500/25 active:scale-95 transition cursor-pointer whitespace-nowrap">
              ▶ 구출 작전 시작
            </button>
            <button id="overlayLobbyBtn" type="button" class="hidden flex-1 py-3.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-100 font-black text-sm shadow-lg active:scale-95 transition cursor-pointer whitespace-nowrap">
              나가기
            </button>
          </div>
        </div>

        <!-- 게임 화면 내 RANK TOP 10 오버레이 -->
        <div id="rankOverlay" class="hidden absolute inset-0 z-30 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-3">
          <div class="w-full max-w-sm bg-slate-900 border border-amber-500/40 rounded-2xl p-3.5 shadow-2xl flex flex-col gap-2 max-h-full">
            <div class="flex items-center justify-between">
              <div class="text-xs sm:text-sm font-black text-amber-300">🏆 엄마 구하기 TOP 10</div>
              <div class="flex items-center gap-1.5">
                <button id="refreshRankingBtn" type="button" class="px-2 py-1 rounded-lg text-[10px] font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 cursor-pointer">🔄</button>
                <button id="rankCloseBtn" type="button" class="px-2 py-1 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer">✕</button>
              </div>
            </div>
            <div class="rounded-xl border border-amber-500/25 px-2.5 py-1.5 flex justify-between text-[11px] bg-slate-950/85">
              <span class="text-slate-400 font-semibold">내 순위</span>
              <span id="myRankDetailText" class="font-extrabold text-amber-300">불러오는 중...</span>
            </div>
            <div id="rankingListContainer" class="flex flex-col gap-1 overflow-y-auto pr-1 max-h-[210px]"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- 일반 화면 및 전체화면 공용 컨트롤 패드 -->
    <section aria-label="게임 조작 패드" class="bg-slate-900/95 border border-slate-800 rounded-2xl p-2.5 sm:p-4 flex items-center justify-between gap-4 sm:gap-6 select-none shadow-xl">
      <!-- 좌측: O형 조이스틱 -->
      <div class="flex flex-col items-center gap-1.5 shrink-0">
        <div id="moveStickZone" style="touch-action:none" class="relative w-24 h-24 sm:w-32 sm:h-32 rounded-full bg-slate-950 border-2 border-sky-500/50 shadow-inner flex items-center justify-center cursor-pointer">
          <div class="absolute inset-2 rounded-full border border-dashed border-slate-700/80 pointer-events-none"></div>
          <span class="absolute top-1.5 left-1/2 -translate-x-1/2 text-[10px] font-black text-sky-400/80 pointer-events-none">▲</span>
          <span class="absolute bottom-1.5 left-1/2 -translate-x-1/2 text-[10px] font-black text-slate-400/80 pointer-events-none">▼</span>
          <span class="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] font-black text-slate-500 pointer-events-none">◀</span>
          <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] font-black text-slate-500 pointer-events-none">▶</span>
          <div id="moveStickKnob" class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-gradient-to-b from-sky-400 to-blue-600 border-2 border-white/80 shadow-lg pointer-events-none flex items-center justify-center text-xs font-black text-slate-950">
            🕹️
          </div>
        </div>
      </div>

      <!-- 우측: 위쪽 무기선택 4개 + 아래쪽 미사일 버튼 -->
      <div class="flex flex-col items-end gap-2 flex-1 min-w-0">
        <div class="grid grid-cols-4 gap-1.5 w-44 sm:w-64 ml-auto">
          <button type="button" data-weapon="0" title="헤비 머신건" class="weapon-slot-btn rounded-xl py-2 border-2 border-amber-400 bg-slate-950 text-center transition cursor-pointer shadow">
            <div class="text-base sm:text-xl leading-none">🔫</div>
          </button>
          <button type="button" data-weapon="1" title="로켓 런처" class="weapon-slot-btn rounded-xl py-2 border border-slate-800 bg-slate-950/70 text-center transition cursor-pointer opacity-80">
            <div class="text-base sm:text-xl leading-none">💣</div>
          </button>
          <button type="button" data-weapon="2" title="레이저 건" class="weapon-slot-btn rounded-xl py-2 border border-slate-800 bg-slate-950/70 text-center transition cursor-pointer opacity-80">
            <div class="text-base sm:text-xl leading-none">⚡</div>
          </button>
          <button type="button" data-weapon="3" title="플레임 샷" class="weapon-slot-btn rounded-xl py-2 border border-slate-800 bg-slate-950/70 text-center transition cursor-pointer opacity-80">
            <div class="text-base sm:text-xl leading-none">🔥</div>
          </button>
        </div>

        <div class="flex items-center justify-end gap-2 w-44 sm:w-64 ml-auto">
          <button id="mobDashBtn" type="button" style="touch-action:none" class="px-3.5 py-2.5 sm:px-4 sm:py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-amber-400/50 text-xs sm:text-sm font-black text-amber-300 shadow cursor-pointer transition">
            ⚡ 대시
          </button>
          <button id="missileFireBtn" type="button" style="touch-action:none" class="w-16 h-16 sm:w-24 sm:h-24 rounded-full bg-gradient-to-b from-orange-400 via-rose-500 to-red-600 hover:from-orange-300 hover:to-red-500 active:scale-95 border-2 border-amber-200/90 shadow-lg shadow-rose-500/30 flex flex-col items-center justify-center text-white cursor-pointer transition shrink-0">
            <span class="text-xl sm:text-3xl leading-none">🚀</span>
            <span class="text-[10px] sm:text-xs font-black mt-0.5">미사일</span>
          </button>
        </div>
      </div>
    </section>
    </div>


  </main>

  <!-- Toast -->
  <div id="toastBox" class="pointer-events-none fixed bottom-5 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 translate-y-2">
    <div id="toastMsg" class="px-4 py-2 rounded-xl bg-slate-900/95 border border-amber-500/50 text-xs sm:text-sm font-bold text-amber-200 shadow-2xl">알림</div>
  </div>



  <script>
    (() => {
      // ==========================================
      // 1. 서버 연동 & 상태 관리
      // ==========================================
      const GAME_ID = 'rescue_mom_v1';
      const CLOUD_API_URL = 'https://02826k.duckdns.org';
      const API_BASE_URL = CLOUD_API_URL;
      const LOBBY_AUTH_BASE = 'https://02826k.github.io/aigameroom/';

      const STORAGE_KEY = 'rescue_mom_save_v1';
      const TOKEN_KEY = 'abuse_jwt_token';
      const USER_KEY = 'abuse_username';

      const ALL_TOKEN_KEYS = [TOKEN_KEY, 'hero_clicker_jwt_token', 'sky2026_jwt_token', 'aigameroom_jwt_token'];
      const ALL_USER_KEYS = [USER_KEY, 'hero_clicker_username', 'sky2026_username', 'aigameroom_username'];
      const ALL_NICK_KEYS = ['aigameroom_nickname', 'hero_clicker_nickname'];

      function goLobbyAuth(mode = 'login') {
        try { saveState(false); } catch (e) {}
        const target = `${LOBBY_AUTH_BASE}?auth=${encodeURIComponent(mode)}&returnTo=${encodeURIComponent(window.location.href)}`;
        window.location.href = target;
      }

      function readSharedAuth() {
        let t = null, u = null;
        try {
          for (const k of ALL_TOKEN_KEYS) { if (!t) t = localStorage.getItem(k); }
          for (const k of ALL_USER_KEYS) { if (!u) u = localStorage.getItem(k); }
        } catch (e) {}
        return { t, u };
      }
      function syncSharedAuth(t, u) {
        try {
          if (t && u) {
            ALL_TOKEN_KEYS.forEach((k) => localStorage.setItem(k, t));
            ALL_USER_KEYS.forEach((k) => localStorage.setItem(k, u));
          } else {
            ALL_TOKEN_KEYS.forEach((k) => localStorage.removeItem(k));
            ALL_USER_KEYS.forEach((k) => localStorage.removeItem(k));
            ALL_NICK_KEYS.forEach((k) => localStorage.removeItem(k));
            localStorage.removeItem('hero_clicker_is_vip');
          }
        } catch (e) {}
      }
      let { t: authToken, u: currentUsername } = readSharedAuth();

      let state = {
        highScore: 0,
        bestSector: 1,
        bestTime: null,
        lastClearTime: null,
        soundEnabled: true,
        bgmEnabled: true,
        isVip: false
      };

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') state = { ...state, ...parsed };
        }
      } catch (e) {}

      function saveState(sync = false) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        if (sync && authToken) syncSaveToServer(false);
      }

      function maskPhoneMiddle(name) {
        const str = String(name || '');
        const m = str.match(/^(01[016789])[-.\s]?(\d{3,4}|\*{3,4})[-.\s]?(\d{4}|\*{4})$/);
        if (m) return `${m[1]}-****-${m[3]}`;
        return str.replace(/(01[016789])[-.\s]?(\d{3,4})[-.\s]?(\d{4})/g, '$1-****-$3');
      }

      async function syncSaveToServer(notify = false) {
        if (!authToken) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
            body: JSON.stringify({
              gameId: GAME_ID,
              saveData: state,
              score: state.highScore,
              bestSector: state.bestSector,
              clearTime: state.bestTime
            })
          });
          if (res.status === 401 || res.status === 403) { handleLogout(true); return; }
          if (res.ok) {
            if (notify) showToast('🟨 클라우드 서버에 기록이 저장되었습니다!');
            fetchRanking();
          }
        } catch (e) {}
      }

      async function loadFromServer() {
        if (!authToken) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/load?gameId=${GAME_ID}`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          if (res.status === 401 || res.status === 403) { handleLogout(true); return; }
          const data = await res.json();
          if (res.ok) {
            state.isVip = Boolean(data.isVip);
            try { localStorage.setItem('hero_clicker_is_vip', String(state.isVip)); } catch (e) {}
            if (data.nickname) {
              ALL_NICK_KEYS.forEach((k) => { try { localStorage.setItem(k, data.nickname); } catch (e) {} });
            }
            if (data.saveData) {
              const sd = typeof data.saveData === 'string' ? JSON.parse(data.saveData) : data.saveData;
              state.highScore = Math.max(state.highScore, Number(sd.highScore || 0));
              state.bestSector = Math.max(state.bestSector, Number(sd.bestSector || 1));
              if (typeof sd.bestTime === 'number' && sd.bestTime > 0) {
                state.bestTime = state.bestTime ? Math.min(state.bestTime, sd.bestTime) : sd.bestTime;
              }
            }
            saveState(false);
            updateHeaderUI();
          }
        } catch (e) {}
      }

      // ==========================================
      // 2. Web Audio 아케이드 BGM & 효과음
      // ==========================================
      let audioCtx = null;
      let bgmTimer = null;
      let bgmStep = 0;

      function getAC() {
        if (!state.soundEnabled && !state.bgmEnabled) return null;
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
      }

      function playSfx(type) {
        if (!state.soundEnabled) return;
        const ctxA = getAC();
        if (!ctxA) return;
        const now = ctxA.currentTime;
        const osc = ctxA.createOscillator();
        const gain = ctxA.createGain();
        osc.connect(gain);
        gain.connect(ctxA.destination);

        if (type === 'laser') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(640, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.07);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'grenade') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.14);
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'boom') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(135, now);
          osc.frequency.exponentialRampToValueAtTime(28, now + 0.3);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now); osc.stop(now + 0.32);
        } else if (type === 'plasma') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(1040, now + 0.07);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.14);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'flame') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160 + Math.random() * 60, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.07);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'dash') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(580, now + 0.11);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'portal') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.35);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.start(now); osc.stop(now + 0.38);
        } else if (type === 'clear') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.14);
          osc.frequency.setValueAtTime(783.99, now + 0.28);
          osc.frequency.setValueAtTime(1046.5, now + 0.42);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
          osc.start(now); osc.stop(now + 0.86);
        } else if (type === 'pickup') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.setValueAtTime(1040, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.start(now); osc.stop(now + 0.17);
        }
      }

      function startBGM() {
        stopBGM();
        if (!state.bgmEnabled) return;
        const ctxA = getAC();
        if (!ctxA) return;
        const riff = [146.83, 146.83, 174.61, 196.0, 220.0, 196.0, 174.61, 130.81];
        bgmTimer = setInterval(() => {
          if (!state.bgmEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(riff[bgmStep % riff.length], now);
            g.gain.setValueAtTime(0.024, now);
            g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
            osc.connect(g); g.connect(ctxA.destination);
            osc.start(now); osc.stop(now + 0.24);
            bgmStep++;
          } catch (e) {}
        }, 240);
      }

      function stopBGM() {
        if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
      }

      }

      function explodeAt(x, y, radius, dmg) {
        spawnVisualExplosion(x, y);
        for (let i = 0; i < enemies.length; i++) {
          const en = enemies[i];
          if (en.hp > 0 && Math.hypot(en.x - x, en.y - y) <= radius + en.w * 0.5) {
            damageEnemy(en, dmg);
          }
        }
        if (boss && boss.active && !boss.defeated && boss.hp > 0 && Math.hypot(boss.x - x, boss.y - y) <= radius + boss.w * 0.55) {
          damageBoss(dmg);
        }
      }

      function damageEnemy(en, dmg) {
        if (en.hp <= 0) return;
        en.hp -= dmg;
        en.hitFlash = 0.08;
        spawnHitSparks(en.x + (Math.random() - 0.5) * en.w * 0.5, en.y + (Math.random() - 0.5) * en.h * 0.5, '#fde047');
        if (en.hp <= 0) {
          const pts = en.score;
          score += pts;
          floatingTexts.push({ x: en.x, y: en.y - 28, text: `+${pts}`, color: '#fde047', life: 0.8 });

          for (let i = 0; i < 7; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 50 + Math.random() * 140;
            particles.push({
              kind: 'smoke',
              x: en.x, y: en.y,
              vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
              life: 0.38, maxLife: 0.38,
              color: i % 2 === 0 ? '#fb923c' : '#cbd5e1',
              size: 11 + Math.random() * 6
            });
          }

          if (Math.random() < 0.25) {
            pickups.push({ x: en.x, y: en.y, vy: -210, type: 'heal', life: 16 });
          }
          updateHud();
        }
      }

      function damageBoss(dmg) {
        if (!boss || !boss.active || boss.defeated || boss.hp <= 0) return;
        boss.hp -= dmg;
        boss.hitFlash = 0.08;
        spawnHitSparks(boss.x + (Math.random() - 0.5) * boss.w * 0.5, boss.y + (Math.random() - 0.5) * boss.h * 0.5, '#f0abfc');
        if (boss.hp <= 0) {
          boss.hp = 0;
          boss.defeated = true;
          boss.active = false;

          score += 1000 * sector;
          player.hp = Math.min(player.maxHp, player.hp + 40);
          updateHud();

          screenFlash = 0.8;
          spawnVisualExplosion(boss.x - 25, boss.y - 20);
          spawnVisualExplosion(boss.x, boss.y - 50);
          spawnVisualExplosion(boss.x + 25, boss.y + 15);
          enemies.length = 0;
          enemyBullets.length = 0;
          bullets.length = 0;

          if (sector < 4) {
            portal.unlocked = true;
            playSfx('portal');
            showToast(`🌀 보스 격파! 오른쪽 포탈이 열렸습니다!`);
          } else {
            rescueSequence = true;
            rescueTimer = 0;
            mom.cageBroken = true;
            playSfx('clear');
            showToast('💥 외계인 대장 보스 격파! 엄마가 구출됩니다!');
          }
        }
      }

      function resolvePlatformCollision(ent, prevY) {
        const wasGrounded = ent.grounded;
        ent.grounded = false;
        const halfW = ent.w / 2;
        const halfH = ent.h / 2;
        for (const p of PLATFORMS) {
          const withinX = (ent.x + halfW > p.x) && (ent.x - halfW < p.x + p.w);
          if (withinX && ent.vy >= 0 && (prevY + halfH <= p.y + 10) && (ent.y + halfH >= p.y)) {
            ent.y = p.y - halfH;
            ent.vy = 0;
            ent.grounded = true;
            if (!wasGrounded && ent === player) {
              spawnCartoonDust(player.x, p.y, 4);
            }
          }
        }
      }

      function updateGame(dt) {
        if (stageBanner.active) {
          stageBanner.timer += dt;
          if (stageBanner.timer >= stageBanner.duration) {
            stageBanner.active = false;
          }
        }

        if (!rescueSequence) elapsedTime += dt;
        if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 30);
        if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dt * 2.2);
        if (player.fireCd > 0) player.fireCd = Math.max(0, player.fireCd - dt);
        if (player.recoil > 0) player.recoil = Math.max(0, player.recoil - dt * 36);
        if (player.invuln > 0) player.invuln = Math.max(0, player.invuln - dt);
        if (player.dashCd > 0) player.dashCd = Math.max(0, player.dashCd - dt);

        if (rescueSequence) {
          rescueTimer += dt;
          const targetCamX = MAP_W - CAM_W;
          camera.x += (targetCamX - camera.x) * Math.min(1, dt * 6);
          camera.y += ((MAP_H - CAM_H) - camera.y) * Math.min(1, dt * 6);

          const sonTargetX = 5992;
          const momTargetX = 6022;
          const groundPlayerY = 576 - player.h / 2;
          if (Math.abs(player.y - groundPlayerY) > 2) {
            player.y += (groundPlayerY - player.y) * Math.min(1, dt * 10);
          } else {
            player.y = groundPlayerY;
          }

          if (rescueTimer < 1.8) {
            if (Math.abs(player.x - sonTargetX) > 4) {
              player.x += (sonTargetX > player.x ? 1 : -1) * 240 * dt;
              player.walkCycle += dt * 16;
            }
            if (Math.abs(mom.x - momTargetX) > 4) {
              mom.x += (momTargetX > mom.x ? 1 : -1) * 230 * dt;
              mom.jumpPhase += dt * 20;
            }
          } else if (rescueTimer < 3.6) {
            mom.hugged = true;
            mom.jumpPhase += dt * 12;
            player.walkCycle += dt * 12;
            if (Math.random() < 0.25) {
              particles.push({
                kind: 'heart',
                x: (player.x + mom.x) / 2 + (Math.random() - 0.5) * 40,
                y: player.y - 48,
                vx: (Math.random() - 0.5) * 40,
                vy: -55 - Math.random() * 35,
                life: 1.1, maxLife: 1.1,
                color: '#f43f5e', size: 16
              });
            }
          } else {
            mom.rescued = true;
            mom.jumpPhase += dt * 15;
            player.walkCycle += dt * 15;
            if (Math.random() < 0.22) {
              const fx = camera.x + 120 + Math.random() * (CAM_W - 240);
              const fy = camera.y + 80 + Math.random() * 160;
              const cols = ['#facc15', '#38bdf8', '#f472b6', '#4ade80'];
              const c = cols[Math.floor(Math.random() * cols.length)];
              for (let k = 0; k < 12; k++) {
                const a = (Math.PI * 2 * k) / 12;
                particles.push({
                  kind: 'spark',
                  x: fx, y: fy,
                  vx: Math.cos(a) * 140, vy: Math.sin(a) * 140,
                  life: 0.65, maxLife: 0.65,
                  color: c, size: 7
                });
              }
            }
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            const pt = particles[i];
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.life -= dt;
            if (pt.life <= 0) particles.splice(i, 1);
          }

          if (rescueTimer >= 5.6) {
            rescueSequence = false;
            gameClear();
          }
          return;
        }

        // 1. 플레이어 이동 & 대시
        let moveX = 0;
        if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;
        if (moveStickVec.active && Math.abs(moveStickVec.x) > 0.18) {
          moveX = Math.max(-1, Math.min(1, moveStickVec.x));
        }
        if (moveX > 0.05) player.facing = 1;
        else if (moveX < -0.05) player.facing = -1;

        if (player.dashTimer > 0) {
          player.dashTimer -= dt;
          player.vx = player.dashDir * 860;
          player.walkCycle += dt * 24;
        } else {
          player.vx = moveX * 440;
          if (moveX !== 0) player.walkCycle += dt * 15;
        }

        const stickJump = moveStickVec.active && moveStickVec.y < -0.45;
        if ((keys['KeyW'] || keys['ArrowUp'] || keys['Space'] || stickJump) && player.grounded) {
          player.vy = -650;
          player.grounded = false;
          spawnCartoonDust(player.x, player.y + player.h / 2, 5);
        }

        const prevY = player.y;
        player.vy += GRAVITY * dt;
        const minAllowedX = bossArenaLocked ? BOSS_ARENA_MIN_X : 32;
        player.x = Math.max(minAllowedX, Math.min(MAP_W - 32, player.x + player.vx * dt));
        player.y += player.vy * dt;
        resolvePlatformCollision(player, prevY);

        if (!bossArenaLocked && player.x > BOSS_TRIGGER_X) {
          bossArenaLocked = true;
          enemies.length = 0;
          if (boss && !boss.defeated && boss.hp > 0 && !boss.active) {
            boss.active = true;
            showToast(`⚠️ 보스 출현! ${boss.name}`);
          }
        }

        if (sector < 4 && portal.unlocked && Math.abs(player.x - portal.x) < 48 && Math.abs(player.y - portal.y) < 80) {
          playSfx('portal');
          score += 500;
          const nextSec = sector + 1;
          setupSector(nextSec);
          return;
        }

        // 카메라 X/Y 추적
        const minCamX = bossArenaLocked ? BOSS_ARENA_MIN_X : 0;
        const desiredOffset = moveX > 0 ? CAM_W * 0.34 : (moveX < 0 ? CAM_W * 0.66 : CAM_W * 0.40);
        const targetCamX = Math.max(minCamX, Math.min(MAP_W - CAM_W, player.x - desiredOffset));
        camera.x += (targetCamX - camera.x) * Math.min(1, dt * 8.0);

        const maxCamY = MAP_H - CAM_H;
        const targetCamY = Math.max(0, Math.min(maxCamY, player.y - CAM_H * 0.62));
        camera.y += (targetCamY - camera.y) * Math.min(1, dt * 7.0);

        // 조준 및 발사
        const worldAimX = pointerScreen.x + camera.x;
        const worldAimY = pointerScreen.y + camera.y;

        if (missileBtnHeld) {
          let aimDir = player.facing >= 0 ? 0 : Math.PI;
          if (moveStickVec.active) {
            if (Math.abs(moveStickVec.y) > Math.abs(moveStickVec.x) && Math.abs(moveStickVec.y) > 0.3) {
              aimDir = moveStickVec.y < 0 ? -Math.PI / 2 : Math.PI / 2;
            } else if (Math.abs(moveStickVec.x) > 0.2) {
              aimDir = moveStickVec.x >= 0 ? 0 : Math.PI;
            }
          } else if (keys['ArrowUp'] || keys['KeyW']) {
            aimDir = -Math.PI / 2;
          } else if (keys['ArrowDown'] || keys['KeyS']) {
            aimDir = Math.PI / 2;
          } else if (keys['ArrowLeft'] || keys['KeyA']) {
            aimDir = Math.PI;
          } else if (keys['ArrowRight'] || keys['KeyD']) {
            aimDir = 0;
          }
          player.aimAngle = aimDir;
          fireWeapon();
        } else {
          const rawAng = Math.atan2(worldAimY - (player.y - 4), worldAimX - player.x);
          player.aimAngle = Math.round(rawAng / (Math.PI / 2)) * (Math.PI / 2);
          if (isFiring) fireWeapon();
        }

        // 2. 일반 외계인 스폰 & AI
        if (!bossArenaLocked && !(boss && boss.active)) {
          spawnTimer -= dt;
          if (spawnTimer <= 0 && enemies.length < 20) {
            spawnEnemy();
            spawnTimer = Math.max(0.55, 1.45 - sector * 0.12);
          }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          if (!en || en.hp <= 0) { enemies.splice(i, 1); continue; }
          if (en.hitFlash > 0) en.hitFlash = Math.max(0, en.hitFlash - dt);

          const dx = player.x - en.x;
          const dy = player.y - en.y;
          const dir = dx >= 0 ? 1 : -1;
          en.vx = dir * en.speed;
          en.walkCycle += dt * 12;

          en.jumpCd -= dt;
          if (en.grounded && en.jumpCd <= 0 && (dy < -45 || (en.kind === 'alien_scout' && Math.abs(dx) < 290))) {
            en.vy = en.kind === 'alien_scout' ? -590 : -520;
            en.grounded = false;
            en.jumpCd = en.kind === 'alien_scout' ? 1.05 : 1.85;
          }

          const ePrevY = en.y;
          en.vy += GRAVITY * dt;
          en.x = Math.max(24, Math.min(MAP_W - 24, en.x + en.vx * dt));
          en.y += en.vy * dt;
          resolvePlatformCollision(en, ePrevY);

          if (player.invuln <= 0 && Math.abs(en.x - player.x) < (en.w + player.w) * 0.44 && Math.abs(en.y - player.y) < (en.h + player.h) * 0.44) {
            player.hp = Math.max(0, player.hp - en.dmg);
            player.invuln = 0.85;
            screenShake = 8;
            floatingTexts.push({ x: player.x, y: player.y - 34, text: `-${en.dmg}`, color: '#f87171', life: 0.75 });
            updateHud();
            if (player.hp <= 0) { gameOver(); return; }
          }
        }

        // 2-1. 섹터별 보스 AI
        if (boss && !boss.defeated && boss.hp > 0 && boss.active) {
          if (boss.hitFlash > 0) boss.hitFlash = Math.max(0, boss.hitFlash - dt);
          const dx = player.x - boss.x;
          boss.moveDir = dx >= 0 ? 1 : -1;
          boss.vx = boss.moveDir * (120 + sector * 12);

          boss.jumpCd -= dt;
          if (boss.grounded && boss.jumpCd <= 0) {
            boss.vy = -560;
            boss.grounded = false;
            boss.jumpCd = 2.9;
          }

          const bPrevY = boss.y;
          boss.vy += GRAVITY * dt;
          boss.x = Math.max(BOSS_ARENA_MIN_X + 60, Math.min(6140, boss.x + boss.vx * dt));
          boss.y += boss.vy * dt;
          resolvePlatformCollision(boss, bPrevY);

          boss.attackCd -= dt;
          if (boss.attackCd <= 0) {
            boss.attackCd = Math.max(1.3, 2.1 - sector * 0.15);
            const baseAng = Math.atan2(player.y - boss.y, player.x - boss.x);
            const spreadList = sector >= 3 ? [-0.22, 0, 0.22] : [-0.12, 0.12];
            spreadList.forEach(offset => {
              const a = baseAng + offset;
              enemyBullets.push({
                x: boss.x + boss.moveDir * 36,
                y: boss.y - 16,
                vx: Math.cos(a) * (390 + sector * 25),
                vy: Math.sin(a) * (390 + sector * 25),
                radius: 11,
                dmg: 14 + sector * 2,
                life: 3.0,
                style: sector === 1 ? 'chalk' : 'plasma'
              });
            });
          }

          if (player.invuln <= 0 && Math.abs(boss.x - player.x) < (boss.w + player.w) * 0.45 && Math.abs(boss.y - player.y) < (boss.h + player.h) * 0.45) {
            player.hp = Math.max(0, player.hp - 22);
            player.invuln = 0.9;
            screenShake = 10;
            updateHud();
            if (player.hp <= 0) { gameOver(); return; }
          }
        }

        // 3. 플레이어 탄환 업데이트
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          if (!b) continue;
          b.life -= dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.type === 'grenade' && particles.length < 420) {
            particles.push({ kind: 'smoke', x: b.x - b.vx * 0.02, y: b.y - b.vy * 0.02, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 20, life: 0.5, maxLife: 0.5, color: 'rgba(203,213,225,0.7)', size: 7 + Math.random() * 4 });
          }

          if (b.life <= 0 || b.x < 0 || b.x > MAP_W || b.y >= 576 || b.y < -40) {
            if (b.type === 'grenade') explodeAt(b.x, Math.min(572, b.y), 108, b.dmg);
            if (bullets[i] === b) bullets.splice(i, 1);
            continue;
          }

          let hitTarget = false;
          for (let j = 0; j < enemies.length; j++) {
            const en = enemies[j];
            if (!en || en.hp <= 0) continue;
            if (b.pierced && b.pierced.has(en)) continue;
            if (Math.abs(b.x - en.x) < en.w * 0.55 + b.radius && Math.abs(b.y - en.y) < en.h * 0.55 + b.radius) {
              if (b.type === 'grenade') {
                explodeAt(b.x, b.y, 108, b.dmg);
                if (bullets[i] === b) bullets.splice(i, 1);
                hitTarget = true;
                break;
              } else if (b.type === 'plasma') {
                b.pierced.add(en);
                damageEnemy(en, b.dmg);
              } else {
                damageEnemy(en, b.dmg);
                if (bullets[i] === b) bullets.splice(i, 1);
                hitTarget = true;
                break;
              }
            }
          }
          if (hitTarget || rescueSequence) continue;

          if (boss && !boss.defeated && boss.hp > 0) {
            if (b.pierced && b.pierced.has(boss)) continue;
            if (Math.abs(b.x - boss.x) < boss.w * 0.52 + b.radius && Math.abs(b.y - boss.y) < boss.h * 0.52 + b.radius) {
              if (!boss.active) {
                if (b.type === 'grenade') {
                  explodeAt(b.x, b.y, 108, 0);
                  if (bullets[i] === b) bullets.splice(i, 1);
                } else if (b.type === 'plasma') {
                  b.pierced.add(boss);
                } else {
                  if (bullets[i] === b) bullets.splice(i, 1);
                }
                floatingTexts.push({ x: boss.x, y: boss.y - boss.h / 2 - 20, text: '🛡️ 무적', color: '#38bdf8', life: 0.5 });
              } else if (b.type === 'grenade') {
                explodeAt(b.x, b.y, 108, b.dmg);
                if (bullets[i] === b) bullets.splice(i, 1);
              } else if (b.type === 'plasma') {
                b.pierced.add(boss);
                damageBoss(b.dmg);
              } else {
                damageBoss(b.dmg);
                if (bullets[i] === b) bullets.splice(i, 1);
              }
            }
          }
        }

        // 3-1. 보스 공격 탄환 업데이트
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const eb = enemyBullets[i];
          if (!eb) continue;
          eb.life -= dt;
          eb.x += eb.vx * dt;
          eb.y += eb.vy * dt;
          if (eb.life <= 0 || eb.y >= 576 || eb.x < 0 || eb.x > MAP_W) {
            enemyBullets.splice(i, 1);
            continue;
          }
          if (player.invuln <= 0 && Math.hypot(eb.x - player.x, eb.y - player.y) < eb.radius + 18) {
            player.hp = Math.max(0, player.hp - eb.dmg);
            player.invuln = 0.8;
            screenShake = 8;
            floatingTexts.push({ x: player.x, y: player.y - 34, text: `-${eb.dmg}`, color: '#f87171', life: 0.75 });
            enemyBullets.splice(i, 1);
            updateHud();
            if (player.hp <= 0) { gameOver(); return; }
          }
        }

        // 4. 구급 상자 아이템
        for (let i = pickups.length - 1; i >= 0; i--) {
          const pk = pickups[i];
          pk.life -= dt;
          if (pk.life <= 0) { pickups.splice(i, 1); continue; }
          const pPrev = pk.y;
          pk.vy += GRAVITY * 0.7 * dt;
          pk.y += pk.vy * dt;
          const dummy = { x: pk.x, y: pk.y, w: 26, h: 26, vy: pk.vy, grounded: false };
          resolvePlatformCollision(dummy, pPrev);
          pk.y = dummy.y; pk.vy = dummy.vy;

          if (Math.hypot(pk.x - player.x, pk.y - player.y) < 42) {
            playSfx('pickup');
            player.hp = Math.min(player.maxHp, player.hp + 35);
            showToast('💚 구급 상자 획득 (+35 체력)');
            pickups.splice(i, 1);
            updateHud();
          }
        }

        // 5. 파티클 & 플로팅 텍스트
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          if (pt.grav) pt.vy += 700 * dt;
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        }
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y -= 36 * dt;
          ft.life -= dt;
          if (ft.life <= 0) floatingTexts.splice(i, 1);
        }
      }

      // ==========================================
      // 4. 4개 섹터 실감나는 디테일 배경 & 중앙 STAGE 배너 렌더링
      // ==========================================
      function drawOutlinedRect(x, y, w, h, r, fill, stroke = '#090d16', lw = 3) {
        ctx.fillStyle = fill;
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
        ctx.stroke();
      }

      function legacySectorBackground() {
        ctx.save();
        ctx.translate(0, -camera.y * 0.45);

        if (sector === 1) {
          ctx.fillStyle = '#fef9c3';
          ctx.fillRect(0, 0, CAM_W, MAP_H + 200);

          ctx.fillStyle = '#fde68a';
          ctx.fillRect(0, 0, CAM_W, 38);

          ctx.fillStyle = '#b45309';
          ctx.fillRect(0, 395, CAM_W, 440);
          ctx.fillStyle = '#78350f';
          ctx.fillRect(0, 387, CAM_W, 10);
          ctx.strokeStyle = '#090d16';
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(0, 387); ctx.lineTo(CAM_W, 387); ctx.stroke();

          const step = 620;
          const first = Math.floor((camera.x * 0.45) / step) * step;
          for (let mx = first; mx < camera.x * 0.45 + CAM_W + step; mx += step) {
            const sx = mx - camera.x * 0.45;

            drawOutlinedRect(sx + 30, 128, 240, 148, 6, '#14532d', '#78350f', 6);
            drawOutlinedRect(sx + 75, 86, 62, 28, 4, '#fffbeb', '#78350f', 3);
            drawOutlinedRect(sx + 160, 86, 62, 28, 4, '#fffbeb', '#78350f', 3);
            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx + 52, 165); ctx.lineTo(sx + 135, 165);
            ctx.moveTo(sx + 52, 190); ctx.lineTo(sx + 115, 190);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(sx + 210, 188, 22, 0, Math.PI * 2);
            ctx.stroke();
            drawOutlinedRect(sx + 24, 272, 252, 11, 3, '#92400e', '#090d16', 2.5);
            ctx.fillStyle = '#ffffff';

          rrect(26, -30, 58, 14, 5, W('#334155'), 3);
          rrect(70, -34, 18, 22, 4, W('#0f172a'), 3);
          glowEye(90, -23, 4, '#a3e635', t);
        } else {
          // 외계인 대장 보스
          const hw = b.w / 2;
          rrect(-38, 24 + step * 0.4, 26, 48, 7, W('#3b0764'), 4);
          rrect(12, 24 - step * 0.4, 26, 48, 7, W('#3b0764'), 4);
          rrect(-42, 66, 34, 14, 6, W('#0b0f1a'), 2);
          rrect(8, 66, 34, 14, 6, W('#0b0f1a'), 2);
          // 갑옷 몸통
          rrect(-hw, -b.h / 2 + 30 + breathe * 0.3, b.w, b.h * 0.62, 26, flash ? '#fff' : gradFill(0, -50, 0, 50, [[0, '#a855f7'], [0.6, '#6b21a8'], [1, '#3b0764']]), 4);
          // 코어
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = radFill(0, -6, 0, 30, [[0, 'rgba(250,204,21,0.95)'], [0.4, 'rgba(244,63,94,0.6)'], [1, 'rgba(244,63,94,0)']]);
          ctx.beginPath(); ctx.arc(0, -6, 30 + Math.sin(t * 6) * 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
          blob(0, -6, 11, 11, W('#fde047'), 3);
          // 어깨 스파이크
          [-1, 1].forEach(s => {
            ctx.fillStyle = W('#1e1b4b'); ctx.strokeStyle = '#0b0f1a'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(s * 40, -40); ctx.lineTo(s * 78, -62); ctx.lineTo(s * 58, -24); ctx.closePath(); ctx.fill(); ctx.stroke();
          });
          // 거대한 머리
          const hy = -b.h / 2 + 8 + breathe * 0.6;
          blob(0, hy, 44, 38, flash ? '#fff' : radFill(-12, hy - 16, 6, 52, [[0, '#f0abfc'], [0.6, '#c026d3'], [1, '#701a75']]), 4);
          // 뇌 주름
          ctx.strokeStyle = 'rgba(80,7,90,0.6)'; ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-26, hy - 20); ctx.quadraticCurveTo(-12, hy - 34, 0, hy - 22);
          ctx.quadraticCurveTo(12, hy - 34, 26, hy - 20); ctx.stroke();
          // 왕관
          ctx.fillStyle = W('#facc15'); ctx.strokeStyle = '#0b0f1a'; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-26, hy - 30); ctx.lineTo(-20, hy - 52); ctx.lineTo(-8, hy - 36); ctx.lineTo(0, hy - 58);
          ctx.lineTo(8, hy - 36); ctx.lineTo(20, hy - 52); ctx.lineTo(26, hy - 30); ctx.closePath(); ctx.fill(); ctx.stroke();
          glowEye(0, hy - 46, 4, '#22d3ee', t);
          // 세 눈
          glowEye(-16, hy + 2, 7, '#f43f5e', t);
          glowEye(16, hy + 2, 7, '#f43f5e', t + 0.3);
          glowEye(0, hy - 12, 6, '#facc15', t + 0.6);
          ctx.strokeStyle = '#0b0f1a'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(-14, hy + 20); ctx.quadraticCurveTo(0, hy + 12, 14, hy + 20); ctx.stroke();
          // 에너지 손
          blob(58, -10, 14, 14, W('#a855f7'), 3);
          glowEye(64, -10, 7, '#e879f9', t);
        }
        ctx.restore();

        if (!b.active) {
          ctx.save();
          const p = 0.5 + 0.5 * Math.sin(t * 3);
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = radFill(b.x, b.y - 6, b.w * 0.3, b.w * 0.85, [[0, 'rgba(56,189,248,0)'], [0.8, `rgba(56,189,248,${0.12 + p * 0.1})`], [1, 'rgba(56,189,248,0)']]);
          ctx.beginPath(); ctx.ellipse(b.x, b.y - 6, b.w * 0.85, b.h * 0.78, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = `rgba(125,211,252,${0.5 + p * 0.4})`;
          ctx.lineWidth = 2.5;
          ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 30;
          ctx.beginPath(); ctx.ellipse(b.x, b.y - 6, b.w * 0.78, b.h * 0.7, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }

        // 보스 체력바
        const bbw = 190, by = b.y - b.h / 2 - (b.stage >= 3 ? 92 : 64);
        ctx.save();
        rrect(b.x - bbw / 2 - 3, by - 3, bbw + 6, 16, 8, 'rgba(2,6,23,0.85)', 2, 'rgba(250,204,21,0.7)');
        const ratio = Math.max(0, b.hp / b.maxHp);
        if (ratio > 0) {
          rrect(b.x - bbw / 2, by, bbw * ratio, 10, 5, gradFill(b.x - bbw / 2, 0, b.x + bbw / 2, 0, [[0, '#be123c'], [0.6, '#f43f5e'], [1, '#fb923c']]), 0);
          ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(b.x - bbw / 2 + 3, by + 1.5, bbw * ratio - 6, 2.5);
        }
        ctx.font = '900 14px "Noto Sans KR"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#020617'; ctx.lineWidth = 4;
        ctx.strokeText(b.name, b.x, by - 8);
        ctx.fillStyle = '#fef08a';
        ctx.fillText(b.name, b.x, by - 8);
        ctx.restore();
      }

      // 게임 화면 좌측 상단 HP 게이지 + 진행 레이더 바 렌더링
      function renderTopLeftHud() {
        ctx.save();
        const boxX = 14;
        const boxY = 12;
        const boxW = 246;
        const boxH = 38;

        ctx.fillStyle = 'rgba(9, 13, 22, 0.84)';
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(boxX + 6, boxY + 6, 26, 26, 7);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♥', boxX + 19, boxY + 20);

        const hpRatio = Math.max(0, Math.min(1, player.hp / player.maxHp));
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '900 11px "Noto Sans KR", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('HP', boxX + 40, boxY + 16);

        ctx.fillStyle = hpRatio <= 0.3 ? '#f87171' : '#86efac';
        ctx.textAlign = 'right';
        ctx.fillText(`${Math.ceil(player.hp)} / ${player.maxHp}`, boxX + boxW - 10, boxY + 16);

        const barX = boxX + 40;
        const barY = boxY + 21;
        const barW = boxW - 50;
        const barH = 10;
        ctx.fillStyle = '#020617';
        ctx.beginPath();
        ctx.roundRect(barX, barY, barW, barH, 5);
        ctx.fill();

        if (hpRatio > 0) {
          const hpGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
          if (hpRatio <= 0.3) {
            hpGrad.addColorStop(0, '#dc2626');
            hpGrad.addColorStop(1, '#f87171');
          } else if (hpRatio <= 0.6) {
            hpGrad.addColorStop(0, '#d97706');
            hpGrad.addColorStop(1, '#facc15');
          } else {
            hpGrad.addColorStop(0, '#10b981');
            hpGrad.addColorStop(1, '#a3e635');
          }
          ctx.fillStyle = hpGrad;
          ctx.beginPath();
          ctx.roundRect(barX, barY, Math.max(8, barW * hpRatio), barH, 5);
          ctx.fill();
        }

        const radarW = boxW;
        const radarH = 12;
        const rx = boxX;
        const ry = boxY + boxH + 6;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(rx, ry, radarW, radarH, 5);
        ctx.fill();
        ctx.stroke();

        const camRatioX = (camera.x / MAP_W) * radarW;
        const camRatioW = (CAM_W / MAP_W) * radarW;
        ctx.fillStyle = 'rgba(250, 204, 21, 0.24)';
        ctx.fillRect(rx + camRatioX, ry + 1, camRatioW, radarH - 2);

        const goalX = rx + ((sector < 4 ? portal.x : mom.x) / MAP_W) * radarW;
        ctx.fillStyle = sector < 4 ? (portal.unlocked ? '#38bdf8' : '#f43f5e') : '#f472b6';
        ctx.beginPath(); ctx.arc(goalX, ry + radarH / 2, 3.5, 0, Math.PI * 2); ctx.fill();

        const px = rx + (player.x / MAP_W) * radarW;
        ctx.fillStyle = '#4ade80';
        ctx.beginPath(); ctx.arc(px, ry + radarH / 2, 3.2, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
      }

      function formatTimeSec(sec) {
        const s = Math.max(0, Number(sec || 0));
        const m = Math.floor(s / 60);
        const rem = Math.floor(s % 60);
        return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
      }

      // 게임 화면 우측 상단 골드(점수) & 타임 HUD 렌더링
      function renderTopRightHud() {
        ctx.save();
        const boxW = 192;
        const boxH = 42;
        const boxX = CAM_W - boxW - 14;
        const boxY = 12;

        ctx.fillStyle = 'rgba(9, 13, 22, 0.84)';
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 10);
        ctx.fill();
        ctx.stroke();

        ctx.font = '900 12px "Inter", "Noto Sans KR", sans-serif';
        ctx.textBaseline = 'middle';

        ctx.textAlign = 'left';
        ctx.fillStyle = '#fde047';
        ctx.fillText(`🏆 ${Math.floor(score).toLocaleString()}`, boxX + 10, boxY + boxH / 2);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#7dd3fc';
        ctx.fillText(`⏱ ${formatTimeSec(elapsedTime)}`, boxX + boxW - 10, boxY + boxH / 2);

        ctx.restore();
      }

      // 게임 시작/스테이지 진입 시 화면 중앙 STAGE 1 배너 렌더링
      function renderCenterStageBanner() {
        if (!stageBanner.active) return;
        const t = stageBanner.timer;
        const dur = stageBanner.duration;
        let alpha = 1;
        let scalePop = 1;

        if (t < 0.25) {
          const p = t / 0.25;
          alpha = p;
          scalePop = 0.8 + 0.2 * p;
        } else if (t > dur - 0.45) {
          alpha = Math.max(0, (dur - t) / 0.45);
        }

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(CAM_W / 2, CAM_H * 0.36);
        ctx.scale(scalePop, scalePop);

        // 중앙 반투명 배경 띠
        const bannerW = 460;
        const bannerH = 92;
        const grad = ctx.createLinearGradient(-bannerW / 2, 0, bannerW / 2, 0);
        grad.addColorStop(0, 'rgba(9, 13, 22, 0)');
        grad.addColorStop(0.2, 'rgba(9, 13, 22, 0.86)');
        grad.addColorStop(0.8, 'rgba(9, 13, 22, 0.86)');
        grad.addColorStop(1, 'rgba(9, 13, 22, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(-bannerW / 2, -bannerH / 2, bannerW, bannerH);

        // 상단/하단 골드 라인
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.75)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-180, -bannerH / 2);
        ctx.lineTo(180, -bannerH / 2);
        ctx.moveTo(-180, bannerH / 2);
        ctx.lineTo(180, bannerH / 2);
        ctx.stroke();

        // STAGE 1 메인 텍스트
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 38px "Inter", "Noto Sans KR", sans-serif';
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 6;
        ctx.strokeText(stageBanner.stageText, 0, -10);
        ctx.fillStyle = '#facc15';
        ctx.fillText(stageBanner.stageText, 0, -10);

        // 부제목 텍스트
        ctx.font = '800 16px "Noto Sans KR", sans-serif';
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 4;
        ctx.strokeText(stageBanner.subText, 0, 22);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(stageBanner.subText, 0, 22);

        ctx.restore();
      }

      // ===== 그래픽 업그레이드: 배경 이미지 / 지형 / 캐릭터 / 이펙트 =====
      const BG_IMAGES = {};
      [1, 2, 3, 4].forEach((n) => {
        const img = new Image();
        img.onload = () => { img._ok = true; };
        img.src = `./img/bg${n}.jpg`;
        BG_IMAGES[n] = img;
      });

      const AMBIENT = Array.from({ length: 46 }, (_, i) => ({
        x: (i * 197) % CAM_W, y: (i * 89) % CAM_H,
        s: 1 + (i % 3), sp: 8 + (i % 5) * 6, ph: i * 1.7
      }));

      function groundYBelow(x, footY) {
        let best = 576;
        for (const p of PLATFORMS) {
          if (p.style === 'ground') continue;
          if (x >= p.x && x <= p.x + p.w && p.y >= footY - 4 && p.y < best) best = p.y;
        }
        return best;
      }

      function drawShadow(x, footY, w) {
        const gy = groundYBelow(x, footY);
        const k = Math.max(0.25, 1 - (gy - footY) / 220);
        ctx.fillStyle = `rgba(0,0,0,${0.32 * k})`;
        ctx.beginPath(); ctx.ellipse(x, gy + 1, w * 0.55 * k, 6 * k, 0, 0, Math.PI * 2); ctx.fill();
      }

      function drawParallaxImage(img, factor, tint) {
        const scale = (CAM_H + 120) / img.height;
        const w = img.width * scale, h = img.height * scale;
        const off = -((camera.x * factor) % (w * 2));
        const y = -40 - (camera.y - (MAP_H - CAM_H)) * 0.25;
        for (let k = -1; k < 3; k++) {
          const x = off + k * w;
          if (x > CAM_W || x + w < 0) continue;
          ctx.save();
          if (((k % 2) + 2) % 2 === 1) {
            ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h);
          } else {
            ctx.drawImage(img, x, y, w, h);
          }
          ctx.restore();
        }
        if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, CAM_W, CAM_H); }
      }

      function renderSectorBackground() {
        const img = BG_IMAGES[sector];
        if (!(img && img._ok)) { legacySectorBackground(); }
        else {
          const tints = { 1: 'rgba(255,237,213,0.08)', 2: 'rgba(15,23,42,0.12)', 3: 'rgba(30,10,40,0.18)', 4: 'rgba(15,23,42,0.18)' };
          drawParallaxImage(img, 0.22, tints[sector]);
          // 바닥 쪽으로 갈수록 어두워지는 깊이감
          const g = ctx.createLinearGradient(0, CAM_H * 0.45, 0, CAM_H);
          g.addColorStop(0, 'rgba(2,6,23,0)');
          g.addColorStop(1, 'rgba(2,6,23,0.45)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, CAM_W, CAM_H);
        }
        renderAmbient();
      }

      function renderAmbient() {
        const t = performance.now() / 1000;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        AMBIENT.forEach((a) => {
          let x, y, col;
          if (sector === 3) {
            // 불씨가 위로 날아오름
            y = (a.y - t * a.sp * 2.2) % CAM_H; if (y < 0) y += CAM_H;
            x = (a.x + Math.sin(t + a.ph) * 14 - camera.x * 0.3) % CAM_W; if (x < 0) x += CAM_W;
            col = `rgba(251,146,60,${0.35 + 0.35 * Math.sin(t * 3 + a.ph)})`;
          } else {
            y = (a.y + Math.sin(t * 0.6 + a.ph) * 12) % CAM_H;
            x = (a.x + t * a.sp * 0.4 - camera.x * 0.15) % CAM_W; if (x < 0) x += CAM_W;
            col = sector === 2 ? `rgba(186,230,253,${0.18 + 0.12 * Math.sin(t + a.ph)})`
              : `rgba(255,251,235,${0.2 + 0.15 * Math.sin(t + a.ph)})`;
          }
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(x, y, a.s * (sector === 3 ? 1.2 : 0.9), 0, Math.PI * 2); ctx.fill();
        });
        ctx.restore();
      }

      // ---- 지형 ----
      function drawGround(p) {
        const x0 = Math.max(p.x, camera.x - 30), x1 = Math.min(p.x + p.w, camera.x + CAM_W + 30);
        const y = p.y, h = 260;
        if (sector === 1) {
          ctx.fillStyle = gradFill(0, y, 0, y + 120, [[0, '#b7712f'], [1, '#6b3a14']]);
          ctx.fillRect(x0, y, x1 - x0, h);
          ctx.strokeStyle = 'rgba(60,25,5,0.55)'; ctx.lineWidth = 2;
          const s = Math.floor(x0 / 96) * 96;
          for (let bx = s; bx < x1; bx += 96) {
            ctx.beginPath(); ctx.moveTo(bx, y + 14); ctx.lineTo(bx, y + h); ctx.stroke();
            ctx.fillStyle = 'rgba(255,220,170,0.08)'; ctx.fillRect(bx + 6, y + 14, 30, h);
          }
          for (let ly = y + 40; ly < y + h; ly += 34) { ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(x1, ly); ctx.stroke(); }
          ctx.fillStyle = gradFill(0, y - 2, 0, y + 14, [[0, '#fbbf24'], [1, '#b45309']]);
          ctx.fillRect(x0, y - 2, x1 - x0, 16);
        } else if (sector === 2) {
          ctx.fillStyle = gradFill(0, y, 0, y + 120, [[0, '#94a3b8'], [1, '#334155']]);
          ctx.fillRect(x0, y, x1 - x0, h);
          ctx.strokeStyle = 'rgba(15,23,42,0.35)'; ctx.lineWidth = 1.5;
          const s = Math.floor(x0 / 48) * 48;
          for (let bx = s; bx < x1; bx += 48) { ctx.beginPath(); ctx.moveTo(bx, y + 16); ctx.lineTo(bx - 20, y + h); ctx.stroke(); }
          for (let ly = y + 40; ly < y + h; ly += 30) { ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(x1, ly); ctx.stroke(); }
          // 노란 점자블록 안전선
          ctx.fillStyle = '#facc15'; ctx.fillRect(x0, y, x1 - x0, 14);
          ctx.fillStyle = 'rgba(161,98,7,0.55)';
          for (let bx = Math.floor(x0 / 12) * 12; bx < x1; bx += 12) { ctx.beginPath(); ctx.arc(bx + 6, y + 7, 2.2, 0, Math.PI * 2); ctx.fill(); }
        } else if (sector === 3) {
          ctx.fillStyle = gradFill(0, y, 0, y + 140, [[0, '#3f3f46'], [1, '#18181b']]);
          ctx.fillRect(x0, y, x1 - x0, h);
          // 차선
          ctx.fillStyle = 'rgba(250,204,21,0.75)';
          for (let bx = Math.floor(x0 / 140) * 140; bx < x1; bx += 140) ctx.fillRect(bx, y + 46, 70, 6);
          // 균열
          ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
          for (let bx = Math.floor(x0 / 310) * 310; bx < x1; bx += 310) {
            ctx.beginPath(); ctx.moveTo(bx + 40, y + 18); ctx.lineTo(bx + 62, y + 34); ctx.lineTo(bx + 54, y + 52); ctx.lineTo(bx + 80, y + 70); ctx.stroke();
          }
          // 연석
          ctx.fillStyle = gradFill(0, y - 2, 0, y + 16, [[0, '#a1a1aa'], [1, '#52525b']]);
          ctx.fillRect(x0, y - 2, x1 - x0, 16);
          // 바닥에 비친 화재 빛
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = gradFill(0, y, 0, y + 60, [[0, 'rgba(249,115,22,0.18)'], [1, 'rgba(249,115,22,0)']]);
          ctx.fillRect(x0, y, x1 - x0, 60); ctx.restore();
        } else {
          ctx.fillStyle = gradFill(0, y, 0, y + 140, [[0, '#334155'], [1, '#0b1220']]);
          ctx.fillRect(x0, y, x1 - x0, h);
          ctx.strokeStyle = 'rgba(148,163,184,0.18)'; ctx.lineWidth = 1.5;
          for (let bx = Math.floor(x0 / 120) * 120; bx < x1; bx += 120) { ctx.beginPath(); ctx.moveTo(bx, y + 14); ctx.lineTo(bx, y + h); ctx.stroke(); }
          // 대리석 반사광
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = gradFill(0, y + 14, 0, y + 70, [[0, 'rgba(125,211,252,0.16)'], [1, 'rgba(125,211,252,0)']]);
          ctx.fillRect(x0, y + 14, x1 - x0, 56); ctx.restore();
          ctx.fillStyle = gradFill(0, y - 2, 0, y + 14, [[0, '#64748b'], [1, '#1e293b']]);
          ctx.fillRect(x0, y - 2, x1 - x0, 16);
        }
        ctx.strokeStyle = '#0b0f1a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x0, y - 2); ctx.lineTo(x1, y - 2); ctx.stroke();
      }

      function drawPlatform(p) {
        const pal = {
          1: ['#e2a35b', '#9a5b1f', '#fde68a'], 2: ['#38bdf8', '#075985', '#e0f2fe'],
          3: ['#78716c', '#292524', '#fdba74'], 4: ['#7dd3fc', '#1e3a8a', '#e0f2fe']
        }[sector];
        // 아래 그림자
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.roundRect(p.x + 8, p.y + p.h, p.w - 16, 10, 5); ctx.fill();
        rrect(p.x, p.y, p.w, p.h, 6, gradFill(0, p.y, 0, p.y + p.h, [[0, pal[0]], [1, pal[1]]]), 3);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(p.x + 6, p.y + 3, p.w - 12, 4);
        // 볼트 / 무늬
        ctx.fillStyle = 'rgba(11,15,26,0.55)';
        for (let bx = p.x + 16; bx < p.x + p.w - 8; bx += 44) { ctx.beginPath(); ctx.arc(bx, p.y + p.h - 7, 2.4, 0, Math.PI * 2); ctx.fill(); }
        if (sector === 3 || sector === 4) {
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = pal[2]; ctx.globalAlpha = 0.35 + 0.25 * Math.sin(performance.now() / 300 + p.x);
          ctx.fillRect(p.x + 10, p.y + p.h - 3, p.w - 20, 2); ctx.restore();
        }
      }

      // ---- 주인공 ----
      function drawWeapon(idx) {
        const t = performance.now() / 1000;
        if (idx === 0) { // 헤비 머신건
          rrect(-2, -6, 22, 12, 3, gradFill(0, -6, 0, 6, [[0, '#64748b'], [1, '#1e293b']]), 2.5);
          rrect(18, -3.5, 18, 7, 2, '#334155', 2);
          rrect(4, 4, 8, 9, 2, '#0f172a', 2);
          blob(37, 0, 2.6, 2.6, '#facc15', 0);
        } else if (idx === 1) { // 로켓 런처
          rrect(-6, -8, 40, 16, 7, gradFill(0, -8, 0, 8, [[0, '#4d7c0f'], [1, '#1a2e05']]), 2.5);
          rrect(30, -10, 8, 20, 3, '#0f172a', 2.5);
          blob(4, 9, 4, 4, '#0f172a', 2);
          blob(36, 0, 4, 5, '#f97316', 0);
        } else if (idx === 2) { // 레이저 건
          rrect(-2, -6, 30, 12, 6, gradFill(0, -6, 0, 6, [[0, '#e0f2fe'], [1, '#64748b']]), 2.5);
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < 3; i++) {
            ctx.fillStyle = `rgba(56,189,248,${0.5 + 0.4 * Math.sin(t * 10 + i)})`;
            ctx.fillRect(6 + i * 6, -4, 3, 8);
          }
          ctx.restore();
          rrect(26, -3, 10, 6, 3, '#0ea5e9', 2);
        } else { // 플레임 샷
          blob(2, 6, 8, 8, gradFill(0, -2, 0, 14, [[0, '#f87171'], [1, '#7f1d1d']]), 2.5);
          rrect(4, -5, 26, 9, 4, '#475569', 2.5);
          rrect(28, -6, 8, 11, 3, '#1f2937', 2);
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          blob(37, 0, 3 + Math.random() * 1.5, 3, 'rgba(251,146,60,0.9)', 0); ctx.restore();
        }
      }

      function renderPlayer() {
        const t = performance.now() / 1000;
        ctx.save();
        if (player.invuln > 0 && Math.floor(player.invuln * 18) % 2 === 0) ctx.globalAlpha = 0.55;
        const celebrate = (rescueSequence && (mom.rescued || mom.hugged)) ? -Math.abs(Math.sin(player.walkCycle)) * 24 : 0;
        drawShadow(player.x, player.y + player.h / 2, 34);

        // 대시 잔상
        if (player.dashTimer > 0) {
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          for (let i = 1; i <= 3; i++) {
            ctx.fillStyle = `rgba(250,204,21,${0.22 / i})`;
            ctx.beginPath(); ctx.ellipse(player.x - player.dashDir * i * 16, player.y, 18, 26, 0, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }

        ctx.translate(player.x, player.y + celebrate);
        ctx.scale(1.18, 1.18);
        const faceDir = rescueSequence ? 1 : (Math.cos(player.aimAngle) >= 0 ? 1 : -1);
        const legSwing = Math.sin(player.walkCycle) * 7;
        const bobY = Math.abs(Math.sin(player.walkCycle)) * 2.5;

        // 망토
        ctx.fillStyle = gradFill(0, -16, 0, 0, [[0, '#f87171'], [1, '#b91c1c']]);
        ctx.strokeStyle = '#0b0f1a'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-faceDir * 6, -16 - bobY);
        ctx.quadraticCurveTo(-faceDir * 22, -14 - bobY + Math.sin(player.walkCycle * 1.5) * 4, -faceDir * 26, -4 - bobY + Math.sin(t * 6) * 3);
        ctx.lineTo(-faceDir * 10, 4 - bobY);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // 다리 + 운동화
        rrect(-10 + legSwing * 0.5, 5, 8, 15, 3, '#1d4ed8', 2.2);
        rrect(2 - legSwing * 0.5, 5, 8, 15, 3, '#1e40af', 2.2);
        rrect(-12 + legSwing * 0.5, 18, 12, 6, 3, '#f8fafc', 2);
        rrect(0 - legSwing * 0.5, 18, 12, 6, 3, '#f8fafc', 2);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-11 + legSwing * 0.5, 21, 10, 2); ctx.fillRect(1 - legSwing * 0.5, 21, 10, 2);

        // 몸통 (후드티 + 가방끈)
        rrect(-12, -12 - bobY, 24, 21, 7, gradFill(0, -12, 0, 9, [[0, '#fbbf24'], [1, '#d97706']]), 2.6);
        ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-faceDir * 8, -11 - bobY); ctx.lineTo(faceDir * 6, 6 - bobY); ctx.stroke();
        blob(0, -2 - bobY, 3, 3, '#fef3c7', 1.5);

        // 머리
        const hy = -21 - bobY;
        blob(0, hy, 12.5, 12, radFill(-4, hy - 5, 2, 15, [[0, '#ffe6cc'], [1, '#f5b383']]), 2.6);
        // 모자 (챙은 바라보는 방향)
        ctx.fillStyle = gradFill(0, hy - 14, 0, hy, [[0, '#22c55e'], [1, '#15803d']]);
        ctx.beginPath(); ctx.arc(0, hy - 2, 12.8, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill(); ctx.stroke();
        rrect(faceDir > 0 ? 2 : -18, hy - 4, 16, 4.5, 2, '#166534', 2);
        blob(0, hy - 14, 2.5, 2.5, '#fef08a', 1.5);
        // 눈 (조준 방향을 봄)
        const lx = Math.cos(player.aimAngle) * 1.5, ly = Math.sin(player.aimAngle) * 1.5;
        blob(faceDir * 3, hy + 1, 3, 3.6, '#ffffff', 1.4);
        blob(faceDir * 9, hy + 1, 2.6, 3.4, '#ffffff', 1.4);
        blob(faceDir * 3 + lx, hy + 1.5 + ly, 1.5, 1.9, '#0b0f1a', 0);
        blob(faceDir * 9 + lx, hy + 1.5 + ly, 1.4, 1.8, '#0b0f1a', 0);
        blob(faceDir * -2, hy + 6, 2.4, 1.4, 'rgba(244,114,182,0.6)', 0);
        ctx.strokeStyle = '#0b0f1a'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(faceDir * 6, hy + 6, 2.6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

        if (!rescueSequence) {
          ctx.save();
          ctx.translate(-Math.cos(player.aimAngle) * player.recoil, -3 - bobY - Math.sin(player.aimAngle) * player.recoil);
          ctx.rotate(player.aimAngle);
          if (Math.cos(player.aimAngle) < -0.01) ctx.scale(1, -1);
          blob(4, 2, 4.2, 4.2, '#ffd7b0', 2);
          drawWeapon(player.weaponIdx);
          ctx.restore();
        } else {
          rrect(-18, -26 - bobY, 6, 14, 3, '#ffd7b0', 2);
          rrect(12, -26 - bobY, 6, 14, 3, '#ffd7b0', 2);
        }
        ctx.restore();
      }

      // ---- 외계인 적 ----
      function renderEnemy(en) {
        const t = performance.now() / 1000;
        drawShadow(en.x, en.y + en.h / 2, en.w);
        ctx.save();
        ctx.translate(en.x, en.y);
        const dir = player.x >= en.x ? 1 : -1;
        ctx.scale(dir * 1.15, 1.15);
        const fl = en.hitFlash > 0;
        const leg = Math.sin(en.walkCycle) * 5;
        const hw = en.w / 2, hh = en.h / 2;

        if (en.kind === 'alien_scout') {
          // 제트팩 정찰병
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          const fh = 14 + Math.random() * 8;
          ctx.fillStyle = gradFill(0, hh - 6, 0, hh + fh, [[0, 'rgba(125,211,252,0.95)'], [1, 'rgba(56,189,248,0)']]);
          ctx.beginPath(); ctx.moveTo(-12, hh - 8); ctx.lineTo(-4, hh - 8); ctx.lineTo(-8, hh + fh); ctx.closePath(); ctx.fill();
          ctx.restore();
          rrect(-15, -6, 9, 20, 4, '#334155', 2.2);
          rrect(-hw + 4, -hh + 12, en.w - 8, en.h * 0.55, 10, fl ? '#fff' : gradFill(0, -hh, 0, hh, [[0, '#7dd3fc'], [1, '#0369a1']]), 2.6);
          blob(2, -hh + 8, 15, 13, fl ? '#fff' : radFill(-3, -hh + 2, 2, 18, [[0, '#bae6fd'], [1, '#0284c7']]), 2.6);
          blob(6, -hh + 8, 7.5, 8, '#020617', 2);
          glowEye(8, -hh + 6, 3, '#f0abfc', t);

          ctx.beginPath(); ctx.moveTo(-2, -hh - 3); ctx.lineTo(-8, -hh - 14); ctx.stroke();
          glowEye(-8, -hh - 15, 2.6, '#38bdf8', t);
          rrect(-6 + leg * 0.4, hh - 12, 6, 10, 3, '#1e293b', 2);
          rrect(4 - leg * 0.4, hh - 12, 6, 10, 3, '#1e293b', 2);
        } else if (en.kind === 'alien_guard') {
          // 중장갑 경비병
          rrect(-14 + leg * 0.5, 6, 11, hh - 2, 4, '#3b0764', 2.6);
          rrect(3 - leg * 0.5, 6, 11, hh - 2, 4, '#3b0764', 2.6);
          rrect(-17 + leg * 0.5, hh, 15, 6, 3, '#0b0f1a', 0);
          rrect(2 - leg * 0.5, hh, 15, 6, 3, '#0b0f1a', 0);
          rrect(-hw, -hh + 8, en.w, en.h * 0.66, 14, fl ? '#fff' : gradFill(0, -hh, 0, hh, [[0, '#c084fc'], [0.5, '#7e22ce'], [1, '#3b0764']]), 3);
          blob(-hw + 2, -hh + 14, 11, 8, fl ? '#fff' : '#581c87', 2.6);
          blob(hw - 2, -hh + 14, 11, 8, fl ? '#fff' : '#581c87', 2.6);
          rrect(-14, -hh - 6, 28, 22, 9, fl ? '#fff' : '#4c1d95', 2.8);
          rrect(-8, -hh + 1, 22, 7, 3.5, '#020617', 2);
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = `rgba(239,68,68,${0.7 + 0.3 * Math.sin(t * 9)})`;
          ctx.fillRect(-6, -hh + 2.5, 18, 4);
          ctx.fillStyle = radFill(3, -hh + 4, 0, 20, [[0, 'rgba(239,68,68,0.5)'], [1, 'rgba(239,68,68,0)']]);
          ctx.fillRect(-18, -hh - 16, 42, 40); ctx.restore();
          rrect(6, -2, 26, 12, 5, '#1f2937', 2.6);
          glowEye(32, 4, 3, '#e879f9', t);
        } else {
          // 일반 병사 (큰머리 초록 외계인)
          rrect(-10 + leg * 0.5, 4, 8, hh - 2, 3, '#1e293b', 2.4);
          rrect(2 - leg * 0.5, 4, 8, hh - 2, 3, '#1e293b', 2.4);
          rrect(-hw + 4, -hh + 18, en.w - 8, en.h * 0.48, 9, fl ? '#fff' : gradFill(0, 0, 0, 20, [[0, '#4ade80'], [1, '#15803d']]), 2.6);
          rrect(-hw + 8, -hh + 22, en.w - 16, 6, 3, 'rgba(15,23,42,0.6)', 0);
          blob(0, -hh + 8, 17, 15, fl ? '#fff' : radFill(-5, -hh + 2, 2, 20, [[0, '#d9f99d'], [1, '#65a30d']]), 2.6);
          ctx.save(); ctx.rotate(-0.18);
          blob(-2, -hh + 12, 5.5, 8, '#020617', 2); ctx.restore();
          ctx.save(); ctx.rotate(0.18);
          blob(10, -hh + 9, 5.5, 8, '#020617', 2); ctx.restore();
          blob(0, -hh + 7, 1.8, 2.4, '#ffffff', 0); blob(10, -hh + 6, 1.8, 2.4, '#ffffff', 0);
          ctx.strokeStyle = '#0b0f1a'; ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(-5, -hh - 4); ctx.quadraticCurveTo(-12, -hh - 12, -10 + Math.sin(t * 5 + en.x) * 2, -hh - 16);
          ctx.moveTo(5, -hh - 4); ctx.quadraticCurveTo(12, -hh - 12, 10 + Math.cos(t * 5 + en.x) * 2, -hh - 16);
          ctx.stroke();
          glowEye(-10, -hh - 17, 2.4, '#bef264', t);
          glowEye(10, -hh - 17, 2.4, '#bef264', t + 1);
          rrect(4, -hh + 24, 20, 8, 4, '#334155', 2.2);
          glowEye(24, -hh + 28, 2.2, '#f43f5e', t);
        }
        ctx.restore();

        // 체력바
        if (en.hp < en.maxHp) {
          const bw = en.w + 14, by = en.y - en.h / 2 - (en.kind === 'alien_trooper' ? 34 : 24);
          rrect(en.x - bw / 2 - 1.5, by - 1.5, bw + 3, 7, 3.5, 'rgba(2,6,23,0.85)', 0);
          rrect(en.x - bw / 2, by, Math.max(2, bw * Math.max(0, en.hp / en.maxHp)), 4, 2, '#f43f5e', 0);

      }

      // ---- 엄마 & 캡슐 ----

        blob(0, -19, 11, 11, radFill(-3, -23, 1, 13, [[0, '#ffe6cc'], [1, '#f5b383']]), 2.5);
        ctx.fillStyle = '#4a2511'; ctx.beginPath(); ctx.arc(0, -22, 11.5, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill();
        blob(-4, -18, 1.6, 2.2, '#0b0f1a', 0); blob(4, -18, 1.6, 2.2, '#0b0f1a', 0);

        ctx.stroke();

        // 말풍선

        rrect(-68, -62, 136, 24, 10, '#ffffff', 2.5);

          ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 3;

      // ---- 포탈 ----
      function renderPortal() {

        if (portal.unlocked) {
          ctx.globalCompositeOperation = 'lighter';
