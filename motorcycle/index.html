<script type="module">
import * as THREE from 'three';

const GAME_ID = 'moto_racing_3d_v1';
const CLOUD = 'https://02826k.duckdns.org';
const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const API = local ? '' : CLOUD;
const STORAGE = 'moto_racing_3d_save_v1';
const TOKEN_KEYS = ['hero_clicker_jwt_token', 'abuse_jwt_token', 'sky2026_jwt_token', 'gongdaegong_jwt_token', 'aigameroom_jwt_token', 'moto_racing_3d_jwt'];
const USER_KEYS = ['hero_clicker_username', 'gongdaegong_username', 'aigameroom_username', 'moto_racing_3d_user'];
const VIP_KEY = 'hero_clicker_is_vip';
const LOBBY_URL = 'https://02826k.github.io/aigameroom/';
function goLobbyAuth(mode = 'login') {
  const returnTo = encodeURIComponent(window.location.href);
  window.location.href = `${LOBBY_URL}?auth=${encodeURIComponent(mode)}&returnTo=${returnTo}`;
}
const FINISH_TIME_SEC = 180;
const LANES = [-3.2, 0, 3.2];

let authToken = null;
let currentUsername = null;

function loadSharedAuth() {
  authToken = null;
  currentUsername = null;
  try {
    for (const k of TOKEN_KEYS) {
      const v = localStorage.getItem(k);
      if (v) { authToken = v; break; }
    }
    for (const k of USER_KEYS) {
      const v = localStorage.getItem(k);
      if (v) { currentUsername = v; break; }
    }
  } catch {}
}
function saveSharedAuth(token, username, isVip) {
  try {
    if (token) {
      TOKEN_KEYS.forEach(k => localStorage.setItem(k, token));
      if (username) USER_KEYS.forEach(k => localStorage.setItem(k, username));
      if (isVip) localStorage.setItem(VIP_KEY, 'true');
    } else {
      TOKEN_KEYS.forEach(k => localStorage.removeItem(k));
      USER_KEYS.forEach(k => localStorage.removeItem(k));
      localStorage.removeItem(VIP_KEY);
    }
  } catch {}
}
loadSharedAuth();

function maskPhoneMiddle(name) {
  const str = String(name || '');
  const m = str.match(/^(01[016789])[-.\s]?(\d{3,4}|\*{3,4})[-.\s]?(\d{4}|\*{4})$/);
  if (m) return `${m[1]}-****-${m[3]}`;
  return str.replace(/(01[016789])[-.\s]?(\d{3,4})[-.\s]?(\d{4})/g, '$1-****-$3');
}

const COLOR_OPTIONS = [
  { id: 'red', label: '빨', hex: 0xef4444, css: '#ef4444' },
  { id: 'orange', label: '주', hex: 0xf97316, css: '#f97316' },
  { id: 'yellow', label: '노', hex: 0xeab308, css: '#eab308' },
  { id: 'green', label: '초', hex: 0x22c55e, css: '#22c55e' },
  { id: 'blue', label: '파', hex: 0x3b82f6, css: '#3b82f6' },
  { id: 'navy', label: '남', hex: 0x1e3a8a, css: '#1e3a8a' },
  { id: 'purple', label: '보', hex: 0xa855f7, css: '#a855f7' },
  { id: 'white', label: '흰색', hex: 0xf8fafc, css: '#f8fafc', metal: 0.35, rough: 0.35 },
  { id: 'black', label: '검정', hex: 0x0f172a, css: '#0f172a', metal: 0.45, rough: 0.35 },
  { id: 'gold', label: '골드', hex: 0xfbbf24, css: 'linear-gradient(135deg,#fef08a,#d97706)', metal: 0.9, rough: 0.16 },
  { id: 'rainbow', label: '무지개', hex: 0xff0080, css: 'linear-gradient(135deg,#ef4444,#eab308,#22c55e,#3b82f6,#a855f7)' }
];
const COLOR_IDS = new Set(COLOR_OPTIONS.map(c => c.id));
const defState = () => ({ highScore: 0, gold: 200, soundEnabled: true, bgmEnabled: true, isVip: localStorage.getItem(VIP_KEY) === 'true', selectedBike: 1, bikeColor: 'default', helmetColor: 'default', suitColor: 'default', bestTimeSec: null, maxSpeedKmh: 0, bestRunGold: 0, bestTotalScore: 0 });
function sanitize(p) {
  const b = defState();
  if (!p || typeof p !== 'object') return b;
  const isVip = !!p.isVip || localStorage.getItem(VIP_KEY) === 'true';
  const rawBike = p.selectedBike === 2 ? 2 : 1;
  return {
    highScore: typeof p.highScore === 'number' && p.highScore >= 0 ? Math.floor(p.highScore) : 0,
    gold: typeof p.gold === 'number' && p.gold >= 0 ? Math.floor(p.gold) : 200,
    soundEnabled: typeof p.soundEnabled === 'boolean' ? p.soundEnabled : true,
    bgmEnabled: typeof p.bgmEnabled === 'boolean' ? p.bgmEnabled : true,
    isVip,
    selectedBike: rawBike,
    bikeColor: COLOR_IDS.has(p.bikeColor) ? p.bikeColor : 'default',
    helmetColor: COLOR_IDS.has(p.helmetColor) ? p.helmetColor : 'default',
    suitColor: COLOR_IDS.has(p.suitColor) ? p.suitColor : 'default',

function levelLights(root) {
  const th = root.rotation.x, cs = Math.cos(-th), sn = Math.sin(-th), u = root.userData;
  const rot = o => {
    if (!o.userData.base) o.userData.base = o.position.clone();
    const b = o.userData.base;
    o.position.set(b.x, b.y * cs - b.z * sn, b.y * sn + b.z * cs);
  };
  [u.bikeSpot, u.bikeSpot2].forEach(sp => { if (sp) rot(sp.target); });
  [u.headBeam, u.headBeam2].forEach(bm => { if (bm) { rot(bm); bm.rotation.x = Math.PI / 2 - th; } });
}

function applyColorToMat(mat, colorId, defaultHex, defaultMetal, defaultRough) {
  if (!mat) return;
  if (!colorId || colorId === 'default') {
    mat.color.setHex(defaultHex);
    mat.metalness = defaultMetal;
    mat.roughness = defaultRough;
    return;
  }
  const opt = COLOR_OPTIONS.find(c => c.id === colorId);
  if (!opt) return;
  if (opt.id !== 'rainbow') mat.color.setHex(opt.hex);
  mat.metalness = opt.metal ?? (opt.id === 'gold' ? 0.9 : 0.65);
  mat.roughness = opt.rough ?? (opt.id === 'gold' ? 0.16 : 0.25);
}

function applyBikeCustomColors(forceBasicRed = false) {
  if (forceBasicRed) {
    applyColorToMat(bike1Mesh.userData.paintMat, 'default', 0xef4444, 0.55, 0.32);
    applyColorToMat(bike1Mesh.userData.helmetMat, 'default', 0xef4444, 0.65, 0.22);
    applyColorToMat(bike1Mesh.userData.jacketMat, 'default', 0x334155, 0.25, 0.55);
    applyColorToMat(bike1Mesh.userData.suitMat, 'default', 0x1e293b, 0.2, 0.65);
  } else {
    applyColorToMat(bike1Mesh.userData.paintMat, state.bikeColor, 0xef4444, 0.55, 0.32);
    applyColorToMat(bike1Mesh.userData.helmetMat, state.helmetColor, 0x0ea5e9, 0.65, 0.22);
    applyColorToMat(bike1Mesh.userData.jacketMat, state.suitColor, 0x334155, 0.25, 0.55);
    applyColorToMat(bike1Mesh.userData.suitMat, state.suitColor, 0x1e293b, 0.2, 0.65);
  }

  applyColorToMat(bike2Mesh.userData.paintMat, state.bikeColor, 0xeab308, 0.72, 0.22);
  applyColorToMat(bike2Mesh.userData.helmetMat, state.helmetColor, 0xf8fafc, 0.65, 0.22);
  applyColorToMat(bike2Mesh.userData.jacketMat, state.suitColor, 0x334155, 0.25, 0.55);
  applyColorToMat(bike2Mesh.userData.suitMat, state.suitColor, 0x1e293b, 0.2, 0.65);
}

function applySelectedBikeMesh() {
  const want = state.selectedBike === 2 ? bike2Mesh : bike1Mesh;
  if (player !== want) {
    want.position.copy(player.position);
    want.rotation.copy(player.rotation);
    scene.remove(player);
    player = want;
    scene.add(player);
  }
  applyBikeCustomColors();
}

  } else {

}

function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  if (w < 1 || h < 1) return;
  const aspect = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = aspect;
  const baseFov = 60;
  if (aspect < 1.25) {
    const targetHalfTan = Math.tan(THREE.MathUtils.degToRad(baseFov) / 2) * (1.25 / Math.max(0.55, aspect));
    camera.fov = Math.min(90, THREE.MathUtils.radToDeg(2 * Math.atan(targetHalfTan)));
  } else {
    camera.fov = baseFov;
  }
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function startGame() {
  if (!state.isVip && state.selectedBike === 2) {
    vipAlertModal.classList.remove('hidden');
    vipAlertModal.classList.add('flex');
    return;
  }
  applySelectedBikeMesh();
  if (!state.isVip) applyBikeCustomColors(true);
  distance = 0; lives = state.isVip ? 3 : 1; elapsedTime = 0; runMaxSpeed = 0; runGold = 0; isCleared = false;
  speed = 12; boostT = 0; invuln = 0; nearMissCd = 0; crashFlash = 0;
  fuel = FUEL_MAX; lowFuelWarned = false; throttle = 0; keysUD.up = false; keysUD.down = false;
  laneIdx = 1; laneX = 0; targetLaneX = 0;
  dayPhase = 0.28;
  player.position.set(0, 0, 0); player.rotation.set(0, 0, 0);
  activeCars.forEach(c => { c.mesh.visible = false; });
  activeCars.length = 0;
  activeCoins.forEach(c => { c.mesh.visible = false; });
  activeCoins.length = 0;
  activeFuels.forEach(c => { c.mesh.visible = false; });
  activeFuels.length = 0;
  spawnT = 1.2; coinSpawnT = 2; fuelSpawnT = 3.5;
  running = true;
  if (state.bgmEnabled) startBGM();
  document.getElementById('overlayResultBox').classList.add('hidden');

}

function changeLane(dir) {
  if (!running) return;
  const prev = laneIdx;
  laneIdx = Math.max(0, Math.min(2, laneIdx + dir));
  targetLaneX = LANES[laneIdx];
  if (prev !== laneIdx && navigator.vibrate) {
    try { navigator.vibrate(15); } catch {}
  }
}

function finishGameWithReason(titleText) {
  running = false;
  isCleared = false;
  overlayLockUntil = Date.now() + 900;
  stopBGM();
  const d = Math.floor(distance);
  const runTotal = d + runMaxSpeed * 10 + runGold;
  let changed = false;
  if (d > state.highScore) { state.highScore = d; changed = true; }
  if (runMaxSpeed > state.maxSpeedKmh) { state.maxSpeedKmh = runMaxSpeed; changed = true; }
  if (runGold > state.bestRunGold) { state.bestRunGold = runGold; changed = true; }
  if (runTotal > state.bestTotalScore) { state.bestTotalScore = runTotal; changed = true; }
  if (changed) saveState(true);
  document.getElementById('overlayResultBox').classList.remove('hidden');
  document.getElementById('overlayTitle').textContent = titleText;
  document.getElementById('overlaySub').textContent = `종합 ${runTotal.toLocaleString()}점 (거리 ${d.toLocaleString()}m · 최고 ${runMaxSpeed}km/h · 골드 +${runGold.toLocaleString()}G)`;
  document.getElementById('overlayActionBtn').textContent = '다시 레이스';
  setOverlayVisible(true);
  updateUI();
}

function onFuelEmpty() {
  if (!running) return;
  fuel = 0;
  speed = 0;
  playSound('hit');
  crashFlash = 0.35;
  showToast('⛽ 연료가 모두 소진되었습니다!');
  finishGameWithReason('⛽ 연료 고갈!');
}

function onCrash() {
  if (invuln > 0) return;
  playSound('hit');
  crashFlash = 0.4;
  lives--;
  invuln = 1.8;
  for (let i = activeCars.length - 1; i >= 0; i--) {
    if (activeCars[i].z > -10 && activeCars[i].z < 8) {
      activeCars[i].mesh.visible = false;
      activeCars.splice(i, 1);
    }
  }
  if (lives <= 0) {
    finishGameWithReason('CRASH!');
  } else {
    updateUI();
  }
}

function spawnCar() {
  const wantBus = Math.random() < 0.1;
  let mesh = wantBus ? busPool.find(m => !m.visible) : null;
  const isBus = !!mesh;
  if (!mesh) mesh = carPool.find(m => !m.visible);
  if (!mesh) return;

  let li = Math.floor(Math.random() * 3);
  if (Math.random() < 0.12) li = laneIdx;
  const spawnZ = -58 - Math.random() * 20;

  const tooClose = activeCars.some(c => c.lane === li && Math.abs(c.z - spawnZ) < (isBus ? 12 : 8));
  if (tooClose) return;
  const occupiedLanesNear = new Set(activeCars.filter(c => Math.abs(c.z - spawnZ) < 13).map(c => c.lane));
  if (occupiedLanesNear.size >= 2 && !occupiedLanesNear.has(li)) return;

  mesh.visible = true;
  mesh.position.set(LANES[li], 0, spawnZ);
  mesh.rotation.y = Math.PI;
  activeCars.push({
    mesh,
    lane: li,
    z: spawnZ,
    speed: (isBus ? 7 : 9) + Math.random() * 5 + Math.min(1, elapsedTime / FINISH_TIME_SEC) * 4,
    halfLen: isBus ? 3.25 : 1.85,
    halfWidth: isBus ? 1.25 : 1.15
  });
}

function bindHoldControl(btn, keyName, activeClass) {
  const press = e => {
    e.preventDefault();
    keysUD[keyName] = true;
    btn.classList.add(...activeClass);
  };
  const release = () => {
    keysUD[keyName] = false;
    btn.classList.remove(...activeClass);
  };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

  mobileAccelBtn.classList.remove('brightness-110', 'ring-2', 'ring-amber-200', 'scale-95');
});
mobileBoostBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!running) return;
  if (boostT <= 0 && fuel > 5) {
    boostT = state.isVip ? 2.4 : 1.5;
    playSound('boost');
  }
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  resize();

  if (running) {
    dayPhase = (dayPhase + dt / 90) % 1;
    updateDayNight(dayPhase);

    const boostMul = boostT > 0 ? (state.isVip ? 1.55 : 1.35) : 1;
    if (boostT > 0) boostT = Math.max(0, boostT - dt);
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (nearMissCd > 0) nearMissCd = Math.max(0, nearMissCd - dt);
    if (crashFlash > 0) crashFlash = Math.max(0, crashFlash - dt);

    throttle = 0;
    if (keysUD.up) throttle += 1;
    if (keysUD.down) throttle -= 1;
    const baseSpd = 16 + (state.isVip ? 2 : 0);
    const minSpd = 4;
    const maxSpd = 56 + (state.isVip ? 4 : 0);
    let desired = throttle > 0 ? maxSpd : throttle < 0 ? minSpd : baseSpd;
    if (boostT > 0) desired = maxSpd * boostMul;
    desired = Math.max(minSpd, Math.min(maxSpd * boostMul, desired));
    speed += (desired - speed) * Math.min(1, dt * (throttle < 0 ? 3.8 : 2.6));

    const drain = (0.35 + speed * 0.045 + (boostT > 0 ? 1.2 : 0) + (throttle > 0 ? 0.25 : 0)) * dt * 0.5;
    fuel = Math.max(0, fuel - drain);

    if (fuel <= 15 && fuel > 0 && !lowFuelWarned) {
      lowFuelWarned = true;
      showToast('⚠️ 연료 부족! 연료통을 획득하세요!');
    }
    if (fuel <= 0) {
      onFuelEmpty();
      renderer.render(scene, camera);
      return;
    }

    elapsedTime += dt;
    const curKmh = Math.floor(speed * 4.5);
    if (curKmh > runMaxSpeed) runMaxSpeed = curKmh;
    distance += speed * dt * 2.2;
    roadScroll += speed * dt;

    roadSegs.forEach(seg => {
      seg.position.z += speed * dt;
      if (seg.position.z > ROAD_LEN) seg.position.z -= ROAD_SEGS * ROAD_LEN;
    });
    propsGroup.children.forEach(o => { o.position.z += speed * dt; if (o.position.z > 12) o.position.z -= o.userData.span; });
    cityGroup.children.forEach(b => {
      b.position.z += speed * dt * 0.3;
      if (b.position.z > 20) b.position.z -= 200;
    });

    laneX += (targetLaneX - laneX) * Math.min(1, dt * 10);
    player.position.x = laneX;
    player.rotation.z = (targetLaneX - laneX) * (player.userData.isSupercar ? -0.08 : -0.2);
    if (player.userData.wheels) player.userData.wheels.forEach(w => { w.rotation.x -= speed * dt * 0.35; });
    player.rotation.x = -speed * 0.002;
    levelLights(player);
    if (player.userData.tailMat) player.userData.tailMat.color.setHex(keysUD.down ? 0xff3b4d : 0x7a1220);
    if (player.userData.flames) {
      player.userData.flames.forEach(fl => {
        fl.visible = boostT > 0;
        if (boostT > 0) fl.scale.y = 0.8 + Math.random() * 0.5;
      });
    }

    player.visible = !(invuln > 0 && Math.floor(invuln * 12) % 2 === 0);
    neonL.position.set(laneX, 2.5, -2);

    spawnT -= dt;
    if (spawnT <= 0) {
      spawnCar();
      spawnT = Math.max(0.65, 1.5 - Math.min(1, elapsedTime / FINISH_TIME_SEC) * 0.75) * (0.85 + Math.random() * 0.5);
    }
    coinSpawnT -= dt;
    if (coinSpawnT <= 0) { spawnCoin(); coinSpawnT = 2 + Math.random() * 1.5; }
    fuelSpawnT -= dt;
    if (fuelSpawnT <= 0) { spawnFuel(); fuelSpawnT = 4 + Math.random() * 3; }

    for (let i = activeCars.length - 1; i >= 0; i--) {
      const c = activeCars[i];
      c.z += (speed - c.speed) * dt * 0.72;
      if (c.z < -95) { c.mesh.visible = false; activeCars.splice(i, 1); continue; }
      c.mesh.position.z = c.z;
      c.mesh.position.x = LANES[c.lane];
      if (c.z > 22) { c.mesh.visible = false; activeCars.splice(i, 1); continue; }

      const dx = Math.abs(c.mesh.position.x - player.position.x);
      const dz = Math.abs(c.z - player.position.z);
      if (dz < c.halfLen && dx < c.halfWidth && invuln <= 0) {
        onCrash();
      } else if (dz < c.halfLen + 0.4 && dx >= c.halfWidth && dx < c.halfWidth + 1.1 && nearMissCd <= 0 && c.z > -1 && c.z < 3) {
        nearMissCd = 1;
        const b = state.isVip ? 18 : 7;
        state.gold += b;
        runGold += b;
        distance += state.isVip ? 30 : 12;
        playSound('coin');
        showToast('💨 아슬아슬! +' + b + 'G');
        saveState(false);
      }
    }

    for (let i = activeCoins.length - 1; i >= 0; i--) {
      const c = activeCoins[i];
      c.z += speed * dt;
      c.mesh.position.z = c.z;
      c.mesh.rotation.z += dt * 4;
      if (c.z > 12) { c.mesh.visible = false; activeCoins.splice(i, 1); continue; }
      const dx = Math.abs(c.mesh.position.x - player.position.x);
      const dz = Math.abs(c.z - player.position.z);
      if (dz < 1.5 && dx < 1.3) {
        state.gold += 100;
        runGold += 100;
        distance += state.isVip ? 25 : 10;
        playSound('coin');
        showToast('🪙 +100G');
        c.mesh.visible = false;
        activeCoins.splice(i, 1);
        saveState(false);
      }
    }

    for (let i = activeFuels.length - 1; i >= 0; i--) {
      const f = activeFuels[i];
      f.z += speed * dt;
      f.mesh.position.z = f.z;
      f.mesh.position.x = LANES[f.lane];
      f.mesh.rotation.y += dt * 2;
      if (f.z > 12) { f.mesh.visible = false; activeFuels.splice(i, 1); continue; }
      const dx = Math.abs(f.mesh.position.x - player.position.x);
      const dz = Math.abs(f.z - player.position.z);
      if (dz < 1.8 && dx < 1.4) {
        fuel = Math.min(FUEL_MAX, fuel + 35);
        if (fuel > 15) lowFuelWarned = false;
        playSound('coin');
        showToast('⛽ 연료 +35%');
        f.mesh.visible = false;
        activeFuels.splice(i, 1);
      }
    }

    if (elapsedTime >= FINISH_TIME_SEC) {
      elapsedTime = FINISH_TIME_SEC;
      running = false;
      isCleared = true;
      overlayLockUntil = Date.now() + 1500;
      stopBGM();
      const d = Math.floor(distance);
      const runTotal = d + runMaxSpeed * 10 + runGold;
      if (d > state.highScore) state.highScore = d;
      if (runMaxSpeed > state.maxSpeedKmh) state.maxSpeedKmh = runMaxSpeed;
      if (runGold > state.bestRunGold) state.bestRunGold = runGold;
      if (runTotal > state.bestTotalScore) state.bestTotalScore = runTotal;
      state.bestTimeSec = FINISH_TIME_SEC;
      saveState(true);
      document.getElementById('overlayResultBox').classList.remove('hidden');
      document.getElementById('overlayTitle').textContent = '🏆 3분 완주 성공!';
      document.getElementById('overlaySub').textContent = `종합 ${runTotal.toLocaleString()}점 · 거리 ${d.toLocaleString()}m · 최고 ${runMaxSpeed}km/h · 골드 +${runGold.toLocaleString()}G`;
      document.getElementById('overlayActionBtn').textContent = '처음부터';
      setOverlayVisible(true);
    }

    const portraitZ = camera.aspect < 1 ? (1 - camera.aspect) * 2.8 : 0;
    const camTarget = new THREE.Vector3(laneX * 0.35, 3.8 + speed * 0.02 + portraitZ * 0.25, 7.5 + portraitZ);
    camera.position.lerp(camTarget, 1 - Math.pow(0.001, dt));
    camera.lookAt(laneX * 0.5, 0.8, -6);

    updateUILive();
  } else {
    dayPhase = (dayPhase + dt / 120) % 1;
    updateDayNight(dayPhase);
    const portraitIdle = camera.aspect < 1 ? (1 - camera.aspect) * 1.6 : 0;
    camera.position.x = Math.sin(clock.elapsedTime * 0.45) * (camera.aspect < 1 ? 1.5 : 2.1);
    camera.position.y = 1.95 + portraitIdle * 0.15;
    camera.position.z = 4.1 + portraitIdle;
    camera.lookAt(0, 0.45, -0.15);
    roadSegs.forEach(seg => {
      seg.position.z += dt * 4;
      if (seg.position.z > ROAD_LEN) seg.position.z -= ROAD_SEGS * ROAD_LEN;
    });
  }

  if (!running || state.isVip) {
    const hue = (clock.elapsedTime * 0.35) % 1;
    if (state.bikeColor === 'rainbow' && player.userData.paintMat) player.userData.paintMat.color.setHSL(hue, 0.9, 0.55);
    if (state.helmetColor === 'rainbow' && player.userData.helmetMat) player.userData.helmetMat.color.setHSL((hue + 0.33) % 1, 0.9, 0.55);
    if (state.suitColor === 'rainbow') {
      if (player.userData.jacketMat) player.userData.jacketMat.color.setHSL((hue + 0.66) % 1, 0.85, 0.5);
      if (player.userData.suitMat) player.userData.suitMat.color.setHSL((hue + 0.66) % 1, 0.85, 0.38);
    }
  }

  if (crashFlash > 0) renderer.setClearColor(new THREE.Color().setHSL(0, 0.7, 0.08 + crashFlash * 0.15));

  renderer.render(scene, camera);
}
animate();

function updateUILive() {
  document.getElementById('scoreDisplay').textContent = Math.floor(distance).toLocaleString() + ' m';
  document.getElementById('speedDisplay').textContent = Math.floor(speed * 4.5) + ' km/h';
  document.getElementById('livesDisplay').textContent = (state.isVip ? '👑' : '') + ('❤️'.repeat(Math.max(0, lives)) || '💀');
  const td = document.getElementById('timerDisplay');
  if (td) td.textContent = formatTime(elapsedTime) + ' / 03:00';
  const pct = Math.max(0, Math.min(100, fuel));
  const fill = document.getElementById('fuelBarFill');
  const ft = document.getElementById('fuelText');
  const fWrap = document.getElementById('fuelHudWrap');
  const fTitle = document.getElementById('fuelTitle');
  if (fill) {
    fill.style.height = pct + '%';
    fill.className = 'absolute bottom-0 left-0 right-0 transition-[height] duration-150 ' + (
      pct > 40 ? 'bg-gradient-to-t from-amber-600 to-yellow-300' :
      pct > 20 ? 'bg-gradient-to-t from-orange-700 to-orange-400' :
      'bg-gradient-to-t from-red-800 to-red-500'
    );
  }
  if (ft) {
    ft.textContent = Math.floor(pct) + '%';
    ft.className = 'text-[9px] font-bold tabular-nums ' + (pct <= 20 && running ? 'text-rose-400' : 'text-amber-100/80');
  }
  if (fTitle) {
    fTitle.className = 'text-[9px] font-bold tracking-wide ' + (pct <= 20 && running ? 'text-rose-400' : 'text-amber-200/90');
  }
  if (fWrap) fWrap.classList.toggle('animate-pulse', pct <= 20 && running);
  const boostBtn = document.getElementById('mobileBoostBtn');
  if (boostBtn) {
    const canBoost = running && boostT <= 0 && fuel > 5;
    boostBtn.classList.toggle('opacity-60', running && !canBoost);
    boostBtn.classList.toggle('ring-2', boostT > 0);
    boostBtn.classList.toggle('ring-white', boostT > 0);
  }
}

function updateDayNight(phase) {
  const sunAngle = phase * Math.PI * 2 - Math.PI / 2;
  const elev = Math.sin(sunAngle);
  const sunH = Math.max(0.15, elev);
  sun.position.set(Math.cos(sunAngle) * 30, sunH * 25 + 2, 10);
  sun.intensity = 0.25 + Math.max(0, elev) * 1.1;

  const night = elev < 0 ? Math.min(1, -elev * 1.2) : 0;
  const day = elev > 0 ? elev : 0;

  const dayCol = new THREE.Color(0x7eb6e8);
  const nightCol = new THREE.Color(0x0a0f1a);
  const dawnCol = new THREE.Color(0xff8c5a);
  let sky = nightCol.clone();
  if (phase > 0.2 && phase < 0.35) sky = nightCol.clone().lerp(dawnCol, (phase - 0.2) / 0.15);
  else if (phase >= 0.35 && phase < 0.45) sky = dawnCol.clone().lerp(dayCol, (phase - 0.35) / 0.1);
  else if (phase >= 0.45 && phase < 0.65) sky = dayCol.clone();
  else if (phase >= 0.65 && phase < 0.8) sky = dayCol.clone().lerp(dawnCol, (phase - 0.65) / 0.15);
  else if (phase >= 0.8 && phase < 0.9) sky = dawnCol.clone().lerp(nightCol, (phase - 0.8) / 0.1);

  scene.fog.color.copy(sky);
  scene.fog.density = 0.012 + night * 0.012;
  renderer.setClearColor(sky);
  amb.intensity = 0.2 + day * 0.45;
  amb.color.set(night > 0.5 ? 0x304080 : 0xfff0e0);
  hemi.intensity = 0.15 + day * 0.4;
  neonL.intensity = 0.5 + night * 1.2;
  cityMats.forEach(m => { m.emissiveIntensity = 0.12 + night * 1.0; });
  lampHeadMat.color.setHex(night > 0.25 ? 0xfff1b8 : 0x6b7280);
  lampPoolMat.opacity = night * 0.3;
  neonR.intensity = 0.3 + night * 0.8;
  sun.color.set(night > 0.3 ? 0x8899cc : 0xffe0c0);

  const isNightNow = elev < 0.08;
  lastNightFlag = isNightNow;
  const playerLights = lightsOverride === null ? isNightNow : lightsOverride;
  [bike1Mesh, bike2Mesh].forEach(bk => {
    if (bk.userData.bikeSpot) bk.userData.bikeSpot.intensity = playerLights ? 3.5 : 0;
    if (bk.userData.headBeam) bk.userData.headBeam.visible = playerLights;
    if (bk.userData.bikeSpot2) bk.userData.bikeSpot2.intensity = playerLights ? 3.5 : 0;
    if (bk.userData.headBeam2) bk.userData.headBeam2.visible = playerLights;
    if (bk.userData.headlightMat) {
      bk.userData.headlightMat.color.setHex(
        playerLights ? (bk.userData.isVipBike ? 0xe0f2fe : 0xfef08a) : 0x475569
      );
    }
  });
  carPool.forEach(c => { if (c.userData.headlightMat) c.userData.headlightMat.color.setHex(isNightNow ? 0xfef08a : 0x334155); });
  busPool.forEach(b => { if (b.userData.headlightMat) b.userData.headlightMat.color.setHex(isNightNow ? 0xfef08a : 0x334155); });
}

function updateUI() {
  const sfxBtn = document.getElementById('soundToggleBtn');
  sfxBtn.textContent = state.soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
  sfxBtn.className = state.soundEnabled
    ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap'
    : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';

  const bgmBtn = document.getElementById('bgmToggleBtn');
  bgmBtn.textContent = state.bgmEnabled ? '🎵 배경음 ON' : '🔇 배경음 OFF';
  bgmBtn.className = state.bgmEnabled
    ? 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400/70 text-white transition active:scale-95 cursor-pointer whitespace-nowrap'
    : 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 transition active:scale-95 cursor-pointer whitespace-nowrap';

  updateBikeSelectUI();

  updateUILive();

  const authBtn = document.getElementById('authHeaderBtn');
  if (authBtn) {
    if (authToken) {
      authBtn.textContent = state.isVip ? '👑 VIP 로그아웃' : '로그아웃';
      authBtn.className = state.isVip
        ? 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-r from-fuchsia-600 via-purple-600 to-indigo-600 text-white border border-amber-300/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0'
        : 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 shadow transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0';
    } else {
      authBtn.textContent = '로그인';
      authBtn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-gradient-to-b from-amber-300 via-amber-400 to-amber-600 hover:brightness-110 text-slate-950 border border-yellow-200/80 shadow-md transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0';
    }
  }
}

let toastTimer = null;
function showToast(m) {
  const box = document.getElementById('toastBox');
  document.getElementById('toastMsg').textContent = m;
  box.classList.remove('opacity-0', '-translate-y-2');
  box.classList.add('opacity-100', 'translate-y-0');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    box.classList.add('opacity-0', '-translate-y-2');
    box.classList.remove('opacity-100', 'translate-y-0');
  }, 1900);
}

};

async function fetchRank() {
  const box = document.getElementById('rankingListContainer'), my = document.getElementById('myRankDetailText');
  if (my) my.textContent = `${(state.bestTotalScore || 0).toLocaleString()} 점`;
  try {
    const h = authToken ? { Authorization: 'Bearer ' + authToken } : {};
    const res = await fetch(API + '/api/ranking?gameId=' + GAME_ID + '&_t=' + Date.now(), { headers: h });
    const d = await res.json();
    if (!res.ok) throw 0;
    if (d.myRank && my) {
      my.textContent = `${(d.myRank.score || state.bestTotalScore || 0).toLocaleString()} 점 (${d.myRank.rank}위)`;
    }
    const list = (d.rankings || []).slice(0, 10);
    if (list.length === 0) {
      box.innerHTML = '<div class="text-center text-xs text-slate-500 py-4">아직 등록된 순위가 없습니다.</div>';
      return;
    }
    box.innerHTML = '';
    list.forEach(it => {
      const dist = it.highScore ?? it.saveData?.highScore ?? (it.isMe ? state.highScore : 0);
      const maxSpd = it.maxSpeedKmh ?? it.saveData?.maxSpeedKmh ?? (it.isMe ? state.maxSpeedKmh : 0);
      const rGold = it.bestRunGold ?? it.saveData?.bestRunGold ?? (it.isMe ? state.bestRunGold : 0);
      const parts = [];
      if (dist > 0) parts.push('📏 ' + dist.toLocaleString() + 'm');
      if (maxSpd > 0) parts.push('🚀 ' + maxSpd + 'km/h');
      if (rGold > 0) parts.push('🪙 ' + rGold.toLocaleString() + 'G');
      const r = document.createElement('div');
      r.className = 'rounded-xl px-3 py-2 border bg-slate-950 border-slate-800 flex items-center justify-between gap-2 text-xs' + (it.isMe ? ' border-orange-400/60' : '');
      r.innerHTML =
        '<div class="min-w-0">' +
          '<div class="font-bold text-slate-100 truncate">' + it.rank + '위 ' + maskPhoneMiddle(it.maskedName) + (it.isMe ? ' <span class="text-orange-300 text-[10px]">(나)</span>' : '') + '</div>' +
          (parts.length ? '<div class="text-[10px] text-slate-400 mt-0.5 truncate">' + parts.join(' · ') + '</div>' : '') +
        '</div>' +
        '<span class="font-black text-orange-400 shrink-0">' + (it.score || 0).toLocaleString() + ' 점</span>';
      box.appendChild(r);
    });
  } catch { box.innerHTML = '<div class="text-center text-xs text-slate-500 py-4">랭킹 대기 중</div>'; }
}

  authToken = null; currentUsername = null;

  state.isVip = false; state.selectedBike = 1; applySelectedBikeMesh(); updateUI(); fetchRank();
  showToast(exp ? '만료' : '로그아웃되었습니다.');

fetchRank();
